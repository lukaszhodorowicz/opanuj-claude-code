name: strona

# Składa witrynę kursu (narzedzia.witryna) i wystawia ją przez GitHub Pages pod adresem z pliku CNAME.
# W prywatnym repozytorium warsztatu oba kroki są pomijane: strona wychodzi z publicznego repozytorium (D-2026-10-24-06, D-2026-10-28-02).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: strona
  cancel-in-progress: true

jobs:
  zbuduj:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python -m narzedzia.witryna zbuduj --wyjscie _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  wystaw:
    needs: zbuduj
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.wdrozenie.outputs.page_url }}
    steps:
      - id: wdrozenie
        uses: actions/deploy-pages@v4
