<!doctype html>
<!-- Rysunek do lekcji pierwsze-zadanie (styl R1, D-2026-10-26-58): pole wiadomości w czasie pracy Claude z przyciskiem stop; wygląd i miejsce przycisku według zrzutu obrazy/3-przycisk-stop.png, bez podpisu o położeniu. Źródło PNG obrazy/przycisk-stop.png. -->
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=760" />
    <title>Przycisk stop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --granat: #0e1422;
        --limonka: #a3e635;
        --zakreslacz: #d9f99d;
        --papier: #f6f6f1;
        --papier-2: #eef0e6;
        --grafit: #475569;
        --biel: #ffffff;
        --a-tlo: #191919;
        --a-pole: #2a2a2a;
        --a-kreska: #3d3d3d;
        --a-tekst: #eeeeee;
        --a-szary: #969696;
        --a-dymek: #303030;
        --a-szkic: #4a4a4a;
        --sans: "Plus Jakarta Sans", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--papier); }
      body { width: 760px; color: var(--granat); font-family: var(--sans); }
      .rys { padding: 20px 16px 22px; }
      .scena { position: relative; display: grid; grid-template-columns: 524px 1fr; column-gap: 0; align-items: center; }
      .okno {
        background: var(--a-tlo);
        border-radius: 18px;
        padding: 18px 16px 12px;
        color: var(--a-tekst);
      }
      .dymek { margin-left: auto; width: 74%; background: var(--a-dymek); border-radius: 14px; padding: 14px; }
      .dymek i { display: block; height: 10px; border-radius: 5px; background: var(--a-szkic); }
      .dymek i + i { margin-top: 9px; }
      .praca { display: flex; gap: 8px; padding: 22px 4px 26px; }
      .praca b { width: 11px; height: 11px; border-radius: 50%; background: var(--a-szary); }
      .pole {
        height: 64px;
        background: var(--a-pole);
        border: 1px solid var(--a-kreska);
        border-radius: 18px;
        display: flex;
        align-items: center;
        padding: 0 14px 0 16px;
        gap: 12px;
      }
      .pole .plus { width: 26px; height: 26px; color: var(--a-tekst); }
      .kursor { width: 2px; height: 28px; background: var(--a-tekst); }
      .stop {
        margin-left: auto;
        width: 44px; height: 44px; border-radius: 12px;
        display: grid; place-items: center;
        box-shadow: 0 0 0 4px var(--limonka);
        background: #3a3a3a;
      }
      .stop i { width: 22px; height: 22px; border-radius: 5px; background: var(--a-tekst); }
      .mikrofon { width: 30px; height: 30px; color: var(--a-tekst); }
      .rzad { height: 46px; display: flex; align-items: center; gap: 12px; padding: 0 8px; }
      .rzad i { height: 10px; border-radius: 5px; background: var(--a-szkic); }
      .rzad .prawo { margin-left: auto; }
      .krazek { width: 24px; height: 24px; border-radius: 50%; border: 3px solid var(--a-szkic); border-top-color: var(--a-szary); }
      .podpis {
        position: relative;
        margin-left: 34px;
        background: var(--biel);
        border: 4px solid var(--granat);
        border-radius: 18px;
        padding: 14px 16px;
        font: 600 23px/1.2 var(--sans);
      }
      .podpis b { display: block; font: 800 26px/1.1 var(--sans); letter-spacing: -0.02em; }
      .linka { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="rys" role="img" aria-label="Pole wiadomości w czasie pracy Claude z kwadratowym przyciskiem stop, zaznaczonym kolorem. Podpis: stop przerywa od razu.">
      <div class="scena">
        <div class="okno" aria-hidden="true">
          <div class="dymek"><i style="width: 92%"></i><i style="width: 58%"></i></div>
          <div class="praca"><b></b><b></b><b></b></div>
          <div class="pole">
            <svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <span class="kursor"></span>
            <span class="stop" id="stop"><i></i></span>
            <svg class="mikrofon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          </div>
          <div class="rzad">
            <i style="width: 60px"></i>
            <i class="prawo" style="width: 96px"></i>
            <i style="width: 64px"></i>
            <span class="krazek"></span>
          </div>
        </div>
        <div class="podpis"><b>Przycisk stop</b>od razu przerywa pracę Claude.</div>
        <svg class="linka" aria-hidden="true">
          <!-- od podpisu do przycisku stop: biała obwódka pod granatową kreską, żeby było ją widać na ciemnym tle -->
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M556 104 H442 a12 12 0 0 0 -12 12 V132 M418 120 L430 134 L442 120" stroke="#ffffff" stroke-width="10"/>
            <path d="M556 104 H442 a12 12 0 0 0 -12 12 V132 M418 120 L430 134 L442 120" stroke="#0e1422" stroke-width="4"/>
          </g>
        </svg>
      </div>
    </div>
  </body>
</html>
