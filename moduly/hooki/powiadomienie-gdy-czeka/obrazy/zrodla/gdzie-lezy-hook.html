<!doctype html>
<!-- Rysunek R3 „Gdzie leży hook” do lekcji powiadomienie-gdy-czeka: .claude/settings.json w folderze Opinie-kluby działa tylko w tym projekcie (zakreślacz), ~/.claude/settings.json w folderze domowym działa we wszystkich projektach; klamra: hooki z obu plików sumują się. Źródło PNG obrazy/gdzie-lezy-hook.png. -->
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=760" />
    <title>Gdzie leży hook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="kadry.css" />
    <style>
      .uklad {
        display: grid;
        grid-template-columns: 1fr 34px 120px;
        column-gap: 6px;
        padding: 16px;
        align-items: stretch;
      }
      .wiersze {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .wiersz {
        display: grid;
        grid-template-columns: 262px 44px 1fr;
        align-items: center;
        padding: 12px;
        border-radius: 20px;
      }
      .wiersz.ten {
        background: var(--zakreslacz);
        border: 4px solid var(--limonka);
      }
      .wiersz.zwykly {
        border: 4px solid transparent;
      }
      .drzewko {
        background: var(--biel);
        border: 3px solid var(--granat);
      }
      .drzewko .glowa {
        font-family: var(--sans);
        font-weight: 800;
        font-size: 21px;
        letter-spacing: -0.015em;
      }
      .drzewko .glowa.mono {
        font: 700 19px/1 var(--mono);
      }
      .sciezka {
        margin: 8px 0 0;
        text-align: center;
        color: var(--grafit);
        font: 700 18px/1 var(--mono);
      }
      .strzalka svg {
        display: block;
        width: 44px;
        height: 24px;
        overflow: visible;
      }
      .skutek {
        padding-left: 8px;
        font: 800 23px/1.2 var(--sans);
        letter-spacing: -0.02em;
      }
      .klamra svg {
        width: 34px;
        height: 100%;
        display: block;
      }
      .suma {
        align-self: center;
        font: 800 22px/1.2 var(--sans);
        letter-spacing: -0.02em;
      }
      .drzewko {
        padding: 6px 8px;
        font-size: 19px;
      }
      .drzewko .el {
        gap: 7px;
        padding: 0 4px;
      }
      .drzewko .w1 {
        margin-left: 20px;
      }
      .drzewko .w2 {
        margin-left: 40px;
      }
      .drzewko .glowa {
        font-size: 20px;
      }
      .drzewko .glowa.mono {
        font-size: 19px;
      }
      .skutek {
        font-size: 22px;
      }

      /* ===== Nagłówek z wnioskiem ===== */
      h1.teza {
        margin: 0 0 26px 4px;
        font: 800 28px/1.22 var(--sans);
        letter-spacing: -0.025em;
        max-width: 728px;
      }
      h1.teza mark {
        color: inherit;
        background: linear-gradient(transparent 52%, var(--zakreslacz) 52%, var(--zakreslacz) 94%, transparent 94%);
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div class="rys" role="img" aria-label="Dwa wiersze. Folder Opinie-kluby z folderem .claude i plikiem settings.json: hook działa tylko w tym projekcie. Twój folder domowy z folderem .claude i plikiem settings.json, czyli ~/.claude/settings.json: hook działa we wszystkich Twoich projektach. Klamra łączy oba wiersze: hooki z obu plików sumują się.">
      <h1 class="teza">Hook z&nbsp;projektu działa <mark>tylko w&nbsp;nim</mark>, a&nbsp;hook z&nbsp;folderu domowego we wszystkich Twoich projektach</h1>
      <div class="uklad ramka">
        <div class="wiersze">
          <!-- Wiersz 1: folder projektu -->
          <div class="wiersz ten">
            <div>
              <div class="drzewko">
                <div class="el glowa mono">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.2h9A1.5 1.5 0 0 1 21 9.7v8.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>
                  Opinie-kluby
                </div>
                <div class="el w1">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.2h9A1.5 1.5 0 0 1 21 9.7v8.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>
                  .claude
                </div>
                <div class="el w2">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg>
                  settings.json
                </div>
              </div>
            </div>
            <div class="strzalka"><svg viewBox="0 0 54 24" aria-hidden="true"><path d="M6 12H46M37 3l10 9-10 9" fill="none" stroke="#0e1422" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="skutek">Działa tylko w&nbsp;tym projekcie</div>
          </div>

          <!-- Wiersz 2: folder domowy -->
          <div class="wiersz zwykly">
            <div>
              <div class="drzewko">
                <div class="el glowa">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg>
                  Twój folder domowy
                </div>
                <div class="el w1">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.2h9A1.5 1.5 0 0 1 21 9.7v8.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>
                  .claude
                </div>
                <div class="el w2">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg>
                  settings.json
                </div>
              </div>
            </div>
            <div class="strzalka"><svg viewBox="0 0 54 24" aria-hidden="true"><path d="M6 12H46M37 3l10 9-10 9" fill="none" stroke="#0e1422" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="skutek">Działa we wszystkich Twoich projektach</div>
          </div>
        </div>

        <!-- Klamra łącząca oba wiersze -->
        <div class="klamra">
          <svg viewBox="0 0 44 100" preserveAspectRatio="none" aria-hidden="true">
            <path d="M6 4 Q20 4 20 14 V40 Q20 50 34 50 Q20 50 20 60 V86 Q20 96 6 96" fill="none" stroke="#0e1422" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
          </svg>
        </div>
        <p class="suma">Hooki z&nbsp;obu plików sumują się.</p>
      </div>
    </div>
  </body>
</html>
