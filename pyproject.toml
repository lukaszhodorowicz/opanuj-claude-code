[project]
name = "przewodnik-claude-code"
version = "0.1.0"
description = "Polski przewodnik po Claude Code dla osób, które nie programują: narzędzia i testy treści."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "genanki>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
