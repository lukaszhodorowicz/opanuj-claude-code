    gdzie: tryb
    zrodlo: "https://code.claude.com/docs/en/permission-modes.md (dział Switch permission modes), sprawdzono 2026-10-23"
  - napis: "⏵⏵ accept edits on"
    gdzie: tryb
    zrodlo: "https://code.claude.com/docs/en/permission-modes.md (dział Switch permission modes), sprawdzono 2026-10-23"
