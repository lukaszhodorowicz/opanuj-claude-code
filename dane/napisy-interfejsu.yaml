  # Okno zgody na polecenie według dokumentacji (opis zrzutu w permissions.md, dział Permission system).
  - wzor: "^Yes, and don['’]t ask again for: .+$"
    gdzie: menu
    zrodlo: "https://code.claude.com/docs/en/permissions.md (opis okna zgody: „Yes, and don't ask again for: npm test *”), sprawdzono 2026-10-23"
  - napis: "Yes, and switch to auto mode"
    gdzie: menu
    zrodlo: "https://code.claude.com/docs/en/permissions.md i permission-modes.md (Switch permission modes); program 2.1.309, sprawdzono 2026-10-23"
  - napis: "No"
    gdzie: menu
    zrodlo: "https://code.claude.com/docs/en/permissions.md (opis okna zgody: cztery opcje, ostatnia „No”), sprawdzono 2026-10-23"
  - wzor: "^~/[^\\s/]+(/[^\\s/]+)*$"
    gdzie: okno
    zrodlo: "pasek okna programu terminala (nie Claude Code): pokazujemy tylko folder roboczy, decyzja projektu 2026-10-23"
  # Okno zgody na plik i wynik Read (program 2.1.309, sprawdzono 2026-10-24).
  - wzor: "^Do you want to create .+\\?$"
    gdzie: menu
    zrodlo: "program Claude Code 2.1.309 (okno zgody na zapis pliku, pytanie z nazwą pliku), sprawdzono 2026-10-24"
  - wzor: "^Yes, and switch to accept edits \\(auto-approve file edits and common file commands\\) for this session( \\(shift\\+tab\\))?$"
    gdzie: menu
    zrodlo: "program Claude Code 2.1.309 (okno zgody na zapis pliku w trybie default; opcja bywa niedostępna, a dopisek klawisza zależy od ustawień), sprawdzono 2026-10-24"
  - wzor: "^Read \\d+ lines?$"
    gdzie: wynik
    zrodlo: "program Claude Code 2.1.309 (wynik narzędzia Read dla pliku tekstowego), sprawdzono 2026-10-24"

  # Okno odczytu spoza folderu w trybie auto (program 2.1.309, terminal, sprawdzono 2026-10-24).
  - napis: "Read outside the working directories"
    gdzie: menu
    zrodlo: "program Claude Code 2.1.309, sprawdzono 2026-10-24 (okno odczytu spoza folderów roboczych)"
  - napis: "Allow this read outside the working directories?"
    gdzie: menu
    zrodlo: "program Claude Code 2.1.309, sprawdzono 2026-10-24 (okno odczytu spoza folderów roboczych)"
  - napis: "Yes, and keep allowing any reads outside the working directories"
    gdzie: menu
    zrodlo: "program Claude Code 2.1.309, sprawdzono 2026-10-24 i permission-modes.md (The first read outside the working directories)"
  - napis: "No, and block reads outside the working directories from now on"
    gdzie: menu
    zrodlo: "program Claude Code 2.1.309, sprawdzono 2026-10-24 i permission-modes.md (The first read outside the working directories)"
  - napis: "No, and ask again next time"
    gdzie: menu
    zrodlo: "program Claude Code 2.1.309, sprawdzono 2026-10-24 i permission-modes.md (The first read outside the working directories)"
  - napis: "Yes, but ask again next time"
    gdzie: menu
    zrodlo: "program Claude Code 2.1.309, sprawdzono 2026-10-24 i permission-modes.md (The first read outside the working directories)"

