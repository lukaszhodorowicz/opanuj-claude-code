  - id: aplikacja-panel-plikow-files-na-pasku-tytulu
    tresc: "W aplikacji, żeby otworzyć kolejny panel, klikasz jego przycisk z ikoną na pasku tytułu sesji; nazwy przycisków widać po najechaniu, między innymi Terminal, Changes (widok zmian), Browser i Files."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'To open another pane, click its icon button in the session''s title bar. Hover to see each button''s name, such as **Terminal**, **Changes** for the diff view, **Browser**, and **Files**.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: aplikacja-at-dodaje-plik-do-rozmowy
    tresc: "W aplikacji wpisujesz @ i nazwę pliku, żeby dodać ten plik do kontekstu rozmowy."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**@mention files**: type `@` followed by a filename to add a file to the conversation context.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: aplikacja-plus-i-przeciaganie-dolaczaja-pliki
    tresc: "W aplikacji obrazy, PDF-y i inne pliki dołączasz do wiadomości przyciskiem + obok pola wiadomości albo przeciągając je do pola; dokumentacja podaje jako zastosowanie zrzuty ekranu, makiety projektów i dokumenty pomocnicze."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Attach files: attach images, PDFs, and other files to your prompt from the **+** button next to the prompt box, or drag and drop files directly into the prompt. This is useful for sharing screenshots of bugs, design mockups, or reference documents.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: aplikacja-wiecej-kontekstu-lepszy-wynik
    tresc: "Według dokumentacji aplikacji im więcej kontekstu ma Claude, tym lepsze wyniki; konkretny plik wciągasz do rozmowy wpisując @ i nazwę."
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    cytat: 'Type `@filename` in the prompt box to pull a specific file into the conversation. The more context Claude has, the better the results.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: aplikacja-at-z-autouzupelnianiem
    tresc: "W aplikacji @ przed nazwą pliku działa z autouzupełnianiem, z wyjątkiem pierwszej wiadomości w sesji w chmurze."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '| @mention files | Text-based | With autocomplete, except for a cloud session''s first message |'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-code-tworzy-nowe-pliki
    tresc: "Wśród wbudowanych narzędzi Claude Code są operacje na plikach: czytanie plików, edycja kodu, tworzenie nowych plików, zmiana nazw i porządkowanie."
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: '| **File operations** | Read files, edit code, create new files, rename and reorganize |'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: read-czyta-krotkie-pdf-w-calosci
    tresc: "Claude czyta krótkie pliki PDF w całości; PDF dłuższy niż 10 stron czyta zakresami stron, do 20 stron naraz."
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: 'Claude reads short `.pdf` files whole. For PDFs longer than 10 pages, it reads in ranges with a `pages` parameter, such as `"1-5"`, up to 20 pages at a time.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: read-pokazuje-claude-obrazy-png
    tresc: "Pliki PNG, JPEG, GIF i WebP trafiają do Claude jako obraz, który Claude widzi, a nie jako surowe bajty; duży zrzut ekranu Claude Code zmniejsza przed wysłaniem, więc Claude może widzieć wersję pomniejszoną."
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: '**Images**: PNG, JPEG, GIF, and WebP files are returned as visual content that Claude can see, not as raw bytes. Claude Code resizes and recompresses large images to fit the model''s image size limits before sending them, so Claude may see a downscaled version of a large screenshot.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: read-odmawia-xlsx-po-at-claude-dostaje-sciezke
    tresc: "Narzędzie Read odmawia otwarcia pliku, którego rozszerzenie uznaje za binarne, na przykład .xlsx; gdy wskażesz taki plik znakiem @, Claude dostaje jego ścieżkę, ale nie zawartość."
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: 'Read refuses a file whose extension it treats as binary, such as `.xlsx`, `.parquet`, `.heic`, or `.zip`. [...] If you [`@`-mention](https://code.claude.com/docs/en/common-workflows#reference-files-and-directories) a file that Read refuses, Claude receives the file''s path but not its contents.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: aplikacja-klik-sciezki-do-pdf-html-wideo-otwiera-panel-browser
    tresc: "W sesji lokalnej w aplikacji kliknięcie w rozmowie ścieżki do pliku HTML, PDF albo wideo otwiera go w panelu Browser."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'In a local session, click an HTML, PDF, or video path in the chat to open it in the Browser pane.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: aplikacja-panele-w-dowolnym-ukladzie
    tresc: "Zakładka Code w aplikacji opiera się na panelach, które możesz układać w dowolnym układzie; wśród nich są rozmowa, widok zmian, przeglądarka, terminal i plik."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'The Code tab is built around panes you can arrange in any layout: chat, diff, browser, terminal, file, plan, tasks, and subagent'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: aplikacja-panel-browser-to-przegladarka-z-kartami
    tresc: "Panel Browser w aplikacji jest przeglądarką z kartami."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'The Browser pane is a tabbed browser, so you can open documentation, issue trackers, or any other site next to your running app.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: aplikacja-panele-obok-siebie
    tresc: "W aplikacji możesz ułożyć obok siebie rozmowę, widok zmian, przeglądarkę, terminal i edytor pliku."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Arrange panes for the chat, diff, browser, terminal, and file editor side by side'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: slides-zwykla-prosba-wybiera-szablon
    tresc: "Żeby zacząć od szablonu, opisujesz, co chcesz; Claude wybiera pasujący szablon, wypełnia go na podstawie Twojej prośby i tego, co sesja już ma, i daje Ci link."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'To start from a template, describe what you want, such as "turn the migration notes into a deck for Thursday''s review" or "write this plan up as a doc for the team". Claude picks the matching template, fills it from your request and from what the session already has, and gives you the link.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: slides-edytor-na-claude-ai-i-eksport
    tresc: "Każdy z szablonów (Claude Slides, Claude Design, Claude Docs) otwiera się we własnym edytorze na claude.ai, gdzie zmieniasz go sam (razem z zespołem) albo prosząc Claude, i eksportujesz go do formatów takich jak PowerPoint, PDF czy Word."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Each opens in its own editor on claude.ai, where you and your teammates change it directly or ask Claude to, and export it to formats such as PowerPoint, PDF, or Word.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: slides-szablony-beta-plany
    tresc: "Szablony (Slides, Design, Docs) są w wersji beta i domyślnie włączone na planach Pro, Max i Team; na planach Enterprise Owner włącza każdy szablon w Organization settings > Artifacts."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: "Templates are in beta. They're on by default on Pro, Max, and Team plans. On Enterprise plans, an Owner turns each template on under **Organization settings > Artifacts**."
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: artefakt-publikacja-z-prosby-bez-okna-zgody
    tresc: "Nowy artefakt, który Claude publikuje w odpowiedzi na prośbę wpisaną przez Ciebie, przechodzi bez okna zgody i bez przeglądu klasyfikatora. W kilku przypadkach Claude Code najpierw pyta (w trybie Auto zamiast tego publikację sprawdza klasyfikator), na przykład w trybie Plan przed pierwszą publikacją każdego artefaktu."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: "A new artifact that Claude publishes in response to a prompt you type goes through without a permission prompt or classifier review. In these cases Claude Code asks you first, or in auto mode has the classifier review the publish: [...] The session is in plan mode | Asks before the first publish of each artifact"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-opisz-wynik-nie-kroki
    tresc: "Dokumentacja radzi opisać wynik, a nie kroki: powiedz, czego chcesz, i pozwól Claude znaleźć pliki."
    zrodlo: https://code.claude.com/docs/en/prompt-library.md
    cytat: 'Describe the outcome, not the steps. Say what you want and let Claude find the files.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: zlecenie-wskaz-istniejacy-plik-jako-wzor
    tresc: "Dokumentacja radzi wskazać istniejący plik, test albo wzorzec, do którego ma pasować nowy kod, żeby był spójny z tym, co już masz."
    zrodlo: https://code.claude.com/docs/en/prompt-library.md
    cytat: 'Point at a reference. Name an existing file, test, or pattern to match so the new code is consistent with what you already have.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: zlecenie-daj-material-zamiast-opisu
    tresc: "Dokumentacja radzi dać Claude materiał: wkleić do prośby błędy, logi, zrzuty ekranu albo wynik planu albo wpisać @, żeby wskazać plik; Claude czyta źródło, a nie Twój jego opis."
    zrodlo: https://code.claude.com/docs/en/prompt-library.md
    cytat: 'Give it the artifact. Paste errors, logs, screenshots, and plan output directly in the prompt, or type `@` to reference a file. Claude reads the source instead of your description of it.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: zlecenie-nazwij-format-dlugosc-odbiorce
    tresc: "Dokumentacja radzi nazwać format, długość albo odbiorcę, żeby wyjaśnienie pasowało do tego, jak zamierzasz go użyć."
    zrodlo: https://code.claude.com/docs/en/prompt-library.md
    cytat: 'Say how you want the answer. Name the format, length, or audience so the explanation fits how you''ll use it.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: zlecenie-popros-o-sprawdzenie-w-tej-samej-prosbie
    tresc: "Dokumentacja radzi poprosić w tej samej prośbie o uruchomienie, test, porównanie albo sprawdzenie, żeby Claude pracował dalej w kolejnych podejściach, a nie kończył po pierwszej próbie."
    zrodlo: https://code.claude.com/docs/en/prompt-library.md
    cytat: 'Give it a way to check its own work. Ask for run, test, compare, or verify in the same prompt so Claude iterates instead of stopping after one attempt.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: zlecenie-bez-sprawdzianu-ty-jestes-petla-weryfikacji
    tresc: "Claude kończy, gdy praca wygląda na skończoną; bez sprawdzianu, który może uruchomić, jedynym sygnałem jest „wygląda na skończone”, a Ty stajesz się pętlą weryfikacji i każdy błąd czeka, aż go zauważysz."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Claude stops when the work looks done. Without a check it can run, "looks done" is the only signal available, and you become the verification loop: every mistake waits for you to notice it.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: zlecenie-popros-o-dowod-zamiast-zapewnienia
    tresc: "Dokumentacja radzi, żeby Claude pokazał dowód sukcesu, a nie tylko o nim zapewniał."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Have Claude show evidence rather than asserting success: the test output, the command it ran and what it returned, or a screenshot of the result.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: zlecenie-niejasna-prosba-przy-rozpoznawaniu-tematu
    tresc: "Niejasne prośby mogą się przydać, gdy rozpoznajesz temat i stać Cię na poprawianie po drodze."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Vague prompts can be useful when you''re exploring and can afford to course-correct.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: zlecenie-dokladniejsze-polecenia-mniej-poprawek
    tresc: "Im dokładniejsze Twoje polecenia, tym mniej poprawek będziesz potrzebować."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'The more precise your instructions, the fewer corrections you''ll need.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: zlecenie-claude-nie-czyta-w-myslach
    tresc: "Claude potrafi wywnioskować zamiar, ale nie czyta w myślach, więc wskaż konkretne pliki, wspomnij ograniczenia i wskaż przykładowe wzorce."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Claude can infer intent, but it can''t read your mind. Reference specific files, mention constraints, and point to example patterns.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-md-czytany-na-start-sesji
    tresc: "Claude czyta pliki CLAUDE.md na początku każdej sesji."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'You write these files in plain text; Claude reads them at the start of every session.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-md-zwykly-tekst-piszesz-ty
    tresc: "Pliki CLAUDE.md piszesz sam, zwykłym tekstem."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'You write these files in plain text'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: aplikacja-uzywa-claude-md-z-projektu
    tresc: "Pliki CLAUDE.md i CLAUDE.local.md w projekcie są używane zarówno przez aplikację na komputer, jak i przez wiersz poleceń."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**[CLAUDE.md](/docs/en/memory.md)** and `CLAUDE.local.md` files in your project are used by both'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: aplikacja-rozmowa-to-sesja-z-wlasna-historia
    tresc: "W zakładce Code każda rozmowa jest sesją, która ma własną historię rozmowy i własny folder projektu, niezależne od innych sesji."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'each conversation is a **session**: it has its own chat history and project folder, independent of any other session'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: aplikacja-nowa-rozmowa-plus-new-lub-cmd-n
    tresc: "Żeby pracować nad kilkoma zadaniami równolegle, kliknij + New na pasku bocznym albo naciśnij Cmd+N na macOS lub Ctrl+N w Windows."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Click **+ New** in the sidebar, or press **Cmd+N** on macOS or **Ctrl+N** on Windows, to work on multiple tasks in parallel.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-md-w-glownym-katalogu-projektu
    tresc: "CLAUDE.md to plik dodawany w głównym katalogu projektu, który Claude Code czyta na początku każdej sesji."
    zrodlo: https://code.claude.com/docs/en/overview.md
    cytat: 'is a markdown file you add to your project root that Claude Code reads at the start of every session.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-md-prosba-o-zapis
    tresc: "Żeby dodać zasady do CLAUDE.md, poproś o to Claude wprost, na przykład „add this to CLAUDE.md”."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'To add instructions to CLAUDE.md instead, ask Claude directly, like "add this to CLAUDE.md,"'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: aplikacja-reczna-edycja-pliku-w-panelu-files
    tresc: "W sesji lokalnej możesz sam edytować pliki z folderu roboczego sesji w panelu plików, oprócz niektórych plików tylko do odczytu, takich jak .mcp.json i .claude/settings.json."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: |-
      To edit a file yourself, use the [file pane](#arrange-your-workspace):

      * **Local sessions**: you can edit files inside the session's working directory, except some view-only ones such as `.mcp.json` and `.claude/settings.json`.
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: aplikacja-wersja-claude-code-status
    tresc: 'Wersję Claude Code w sesji sprawdzasz, wpisując /status w sesji lokalnej w zakładce Code; nowszą wersję dostajesz przez Claude > Check for Updates… (macOS) albo Help > Check for Updates… (Windows) i nową sesję.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'To see which version of Claude Code a session runs, type `/status` in a local session in the **Code** tab and read the **Claude Code** row, which shows a version such as `2.1.286`. … To get a newer version for local sessions, open **Claude > Check for Updates…** on macOS or **Help > Check for Updates…** on Windows, then start a new session.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: ustawienia-przeladowanie-bez-restartu-hooki
    tresc: 'Claude Code obserwuje pliki ustawień i wczytuje je po zmianie, więc większość zmian, także w hooks, działa w trwającej sesji bez ponownego uruchomienia; plik ustawień w folderze .claude projektu wczytuje nawet wtedy, gdy folder powstał w tej samej sesji.'
    zrodlo: https://code.claude.com/docs/en/settings.md
    cytat: 'Claude Code watches your settings files and reloads them when they change, so it applies most edits to the running session without a restart, including edits to `permissions`, `hooks`, and credential helpers such as `apiKeyHelper`. … For the project''s `.claude/` folder, it loads the file even when you create the folder in the same session.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-piec-typow
    tresc: 'Każdy hook ma typ, który mówi, jak działa: najczęściej command (polecenie powłoki), a poza nim http (wysłanie danych zdarzenia na adres), mcp_tool (narzędzie skonfigurowanego serwera MCP), prompt (jednorazowa ocena modelem) i agent (sprawdzenie z dostępem do narzędzi, funkcja eksperymentalna).'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'Each hook has a `type` that determines how it runs. Most hooks use `"type": "command"`, which runs a shell command. Four other types are available: … `"type": "http"`: POST event data to a URL. … `"type": "mcp_tool"`: call a tool on a configured MCP server. … `"type": "prompt"`: single-turn LLM evaluation. … `"type": "agent"`: multi-turn verification with tool access. Agent hooks are experimental and may change.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-prompt-osad-modelu
    tresc: 'Do decyzji, które wymagają osądu, a nie sztywnej reguły, służy hook typu prompt: zamiast uruchamiać polecenie, Claude Code wysyła Twoją zasadę i dane zdarzenia do modelu Claude, który podejmuje decyzję; polem model możesz wybrać inny model.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'For decisions that require judgment rather than deterministic rules, use `type: "prompt"` hooks. Instead of running a shell command, Claude Code sends your prompt and the hook''s input data to a Claude model to make the decision. You can specify a different model with the `model` field if you need more capability.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-prompt-wysyla-zasade-i-dane-do-modelu
    tresc: 'Hook typu prompt wysyła dane zdarzenia i Twoją zasadę do modelu Claude, domyślnie do tego, którego Claude Code używa do funkcji działających w tle; model odpowiada decyzją, a Claude Code sam ją wykonuje.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'Instead of executing a Bash command, prompt-based hooks: … Send the hook input and your prompt to a Claude model, by default the one Claude Code uses for [background functionality](https://code.claude.com/docs/en/costs.md#background-token-usage) … The LLM responds with structured JSON containing a decision … Claude Code processes the decision automatically'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-prompt-odpowiedz-ok-i-powod
    tresc: 'Model w hooku typu prompt odpowiada polem ok: true pozwala na działanie, a przy false skutek zależy od zdarzenia; przy ok: false model musi podać powód (reason).'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '| `ok` | `true` to allow. For `false`, see the per-event behavior below | … | `reason` | Required when `ok` is `false` |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-prompt-posttooluse-continueonblock
    tresc: 'Gdy hook typu prompt na zdarzeniu PostToolUse odpowie ok: false, domyślnie Claude kończy pracę nad wiadomością, a powód pojawia się w rozmowie jako ostrzeżenie; z continueOnBlock: true powód wraca do Claude i Claude pracuje dalej.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '`PostToolUse`: by default the turn ends and the reason appears in the chat as a warning line. Set `continueOnBlock: true` to feed the reason back to Claude and continue the turn instead'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-prompt-zasada-zakaz-albo-warunek
    tresc: 'W hooku typu prompt zasadę możesz zapisać jako regułę, co zablokować albo przepuścić, albo jako warunek, który musi być spełniony.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'In a prompt or [agent hook](#agent-based-hooks), you can write the `prompt` as a rule about what to block or allow, such as "Block any Bash command that reads `.env` files", or as a condition that must hold, such as "All unit tests pass".'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-prompt-pola-pliku
    tresc: 'Hook typu prompt ma w pliku pola: type z wartością prompt, prompt z tekstem dla modelu oraz nieobowiązkowe model, timeout (czas w sekundach, domyślnie 30) i continueOnBlock (domyślnie false; na zdarzeniach, które je obsługują, m.in. PostToolUse, true oddaje Claude powód odmowy i praca trwa dalej).'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '| `type` | yes | Must be `"prompt"` | … | `prompt` | yes | The prompt text to send to the LLM. … | `model` | no | Model to use for evaluation. … | `timeout` | no | Timeout in seconds. Default: 30 | … | `continueOnBlock` | no | On the events it applies to, `true` feeds an `ok: false` reason back to Claude and continues instead of ending the turn. Default: `false`.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-prompt-dane-doklejone-do-zasady
    tresc: 'Miejsce na dane zdarzenia wskazujesz w tekście zasady znacznikiem $ARGUMENTS; gdy go nie ma, Claude Code dokleja dane zdarzenia do zasady.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '| `prompt` | yes | The prompt text to send to the LLM. Use `$ARGUMENTS` as a placeholder for the hook input JSON. If `$ARGUMENTS` is not present, input JSON is appended to the prompt |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-prompt-czas-30-sekund
    tresc: 'Hook typu prompt ma domyślnie 30 sekund; czas zmienisz polem timeout w sekundach.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'Hook timeouts vary by type. Override per hook with the `timeout` field in seconds. … `prompt`: 30 seconds.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-prompt-zdarzenia-tak-nie
    tresc: 'Typ prompt przyjmują m.in. zdarzenia PostToolUse, PreToolUse i Stop; nie przyjmują go m.in. FileChanged i Notification.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'Events that support all five hook types (`command`, `http`, `mcp_tool`, `prompt`, and `agent`): … `PostToolUse` … `PreToolUse` … `Stop` … Events that support `command`, `http`, and `mcp_tool` hooks but not `prompt` or `agent`: … `FileChanged` … `Notification`'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-prompt-tylko-dane-zdarzenia
    tresc: 'Hook typu prompt wybierasz, gdy do decyzji wystarczą same dane zdarzenia; gdy trzeba sprawdzić coś w rzeczywistym stanie plików, dokumentacja wskazuje hook typu agent.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'Use prompt hooks when the hook input data alone is enough to make a decision. Use agent hooks when you need to verify something against the actual state of the codebase.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-agent-eksperymentalny-czyta-pliki
    tresc: 'Hooki typu agent są eksperymentalne; zamiast jednego zapytania do modelu uruchamiają subagenta, który może czytać pliki, przeszukiwać kod i używać innych narzędzi, zanim zwróci decyzję.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'Agent hooks are experimental. Behavior and configuration may change in future releases. … Unlike prompt hooks, which make a single LLM call, agent hooks spawn a subagent that can read files, search code, and use other tools to verify conditions before returning a decision.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-dopasowanie-edit-write
    tresc: 'Dopasowanie Edit|Write uruchamia hook tylko wtedy, gdy Claude użyje narzędzia Edit albo Write, a nie Bash, Read ani innego narzędzia; przecinek działa jak kreska pionowa, więc Edit, Write znaczy to samo.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'The `"Edit|Write"` matcher fires only when Claude uses the `Edit` or `Write` tool, not when it uses `Bash`, `Read`, or any other tool. A comma separates alternatives the same way, so `"Edit, Write"` is equivalent.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-bez-dopasowania-kazde-zdarzenie
    tresc: 'Hook bez dopasowania rusza przy każdym wystąpieniu swojego zdarzenia; dopasowanie zawęża, kiedy rusza.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'Without a matcher, a hook fires on every occurrence of its event. Matchers let you narrow that down.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-edit-write-pomija-zmiany-poleceniem
    tresc: 'Claude Code nie uruchamia hooka PostToolUse z dopasowaniem Edit|Write, gdy ten sam plik przepisze polecenie Bash albo program spoza Claude Code.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'Claude Code doesn''t run a `PostToolUse` hook matching `Edit|Write` when a `Bash` command or a process outside Claude Code rewrites the same file.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-zmienia-pliki-tez-poleceniami
    tresc: 'Claude może tworzyć i zmieniać pliki także przez uruchamianie poleceń powłoki.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'Claude can also create or modify files by running shell commands.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zdarzenie-filechanged-kazda-zmiana
    tresc: 'Zdarzenie FileChanged zachodzi, gdy obserwowany plik zmieni się na dysku, bez względu na to, co go zmieniło: narzędzie Edit albo Write, polecenie uruchomione przez Claude czy program spoza Claude Code.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'Runs when a watched file changes on disk. Claude Code detects changes with a filesystem watcher, not by inspecting tool calls, so it runs the hook no matter what changed the file: an `Edit` or `Write` tool call, a script Claude runs with `Bash`, or a process outside Claude Code entirely.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-posttooluse-nie-cofa
    tresc: 'Hook PostToolUse nie cofnie działania, bo narzędzie już się wykonało.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: '`PostToolUse` hooks can''t undo actions since the tool has already executed.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-posttooluse-dostaje-dane-narzedzia
    tresc: 'Hook PostToolUse rusza, gdy narzędzie już się udało, i dostaje zarówno dane przekazane narzędziu (tool_input), jak i jego wynik (tool_response).'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '`PostToolUse` hooks fire after a tool has already executed successfully. The input includes both `tool_input`, the arguments sent to the tool, and `tool_response`, the result it returned.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: narzedzie-write-cala-tresc-edit-fragment
    tresc: 'Narzędzie Write tworzy albo nadpisuje plik i dostaje całą jego treść, a narzędzie Edit zamienia tekst w istniejącym pliku i dostaje tekst do zamiany i tekst, na który go zamienia.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '##### Write … Creates or overwrites a file. … | `content` | string | `"file content"` | Content to write to the file | … ##### Edit … Replaces a string in an existing file. … | `old_string` | string | `"original text"` | Text to find and replace | … | `new_string` | string | `"replacement text"` | Replacement text |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-claude-czeka-na-hook
    tresc: 'Domyślnie Claude czeka z dalszą pracą, aż hook się skończy.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'By default, hooks block Claude''s execution until they complete.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-prosba-hook-egzekwowanie
    tresc: 'Zasada w CLAUDE.md albo w skillu, np. „nigdy nie edytuj .env”, to prośba, a nie gwarancja; hook PreToolUse, który blokuje taką edycję, to egzekwowanie, więc zasadę, która ma obowiązywać za każdym razem, dokumentacja każe zapisać w hooku.'
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '**Put guardrails in hooks.** An instruction like "never edit `.env`" in CLAUDE.md or a skill is a request, not a guarantee. A `PreToolUse` hook that blocks the edit is enforcement. If a rule must hold every time, make it a hook rather than a prompt instruction.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hooki-egzekwuja-niezaleznie-od-claude
    tresc: 'CLAUDE.md mówi Claude, jak działa projekt, a uprawnienia i hooki egzekwują granice bez względu na to, co zdecyduje Claude; CLAUDE.md jest na „tak to u nas robimy”, a uprawnienia i hooki na to, co nie może się zdarzyć nigdy.'
    zrodlo: https://code.claude.com/docs/en/debug-your-config.md
    cytat: 'CLAUDE.md and permissions solve different problems. CLAUDE.md tells Claude how your project works so it makes good decisions. [Permissions](https://code.claude.com/docs/en/permissions.md) and [hooks](https://code.claude.com/docs/en/hooks.md) enforce limits regardless of what Claude decides. Use CLAUDE.md for "we do it this way here." Use permissions or hooks for security boundaries and anything that must never happen, where you need a guarantee instead of guidance.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-przyklad-skrypt-blokuje-pliki
    tresc: 'Dokumentacja pokazuje też hook, który nie pozwala Claude zmieniać chronionych plików: osobny skrypt porównuje ścieżkę pliku z listą wzorców i blokuje edycję, a Claude dostaje wyjaśnienie, dlaczego ją zablokowano.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'Prevent Claude from modifying sensitive files like `.env`, `package-lock.json`, or anything in `.git/`. Claude receives feedback explaining why the edit was blocked, so it can adjust its approach. … This example uses a separate script file that the hook calls. The script checks the target file path against a list of protected patterns and exits with code 2 to block the edit.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-kiedy-dopisac
    tresc: "CLAUDE.md to miejsce na to, co inaczej tłumaczysz od nowa; dopisujesz do niego, gdy Claude popełnia ten sam błąd drugi raz albo gdy wpisujesz w rozmowie tę samą poprawkę lub wyjaśnienie co w poprzedniej sesji."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: |-
      Treat CLAUDE.md as the place you write down what you'd otherwise re-explain. Add to it when:

      * Claude makes the same mistake a second time
      * …
      * You type the same correction or clarification into chat that you typed last session
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-md-nie-wpisuj-zmiennych-informacji
    tresc: "Dokumentacja wymienia wśród rzeczy, których nie wpisuje się do CLAUDE.md, informacje, które często się zmieniają."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: '| Repository etiquette (branch naming, PR conventions) | Information that changes frequently |'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-md-nie-wpisuj-oczywistych-praktyk
    tresc: "Dokumentacja wymienia wśród rzeczy, których nie wpisuje się do CLAUDE.md, oczywiste praktyki, na przykład „write clean code”."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: '| Common gotchas or behaviors that aren''t self-evident | Self-evident practices like "write clean code" |'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-md-kontekst-nie-wymuszenie
    tresc: "Claude traktuje pliki CLAUDE.md jako kontekst, a nie wymuszoną konfigurację."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'Claude treats CLAUDE.md files as context, not enforced configuration'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-md-a-notatki-claude-dwa-mechanizmy
    tresc: "Claude Code ma dwa mechanizmy przenoszące wiedzę między sesjami: pliki CLAUDE.md, które piszesz Ty, oraz pamięć automatyczną, czyli notatki, które Claude zapisuje sam na podstawie Twoich poprawek i preferencji."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: |-
      Two mechanisms carry knowledge across sessions:

      * **CLAUDE.md files**: instructions you write to give Claude persistent context. …
      * **Auto memory**: notes Claude writes itself based on your corrections and preferences
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: aplikacja-cmd-n-nowa-sesja
    tresc: "W zakładce Code skrót Cmd+N otwiera nową sesję."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '| `Cmd` `N` | New session |'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-md-bez-gwarancji-stosowania
    tresc: "Claude czyta CLAUDE.md i stara się stosować zasady, ale nie ma gwarancji, że zastosuje każdą."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'Claude reads it and tries to follow it, but there''s no guarantee of strict compliance'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-domowy-chroniony-z-wyjatkami
    tresc: 'Folder .claude, także ~/.claude w folderze domowym, jest chroniony poza kilkoma wyjątkami (np. pliki planu bieżącej sesji w ~/.claude/plans/): w trybach Manual i Accept edits zapis w nim wymaga Twojej zgody.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: '| `default`, `acceptEdits` | Prompted | … For `~/.claude/`: **Yes, and allow Claude to edit files in its \~/.claude folder for this session** … `.claude`, with a few exceptions, such as: … The current session''s own plan files in `~/.claude/plans/`'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hooki-chmura-nie-czyta-domowych-ustawien
    tresc: 'Sesje w chmurze nie czytają Twojego lokalnego pliku ~/.claude/settings.json, więc hooki z niego tam nie działają.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '[Cloud sessions](https://code.claude.com/docs/en/claude-code-on-the-web.md) don''t read your local `~/.claude/settings.json`.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-command-bez-polecen-i-narzedzi
    tresc: 'Hook typu command porozumiewa się z Claude Code tylko wynikiem polecenia i kodem wyjścia; nie może wywołać poleceń z ukośnikiem ani użyć narzędzi.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'Command hooks communicate through stdout, stderr, and exit codes only. They can''t trigger `/` commands or tool calls.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: ustawienia-zmiana-nie-dotarla-nowa-sesja
    tresc: 'Zmiany w pliku ustawień zwykle wczytują się same; gdy po kilku sekundach ich nie widać, obserwator plików mógł je przeoczyć; wtedy ponowne uruchomienie sesji wymusza wczytanie.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'File edits are normally picked up automatically. If they haven''t appeared after a few seconds, the file watcher may have missed the change: restart your session to force a reload.'
    sprawdzono: '2026-10-26'
    wersja: '2.1.310'

  - id: aplikacja-przyklad-prosby-utworz-claude-md
    tresc: "Dokumentacja aplikacji podaje jako przykład prośby, którą wpisujesz, żeby Claude coś zrobił: utwórz plik CLAUDE.md z zasadami dla tego projektu."
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    cytat: 'Type what you want Claude to do: … `Create a CLAUDE.md with instructions for this codebase`'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-md-zasady-konkretne-do-sprawdzenia
    tresc: "Dokumentacja radzi pisać zasady w CLAUDE.md na tyle konkretnie, żeby dało się je sprawdzić."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'Write instructions that are concrete enough to verify'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-md-konkretne-i-zwiezle-stosowane-spojniej
    tresc: "Im konkretniejsze i krótsze zasady, tym spójniej Claude ich przestrzega."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'The more specific and concise your instructions, the more consistently Claude follows them.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-md-do-200-linii
    tresc: "Dokumentacja radzi celować w mniej niż 200 linii na plik CLAUDE.md; dłuższe pliki zużywają więcej kontekstu i obniżają stosowanie zasad."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'target under 200 lines per CLAUDE.md file. Longer files consume more context and reduce adherence.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-md-sprzeczne-zasady-wybor-dowolny
    tresc: "Gdy dwie zasady sobie przeczą, Claude może wybrać jedną dowolnie."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'if two instructions contradict each other, Claude may pick one arbitrarily'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-md-wazne-tylko-przy-jednej-zasadzie
    tresc: "Gdy Claude wciąż pomija jedną zasadę, dokumentacja radzi dopisać wyróżnienie, na przykład „IMPORTANT”, przy tej jednej linii; wyróżnienie wielu linii sprawia, że żadna się nie wyróżnia."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'If Claude keeps skipping one instruction, add emphasis such as "IMPORTANT" to that line alone. If you emphasize many lines, none of them stands out.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: claude-md-sprawdz-zmiane-obserwujac-zachowanie
    tresc: "Dokumentacja radzi sprawdzać zmiany w CLAUDE.md, obserwując, czy zachowanie Claude faktycznie się zmienia."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'test changes by observing whether Claude''s behavior actually shifts'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: artefakt-nowy-widoczny-tylko-dla-ciebie
    tresc: "Nowy artefakt widzisz tylko Ty. Żeby go udostępnić, otwierasz go w przeglądarce i używasz kontrolki Share w nagłówku strony."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'A new artifact is visible only to you. To share it, open the artifact in your browser and use the **Share** control in the page header.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: aplikacja-link-w-rozmowie-cmd-klik-zwykla-przegladarka
    tresc: "Przy pierwszym kliknięciu zewnętrznego linku w rozmowie okno pyta, czy linki otwierać w panelu Browser, czy w domyślnej przeglądarce; kliknięcie z klawiszem Cmd (macOS) albo Ctrl (Windows) otwiera link od razu w domyślnej przeglądarce."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'The first time you click an external link in the chat, a dialog asks whether links open in the Browser pane or in your default browser. [...] **Cmd**-click on macOS or **Ctrl**-click on Windows opens a link in your default browser directly.'
    sprawdzono: '2026-10-25'
