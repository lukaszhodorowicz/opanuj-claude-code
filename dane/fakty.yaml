    wersja: "2.1.310"

  # Fakty lekcji prezentacja-dla-klienta (moduł 3), zebrane 26.10.2026.
  - id: artefakt-wbudowany-skill-wygladu-szuka-zapisu-wygladu
    tresc: "Gdy Claude buduje artefakt, stosuje wbudowany skill wyglądu, więc strona dostaje przemyślaną paletę, typografię i układ bez dodatkowych próśb; skill ten najpierw szuka w projekcie istniejącego zapisu wyglądu (design system), zanim wybierze własny."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Claude applies a built-in design skill when it builds an artifact, so pages get a deliberate palette, typography, and layout without extra prompting. That skill also looks for an existing design system in your project before choosing its own.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-zapis-wygladu-marki-w-claude-md
    tresc: "Design tokens to nazwane wartości kolorów, typografii i odstępów, które zapis wyglądu wykorzystuje wielokrotnie. Żeby artefakty były spójne z marką produktu, zapisujesz je tam, gdzie Claude je znajdzie, na przykład w CLAUDE.md projektu albo w pliku motywu w repozytorium; przykład w dokumentacji to nagłówek „## Design system” z listą kolorów, czcionek i odstępów."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Design tokens are the named color, typography, and spacing values your design system reuses. To keep artifacts consistent with your product''s branding, record them where Claude can find them, such as the project''s [CLAUDE.md](https://code.claude.com/docs/en/memory.md) or a theme file in your repository: [...] ## Design system - Colors: primary #1a4d8f, accent #f59e0b, surface #f8fafc - Typography: Inter for body, JetBrains Mono for code - Spacing: 8px scale, 6px border radius'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-pierwszenstwo-prosba-zapis-wygladu-claude
    tresc: "Claude traktuje Twój zapis wyglądu (design system) jako ważniejszy od własnych wyborów, a Twoją prośbę jako ważniejszą od obu. Nagłówek i format z przykładu to tylko przykład; wystarczy każda jasna lista kolorów, czcionek i odstępów."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Claude treats your design system as higher precedence than its own choices, and your prompt as higher precedence than both. The heading and format above are an example; any clear list of colors, fonts, and spacing works.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-konkretny-kroj-nazwij-w-prosbie-albo-zapisie
    tresc: "Żeby użyć konkretnego kroju czcionki, nazywasz go w prośbie albo w zapisie wyglądu (design system)."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'To use a specific typeface, name it in your prompt or your design system.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: szablony-slides-design-docs-do-czego
    tresc: "Zamiast budować stronę od zera, Claude może zacząć artefakt od jednego z trzech szablonów na Twoim koncie claude.ai: Claude Slides do prezentacji, Claude Design do projektu wizualnego albo Claude Docs do dokumentu, który inni będą czytać i edytować."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Instead of building a page from scratch, Claude can start an artifact from one of the templates on your claude.ai account: [Claude Slides](https://support.claude.com/en/articles/17153992-what-are-artifacts-and-how-do-i-use-them#h_11d5a9a5fa) for a presentation, [Claude Design](https://support.claude.com/en/articles/14604416-get-started-with-claude-design) for a visual design, or [Claude Docs](https://support.claude.com/en/articles/16923645-get-started-with-claude-docs) for a document other people will read and edit.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: slides-polecenie-slides-z-opisem-temat-i-odbiorca
    tresc: "Przy prezentacji albo projekcie możesz też uruchomić polecenie /slides albo /design z opisem; w /slides opis mówi, o czym jest prezentacja i dla kogo."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'For a deck or a design you can also run `/slides` or `/design` with a brief. [...] Run `/slides` with a brief that says what the deck covers and who it''s for:'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: slides-polecenia-wymagaja-wersji-i-wlaczonego-szablonu
    tresc: "Gdy organizacja wyłączyła szablon Slides, polecenie /slides się nie pojawia; gdy wyłączyła szablon Design, /design nie szkicuje projektów. Oba polecenia wymagają Claude Code 2.1.265 lub nowszego i sesji, w której artefakty są dostępne."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'If your organization has the Slides template turned off, `/slides` doesn''t appear; if it has the Design template turned off, `/design` doesn''t draft designs. Both commands require Claude Code v2.1.265 or later and a session where [artifacts are available](#availability).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: slides-polecenie-tworzy-artefakt-i-daje-link
    tresc: "Po poleceniu /slides z opisem Claude tworzy artefakt Claude Slides i daje Ci link."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Run `/slides` with a brief that says what the deck covers and who it''s for: [...] Claude creates a Claude Slides artifact and gives you the link.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: slides-bez-opisu-claude-pyta
    tresc: "Gdy uruchomisz /slides bez opisu, Claude najpierw pyta, o czym ma być prezentacja, i dopiero potem cokolwiek tworzy."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'If you run `/slides` without a brief, Claude asks what the deck should be about before creating anything.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: design-polecenie-makiety-artboardy-na-jednym-plotnie
    tresc: "Żeby zrobić makietę interfejsu, przebiegu ekranów, strony docelowej albo plakatu zamiast budować stronę, uruchamiasz /design z opisem; Claude szkicuje projekt jako artboardy na jednym płótnie i publikuje to płótno jako artefakt Claude Design."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'To mock up a UI, a screen flow, a landing page, or a poster rather than build a page, run `/design` with a brief. Claude drafts the design as artboards on one canvas and publishes the canvas as a Claude Design artifact.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: design-edycja-w-przegladarce-zapis-automatyczny-eksport-artboardow
    tresc: "Opublikowany artefakt Claude Design otwierasz w przeglądarce na komputerze, żeby przejrzeć artboardy; zaznaczasz element na artboardzie i zmieniasz go, a zmiany zapisują się automatycznie; każdy artboard możesz wyeksportować do PNG albo PDF."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Claude drafts the design as artboards on one canvas and publishes the canvas as a Claude Design artifact. [...] Open the published artifact in a desktop browser to review the artboards. Select an element on an artboard and change it, and your edits save automatically. You can export each artboard as PNG or PDF.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: docs-konektor-prosba-o-dokument-dla-innych-idzie-do-docs
    tresc: "Claude Docs trafia do Claude Code jako konektor claude.ai, a nie jako polecenie; gdy jest podłączony, prośba o dokument przeznaczony dla innych osób (specyfikację, propozycję, opis planu z sesji) trafia do Claude Docs zamiast na stronę artefaktu, a Claude daje Ci link do dokumentu, gdy go przygotuje."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Claude Docs reaches Claude Code as a claude.ai [connector](https://code.claude.com/docs/en/mcp.md#use-mcp-servers-from-claude-ai) rather than a command. When it''s connected, [...] A request for a document meant for other people then goes to Claude Docs instead of an artifact page: a spec, a proposal, or a write-up of the plan you worked through in the session. Claude gives you the doc''s link when it''s drafted.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: docs-plik-zamiast-dokumentu-gdy-nazwiesz-format
    tresc: "Dokument, który należy do kodu, na przykład README, zostaje plikiem; żeby dostać plik zamiast dokumentu w Claude Docs, nazywasz format, na przykład .docx albo plik Markdown w repozytorium."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'A document that belongs in the codebase, such as a README, stays a file. To get a file for something Claude would otherwise put in Claude Docs, name the format, such as `.docx` or a Markdown file in the repository.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: docs-konektor-od-anthropic-bez-konfiguracji-na-kontach-z-dostepem
    tresc: "Anthropic sam udostępnia niektóre konektory, bez dodawania ich przez Ciebie ani administratora; na kontach, na których Claude Docs jest dostępny, ten konektor działa bez konfiguracji, a Claude używa go, gdy prosisz o dokument przeznaczony dla innych osób."
    zrodlo: https://code.claude.com/docs/en/mcp.md
    cytat: 'Anthropic also provides some connectors itself, without you or an admin adding them. On accounts where [Claude Docs](https://code.claude.com/docs/en/artifacts.md#write-a-document-with-claude-docs) is available, `/mcp` lists `claude.ai Claude Docs` with no setup, and Claude uses it when you ask for a document meant for other people.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-plus-add-connectors-otwiera-katalog-konektorow
    tresc: "W aplikacji, w sesji lokalnej albo SSH z kontem Claude, konektory dodajesz przyciskiem + obok pola wiadomości, przed sesją albo w jej trakcie: wybierasz Add connectors, żeby otworzyć katalog konektorów; gdy menu pokazuje Connectors, wybierasz tę pozycję, a potem Browse connectors."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Click **+** next to the prompt box, before or during the session, to add connectors in a local or [SSH](#ssh-sessions) session with a Claude account. Select **Add connectors** to open the connector directory. If the menu shows **Connectors** instead, select it, then **Browse connectors**.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-status-pokazuje-wersje-claude-code-sesji
    tresc: "Żeby zobaczyć, jakiej wersji Claude Code używa sesja, wpisujesz /status w sesji lokalnej w zakładce Code i czytasz wiersz Claude Code, który pokazuje wersję, na przykład 2.1.286."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'To see which version of Claude Code a session runs, type `/status` in a local session in the **Code** tab and read the **Claude Code** row, which shows a version such as `2.1.286`.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-nowsza-wersja-claude-code-check-for-updates-i-nowa-sesja
    tresc: "Żeby dostać nowszą wersję Claude Code dla sesji lokalnych, otwierasz Claude > Check for Updates… na macOS albo Help > Check for Updates… na Windows, a potem zaczynasz nową sesję."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'To get a newer version for local sessions, open **Claude > Check for Updates…** on macOS or **Help > Check for Updates…** on Windows, then start a new session.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-trzy-widownie-prywatny-organizacja-publiczny
    tresc: "Artefakty zamieniają pracę Claude Code w żywe, interaktywne strony na claude.ai, które możesz zostawić prywatne, udostępnić swojej organizacji albo opublikować pod publicznym linkiem."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Artifacts turn Claude Code''s work into live, interactive pages on claude.ai that you can keep private, share with your organization, or publish to a public link.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-otwierasz-w-przegladarce-aktualizuje-sie-w-miejscu-gdy-sesja-trwa
    tresc: "Artefakt otwierasz w przeglądarce i aktualizuje się on w miejscu, gdy sesja trwa; udostępniasz go z nagłówka strony, gdy chcesz, żeby zobaczył go ktoś jeszcze."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'You open it in a browser, and it updates in place as the session continues. Share it from the page header when you want someone else to see it too.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-kiedy-latwiej-obejrzec-niz-czytac
    tresc: "Artefakt wybierasz wtedy, gdy tekst w terminalu to zły nośnik dla tego, co przygotował Claude: gdy wynik łatwiej obejrzeć i wejść z nim w interakcję, niż czytać go linijka po linijce."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Use an artifact when terminal text is the wrong medium for what Claude produced: output that is easier to look at and interact with than to read line by line.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-link-zamiast-wklejania-wyniku
    tresc: "Jako przykład prośby do Claude dokumentacja podaje wysłanie koledze z zespołu linku zamiast wklejania wyniku do Slacka."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Send a teammate a link instead of pasting output into Slack'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-jedna-strona-bez-zaplecza
    tresc: "Artefakt to zapis pracy: jedna samodzielna strona bez zaplecza, więc nie obsłuży wielu podstron; dla hostowanego narzędzia wewnętrznego z zapleczem wdrażasz je na własnej infrastrukturze."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'An artifact is a capture of work: one self-contained page with no backend, so it can''t serve multiple routes. For a hosted internal tool with a backend, deploy it on your own infrastructure instead.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-bez-wskazania-plik-w-katalogu-tymczasowym
    tresc: "Jeśli nie wskażesz miejsca, Claude zapisuje stronę do pliku HTML albo Markdown w katalogu tymczasowym poza projektem i dopiero potem ją publikuje; artefakt jest prywatny, dopóki go nie udostępnisz."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Unless you name a location, Claude writes the page to an HTML or Markdown file in a temporary directory outside your project, then publishes it. The artifact stays private to you until you share it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-tytul-widac-w-galerii-i-w-udostepnionych-linkach
    tresc: "Tytuł artefaktu widać w Twojej galerii artefaktów na claude.ai i w udostępnionych linkach."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'The title appears in your gallery of artifacts on claude.ai and in shared links.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-brak-linku-znaczy-artefakty-niewlaczone
    tresc: "Gdy Claude odpowiada, że nie może opublikować, albo zapisuje lokalny plik HTML bez linku, artefakty nie są włączone w Twojej sesji i trzeba sprawdzić wymagania dostępności; gdy któryś z warunków dostępności nie jest spełniony, Claude zapisuje lokalny plik HTML albo mówi, że nie może opublikować."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'If Claude responds that it can''t publish, or writes a local HTML file without a link, artifacts aren''t enabled for your session. Check the Availability requirements. [...] Artifacts require every condition below. When one is not met, Claude writes a local HTML file or says it cannot publish instead.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-publiczny-pyta-raz-na-rozmowe-przed-zmiana
    tresc: "Gdy udostępnisz artefakt publicznie, Claude Code pyta raz na rozmowę, zanim go zmieni (w trybie Auto zamiast pytania publikację sprawdza klasyfikator)."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'In these cases Claude Code asks you first, or in auto mode has the classifier review the publish: [...] You shared the artifact publicly | Asks once per conversation before changing it'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-pyta-gdy-plik-wymaga-zgody-na-odczyt
    tresc: "Gdy Claude nie może przeczytać pliku bez Twojej zgody, Claude Code pyta przed jego publikacją, a reguła zezwalająca dla narzędzia Artifact tego pytania nie pomija (w trybie Auto zamiast pytania publikację sprawdza klasyfikator)."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'In these cases Claude Code asks you first, or in auto mode has the classifier review the publish: [...] Claude can''t read the file without your approval | Asks before publishing it. An allow rule for the `Artifact` tool doesn''t skip this prompt'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-pyta-przy-zmianie-pliku-bez-zgody-w-manual
    tresc: "W trybie Manual albo acceptEdits, gdy Claude wprowadza małą zmianę w pliku artefaktu, której nie może zrobić bez Twojej zgody (na przykład w pliku projektu w trybie Manual), Claude Code pyta przed opublikowaniem tej zmiany, także gdy reguła zezwalająca obejmuje narzędzie Artifact."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'In these cases Claude Code asks you first, or in auto mode has the classifier review the publish: [...] In Manual or `acceptEdits` mode, Claude makes a small change to an artifact''s file it can''t edit without your approval, such as a project file in Manual mode | Asks before publishing the change. You''re asked even if an allow rule covers the `Artifact` tool, because the edit to the file needs your approval'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-klawisz-d-w-liscie-artifacts-kasuje-trwale-link-przestaje-dzialac
    tresc: "W Claude Code poleceniem /artifacts wyświetlasz swoje artefakty i te udostępnione Tobie, a klawisz d (poza sesją w chmurze) trwale kasuje po potwierdzeniu artefakt, którego jesteś właścicielem; jego link przestaje działać dla wszystkich, także dla Ciebie."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Run `/artifacts` in Claude Code to list the artifacts you own and the ones shared with you. [...] **`d`**: outside a cloud session, permanently deletes an artifact you own after you confirm. Its link stops working for everyone, including you'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-menu-share-opis-zrzutu
    tresc: "Opis zrzutu w dokumentacji: otwarte menu Share ma przełącznik Always share latest version, wybór wersji z napisem Sharing version 2, wybór widowni (w przykładzie Everyone at Acme) i przycisk Copy link."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'The Share menu is open with the Always share latest version toggle, a version picker reading Sharing version 2, an Everyone at Acme audience selector, and a Copy link button.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-galeria-claude-ai-code-artifacts
    tresc: "Nagłówek strony artefaktu prowadzi też do Twojej galerii pod adresem claude.ai/code/artifacts, w której są wszystkie utworzone przez Ciebie artefakty."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'The header also links to your gallery at claude.ai/code/artifacts, which lists every artifact you have created.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-ogladajacy-z-organizacji-widza-imie-autora
    tresc: "Oglądający z Twojej organizacji widzą, kto opublikował stronę: przy artefakcie udostępnionym w organizacji Twoje imię jest w menu tytułu, a przy artefakcie publicznym w nagłówku strony dla zalogowanych oglądających z Twojej organizacji."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Viewers in your organization can see who published the page: on an artifact shared within your organization, your name is in the title menu, and on a public artifact it''s in the page header for signed-in viewers in your organization.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-udostepnianie-w-organizacji-team-enterprise
    tresc: "Na planach Team i Enterprise artefakt możesz udostępnić w organizacji: wskazanym osobom z organizacji albo wszystkim w niej; oglądający logują się do claude.ai jako członkowie organizacji, żeby zobaczyć stronę."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Who you can share with depends on your plan: [...] **Within your organization**: on Team and Enterprise plans, grant access to specific people in your organization, or to everyone in it. Viewers sign in to claude.ai as members of your organization to see the page.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-link-do-czesci-strony-z-kotwica
    tresc: "Jeśli strona ma kilka widoków, na przykład karty albo sekcje, możesz poprosić Claude o linki do każdego z nich; taki link to link artefaktu z kotwicą na końcu, na przykład #overview."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'If a page has several views, such as tabs or sections, you can link to one of them directly. Ask Claude for the links: [...] Each link is the artifact''s link with an anchor on the end, such as `#overview`.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-czcionki-z-google-fonts-skrypty-z-pieciu-cdn
    tresc: "Strona może ładować kroje pisma z Google Fonts i skrypty z pięciu publicznych serwerów CDN: cdnjs, unpkg, CDN Tailwind i jQuery oraz wybranych ścieżek jsDelivr, takich jak /npm/."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'The page can load typefaces from Google Fonts, and scripts from five public CDN hosts: cdnjs, unpkg, the Tailwind and jQuery CDNs, and selected paths on jsDelivr such as `/npm/`.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-zewnetrzne-obrazy-zablokowane-obrazy-w-pliku
    tresc: "Polityka CSP blokuje każdy zewnętrzny obraz oraz wszystkie inne zewnętrzne skrypty, arkusze stylów i czcionki (poza dozwolonymi serwerami); dlatego Claude ładuje potrzebne biblioteki z jednego z dozwolonych CDN, resztę CSS i JavaScriptu wkleja do pliku, a obrazy osadza w nim jako data URI."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'The CSP blocks every external image and all other external scripts, stylesheets, and fonts, [...] Claude therefore loads any library the page needs from one of those CDNs, inlines all other CSS and JavaScript, and embeds images as data URIs.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-wywolania-sieciowe-tylko-do-wlasnego-pochodzenia
    tresc: "Polityka CSP pozwala wywołaniom fetch, XHR i WebSocket sięgać tylko do własnego pochodzenia (origin) strony i hostów Google Fonts."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'The CSP blocks every external image and all other external scripts, stylesheets, and fonts, and lets `fetch`, XHR, and WebSocket calls reach only the page''s own origin and the Google Fonts hosts.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-bez-zaplecza-bez-logowania-ogladajacych
    tresc: "Artefakt to strona statyczna bez zaplecza, więc sam nie może uwierzytelniać oglądających."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'No backend | An artifact is a static page. It can''t authenticate viewers itself.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-linki-wzgledne-nie-dzialaja
    tresc: "Linki względne nie działają, bo obok strony nie jest nic wdrożone; przy treści z wieloma częściami Claude używa kotwic na stronie zamiast osobnych plików."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Single page | Relative links do not resolve, because nothing is deployed alongside the page. For multi-section content, Claude uses in-page anchors rather than separate files.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-plik-html-htm-md-utf8
    tresc: "Opublikowany plik musi mieć rozszerzenie .html, .htm albo .md i dać się odczytać jako UTF-8 (albo UTF-16 little-endian po znaczniku BOM); pliki Markdown wyświetlają się jako ostylowane strony dokumentu z podświetlaniem składni kodu."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'The published file must be `.html`, `.htm`, or `.md`, and must decode as UTF-8, or as little-endian UTF-16 by its byte-order mark. Markdown files render as styled document pages with syntax-highlighted code.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-plik-spod-sciezki-sieciowej-odrzucony
    tresc: "Plik pod ścieżką, która wskazuje host sieciowy, jest odrzucany bez odczytu; dokumentacja nazywa to plikiem na udziale sieciowym (network share) i osobno opisuje, które ścieżki są odrzucane, oraz wyjątek dla zmapowanego dysku w Windows."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Source location | A file at a path that names a network host is refused without being read. See Not published: that file is on a network share for which paths are refused and the mapped-drive exception on Windows.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-limit-16-mib-duze-obrazy
    tresc: "Wyrenderowana strona może mieć najwyżej 16 MiB; gdy publikacja nie udaje się z powodu rozmiaru, zwykle winne są duże osadzone obrazy."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Rendered size | The rendered page must be 16 MiB or smaller. Large embedded images are the usual cause when a publish fails for size.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-pro-max-bez-administratora
    tresc: "Na planach Pro i Max artefakty są prywatne, dopóki ich nie udostępnisz, i nie dotyczy ich zarządzanie przez administratora; na planach Team i Enterprise artefakty są domyślnie włączone, a Owner może je wyłączyć dla organizacji w ustawieniach administratora claude.ai."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Plan | Pro, Max, Team, or Enterprise. On Pro and Max plans, artifacts are private to you until you share them, and no admin management applies. On Team and Enterprise plans, artifacts are on by default, and an Owner can turn them off for the organization in claude.ai admin settings.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-polityka-z-api-anthropic-claude-mowi-dlaczego
    tresc: "To, czy artefakty są dozwolone w Twojej organizacji, wynika z polityki organizacji, którą Claude Code wczytuje z api.anthropic.com; gdy jej nie wczyta, artefakty są niedostępne, a gdy o nie poprosisz, Claude mówi dlaczego."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Whether artifacts are allowed for your organization comes from your organization''s policy, which Claude Code loads from `api.anthropic.com`. When Claude Code can''t load the policy, artifacts are unavailable. When you ask for one, Claude says why.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-tresc-na-infrastrukturze-anthropic
    tresc: "W opisie zarządzania artefaktami na planach Team i Enterprise dokumentacja podaje, że treść artefaktu jest przechowywana na infrastrukturze prowadzonej przez Anthropic i widzą ją tylko uwierzytelnieni członkowie organizacji, która ją opublikowała, oraz osoby, którym ją udostępnili, chyba że artefakt udostępniono publicznie."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Artifact content is stored on Anthropic-operated infrastructure and is visible only to authenticated members of the publishing organization and the people they share it with, unless the artifact is shared publicly.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-zmiana-wyboru-otwierania-linkow-w-menu-panelu
    tresc: "Przy pierwszym kliknięciu zewnętrznego linku w rozmowie okno pyta, czy linki otwierać w panelu Browser, czy w domyślnej przeglądarce; żeby później zmienić ten wybór, używasz pozycji Open links in built-in browser w menu ⋮ panelu Browser."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'The first time you click an external link in the chat, a dialog asks whether links open in the Browser pane or in your default browser. To change your choice later, use **Open links in built-in browser** in the Browser pane''s **⋮** menu.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-panel-browser-keep-cookies
    tresc: "Pozycją Keep cookies w menu ⋮ panelu Browser wybierasz, czy Browser zachowuje ciasteczka po zamknięciu aplikacji, żeby podczas pracy nad swoją aplikacją nie logować się od nowa."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Choose whether the Browser keeps cookies after you quit the app with **Keep cookies** in the Browser pane''s **⋮** menu, so you don''t have to sign in again during development'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-dawne-nazwy-trybow-w-zakladce-code
    tresc: "Wcześniejsze wersje zakładki Code nazywały tryby uprawnień z tabeli Ask permissions, Auto accept edits i Plan mode; dokumentacja nie wskazuje wprost, która dawna nazwa odpowiada któremu obecnemu trybowi."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Earlier versions of the Code tab labeled these modes Ask permissions, Auto accept edits, and Plan mode.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-zapisuje-konwencje-na-start-sesji
    tresc: Konwencje, których Claude się nauczył, możesz zapisać w CLAUDE.md, żeby każda sesja zaczynała od tego kontekstu i Claude nie uczył się ich od nowa.
    zrodlo: https://code.claude.com/docs/en/prompt-library.md
    cytat: 'record the conventions Claude learned in [CLAUDE.md](https://code.claude.com/docs/en/memory.md) so every session starts with that context instead of Claude relearning it.'
    sprawdzono: 2026-10-25
    wersja: 2.1.310
    sprawdzone_przez: filtr-prawdy 2026-10-25 (lekcja dobre-zlecenie); w lekcji claude-md-zasady-firmy zastąpiony faktem claude-md-czytany-na-start-sesji (filtr prawdy, brzmienie 19)

  - id: sesje-niezalezne-zasady-w-claude-md
    tresc: Każda nowa sesja Claude Code zaczyna z czystym oknem kontekstu, bez historii rozmowy z poprzednich sesji, a własne stałe zasady możesz zapisać w CLAUDE.md.
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: 'Each new session starts with a fresh context window, without the conversation history from previous sessions. … you can add your own persistent instructions in [CLAUDE.md](https://code.claude.com/docs/en/memory.md).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-gdy-chcesz-pokierowac-zachowaniem
    tresc: Pliki CLAUDE.md służą do tego, żeby pokierować zachowaniem Claude.
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: "Use CLAUDE.md files when you want to guide Claude's behavior."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-fakty-na-kazda-sesje
    tresc: Do CLAUDE.md wpisujesz fakty, które Claude ma znać w każdej sesji, w tym reguły typu „zawsze rób X”.
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'Keep it to facts Claude should hold in every session: … "always do X" rules.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-naglowki-i-punkty
    tresc: Zasady pogrupowane pod nagłówkami i w punktach Claude łatwiej stosuje niż gęste akapity.
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'group related instructions under markdown headers and bullets. Organized sections are easier for Claude to follow than dense paragraphs.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-bez-wymaganego-formatu
    tresc: Dla plików CLAUDE.md nie ma wymaganego formatu; dokumentacja radzi, żeby były krótkie i czytelne dla człowieka.
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: "There's no required format for CLAUDE.md files, but keep it short and human-readable."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-tylko-to-co-dotyczy-wszystkiego
    tresc: CLAUDE.md wczytuje się w każdej sesji, więc dokumentacja radzi wpisywać do niego tylko to, co ma zastosowanie szeroko.
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'CLAUDE.md is loaded every session, so only include things that apply broadly.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-nie-wpisuj-dlugich-wyjasnien
    tresc: Dokumentacja wymienia wśród rzeczy, których nie wpisuje się do CLAUDE.md, długie wyjaśnienia i samouczki.
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: '| ✅ Include | ❌ Exclude | … | Architectural decisions specific to your project | Long explanations or tutorials |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-panel-plikow-zapisuje-sam
    tresc: W aplikacji zmiany, które wprowadzasz w panelu plików, domyślnie zapisują się same, więc panel nie ma przycisku Save.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'By default, your edits in the file pane save on their own, so the pane shows no **Save** button.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-i-notatki-wczytane-na-start-rozmowy
    tresc: Oba mechanizmy pamięci Claude Code, czyli CLAUDE.md i notatki Claude, wczytują się na początku każdej rozmowy.
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'Claude Code has two complementary memory systems. Both are loaded at the start of every conversation.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-wiekszosc-edytuje-tylko-ten-plik
    tresc: Większość użytkowników edytuje tylko CLAUDE.md i settings.json.
    zrodlo: https://code.claude.com/docs/en/claude-directory.md
    cytat: 'Most users only edit `CLAUDE.md` and `settings.json`.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-sprawdz-czy-plik-w-wczytywanym-miejscu
    tresc: Gdy Claude nie stosuje się do CLAUDE.md, dokumentacja radzi sprawdzić, czy plik leży w miejscu, które wczytuje się dla Twojej sesji.
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'Check that the relevant CLAUDE.md is in a location that gets loaded for your session'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-dziala-na-kazdej-powierzchni
    tresc: Każda powierzchnia Claude Code łączy się z tym samym silnikiem, więc pliki CLAUDE.md repozytorium, ustawienia i serwery MCP działają we wszystkich.
    zrodlo: https://code.claude.com/docs/en/overview.md
    cytat: "Each [surface](https://code.claude.com/docs/en/glossary.md#surface) connects to the same underlying Claude Code engine, so your repo's CLAUDE.md files, settings, and MCP servers work across all of them."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-opisujesz-co-chcesz-claude-ustala-jak
    tresc: "Według dokumentacji zamiast pisać kod samemu i prosić Claude o przegląd, opisujesz, czego chcesz, a Claude sam ustala, jak to zbudować; Claude bada, planuje i realizuje."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Instead of writing code yourself and asking Claude to review it, you describe what you want and Claude figures out how to build it. Claude explores, plans, and implements.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-nie-trzeba-wskazywac-ktore-pliki-czytac
    tresc: "Nie musisz podawać, które pliki Claude ma przeczytać ani jakie polecenia uruchomić; Claude sam to ustala."
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: 'You don''t need to specify which files to read or what commands to run. Claude figures that out.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-zlecaj-jak-zdolnemu-wspolpracownikowi
    tresc: "Dokumentacja radzi zlecać zadanie jak zdolnemu współpracownikowi: dajesz kontekst i kierunek, a szczegóły zostawiasz Claude."
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: 'Think of delegating to a capable colleague. Give context and direction, then trust Claude to figure out the details'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-sprawdzian-z-wynikiem-zamyka-petle
    tresc: "Gdy sprawdzian daje wynik przechodzi albo nie przechodzi, pętla zamyka się sama: Claude robi pracę, uruchamia sprawdzian, czyta wynik i poprawia, aż sprawdzian przejdzie."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Give Claude something that produces a pass or fail, and the loop closes on its own. Claude does the work, runs the check, reads the result, and iterates until the check passes.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-sprawdzian-roznica-miedzy-pilnowana-a-zostawiona-sesja
    tresc: "Według dokumentacji sprawdzian, który Claude może uruchomić, to różnica między sesją, którą oglądasz, a sesją, od której możesz odejść."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Give Claude a check it can run: tests, a build, a screenshot to compare. It''s the difference between a session you watch and one you walk away from.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-sprawdzian-to-sygnal-czytelny-w-rozmowie
    tresc: "Sprawdzianem jest wszystko, co zwraca sygnał, który Claude może przeczytać w rozmowie."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'The check is anything that returns a signal Claude can read in the conversation'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-sprawdzian-w-prosbie-dziala-od-dzis
    tresc: "Sprawdzian zlecony w jednej prośbie działa przy każdym zadaniu już dziś; żeby praca bez Twojego nadzoru skończyła się poprawnie, potrzeba wersji z /goal albo z hookiem Stop."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'In one prompt: ask Claude to run the check and iterate in the same message … The prompt version works on any task today. The `/goal` and Stop hook versions are what let an unattended run finish correctly without you.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-dowod-szybszy-niz-powtorne-sprawdzanie
    tresc: "Przejrzenie dowodu jest szybsze niż samodzielne powtórzenie sprawdzenia i działa też przy sesjach bez Twojego nadzoru."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Reviewing evidence is faster than re-running the verification yourself, and it works for sessions you weren''t watching.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-czego-nie-sprawdzisz-nie-wypuszczaj
    tresc: "Dokumentacja radzi zawsze zapewnić sprawdzenie (testy, skrypty, zrzuty ekranu); czego nie możesz sprawdzić, tego nie wypuszczaj."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Always provide verification (tests, scripts, screenshots). If you can''t verify it, don''t ship it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-zawez-zadanie
    tresc: "Dokumentacja radzi zawęzić zadanie: podać, który plik, jaki przypadek i jakie preferencje dotyczące testów."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Scope the task. Specify which file, what scenario, and testing preferences.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-wskaz-zrodlo-ktore-odpowie-na-pytanie
    tresc: "Dokumentacja radzi wskazać Claude źródło, które może odpowiedzieć na pytanie."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Point to sources. Direct Claude to the source that can answer a question.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-wskaz-istniejace-wzorce-w-bazie-kodu
    tresc: "Dokumentacja radzi wskazać Claude istniejące wzorce w Twojej bazie kodu."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Reference existing patterns. Point Claude to patterns in your codebase.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-odwolanie-przez-at-claude-czyta-plik-przed-odpowiedzia
    tresc: "Dokumentacja radzi odwoływać się do plików przez @ zamiast opisywać, gdzie leży kod; Claude czyta plik przed odpowiedzią."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Reference files with `@` instead of describing where code lives. Claude reads the file before responding.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-claude-sam-siega-po-kontekst
    tresc: "Dokumentacja radzi powiedzieć Claude, żeby sam pobrał potrzebny kontekst: poleceniami Bash, narzędziami MCP albo czytając pliki."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Let Claude fetch what it needs. Tell Claude to pull context itself using Bash commands, MCP tools, or by reading files.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-otwarte-pytanie-o-plik-wydobywa-nieznane
    tresc: "Otwarte pytanie, na przykład „co byś poprawił w tym pliku?”, może wydobyć rzeczy, o które nie przyszłoby Ci do głowy zapytać."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'A prompt like `"what would you improve in this file?"` can surface things you wouldn''t have thought to ask about.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-podaj-miare-i-prog-gdy-cel-liczbowy
    tresc: "Gdy celem jest wydajność albo pokrycie testami, dokumentacja radzi podać miarę i próg, żeby było jednoznaczne, kiedy praca jest skończona."
    zrodlo: https://code.claude.com/docs/en/prompt-library.md
    cytat: 'State the measurable target. When the goal is performance or coverage, give the metric and threshold so completion is unambiguous.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-claude-code-to-rozmowa-poprawiasz-zamiast-zaczynac-od-nowa
    tresc: "Claude Code jest konwersacyjny: nie potrzebujesz idealnych próśb, zaczynasz od tego, czego chcesz, i doprecyzowujesz; gdy pierwsza próba nie jest dobra, nie zaczynasz od nowa, tylko poprawiasz."
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: 'Claude Code is conversational. You don''t need perfect prompts. Start with what you want, then refine … When the first attempt isn''t right, you don''t start over. You iterate.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-po-dwoch-poprawkach-czysta-sesja-z-lepszym-poleceniem
    tresc: "Jeśli w jednej sesji to samo poprawiano więcej niż dwa razy, kontekst jest zaśmiecony nieudanymi podejściami; dokumentacja radzi uruchomić /clear i zacząć od nowa z dokładniejszym poleceniem, bo czysta sesja z lepszym poleceniem prawie zawsze wypada lepiej niż długa z nagromadzonymi poprawkami."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'If you''ve corrected Claude more than twice on the same issue in one session, the context is cluttered with failed approaches. Run `/clear` and start fresh with a more specific prompt that incorporates what you learned. A clean session with a better prompt almost always outperforms a long session with accumulated corrections.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-po-dwoch-nieudanych-poprawkach-lepsze-pierwsze-polecenie
    tresc: "Wśród typowych błędów dokumentacja wymienia ciągłe poprawianie; po dwóch nieudanych poprawkach radzi użyć /clear i napisać lepsze pierwsze polecenie, uwzględniające to, czego się nauczyłeś."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'These are common mistakes. … **Correcting over and over.** … **Fix**: After two failed corrections, `/clear` and write a better initial prompt incorporating what you learned.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-ogolna-prosba-bywa-wlasciwa
    tresc: "Czasem ogólna prośba jest właśnie właściwa, bo chcesz zobaczyć, jak Claude interpretuje problem, zanim go zawęzisz."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Sometimes a vague prompt is exactly right because you want to see how Claude interprets the problem before constraining it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-zauwazaj-co-dziala
    tresc: "Gdy Claude daje świetny wynik, dokumentacja radzi zauważyć, co zrobiono: strukturę polecenia, dostarczony kontekst i tryb, w którym trwała praca."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Pay attention to what works. When Claude produces great output, notice what you did: the prompt structure, the context you provided, the mode you were in.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-prompty-z-dokumentacji-to-punkty-wyjscia
    tresc: "Prompty z biblioteki promptów w dokumentacji to punkty wyjścia, a nie gotowe scenariusze."
    zrodlo: https://code.claude.com/docs/en/prompt-library.md
    cytat: 'The prompts are collected from various Anthropic guides … They''re starting points rather than scripts.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-claude-czyta-pliki-zmienia-i-uruchamia-wedlug-trybu
    tresc: "W aplikacji po wysłaniu prośby Claude czyta pliki projektu, wprowadza zmiany i uruchamia polecenia zależnie od trybu uprawnień."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Claude reads your project files, makes changes, and runs commands based on your permission mode.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-samodzielnosc-claude-ma-granice
    tresc: "Samodzielność Claude wiąże się z krzywą uczenia: Claude pracuje w pewnych ograniczeniach, które trzeba rozumieć."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'But this autonomy still comes with a learning curve. Claude works within certain constraints you need to understand.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-tabela-prosba-ogolna-obok-prosby-z-kryterium
    tresc: "Dokumentacja zestawia w tabeli, w kolumnach Before i After, prośbę ogólną z prośbą z kryteriami sprawdzenia (wiersz Provide verification criteria); przykład dotyczy funkcji sprawdzającej adresy e-mail."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: '| **Provide verification criteria** | *"implement a function that validates email addresses"* | *"write a validateEmail function. example test cases: … run the tests after implementing"* |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-dobry-opis-zadania-mowi-co-poza-zakresem
    tresc: "Według dokumentacji najbardziej przydatne opisy zadania (specyfikacje) są samowystarczalne: wskazują pliki, mówią, co zostaje poza zakresem, i kończą się sprawdzeniem, które dowodzi, że całość działa."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'The most useful specs are self-contained: they name the files and interfaces involved, state what is out of scope, and end with an end-to-end verification step that proves the feature works.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zlecenie-gdy-claude-sobie-nie-radzi-zapytaj-dlaczego
    tresc: "Gdy Claude sobie nie radzi, dokumentacja radzi zastanowić się, dlaczego: czy kontekst był zbyt zaśmiecony, prośba zbyt ogólna albo zadanie za duże na jeden raz."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'When Claude struggles, ask why. Was the context too noisy? The prompt too vague? The task too big for one pass?'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-code-uczy-jak-go-uzywac
    tresc: "Claude Code potrafi nauczyć, jak go używać: zadajesz pytanie o samo narzędzie, a Claude wyjaśnia."
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: 'Claude Code can teach you how to use it. Ask questions like "how do I set up hooks?" or "what''s the best way to structure my CLAUDE.md?" and Claude will explain.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: biblioteka-promptow-gdy-nie-wiesz-od-czego-zaczac
    tresc: "Biblioteka promptów w dokumentacji to zbiór promptów do skopiowania do Claude Code; przydaje się do poznania nowych sposobów pracy albo gdy nie wiesz, od czego zacząć."
    zrodlo: https://code.claude.com/docs/en/prompt-library.md
    cytat: "This is a library of prompts to copy into Claude Code. Use it to explore ways of working you haven't tried, or when you're not sure where to start."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-blizszy-plik-czytany-ostatni
    tresc: "Pliki CLAUDE.md układają się w kontekście od korzenia systemu plików do folderu roboczego, więc plik bliżej folderu roboczego Claude czyta ostatni."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'Across the directory tree, content is ordered from the filesystem root down to your working directory. For the `foo/bar/` example, `foo/CLAUDE.md` appears in context before `foo/bar/CLAUDE.md`, so instructions closer to where you launched Claude are read last.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-kolejnosc-od-najszerszego-zasiegu
    tresc: "Dokumentacja podaje miejsca plików CLAUDE.md w kolejności wczytywania, od najszerszego zasięgu do najbardziej szczegółowego, więc instrukcja projektu pojawia się w kontekście po instrukcji użytkownika."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'The table below lists them in load order, from broadest scope to most specific, so a project instruction appears in context after a user instruction.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-nad-na-starcie-pod-na-zadanie
    tresc: "Pliki CLAUDE.md z folderów nad folderem roboczym wczytują się na starcie, a pliki z podfolderów na żądanie."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'CLAUDE.md and CLAUDE.local.md files in the directory hierarchy above the working directory are loaded at launch. Files in subdirectories load on demand.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-zasieg-projekt-praca-organizacja
    tresc: "Pliki CLAUDE.md dają Claude stałe instrukcje dla projektu, Twojego sposobu pracy albo całej organizacji."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'CLAUDE.md files are markdown files that give Claude persistent instructions for a project, your personal workflow, or your entire organization.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-podfolder-popros-o-odczyt-pliku
    tresc: "Żeby sprawdzić nowy plik CLAUDE.md w podfolderze, dokumentacja radzi założyć go z poziomu powłoki, a nie prośbą do Claude, i poprosić Claude o przeczytanie pliku z tego podfolderu."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'To test a new one, create it from your shell rather than asking Claude to write it, then ask Claude to read a file in that subdirectory.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-open-folder-wybor-folderu
    tresc: "W rzędzie pod polem wiadomości wybierasz w selektorze środowiska pierwszą pozycję grupy Local, potem klikasz kontrolkę folderu projektu obok selektora, wybierasz Open folder… i wskazujesz folder projektu."
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    cytat: 'In the [row under the prompt box](https://code.claude.com/docs/en/desktop.md#start-a-session), click the first control, the environment selector, and select the top entry in the **Local** group. Then click the project folder control beside the environment selector, select **Open folder…**, and choose your project''s directory.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-wpisz-zadanie-i-nacisnij-enter-zeby-zaczac
    tresc: "W aplikacji wpisujesz zadanie i naciskasz Enter, żeby zacząć."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Type your task and press **Enter** to start.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: folder-claude-osobista-konfiguracja
    tresc: "Pliki w ~/.claude to osobista konfiguracja, która obowiązuje we wszystkich Twoich projektach."
    zrodlo: https://code.claude.com/docs/en/claude-directory.md
    cytat: 'files in `~/.claude` are personal configuration that applies across all your projects.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-zasieg-projekt-i-globalny
    tresc: "Według tabeli plików plik CLAUDE.md ma zasięg projektowy i globalny, a jego instrukcje wczytują się w każdej sesji."
    zrodlo: https://code.claude.com/docs/en/claude-directory.md
    cytat: '| File | Scope | Commit | What it does | Reference | … | `CLAUDE.md` | Project and global | ✓ | Instructions loaded every session |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-nie-dziala-popraw-konkretnosc
    tresc: "Gdy Claude nie stosuje się do CLAUDE.md, dokumentacja radzi między innymi pisać zasady konkretniej."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'Make instructions more specific.'
    sprawdzono: 2026-10-25
    wersja: 2.1.310
    sprawdzone_przez: filtr-prawdy 2026-10-25 (lekcja zasady-ktore-dzialaja, P6 opcjonalny, niewykorzystany)

  - id: claude-md-test-kazdej-linii
    tresc: "Dokumentacja radzi przy każdej linii CLAUDE.md zapytać, czy jej usunięcie spowodowałoby błędy Claude, a jeśli nie, wyciąć ją."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Keep it concise. For each line, ask: *"Would removing this cause Claude to make mistakes?"* If not, cut it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-rozdety-plik-pomija-zasady
    tresc: "Według dokumentacji rozdęte pliki CLAUDE.md sprawiają, że Claude pomija Twoje właściwe zasady."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Bloated CLAUDE.md files cause Claude to ignore your actual instructions!'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-zasada-ginie-w-za-dlugim-pliku
    tresc: "Gdy Claude dalej robi coś, czego nie chcesz, mimo zasady przeciwko temu, dokumentacja uznaje, że plik jest zapewne za długi, a zasada ginie."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'If Claude keeps doing something you don''t want despite having a rule against it, the file is probably too long and the rule is getting lost.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-pytania-o-tresc-pliku-znak-niejasnej-zasady
    tresc: "Gdy Claude pyta o rzeczy, na które odpowiada CLAUDE.md, sformułowanie zasady może być niejasne."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'If Claude asks you questions that are answered in CLAUDE.md, the phrasing might be ambiguous.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-przegladaj-gdy-cos-idzie-zle-i-przycinaj
    tresc: "Dokumentacja radzi przeglądać CLAUDE.md, gdy coś idzie źle, regularnie go przycinać i sprawdzać zmiany, obserwując, czy zachowanie Claude faktycznie się zmienia."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Treat CLAUDE.md like code: review it when things go wrong, prune it regularly, and test changes by observing whether Claude''s behavior actually shifts.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-za-dlugi-claude-pomija-polowe
    tresc: "Według dokumentacji, gdy CLAUDE.md jest za długi, Claude ignoruje jego połowę, bo ważne zasady giną w szumie."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'If your CLAUDE.md is too long, Claude ignores half of it because important rules get lost in the noise.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-skresl-zasade-ktora-claude-spelnia-bez-niej
    tresc: "Dokumentacja radzi bezlitośnie przycinać plik: jeśli Claude już robi coś poprawnie bez zasady, usuń tę zasadę."
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'Ruthlessly prune. If Claude already does something correctly without the instruction, delete it …'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-jak-piszesz-tak-stosuje
    tresc: "Claude traktuje pliki CLAUDE.md jako kontekst, a nie wymuszoną konfigurację, więc to, jak piszesz zasady, wpływa na to, jak niezawodnie Claude je stosuje."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'Claude treats CLAUDE.md files as context, not enforced configuration, so how you write instructions affects how reliably Claude follows them.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-brak-gwarancji-zwlaszcza-mgliste-i-sprzeczne
    tresc: "Claude czyta CLAUDE.md i stara się go stosować, ale nie ma gwarancji ścisłego stosowania, zwłaszcza przy mglistych albo sprzecznych zasadach."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: "Claude reads it and tries to follow it, but there's no guarantee of strict compliance, especially for vague or conflicting instructions."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-przegladaj-i-usuwaj-nieaktualne-i-sprzeczne
    tresc: "Dokumentacja radzi co jakiś czas przeglądać pliki CLAUDE.md i usuwać zasady nieaktualne albo sprzeczne."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'Review your CLAUDE.md files, nested CLAUDE.md files in subdirectories, and [`.claude/rules/`](#organize-rules-with-claude/rules/) periodically to remove outdated or conflicting instructions.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-ponad-200-linii-przytnij-co-niepotrzebne
    tresc: "Pliki CLAUDE.md dłuższe niż 200 linii zużywają więcej kontekstu i mogą obniżać stosowanie zasad; dokumentacja podaje też radę, żeby przyciąć treść, która nie jest potrzebna w każdej sesji."
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: "Files over 200 lines consume more context and may reduce adherence. … trim content that isn't needed in every session."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: kontekst-okno-miesci-rozmowe-pliki-i-claude-md
    tresc: "Okno kontekstu Claude mieści historię rozmowy, treść plików, wyniki poleceń, CLAUDE.md, pamięć automatyczną, wczytane skille i instrukcje systemowe; w trakcie pracy kontekst się zapełnia."
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: "Claude's context window holds your conversation history, file contents, command outputs, [CLAUDE.md](https://code.claude.com/docs/en/memory.md), [auto memory](https://code.claude.com/docs/en/memory.md#auto-memory), loaded skills, and system instructions. As you work, context fills up."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  # Lekcja pierwsza-praca/nowy-dokument (etap 2, 26.10.2026): pliki firmy, @, załączniki, odczyt plików.
  - id: aplikacja-sesja-ma-wlasna-historie-i-folder-projektu
    tresc: W zakładce Code każda rozmowa jest sesją, która ma własną historię rozmowy i własny folder projektu, niezależne od innych sesji.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'In the Code tab, each conversation is a **session**: it has its own chat history and project folder, independent of any other session.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-claude-czyta-pliki-i-zmienia-wedlug-trybu
    tresc: W aplikacji po wysłaniu prośby Claude czyta pliki projektu, wprowadza zmiany i uruchamia polecenia zgodnie z trybem uprawnień.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: Claude reads your project files, makes changes, and runs commands based on your [permission mode](#choose-a-permission-mode).
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-plus-obok-pola-zalaczniki-skille-konektory-wtyczki
    tresc: W aplikacji przycisk + obok pola wiadomości służy do załączania plików, a także do skilli, konektorów i wtyczek.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: Click the **+** button next to the prompt box for file attachments, [skills](#use-skills), [connectors](#connect-external-tools), and [plugins](#install-plugins).
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-dwie-drogi-dac-claude-plik-at-albo-zalacznik
    tresc: W aplikacji, żeby dać Claude plik, wskazujesz go znakiem @ albo załączasz w polu wiadomości.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'To give Claude a file, @mention it or attach it in the prompt box:'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-panel-pliku-edycja-w-sesji-lokalnej
    tresc: W sesji lokalnej w aplikacji możesz sam edytować w panelu pliku pliki z folderu roboczego sesji, z wyjątkiem niektórych plików tylko do odczytu, takich jak .mcp.json i .claude/settings.json.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'To edit a file yourself, use the [file pane](#arrange-your-workspace): * **Local sessions**: you can edit files inside the session''s working directory, except some view-only ones such as `.mcp.json` and `.claude/settings.json`.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-panel-pliku-auto-save-zapisuje-zmiany-same
    tresc: W aplikacji zmiany wprowadzone w panelu pliku domyślnie zapisują się same, więc panel nie pokazuje przycisku Save; żeby zapisywać ręcznie, odznaczasz Auto save w menu ⋮ panelu, a po zmianie pliku klikasz Save albo Cancel (cofnięcie zmian).
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: By default, your edits in the file pane save on their own, so the pane shows no **Save** button. To save your edits yourself, uncheck **Auto save** in the pane's **⋮** menu. With **Auto save** off, click **Save** after you change a file to write your edits, or **Cancel** to revert them.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-prawy-przycisk-na-sciezce-attach-as-context
    tresc: W aplikacji prawy przycisk na ścieżce pliku w rozmowie, widoku zmian albo panelu pliku otwiera menu, w którym Attach as context dodaje plik do następnej prośby.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Right-click any file path in the chat, diff viewer, or file pane to open a context menu: * **Attach as context**: add the file to your next prompt'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-prawy-przycisk-na-sciezce-show-in-finder-explorer
    tresc: W aplikacji w menu prawego przycisku na ścieżce pliku pozycja Show in Finder (macOS) albo Show in Explorer (Windows) otwiera folder zawierający plik.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Right-click any file path in the chat, diff viewer, or file pane to open a context menu: … * **Show in Finder** on macOS, **Show in Explorer** on Windows: open the containing folder'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-add-folder-w-trwajacej-sesji-lokalnej
    tresc: W trwającej sesji lokalnej (albo SSH) w aplikacji klikasz + obok pola wiadomości i wybierasz Add folder; Claude pracuje w tym folderze bezpośrednio, bez worktree.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**While a local or [SSH](#ssh-sessions) session runs**: click **+** next to the prompt box and select **Add folder**. Claude works in that folder itself, with no [worktree](#run-a-session-in-its-own-worktree).'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-widok-rozmowy-transcript-view-verbose
    tresc: W aplikacji widok rozmowy zmieniasz w menu sesji (strzałka obok tytułu sesji, pozycja Transcript view) albo skrótem Ctrl+O na macOS i Windows; widok Verbose pokazuje każde wywołanie narzędzia, każdy odczyt pliku i każdy krok pośredni Claude oraz jego rozumowanie, a Normal zwija wywołania narzędzi do streszczeń.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: To switch view modes, open the session menu from the caret beside the session title and select **Transcript view**, or press **Ctrl+O** on macOS or Windows to cycle through them. … | **Normal** | Tool calls collapsed into summaries, with full text responses | … | **Verbose** | Every tool call, file read, and intermediate step Claude takes, plus Claude's thinking |
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-sesja-lokalna-laduje-skille-z-konta-claude-ai
    tresc: Sesje lokalne i w chmurze w aplikacji wczytują też skille włączone na koncie claude.ai, z wyjątkiem sesji lokalnych, gdy organizacja ustawi disableSideloadFlags.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: Local and cloud sessions also load the skills enabled for your claude.ai account, except local sessions when your organization sets [`disableSideloadFlags`](/docs/en/settings-reference#disablesideloadflags).
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: read-bez-zgody-write-ze-zgoda-w-trybie-manual
    tresc: W trybie Manual dla ścieżek w folderze roboczym narzędzie Read (czyta zawartość plików) nie wymaga zgody, a narzędzie Write (tworzy albo nadpisuje pliki) wymaga zgody.
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: The `Permission required` column shows whether the tool prompts in [Manual mode](https://code.claude.com/docs/en/permission-modes.md) for paths inside the working directory. […] | `Read` | Reads the contents of files. See [Read tool behavior](#read-tool-behavior) | No | […] | `Write` | Creates or overwrites files. See [Write tool behavior](#write-tool-behavior) | Yes |
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: narzedzia-plikowe-pytaja-o-sciezki-poza-folderem-roboczym
    tresc: Narzędzia do dostępu do plików, takie jak Read, Grep i Glob, pytają o zgodę dla ścieżek poza folderem roboczym i dodatkowymi folderami.
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: File-access tools marked No, including `Read`, `Grep`, and `Glob`, still prompt for paths outside the [working directory and additional directories](https://code.claude.com/docs/en/permissions.md#working-directories).
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: bash-polecenia-tylko-do-odczytu-bez-pytania
    tresc: Claude Code uruchamia wbudowany zestaw poleceń powłoki tylko do odczytu, między innymi ls, cat, echo, pwd, head, tail, grep, find i wc, bez pytania o zgodę w każdym trybie; dla ścieżek poza folderami roboczymi zmienia to ustawienie permissions.blockReadsOutsideWorkingDirectories.
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: Claude Code recognizes a built-in set of Bash commands as read-only and runs them without a permission prompt in every mode, except as [`permissions.blockReadsOutsideWorkingDirectories`](/docs/en/settings-reference#permissions-blockreadsoutsideworkingdirectories) changes for paths outside your working directories. The set includes `ls`, `cat`, `echo`, `pwd`, `head`, `tail`, `grep`, `find`, `wc`, `which`, `diff`, `stat`, `du`, `cd`, and read-only forms of `git`.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: edit-punktowe-zmiany-write-nie-do-czesciowych-zmian
    tresc: Narzędzie Edit wprowadza punktowe zmiany w wybranych plikach i w trybie Manual wymaga zgody; do częściowych zmian w istniejącym pliku Claude używa Edit, a nie Write.
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: '| `Edit` | Makes targeted edits to specific files. See [Edit tool behavior](#edit-tool-behavior) | Yes | […] For partial changes to an existing file, Claude uses Edit instead of Write. […] The `Permission required` column shows whether the tool prompts in [Manual mode](https://code.claude.com/docs/en/permission-modes.md) for paths inside the working directory.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: write-tworzy-nowy-plik-albo-nadpisuje-nie-dopisuje
    tresc: Narzędzie Write tworzy nowy plik albo nadpisuje istniejący podaną całą treścią; nie dopisuje do pliku ani nie scala treści.
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: The Write tool creates a new file or overwrites an existing one with the full content provided. It doesn't append or merge.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: read-pdf-zakresy-stron-wymagaja-pdftoppm
    tresc: Odczyt zakresu stron PDF korzysta z programu pdftoppm (z pakietu poppler-utils); bez niego odczyt zakresu stron kończy się błędem pdftoppm is not installed.
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: Page-range reads render pages with `pdftoppm` from poppler-utils, […] Without it, a page-range read fails with `pdftoppm is not installed`.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: read-duzy-obraz-mozna-poprosic-o-wyciecie-fragmentu
    tresc: Gdy Claude pomija drobny szczegół na dużym obrazie, możesz poprosić go o wycięcie interesującego Cię fragmentu, a potem o odczytanie tego wycinka.
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: If Claude misses fine pixel-level detail in a large image, ask it to crop the region you care about, such as with ImageMagick via Bash, and then read the crop.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: read-czyta-pliki-nie-foldery-ls
    tresc: Narzędzie Read czyta pliki, a nie foldery; zawartość folderu Claude wypisuje poleceniem powłoki, takim jak ls.
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: Read only reads files, not directories. Claude lists directory contents with a shell command such as `ls`.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: read-po-odmowie-claude-pracuje-dalej-skill-albo-polecenie
    tresc: 'Gdy narzędzie Read odmówi odczytu pliku binarnego, na przykład .xlsx, Claude pracuje dalej: błąd podsuwa skill do tego typu pliku, jeśli taki jest, albo polecenie powłoki lub skrypt, które czyta ten format.'
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: 'Claude keeps working after a refusal: the error suggests a skill for that file type if one is available, or else a shell command or script that reads the format.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: read-duzy-plik-tekstowy-czytany-stronami-partial-view
    tresc: 'Claude potrafi przeczytać plik tekstowy większy, niż zwraca jedno wywołanie odczytu: czyta go stronami; gdy cały plik przekracza limit tokenów, dostaje pierwszą stronę z notatką PARTIAL view, która mówi, ile pliku otrzymał i jak czytać dalej.'
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: 'Claude can read a text file larger than a single Read call returns. […] so Claude reads a larger file in pages with `offset` and `limit`. […] **Whole file over the token limit**: the first page of the file, with a `PARTIAL view` notice saying how much of the file it received and how to read more with `offset` and `limit`'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-dostep-do-folderu-i-podfolderow-reszta-za-zgoda
    tresc: Gdy uruchamiasz claude w katalogu, Claude Code ma dostęp do plików w tym katalogu i jego podkatalogach, a do plików gdzie indziej za Twoją zgodą.
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: 'When you run `claude` in a directory, Claude Code gains access to: * **Your project.** Files in your directory and subdirectories, plus files elsewhere with your permission.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-widzi-caly-projekt-czyta-kilka-plikow
    tresc: 'Ponieważ Claude widzi cały projekt, może pracować w poprzek niego. Dokumentacja podaje przykład: poproszony o naprawę błędu, Claude szuka odpowiednich plików, czyta kilka z nich, żeby zrozumieć kontekst, i wprowadza skoordynowane zmiany w wielu plikach. Tym różni się od asystentów w edytorze, którzy widzą tylko bieżący plik.'
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: Because Claude sees your whole project, it can work across it. When you ask Claude to "fix the authentication bug," it searches for relevant files, reads multiple files to understand context, makes coordinated edits across them, […] This is different from inline code assistants that only see the current file.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-sesje-niezalezne-nowa-z-pustym-kontekstem
    tresc: Każda nowa sesja Claude Code zaczyna z nowym oknem kontekstu, bez historii rozmowy z poprzednich sesji.
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: '**Sessions are independent.** Each new session starts with a fresh context window, without the conversation history from previous sessions.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-okno-kontekstu-co-trzyma-zapelnia-sie
    tresc: Okno kontekstu Claude trzyma historię rozmowy, zawartość plików, wyniki poleceń, CLAUDE.md, pamięć automatyczną, wczytane skille i instrukcje systemowe; w trakcie pracy kontekst się zapełnia.
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: Claude's context window holds your conversation history, file contents, command outputs, [CLAUDE.md](https://code.claude.com/docs/en/memory.md), [auto memory](https://code.claude.com/docs/en/memory.md#auto-memory), loaded skills, and system instructions. As you work, context fills up.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: hook-gdy-cos-ma-sie-dziac-zawsze
    tresc: 'Gdy coś ma się dziać za każdym razem, bez proszenia, dokumentacja radzi napisać hook.'
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '| You want something to happen every time without asking | Write a [hook](https://code.claude.com/docs/en/hooks-guide.md) |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-powiadomienie-o-koncu-zadania
    tresc: 'Aplikacja Claude na komputer sama wysyła powiadomienie systemowe, gdy sesja w zakładce Code skończy zadanie, a Ty nie patrzysz akurat na tę sesję.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'The desktop app sends an OS notification when a Code session finishes a task and you aren''t currently viewing that session.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-hooki-z-ustawien-dzialaja
    tresc: 'Hooki zapisane w plikach ustawień działają i w aplikacji Claude na komputer, i w programie w terminalu.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Desktop and CLI read the same configuration files, so your setup carries over: … **[Hooks](https://code.claude.com/docs/en/hooks.md)** and **[skills](https://code.claude.com/docs/en/skills.md)** defined in settings apply to both'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-uruchamia-claude-code-przy-zdarzeniu
    tresc: "Hook Claude Code uruchamia w określonej chwili pracy, a skill wczytuje do kontekstu, żeby Claude go zastosował."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: 'Claude Code runs a hook at a lifecycle event; it loads a skill into context for Claude to apply.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
  - id: claude-code-przy-limicie-kontekstu-streszcza-rozmowe
    tresc: 'Gdy kontekst zbliża się do limitu, Claude Code sam streszcza rozmowę; streszczenie zachowuje Twoje prośby i kluczowe fragmenty kodu, ale szczegółowe instrukcje z początku rozmowy mogą przepaść, więc stałe zasady warto zapisać w CLAUDE.md.'
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: Claude Code manages context automatically as you approach the limit. It compacts the conversation into a summary. The summary keeps your requests and key code snippets, but detailed instructions from early in the conversation may be lost. Put persistent rules in CLAUDE.md rather than relying on conversation history.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-bez-narzedzi-tylko-tekst-z-narzedziami-dziala
    tresc: 'Bez narzędzi Claude może tylko odpowiadać tekstem; z narzędziami może działać: czytać kod, edytować pliki, uruchamiać polecenia, szukać w sieci i łączyć się z usługami zewnętrznymi.'
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: 'Without tools, Claude can only respond with text. With tools, Claude can act: read your code, edit files, run commands, search the web, and interact with external services.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-narzedzia-szukania-pliki-po-wzorcu
    tresc: 'Wśród wbudowanych narzędzi Claude Code jest szukanie: znajdowanie plików po wzorcu, przeszukiwanie treści wyrażeniami regularnymi i eksplorowanie baz kodu.'
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: '| **Search** | Find files by pattern, search content with regex, explore codebases |'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-rozmowa-nie-trzeba-idealnej-prosby
    tresc: 'Claude Code jest konwersacyjny: nie potrzebujesz idealnych próśb; zaczynasz od tego, czego chcesz, a potem doprecyzowujesz, i gdy pierwsza próba nie trafia, nie zaczynasz od nowa, tylko poprawiasz.'
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: 'Claude Code is conversational. You don''t need perfect prompts. Start with what you want, then refine: […] When the first attempt isn''t right, you don''t start over. You iterate.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-nie-trzeba-mowic-ktore-pliki-czytac
    tresc: Nie musisz podawać Claude, które pliki ma czytać ani jakie polecenia uruchamiać; Claude sam to ustala.
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: You don't need to specify which files to read or what commands to run. Claude figures that out.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-pomaga-nie-tylko-w-kodzie-writing-docs
    tresc: Według dokumentacji Claude Code potrafi pomagać nie tylko w kodzie, ale we wszystkim, co da się zrobić z wiersza poleceń, na przykład w pisaniu dokumentów lub dokumentacji (w oryginale writing docs), uruchamianiu buildów, szukaniu plików i researchu.
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: 'Claude Code is an agentic assistant that runs in your terminal. While it excels at coding, it can help with anything you can do from the command line: writing docs, running builds, searching files, researching topics, and more.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  # Lekcja pierwsza-praca/sprawdz-i-cofnij (etap 2, 26.10.2026): widok zmian, cofanie, Manual.
  - id: aplikacja-sesja-sledzi-wlasne-zmiany-niezaleznie
    tresc: "W aplikacji każda sesja śledzi swój kontekst i swoje zmiany niezależnie."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Each session tracks its own context and changes independently.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-widok-zmian-przeglad-modyfikacji-plik-po-pliku
    tresc: "W aplikacji po zmianach Claude widok zmian pozwala przejrzeć modyfikacje plik po pliku."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'After Claude makes changes to your code, the diff view lets you review modifications file by file'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-widok-zmian-to-jeden-z-paneli-zakladki-code
    tresc: "Zakładka Code składa się z paneli, które możesz układać w dowolnym układzie; wśród nich są rozmowa i widok zmian (diff)."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'The Code tab is built around panes you can arrange in any layout: chat, diff, browser, terminal, file, plan, tasks, and subagent'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-przyciski-paneli-nazwa-po-najechaniu-menu-przy-waskim-oknie
    tresc: "W aplikacji nazwę przycisku panelu na pasku tytułu sesji (na przykład Changes dla widoku zmian) widać po najechaniu, a gdy okno jest wąskie, przyciski, które się nie mieszczą, przechodzą do menu ⋮."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Hover to see each button''s name, such as **Terminal**, **Changes** for the diff view, **Browser**, and **Files**. If the pane you want has no button in the title bar, select it from the **⋮** menu beside the buttons: * **When the window is narrow**: buttons that don''t fit move into the menu'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-skrot-przelaczania-widoku-zmian-windows
    tresc: "W zakładce Code na Windowsie panel widoku zmian przełącza skrót Ctrl+Shift+D: tabela skrótów w dokumentacji podaje klawisze macOS (wiersz Cmd Shift D, Toggle diff pane), a na Windowsie Cmd zamienia się na Ctrl."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'The table in this section shows the macOS keys. On Windows and Linux, change these keys: … **Cmd**: press **Ctrl** … | `Cmd` `Shift` `D` | Toggle diff pane |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-polecana-do-wizualnego-przegladu-zmian
    tresc: "Dokumentacja radzi używać aplikacji (Desktop) między innymi wtedy, gdy chcesz przeglądać zmiany wizualnie."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'use Desktop when you want to manage parallel sessions in one window, arrange panes side by side, or review changes visually.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-auto-i-accept-edits-licznik-do-przegladu-w-widoku-zmian
    tresc: "W aplikacji w trybach Auto i Accept edits Claude stosuje zmiany w plikach, a wskaźnik w rodzaju +12 -1 pojawia się, żebyś mógł je przejrzeć w widoku zmian."
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    cytat: '**Auto or Accept edits**: Claude applies its file changes, and an indicator such as `+12 -1` appears so you can review them in the [diff view](/docs/en/desktop.md#review-changes-with-diff-view)'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-code-sam-sledzi-zmiany-plikow-claude
    tresc: "Claude Code automatycznie śledzi zmiany plików robione przez Claude, żebyś mógł szybko cofnąć zmiany i wrócić do wcześniejszego stanu, gdy coś pójdzie źle."
    zrodlo: https://code.claude.com/docs/en/checkpointing.md
    cytat: 'Claude Code automatically tracks Claude''s file edits as you work, allowing you to quickly undo changes and rewind to previous states if anything gets off track.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-code-sledzi-wszystkie-zmiany-narzedzi-do-edycji-plikow
    tresc: "Claude Code śledzi wszystkie zmiany zrobione jego narzędziami do edycji plików."
    zrodlo: https://code.claude.com/docs/en/checkpointing.md
    cytat: 'Claude Code tracks all changes made by its file editing tools'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: punkty-zapisu-naprawa-pomylek-i-proby-wariantow
    tresc: "Punkty zapisu (checkpoints) przydają się między innymi do szybkiego cofnięcia zmian, które coś zepsuły, do próbowania różnych sposobów wykonania bez utraty punktu wyjścia i do eksperymentów ze świadomością, że można wrócić do działającego stanu."
    zrodlo: https://code.claude.com/docs/en/checkpointing.md
    cytat: '**Exploring alternatives**: try different implementation approaches without losing your starting point * **Recovering from mistakes**: quickly undo changes that introduced bugs or broke functionality * **Iterating on features**: experiment with variations knowing you can revert to working states'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: punkty-zapisu-nie-obejmuja-recznych-zmian-poza-claude-code
    tresc: "Punkty zapisu śledzą tylko pliki edytowane w bieżącej sesji; Twoje ręczne zmiany plików poza Claude Code i zmiany z innych równoległych sesji zwykle nie są zapisane (chyba że dotyczą tych samych plików)."
    zrodlo: https://code.claude.com/docs/en/checkpointing.md
    cytat: 'Checkpointing only tracks files that have been edited within the current session. Manual changes you make to files outside of Claude Code and edits from other concurrent sessions are normally not captured, unless they happen to modify the same files as the current session.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: punkty-zapisu-to-szybkie-odzyskiwanie-w-sesji-nie-trwala-historia
    tresc: "Punkty zapisu służą do szybkiego odzyskiwania zmian w ramach sesji; do trwałej historii wersji i współpracy dokumentacja radzi kontrolę wersji."
    zrodlo: https://code.claude.com/docs/en/checkpointing.md
    cytat: 'Checkpoints are designed for quick, session-level recovery. For permanent version history and collaboration, continue using version control, such as Git, for commits, branches, and long-term history.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-code-mozliwosci-te-same-w-kazdym-miejscu-pracy
    tresc: "Pętla agenta, narzędzia i możliwości Claude Code są takie same wszędzie, gdzie go używasz; zmienia się to, gdzie kod się wykonuje i jak z nim pracujesz."
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: 'The [agentic loop](#the-agentic-loop), [tools](#tools), and capabilities are the same everywhere you use Claude Code. What changes is where the code executes and how you interact with it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-code-przed-zmiana-kodu-zapisuje-stan-zmienianych-plikow
    tresc: "Claude Code, zanim wprowadzi zmiany w kodzie, zapisuje stan plików, których zmiany dotyczą, żebyś mógł je w razie potrzeby cofnąć."
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: 'Before Claude makes code changes, it also snapshots the affected files so you can revert if needed.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-code-dwa-zabezpieczenia-punkty-zapisu-i-uprawnienia
    tresc: "Claude Code ma dwa zabezpieczenia: punkty zapisu (checkpoints) pozwalają cofnąć zmiany w plikach, a uprawnienia (permissions) określają, co Claude może robić bez pytania."
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: 'Claude has two safety mechanisms: checkpoints let you undo file changes, and permissions control what Claude can do without asking.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: punkty-zapisu-dzialan-na-zdalnych-systemach-pilnujesz-trybem-uprawnien
    tresc: "Działań, które wpływają na zdalne systemy (bazy danych, API, wdrożenia), nie da się objąć punktem zapisu; kontrolujesz je trybem uprawnień i regułami uprawnień."
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: 'Actions that affect remote systems (databases, APIs, deployments) can''t be checkpointed. You control those with your permission mode and permission rules.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: punkty-zapisu-sa-niezalezne-od-gita-i-zostaja-po-wznowieniu-rozmowy
    tresc: "Punkty zapisu są niezależne od gita i pozostają dostępne po wznowieniu rozmowy."
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: 'Checkpoints are separate from git and remain available when you resume a conversation.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
  - id: punkty-zapisu-plik-zmieniony-tylko-poleceniami-bash-nie-jest-sledzony
    tresc: "Plik, który zmieniły wyłącznie polecenia Bash (nie narzędzia do edycji plików Claude Code), nie jest śledzony przez punkty zapisu i zostaje taki, jaki jest."
    zrodlo: https://code.claude.com/docs/en/checkpointing.md
    cytat: 'A file that only Bash commands changed isn''t tracked and stays as it is.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: punkty-zapisu-migawki-znikaja-po-okolo-30-dniach
    tresc: "Migawki plików z sesji są domyślnie usuwane około 30 dni po tym, jak sesja zapisała ostatnią z nich, a cofnięcie do punktu zapisu, którego migawek już nie ma, może się nie udać."
    zrodlo: https://code.claude.com/docs/en/checkpointing.md
    cytat: 'by default about 30 days after the session last saved one. Rewinding to a checkpoint whose snapshots are gone can fail with'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  # Lekcja pierwsza-praca/pierwsze-zadanie (etap 2, 26.10.2026): instalacja, zakładka Code, Local i folder, tryb, pierwsze zadanie, pętla pracy, poprawka i stop.
  - id: aplikacja-instalatory-macos-windows-arm64-linux-beta
    tresc: Do pobrania jest instalator aplikacji dla macOS (jedna wersja dla procesorów Intel i Apple Silicon), dla Windows z procesorem x64 i osobny instalator dla Windows ARM64; na Linuksie aplikacja jest w wersji beta (apt albo plik .deb, Ubuntu i Debian).
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    cytat: Download for macOS […] Universal build for Intel and Apple Silicon […] Download for Windows […] For x64 processors […] Get Claude for Linux (beta) […] apt or .deb for Ubuntu and Debian […] For Windows ARM64, download the [ARM64 installer]
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-pomoc-centrum-pomocy-i-artykuly-o-instalacji
    tresc: Pomoc w sprawach czatu i Cowork jest w Centrum pomocy Claude (Claude Help Center); o instalacji i wdrażaniu aplikacji na komputer piszą artykuły pomocy Claude Desktop.
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    cytat: '**Using chat or Cowork**: see the [Claude Help Center](https://support.claude.com/) […] **Need more on installing or deploying the desktop app**: see the [Claude Desktop support articles](https://support.claude.com/en/collections/16163169-claude-desktop)'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-z-otwarta-zakladka-code-wybierasz-projekt-i-zadanie
    tresc: Gdy zakładka Code jest otwarta, wybierasz projekt i dajesz Claude zadanie do wykonania.
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    cytat: With the Code tab open, choose a project and give Claude something to do.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-open-folder-wskazuje-katalog-projektu
    tresc: Klikasz kontrolkę folderu projektu obok wyboru środowiska, wybierasz pozycję Open folder… i wskazujesz katalog projektu.
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    cytat: Then click the project folder control beside the environment selector, select **Open folder…**, and choose your project's directory.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-rada-zacznij-od-malego-znanego-projektu
    tresc: Dokumentacja radzi zacząć od małego projektu, który dobrze znasz, bo to najszybszy sposób, żeby zobaczyć, co potrafi Claude Code.
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    cytat: Start with a small project you know well. It's the fastest way to see what Claude Code can do.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-srodowiska-cloud-ssh-wsl
    tresc: Cloud działa na infrastrukturze zarządzanej przez Anthropic (domyślnie), a sesje trwają dalej po zamknięciu aplikacji; SSH działa na zdalnej maszynie, z którą łączysz się przez SSH; WSL (Windows) działa wewnątrz dystrybucji WSL 2 na Twoim komputerze.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**Cloud**: runs on Anthropic-managed infrastructure by default. Sessions continue even if you close the app. […] **SSH**: runs on a remote machine you connect to over SSH […] **WSL** (Windows): runs inside a [WSL 2 distribution](/docs/en/desktop-wsl.md) on your machine'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-model-prawa-czesc-rzedu-zmiana-pozniej
    tresc: Model wybierasz w wyborze modelu w prawej części rzędu pod polem wiadomości i możesz go zmienić później.
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    cytat: Select a model from the model picker toward the right end of the row under the prompt box. […] You can change the model later from the model picker.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-sesja-to-rozmowa-o-kodzie-wlasny-kontekst-i-zmiany
    tresc: Sesja to rozmowa z Claude o Twoim kodzie.
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    cytat: A [session](/docs/en/desktop.md#work-in-parallel-with-sessions) is a conversation with Claude about your code.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-pasek-boczny-wylicza-sesje
    tresc: Pasek boczny wylicza Twoje sesje i pozwala prowadzić kilka naraz.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: The sidebar lists your sessions and lets you run several in parallel.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-code-to-zakladka-obok-czatu-i-cowork
    tresc: W aplikacji Claude na komputer Claude Code to zakładka Code; aplikacja ma też czat i Cowork.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: In the Claude Desktop app, Claude Code is the **Code** tab. The app also has chat and [Cowork](https://claude.com/product/cowork)
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-podpowiedz-polecenia-szary-tekst-w-pustym-polu
    tresc: Po odpowiedzi Claude zakładka Code może pokazać w pustym polu wiadomości podpowiedź następnego polecenia jako szary tekst; każda podpowiedź powstaje z krótkiego zapytania w tle, które liczy się do limitów Twojego planu albo do kosztów API.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: After Claude replies, the Code tab can show a suggested next prompt as gray text in the empty prompt box. Claude Code [generates each suggestion](/docs/en/interactive-mode.md#prompt-suggestions) from your conversation with a short background request that counts toward your plan's usage limits or your API costs.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-podpowiedz-tab-wstawia-pisanie-zastepuje
    tresc: Podpowiedź wstawiasz do pola klawiszem Tab albo strzałką w prawo, możesz ją poprawić i wysłać Enterem; Enter naciśnięty przed przyjęciem podpowiedzi jej nie wysyła; gdy zaczniesz pisać własne polecenie, podpowiedź znika, a pokazuje się tylko przy pustym polu bez załączonych plików.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**Use the suggestion**: press **Tab** or **Right arrow** to place it in the prompt box, edit it if you want, then press **Enter** to send it. Pressing **Enter** before you accept the suggestion doesn''t send it. […] **Write your own prompt**: start typing. The suggestion shows only while the prompt box is empty and has no attached files.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-podpowiedz-wylaczenie-w-ustawieniach
    tresc: Podpowiedzi wyłączysz w Settings > Claude Code, wyłącznikiem Prompt suggestions w grupie Sessions; działa od następnego uruchomienia albo wznowienia każdej sesji.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: Go to **Settings > Claude Code** and turn off **Prompt suggestions** under **Sessions** to stop suggestions in each session from the next time it starts or resumes.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-wczesniejsze-nazwy-trybow
    tresc: Wcześniejsze wersje zakładki Code nazywały tryby Ask permissions, Auto accept edits i Plan mode.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: Earlier versions of the Code tab labeled these modes Ask permissions, Auto accept edits, and Plan mode.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-wersja-aplikacji-about-claude
    tresc: 'Wersję aplikacji sprawdzisz tak: w macOS kliknij Claude na pasku menu, potem About Claude; w Windows kliknij Help, potem About Claude.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**macOS**: click **Claude** in the menu bar, then **About Claude** […] **Windows**: click **Help**, then **About Claude**'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-nowsza-wersja-check-for-updates-potem-nowa-sesja
    tresc: 'Żeby sesje lokalne w zakładce Code dostały nowszą wersję Claude Code, otwórz Claude > Check for Updates… w macOS albo Help > Check for Updates… w Windows, a potem zacznij nową sesję.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: To get a newer version for local sessions, open **Claude > Check for Updates…** on macOS or **Help > Check for Updates…** on Windows, then start a new session.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-blad-403-cztery-kroki
    tresc: 'Przy błędzie 403 albo innym błędzie uwierzytelniania w zakładce Code: 1. wyloguj się i zaloguj z menu aplikacji (najczęstsza naprawa); 2. sprawdź, czy masz aktywny płatny plan (Pro, Max, Team albo Enterprise); 3. gdy działa claude w terminalu (CLI), a aplikacja nie, zamknij aplikację całkowicie, nie samo okno, otwórz ją ponownie i zaloguj się jeszcze raz; 4. sprawdź połączenie z internetem i ustawienia proxy.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '1. Sign out and back in from the app menu. This is the most common fix. 2. Verify you have an active paid subscription: Pro, Max, Team, or Enterprise. 3. If the CLI works but Desktop does not, quit the desktop app completely, not just close the window, then reopen and sign in again. 4. Check your internet connection and proxy settings.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-pusty-ekran-po-uruchomieniu-restart-i-aktualizacje
    tresc: 'Gdy aplikacja się otwiera, ale pokazuje pusty albo niereagujący ekran: uruchom ją ponownie i sprawdź oczekujące aktualizacje; w macOS i Windows aplikacja aktualizuje się przy uruchomieniu, a na Linuksie aktualizujesz ją przez apt.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'If the app opens but shows a blank or unresponsive screen: 1. Restart the app. 2. Check for pending updates. On macOS and Windows the app auto-updates on launch; on Linux, update through apt as described in [Claude Desktop on Linux](/docs/en/desktop-linux.md).'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-failed-to-load-session-folder-albo-uprawnienia
    tresc: Komunikat Failed to load session może znaczyć, że wybrany folder już nie istnieje albo uprawnienia do plików blokują dostęp; spróbuj wybrać inny folder albo uruchomić aplikację ponownie.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: If you see `Failed to load session`, the selected folder may no longer exist, […] or file permissions may prevent access. Try selecting a different folder or restarting the app.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-pomoc-get-support-albo-centrum-pomocy
    tresc: 'Pomoc w aplikacji: Help → Get Support albo bezpośrednio strona centrum pomocy Claude (support.claude.com).'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: Open Help → Get Support in the desktop app, or visit the [Claude support center](https://support.claude.com/) directly
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-new-environment-na-dole-menu-selektora
    tresc: Żeby otworzyć okno New environment (tworzenie zapisanego środowiska), otwierasz wybór środowiska pod polem wiadomości i wybierasz New environment na dole jego menu.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**1. Open the New environment dialog** […] Open the environment selector under the prompt box and select **New environment** at the bottom of its menu.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-narzedzia-uruchamianie-polecen
    tresc: Wśród wbudowanych narzędzi Claude Code kategoria uruchamianie (Execution) obejmuje polecenia w powłoce, uruchamianie serwerów, testy i git.
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: '| **Execution** | Run shell commands, start servers, run tests, use git |'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-narzedzia-siec
    tresc: Wśród wbudowanych narzędzi Claude Code kategoria sieć (Web) obejmuje szukanie w sieci, pobieranie dokumentacji i sprawdzanie komunikatów o błędach.
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: '| **Web** | Search the web, fetch documentation, look up error messages |'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-petla-powtarza-sie-az-zadanie-gotowe-mozna-przerwac
    tresc: Według opisu diagramu pętli twoja wiadomość prowadzi do tego, że Claude zbiera kontekst, działa i sprawdza wyniki, a to powtarza się, aż zadanie będzie gotowe; możesz przerwać w każdej chwili.
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: Your prompt leads to Claude gathering context, taking action, verifying results, and repeating until task complete. You can interrupt at any point.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-petla-dopasowuje-sie-do-zadania
    tresc: 'Pętla dopasowuje się do zadania: pytanie o projekt może wymagać tylko zbierania kontekstu, naprawa błędu przechodzi przez wszystkie trzy fazy wiele razy, a przebudowa może wymagać obszernego sprawdzania; Claude o każdym kroku decyduje na podstawie tego, czego dowiedział się w poprzednim, łączy dziesiątki działań i poprawia kurs po drodze.'
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: The loop adapts to what you ask. A question about your codebase might only need context gathering. A bug fix cycles through all three phases repeatedly. A refactor might involve extensive verification. Claude decides what each step requires based on what it learned from the previous step, chaining dozens of actions together and course-correcting along the way.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-ty-jestes-czescia-petli
    tresc: 'Ty też jesteś częścią pętli: w każdej chwili możesz przerwać, żeby skierować Claude inaczej, dodać informacje albo poprosić o inne podejście; Claude pracuje samodzielnie, ale reaguje na to, co mu napiszesz.'
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: You're part of this loop too. You can interrupt at any point to steer Claude in a different direction, provide additional context, or ask it to try a different approach. Claude works autonomously but stays responsive to your input.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-interfejs-zmienia-widok-petla-identyczna
    tresc: Interfejs decyduje o tym, jak widzisz Claude i jak z nim pracujesz, ale pętla pracy pod spodem jest identyczna.
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: The interface determines how you see and interact with Claude, but the underlying agentic loop is identical.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-mozna-zapytac-jak-z-niego-korzystac
    tresc: 'Claude Code potrafi nauczyć, jak z niego korzystać: zadajesz pytanie, a Claude wyjaśnia.'
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: Claude Code can teach you how to use it. Ask questions like "how do I set up hooks?" or "what's the best way to structure my CLAUDE.md?" and Claude will explain.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: terminal-poprawka-enter-wiadomosc-w-kolejce-czytana-po-narzedziach
    tresc: 'W terminalu, gdy napiszesz poprawkę i naciśniesz Enter bez zatrzymywania Claude, wiadomość pokazuje się w rozmowie jako oczekująca; jeśli Claude wykonuje wywołania narzędzi, czyta ją zaraz po ich zakończeniu, w tej samej turze, i dostosowuje się przed następnym krokiem.'
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: '**Type a correction and press `Enter`** without stopping Claude. The message shows as queued in the conversation. If Claude is running tool calls, it reads the message as soon as those calls finish, within the same turn, and adjusts before its next step.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-deleguj-kontekst-i-kierunek-bez-wymieniania-plikow
    tresc: Delegując, podajesz Claude kontekst i kierunek, a szczegóły zostawiasz jemu.
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: Think of delegating to a capable colleague. Give context and direction, then trust Claude to figure out the details
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: terminal-esc-przerywa-claude-zachowuje-dotychczasowa-prace
    tresc: W terminalu klawisz Esc zatrzymuje bieżącą odpowiedź albo wywołanie narzędzia w trakcie tury, żebyś mógł przekierować Claude; Claude zachowuje pracę wykonaną do tej pory.
    zrodlo: https://code.claude.com/docs/en/interactive-mode.md
    cytat: Stop the current response or tool call mid-turn so you can redirect. Claude keeps the work done so far.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-nie-chce-sie-zamknac-macos-windows
    tresc: "Gdy aplikacja nie chce się zamknąć: w macOS naciśnij Cmd+Q, a jeśli aplikacja nie odpowiada, wymuś zamknięcie skrótem Cmd+Option+Esc, wybierz Claude i kliknij Force Quit; w Windows zakończ proces Claude w Menedżerze zadań (Task Manager), otwieranym skrótem Ctrl+Shift+Esc."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "**macOS**: press Cmd+Q. If the app doesn't respond, use Force Quit with Cmd+Option+Esc, select Claude, and click Force Quit. … **Windows**: use Task Manager with Ctrl+Shift+Esc to end the Claude process."
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-windows-blad-rownoczesnej-instalacji
    tresc: "W Windows, gdy instalator pokazuje błąd o innej trwającej instalacji, a żadnej takiej nie ma, spróbuj uruchomić instalator jako administrator."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "**Concurrent installation error**: if you see an error about another installation in progress but there isn't one, try running the installer as Administrator."
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-windows-starsza-wersja-pyta-o-git
    tresc: "W Windows wersje aplikacji Claude Desktop starsze niż 1.49585.0 prosiły o Git przed uruchomieniem jakiejkolwiek sesji lokalnej; jeśli widzisz taką prośbę i nie używasz worktree, zaktualizuj aplikację."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "On Windows, Claude Desktop versions before 1.49585.0 asked for Git before starting any local session; if you see that prompt and aren't using worktrees, update the app."
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-prosba-o-pomoc-co-podac
    tresc: "Przy zgłaszaniu problemu podaj wersję aplikacji, system operacyjny, dokładny tekst błędu i odpowiednie logi."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "When reporting a problem, include your desktop app version, your operating system, the exact error message, and relevant logs."
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: aplikacja-numer-wersji-kopiuje-sie-klikniecie
    tresc: "Numer wersji aplikacji skopiujesz do schowka, klikając go."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "Click the version number to copy it to your clipboard."
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-modele-rozumuja-narzedzia-dzialaja
    tresc: "Pętlę pracy napędzają dwa składniki: modele, które rozumują, i narzędzia, które działają. Claude Code to warstwa wokół modelu, która dostarcza narzędzia i zarządza kontekstem, jaki widzi model."
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: "The agentic loop is powered by two components: [models](#models) that reason and [tools](#tools) that act. Claude Code is the layer around the model that provides the tools and manages the context the model sees."
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
  - id: claude-code-model-rozumie-kod-i-rozbija-zadanie-na-kroki
    tresc: "Claude Code używa modeli Claude, żeby rozumieć kod i rozumować o zadaniach; przy złożonych zadaniach dzieli pracę na kroki, wykonuje je i dostosowuje się do tego, czego się dowiaduje."
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: "Claude Code uses Claude models to understand your code and reason about tasks. Claude can read code in any language, understand how components connect, and figure out what needs to change to accomplish your goal. For complex tasks, it breaks work into steps, executes them, and adjusts based on what it learns."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: tryb-plan-bez-pytania-odczyty-i-polecenia-klasyfikatora
    tresc: 'W trybie plan bez pytania idą odczyty oraz, gdy tryb auto jest dostępny, polecenia zatwierdzone przez klasyfikator.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'Reads, plus classifier-approved commands when [auto mode](#eliminate-prompts-with-auto-mode) is available'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: tryb-auto-bez-pytania-wszystko-z-kontrola-w-tle
    tresc: 'W trybie auto bez pytania idzie wszystko, z kontrolami bezpieczeństwa w tle.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'Everything, with background safety checks'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: odczyty-w-folderze-roboczym-bez-zgody-w-manual
    tresc: 'W trybie Manual odczyty plików i Grep nie wymagają zgody, o ile dotyczą folderu roboczego i folderów dodatkowych.'
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: 'The table shows, for each tool type, whether Manual mode asks before the action runs. … File reads, Grep | No, within the [working directory and additional directories](#working-directories)'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: okno-zgody-pokazuje-co-claude-zamierza-i-opcje
    tresc: 'Okno zgody pokazuje, co Claude zamierza zrobić, a pod tym Twoje opcje.'
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: 'A permission prompt shows what Claude is about to do, followed by your options.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: okno-zgody-stopka-esc-i-tab
    tresc: 'W przykładowym oknie zgody na polecenie stopka podaje dwa klawisze: Esc (anuluj) i Tab (uzupełnij odpowiedź).'
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: 'A footer lists two keys: Esc to cancel and Tab to amend.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: okno-zgody-regula-polecenia-w-settings-local-json
    tresc: 'Gdy wybierzesz „Yes, and don''t ask again” przy zgodzie zapisywanej na stałe, na przykład dla polecenia, Claude Code zapisuje regułę w pliku .claude/settings.local.json w korzeniu repozytorium git.'
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: 'When you choose "Yes, and don''t ask again" and the approval saves permanently, such as for a Bash command or a WebFetch domain, Claude Code saves the rule to `.claude/settings.local.json` at the root of the git repository'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: okno-zgody-regula-dziala-w-kolejnych-sesjach-repozytorium
    tresc: 'Zapisana reguła obowiązuje w kolejnych sesjach w całym repozytorium, także w sesjach uruchomionych w podkatalogach i w worktree.'
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: 'The rule applies to future sessions anywhere in that repository, including sessions started in subdirectories and in worktrees.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: okno-zgody-poza-git-regula-zapisuje-sie-gdzie-indziej
    tresc: 'Poza repozytorium git, a także m.in. na Windowsie, Claude Code nie używa korzenia repozytorium i zapisuje regułę w innym miejscu, które opisuje strona o ustawieniach.'
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: 'In some cases, such as outside a git repository or on Windows, Claude Code doesn''t use the repository root; … lists those cases and where it saves the rule instead.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: okno-zgody-czasem-tylko-zgoda-jednorazowa
    tresc: 'Czasem okno zgody daje tylko zgodę jednorazową, a reguła zapisana z okna obejmuje tylko to, co nazwała wybrana odpowiedź.'
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: 'Sometimes a permission prompt offers only a one-time approval, with no "don''t ask again" option and no option to allow the action for the rest of the session. Claude Code offers those options only when the prompt can show you everything they would allow, so a rule you save from a prompt covers only what its option named.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: okno-zgody-enter-wysyla-odpowiedz-z-komentarzem
    tresc: 'Przy otwartym polu komentarza Enter wysyła odpowiedź razem z komentarzem.'
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: '`Enter`: submits your answer with the comment attached.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: okno-zgody-yes-z-komentarzem-po-wyniku
    tresc: 'Przy odpowiedzi Yes z komentarzem Claude Code wykonuje działanie, a potem wysyła Twój komentarz do Claude razem z wynikiem.'
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: '**Yes**: Claude Code runs the action, then sends your comment to Claude after the result.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: okno-zgody-no-bez-komentarza-zatrzymuje-ture
    tresc: 'Gdy w głównej rozmowie wybierzesz No bez komentarza, Claude Code zatrzymuje bieżącą turę.'
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: 'If you select **No** without a comment on a prompt from the main conversation, Claude Code stops the turn.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: okno-zgody-esc-to-no-bez-komentarza
    tresc: 'W terminalu Esc w oknie zgody odrzuca działanie tak samo jak No bez komentarza.'
    zrodlo: https://code.claude.com/docs/en/interactive-mode.md
    cytat: 'On a permission prompt, `Esc` declines the action, the same as [**No** without a comment](https://code.claude.com/docs/en/permissions.md#add-a-comment-when-you-answer-a-permission-prompt)'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: permissions-lista-regul-i-plik-zrodlowy
    tresc: 'Polecenie /permissions pokazuje wszystkie reguły uprawnień oraz plik settings.json, z którego każda pochodzi.'
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: 'You can view and manage Claude Code''s tool permissions with `/permissions`. The dialog lists all permission rules and the `settings.json` file each rule comes from.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: permissions-dodanie-i-usuniecie-reguly-od-nastepnego-narzedzia
    tresc: 'Okno /permissions można otworzyć w trakcie pracy Claude; dodanie albo usunięcie reguły działa od następnego wywołania narzędzia przez Claude w tej samej turze.'
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: 'You can open the dialog while Claude is working: when you add or remove a rule, Claude Code applies the change starting with Claude''s next tool call in the same turn.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: tryb-default-pyta-przy-pierwszym-uzyciu-narzedzia
    tresc: 'Tryb default, w aplikacji i terminalu nazywany Manual, pyta o zgodę przy pierwszym użyciu każdego narzędzia.'
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: 'Prompts for permission on first use of each tool. Labeled Manual in the CLI, the VS Code and JetBrains extensions, and the desktop app'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-manual-podglad-dokladnie-co-sie-zmieni
    tresc: 'W aplikacji w trybie Manual widzisz podgląd zmian, który pokazuje dokładnie to, co się zmieni.'
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    cytat: 'In Manual mode, you''ll see: … A diff showing exactly what will change'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-manual-aktualizacje-na-biezaco
    tresc: 'W aplikacji w trybie Manual widzisz aktualizacje na bieżąco, gdy Claude pracuje nad Twoją prośbą.'
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    cytat: 'In Manual mode, you''ll see: … Real-time updates as Claude works through your request'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-cyfry-1-9-wybieraja-pozycje-w-menu
    tresc: 'W zakładce Code cyfry od 1 do 9 wybierają pozycję w otwartym menu.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '| `1`–`9` | Select item in an open menu |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: okno-zgody-zmiana-pliku-do-konca-sesji
    tresc: Zgoda „Yes, and don't ask again” na zmianę plików nie zapisuje się w pliku ustawień i obowiązuje tylko do końca sesji.
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: 'A file-modification approval isn''t saved to the file: as the table shows, it lasts until the session ends.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    sprawdzone_przez: filtr-prawdy 2026-10-23, poprawione

  - id: okno-zgody-polecenie-zapisuje-sie-na-stale
    tresc: Zgoda „Yes, and don't ask again” na polecenie powłoki zapisuje się na stałe dla danego repozytorium i polecenia.
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: '| Bash commands | Shell execution | Yes, except a built-in set of [read-only commands](#read-only-commands) | Permanently per repository and command |'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    sprawdzone_przez: filtr-prawdy 2026-10-23

  - id: aplikacja-permissions-niedostepne
    tresc: W aplikacji na komputer polecenia wbudowane, które w terminalu otwierają interaktywny panel i nie mają formy z argumentem, takie jak /permissions, odpowiadają „isn't available in this environment”.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Terminal-dialog commands: built-in commands that open an interactive panel in the terminal behave differently in the Code tab. [...] Commands with no argument form, such as `/permissions`, reply with `isn''t available in this environment`.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    sprawdzone_przez: filtr-prawdy 2026-10-24

  - id: aplikacja-reguly-uprawnien-w-plikach-ustawien
    tresc: W zakładce Code reguły uprawnień zmieniasz, edytując pliki ustawień, albo uruchamiasz potrzebne polecenie w programie w terminalu.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: Edit [settings files](https://code.claude.com/docs/en/settings.md) directly to manage permission rules and configuration, or run the commands from the standalone CLI.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: aplikacja-czyta-te-same-ustawienia-co-terminal
    tresc: Aplikacja na komputer czyta te same pliki ustawień co program w terminalu.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: The desktop app reads the same settings files as the CLI.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: okno-zgody-bez-komentarza-przy-zgodzie-na-sesje-i-regule
    tresc: Odpowiedzi, które pozwalają na działanie do końca sesji albo zapisują regułę, nie przyjmują komentarza; nie ma go też w oknach zgody na pobranie strony i w przeglądarce.
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: WebFetch and browser prompts don't offer the field. The options that allow the action for the rest of the session or save a rule don't take one either.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: artefakt-wylaczenie-publicznego-udostepniania-blokuje-istniejace-linki
    tresc: "Na planach Team i Enterprise artefaktami zarządza Owner w ustawieniach administratora claude.ai; gdy wyłączy udostępnianie na zewnątrz (External sharing), dostęp przez istniejące publiczne linki zostaje zablokowany, choć ustawienie, kto widzi każdy artefakt, się nie zmienia, a dostęp wraca po ponownym włączeniu."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Owners on Team and Enterprise plans control artifacts from [claude.ai admin settings](https://claude.ai/admin-settings/artifacts). [...] To let members publish artifacts to public links that anyone can view without signing in, go to [**Organization settings > Artifacts**](https://claude.ai/admin-settings/artifacts) and turn on **External sharing** under the **Artifacts** toggle. Turning it back off blocks access through existing public links without changing each artifact''s audience; access resumes if you re-enable it.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: artefakt-strona-zuzywa-wiecej-tokenow-najwiecej-obrazy
    tresc: "Tworzenie artefaktu zużywa tokeny jak każda odpowiedź, a strona z wyglądem zużywa ich więcej niż ta sama treść podana zwykłym tekstem w terminalu; najwięcej dokładają wygląd i przyciski zapisane w samym pliku strony, a zwłaszcza obrazy wklejone do pliku strony."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Generating an artifact uses output tokens like any other response, and a styled page is more token-intensive than the same content as terminal text. Inline CSS, JavaScript for interactive controls, and especially images embedded as data URIs are the main contributors.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: artefakt-przyklady-pulpit-warianty-os-czasu-tablica
    tresc: "Dokumentacja podaje przykłady próśb o artefakt, między innymi: pulpit z danych, które sesja już pobrała, kilka wariantów projektu albo wykonania ułożonych obok siebie, oś czasu badania, która uzupełnia się w trakcie długiego zadania, i tablicę stanu, która za każdym razem, gdy ktoś ją otwiera, pobiera świeże dane przez konektory MCP."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'For example, ask Claude to: [...] Render a dashboard from data the session already pulled [...] Lay out several design or implementation options side by side [...] Keep an investigation timeline that fills in while a long task runs [...] Publish a status board that [pulls fresh data through MCP connectors](#pull-live-data-with-mcp-connectors) each time someone opens it'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-pyta-przed-publikacja-z-konektorami-albo-pobraniami
    tresc: "Gdy publikacja deklaruje możliwości strony, takie jak wywołania konektorów albo pobieranie plików, Claude Code pyta Cię przed tą publikacją (w trybie Auto zamiast pytania publikację sprawdza klasyfikator)."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'In these cases Claude Code asks you first, or in [auto mode](https://code.claude.com/docs/en/permission-modes.md#eliminate-prompts-with-auto-mode) has the classifier review the publish: [...] The publish declares runtime capabilities for the page, such as [connector calls](#pull-live-data-with-mcp-connectors) or [file downloads](#offer-a-file-download) | Asks before that publish'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-edytor-tylko-team-enterprise
    tresc: "Osoby, którym udostępniasz artefakt, są domyślnie oglądającymi: widzą każdą wersję, którą publikujesz, ale nie mogą zmienić strony. Na planach Team i Enterprise możesz też zrobić kogoś edytorem: w oknie udostępniania dodajesz osobę i zmieniasz jej rolę z viewer na editor."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'People you share with are viewers by default: they see each version you publish but can''t change the page. On Team and Enterprise plans, you can also make someone an editor. In the share dialog, add a person and switch their role from **viewer** to **editor**.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-edytor-publikuje-podajac-adres
    tresc: "Edytor publikuje nowe wersje tak samo, jak Ty poprawiasz artefakt z innej sesji: podaje Claude adres artefaktu albo dołącza go z /artifacts, a Claude pobiera aktualną treść i publikuje ją ponownie z jego zmianami. Każdy, kto ma stronę otwartą, widzi każdą aktualizację na żywo."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'An editor publishes new versions the same way you [update the artifact from another session](#update-an-artifact): they give Claude the artifact''s URL, or attach it from [`/artifacts`](#find-an-artifact-again), and Claude pulls the current content and republishes with their changes. Everyone with the page open sees each update live.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-starsza-kopia-scalenie-z-nowsza-wersja
    tresc: "Jeśli edytor opublikuje stronę, gdy Claude trzyma jej starszą kopię, Claude Code odmawia publikacji zbudowanej na tej kopii. Claude nanosi wtedy swoje zmiany na nowszą wersję i publikuje ponownie."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'If an editor publishes while Claude holds an older copy of the page, Claude Code refuses a publish built on that copy. Claude then merges its changes onto the newer version and publishes again.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-cudzy-czytasz-podajac-adres
    tresc: "Gdy ktoś udostępni Ci artefakt, możesz poprosić Claude o jego przeczytanie: podajesz Claude adres artefaktu albo dołączasz go z /artifacts."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'When someone shares an artifact with you, you can have Claude read it: give Claude its URL, or attach it from [`/artifacts`](#find-an-artifact-again).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-cudzy-streszczenie-polecenia-zglaszane
    tresc: "Stronę napisaną przez kogoś innego Claude czyta tak, jak czyta stronę internetową narzędziem WebFetch: dostaje streszczenie tego, o co pytał, a nie surową stronę, a streszczenie zgłasza polecenia wpisane w stronę, zamiast je przekazywać. Claude Code zapisuje też pełne źródło strony do pliku na dysku, który Claude może otworzyć, gdy potrzebuje dokładnej treści, na przykład żeby jako edytor opublikować artefakt ponownie."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Claude reads a page someone else wrote the way it reads a web page with [WebFetch](https://code.claude.com/docs/en/tools-reference.md#webfetch-tool-behavior): it gets a summary of what it asked about rather than the raw page, and the summary reports instructions written into the page instead of relaying them. Claude Code also saves the page''s full source to a local file, which Claude can open when it needs the exact content, such as to republish the artifact as an [editor](#let-someone-edit-with-you).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-cudzej-organizacji-pyta-przed-odczytem
    tresc: "Zanim Claude przeczyta publiczny artefakt innej organizacji, Claude Code najpierw pyta Cię o zgodę, nawet w trybie Auto."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Claude Code asks for your approval before Claude reads the artifact in these cases, in addition to any prompt your permission mode or rules call for: [...] **Another organization''s public artifact**: Claude Code asks you first, even in auto mode.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-plan-pyta-przed-odczytem-z-organizacji
    tresc: "W trybie Plan Claude Code pyta o zgodę, zanim narzędzie Artifact przeczyta artefakt zrobiony przez kogoś innego z Twojej organizacji."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Claude Code asks for your approval before Claude reads the artifact in these cases, in addition to any prompt your permission mode or rules call for: [...] **Plan mode**: in [plan mode](https://code.claude.com/docs/en/permission-modes.md#analyze-before-you-edit-with-plan-mode), Claude Code asks before the Artifact tool reads an artifact someone else in your organization made.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-odczyt-przez-webfetch-obowiazuja-zasady-webfetch
    tresc: "Gdy Claude czyta artefakt narzędziem WebFetch, nadal obowiązują własne zasady pytania o zgodę narzędzia WebFetch."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'When Claude reads the artifact with WebFetch, WebFetch''s own [prompting rules](https://code.claude.com/docs/en/tools-reference.md#webfetch-tool-behavior) still apply.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-odczyt-przez-webfetch-pyta-w-manual-i-accept-edits
    tresc: "W trybach uprawnień Manual i acceptEdits narzędzie WebFetch pyta przed pobraniem strony, z wyjątkiem domen, które Twoje reguły uprawnień już dopuszczają albo blokują, i wbudowanego zestawu wcześniej zatwierdzonych domen dokumentacji. Gdy adres to link do artefaktu na claude.ai, Claude Code może też zapytać o zgodę na odczyt samego artefaktu."
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: 'In Manual and `acceptEdits` [permission modes](https://code.claude.com/docs/en/permission-modes.md), WebFetch prompts before fetching, except for domains your [permission rules](https://code.claude.com/docs/en/permissions.md#manage-permissions) already allow or deny and a built-in set of preapproved documentation domains that fetch without a prompt. [...] When the URL is a claude.ai [artifact](https://code.claude.com/docs/en/artifacts.md) link, Claude Code can also ask for approval to read the artifact itself.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: webfetch-claude-dostaje-wynik-wyciagu-nie-surowa-strone
    tresc: "Przy większości pobrań WebFetch wykonuje prośbę o wyciągnięcie treści w osobnym wywołaniu modelu, a Claude dostaje wynik tego wywołania, nie surową stronę. Dlatego wynik, który mówi, że strona czegoś nie wspomina, może znaczyć tylko tyle, że prośba o to nie pytała."
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: 'For most fetches, it then runs the prompt against the content in a separate model call, and Claude receives the result of that call rather than the raw page. [...] This makes WebFetch lossy by design. The extraction prompt determines what reaches Claude, so a result that says a page doesn''t mention something may only mean the prompt didn''t ask about it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-komentarze-w-organizacji-claude-czyta
    tresc: "Gdy udostępniasz artefakt w organizacji, osoby, którym go udostępniasz, mogą zostawiać komentarze na stronie, a Claude może na Twoją prośbę te komentarze czytać i na nie odpowiadać. Potrzebujesz Claude Code w wersji 2.1.221 lub nowszej. Claude czyta komentarze w dwóch przypadkach."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'When you share an artifact within your organization, the people you share it with can leave comments on the page, and you can have Claude read those comments and reply to them. You need Claude Code v2.1.221 or later. Claude reads the comments in two cases:'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-claude-wypisuje-watki-i-zaznacza-wyslane
    tresc: "Pierwszy przypadek, w którym Claude czyta komentarze: prosisz go o to, podając adres artefaktu. Claude wypisuje każdy wątek i zaznacza komentarze, które wysłała do niego osoba mogąca edytować artefakt."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: '**You ask Claude to read them**: give Claude the artifact''s URL and ask for the comments. Claude lists each thread and marks the comments someone who can edit the artifact sent to it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-komentarz-send-to-claude-albo-wzmianka
    tresc: "Drugi przypadek, w którym Claude czyta komentarze: osoba, która może edytować artefakt, wysyła mu komentarz w wątku na stronie, przez Send to Claude albo wzmianką @claude w komentarzu. W obu przypadkach uaktywnia tym wątek."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: '**Someone who can edit the artifact sends a comment to Claude**: in a thread on the page, they send a comment with **Send to Claude**, or mention `@claude` in one. Either way, they activate the thread.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-odpowiedz-tylko-w-uaktywnionym-watku
    tresc: "Claude może odpowiedzieć albo zamknąć tylko uaktywniony wątek. Pozostałe wątki zostają otwarte, dopóki człowiek nie zamknie ich na stronie. Oglądający widzą każdą odpowiedź przypisaną Claude, przez Ciebie."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Claude can reply to or resolve only an activated thread. Other threads stay open until a person resolves them on the page. Viewers see each reply attributed to Claude, via you.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-publiczny-link-bez-komentarzy
    tresc: "Gdy udostępnisz artefakt publicznie, osoby, które mają do niego dostęp tylko przez publiczny link, nie widzą komentarzy i nie mogą dodać nowych. Istniejące wątki zostają na artefakcie, a Ty i edytorzy artefaktu nadal możecie je czytać i na nie odpowiadać."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'If you share an artifact publicly, people whose only access is the public link don''t see its comments and can''t add any. Existing comment threads stay on the artifact, and you and its editors can still read and reply to them.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-prosba-przeczytaj-komentarze-i-wprowadz-zmiany
    tresc: "Żeby samemu poprosić o komentarze, podajesz Claude adres artefaktu, na przykład prośbą: przeczytaj komentarze pod tym adresem i wprowadź zmiany, o które proszą komentujący."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'To ask for the comments yourself, give Claude the URL: [...] Read the comments on https://claude.ai/code/artifact/5fbea6f3-... and make the changes the commenters ask for.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-komentarze-pierwsza-sesja-po-aktualizacji
    tresc: "Gdy Claude mówi, że nie może czytać komentarzy, jedna z rzeczy do sprawdzenia to sesja: w pierwszej sesji po instalacji Claude Code albo po aktualizacji z wersji starszej niż 2.1.221 Claude może jeszcze nie umieć czytać komentarzy; zaczynasz wtedy nową sesję i prosisz jeszcze raz."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'If Claude tells you it can''t read comments, confirm your version, your session, and your feature-flag setting: [...] You''re not in your first session since you installed Claude Code or upgraded from a version before v2.1.221. In that [first session after an install or upgrade](https://code.claude.com/docs/en/env-vars.md#first-session-after-an-install-or-upgrade), Claude might not be able to read comments yet; start a new session and ask again.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-po-publikacji-claude-obserwuje-komentarze
    tresc: "Gdy Twoja sesja opublikuje artefakt, Claude Code obserwuje ten artefakt, czy pojawiają się komentarze. Gdy osoba, która może edytować artefakt, wyśle komentarz do Claude, trafia on od razu do Twojej sesji, a Claude może przeczytać wątek i odpowiedzieć bez Twojej prośby. Potrzebujesz Claude Code w wersji 2.1.228 lub nowszej."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'After your session publishes an artifact, Claude Code watches that artifact for comments. When someone who can edit the artifact sends a comment to Claude, it reaches your session right away, and Claude can read the thread and reply without you asking. [...] You need Claude Code v2.1.228 or later.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-odpowiedz-na-komentarz-zalezy-od-trybu
    tresc: "O tym, co Claude zrobi, gdy nadejdzie wysłany do niego komentarz, decyduje tryb uprawnień. W trybie, który pozwala Claude opublikować odpowiedź bez pytania Cię, Claude czyta wątek i odpowiada, a Ty widzisz Auto-replied to comment thread on Artifact: <name>. Poza trybem Plan, gdy opublikowanie odpowiedzi wymagałoby Twojej zgody, widzisz Comments are waiting on Artifact: <name>, a Claude pyta Cię o zgodę na przeczytanie wątku i drugi raz na opublikowanie odpowiedzi. W trybie Plan widzisz Comments are waiting on Artifact: <name>, a Claude nie odpowiada, dopóki nie wyjdziesz z trybu Plan i nie poprosisz go o przeczytanie i odpowiedź."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Your [permission mode](https://code.claude.com/docs/en/permission-modes.md) decides what Claude does when a sent comment arrives: [...] **Claude replies on its own**: if you''re in a permission mode that lets Claude post the reply without asking you, Claude reads the thread and replies. You see `Auto-replied to comment thread on Artifact: <name>`. [...] **Claude waits for you**: outside plan mode, when posting the reply would need your approval, you see `Comments are waiting on Artifact: <name>`. Claude then asks you for approval to read the thread, and again to post the reply. [...] **Claude pauses in plan mode**: you see `Comments are waiting on Artifact: <name>`, and Claude doesn''t reply until you leave plan mode and ask it to read and reply.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-obserwacja-komentarzy-wygasa
    tresc: "Obserwacja artefaktu, którą Claude Code zaczął sam, może się zakończyć, gdy na artefakcie przez kilka godzin nic się nie dzieje. Żeby ją wznowić, publikujesz artefakt ponownie albo prosisz Claude, żeby go obserwował."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'A watch that Claude Code started on its own can end after the artifact goes several hours without activity. To start the watch again, publish the artifact again or ask Claude to watch it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-konektory-dane-przy-kazdym-otwarciu
    tresc: "Artefakt może wywoływać konektory MCP za każdym razem, gdy ktoś go ogląda, więc strona pokazuje bieżące dane, a nie migawkę z sesji, która ją zbudowała. Wywołania konektorów z artefaktów są dostępne na planach Pro, Max, Team i Enterprise i wymagają Claude Code w wersji 2.1.209 lub nowszej; we wcześniejszych wersjach Claude publikuje stronę z danymi, które sesja zebrała w trakcie budowania strony."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'An artifact can call [MCP connectors](https://code.claude.com/docs/en/mcp.md#use-mcp-servers-from-claude-ai) each time someone views it, so the page shows current data rather than a snapshot from the session that built it. Connector calls from artifacts are available on Pro, Max, Team, and Enterprise plans and require Claude Code v2.1.209 or later. On earlier versions, Claude publishes the page with whatever data the session gathered while building it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-prosba-o-dane-z-konektora
    tresc: "Żeby zbudować stronę z danymi z konektora, w prośbie nazywasz konektor i dane, które chcesz (przykład z dokumentacji: pulpit otwartych pull requestów, który przy ładowaniu strony pobiera aktualną listę przez konektor GitHub)."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'To create a connector-backed page, name the connector and the data you want in your prompt: [...] Build a dashboard artifact of our open pull requests that pulls the live list through my GitHub connector when the page loads.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-tylko-konektory-z-konta-claude-ai
    tresc: "Przy publikacji Claude deklaruje, które konektory strona może wywoływać, a strona nie może wywołać konektorów spoza tej deklaracji. Kwalifikują się tylko konektory z Twojego konta claude.ai. Lokalne serwery MCP skonfigurowane w Claude Code, na przykład z pliku .mcp.json, mogą dostarczyć dane, gdy Claude buduje stronę, ale opublikowana strona nie może ich wywołać."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Claude declares which connectors the page may call as part of publishing, and the page can''t call connectors outside that declaration. Only connectors from your claude.ai account qualify: [...] Local MCP servers you configure in Claude Code, such as servers from `.mcp.json`, can supply data while Claude builds the page, but the published page can''t call them.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-dane-pobierane-przy-otwarciu-i-odswiezane
    tresc: "Strona pobiera dane, gdy się ładuje, i może je odświeżać co określony czas albo gdy oglądający użyje kontrolki odświeżania na stronie. Odpowiedzi są zapamiętywane w przeglądarce oglądającego, więc ponownie otwarta strona od razu pokazuje zapamiętane odpowiedzi, a potem aktualizuje się świeżymi wynikami."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'The page fetches data when it loads and can refresh on an interval or when a viewer uses a refresh control on the page. Responses are cached in the viewer''s browser, so a reopened page renders from the cached responses immediately, then updates with fresh results.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-konektory-na-koncie-ogladajacego
    tresc: "Gdy opublikowana strona wywołuje konektor, wywołanie używa konta osoby, która ogląda stronę, a nie konta osoby, która ją opublikowała. Wywołania idą przez narzędzia podłączone do konta oglądającego, więc dwie osoby otwierające ten sam pulpit mogą zobaczyć różne dane, zależnie od tego, do czego mają dostęp ich konta. Strona nigdy nie widzi niczyich danych logowania; wywołania w jej imieniu wykonuje claude.ai."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'When a published page calls a connector, the call uses the account of the person viewing the page, not the account of the person who published it: [...] **Each viewer uses their own connectors**: calls go through the viewing account''s connected tools, so two people opening the same dashboard can see different data depending on what their accounts can access. The page never sees anyone''s credentials; claude.ai makes the calls on the page''s behalf.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-ogladajacy-zgadza-sie-na-konektor
    tresc: "claude.ai pyta każdego oglądającego o pozwolenie przed pierwszym wywołaniem konektora przez stronę. Oglądający, który odmówi albo nie podłączył konektora używanego przez stronę, nadal widzi stronę, ale bez jej części na żywo."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: '**Viewers approve access first**: claude.ai asks each viewer for permission before the page''s first connector call. A viewer who declines, or who hasn''t connected a connector the page uses, still sees the page without its live sections.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-dzialania-na-koncie-klikajacego
    tresc: "Strona może mieć kontrolki, które wywołują narzędzia konektora ze skutkami, na przykład wysłanie wiadomości albo zmianę zgłoszenia; takie działanie idzie przez konto osoby, która wybierze kontrolkę."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: '**Actions use the viewer''s account too**: a page can offer controls that invoke connector tools with side effects, such as posting a message or updating an issue. The action goes through the account of whoever selects the control.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-komunikat-zastepczy-w-czesci-na-zywo
    tresc: "Gdy planujesz udostępnić stronę z konektorami, poproś Claude o komunikat zastępczy w każdej części na żywo, który nazywa potrzebny konektor. Oglądający bez tego połączenia zobaczy wtedy, co podłączyć, zamiast pustej części."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'When you plan to share a connector-backed page, ask Claude to include a fallback message in each live section that names the connector it needs. A viewer who''s missing the connection then sees what to connect instead of an empty section.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-publiczny-link-bez-danych-na-zywo
    tresc: "Stronę z konektorami możesz udostępnić w organizacji albo publicznie, na ile pozwalają Twój plan i ustawienia organizacji. Wywołania konektorów nie działają dla oglądającego, który otwiera publiczny link bez zalogowania do claude.ai albo spoza Twojej organizacji; taki oglądający widzi stronę bez części na żywo."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'You can [share a connector-backed page](#share-an-artifact) within your organization or publicly, as your plan and organization settings allow. Connector calls don''t run for a viewer who opens the public link without signing in to claude.ai, or from outside your organization. That viewer sees the page without its live sections.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-konektor-dodajesz-w-settings-connectors
    tresc: "Gdy części na żywo zostają puste dla oglądającego z Twojej organizacji, jedną z przyczyn jest brak podłączonego konektora: konektory są przypisane do konta, więc każdy oglądający potrzebuje własnego połączenia z każdym konektorem, który wywołuje strona. Oglądający dodaje konektor w Settings > Connectors na claude.ai, a potem przeładowuje stronę."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'When a connector-backed page renders but its live sections stay empty for a viewer in your organization, work through these causes: [...] **The viewer hasn''t connected the connector**: connectors are per-account, so each viewer needs their own connection to every connector the page calls. They can add one under **Settings > Connectors** on claude.ai, then reload the page.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-odmowa-konektora-do-przeladowania
    tresc: "Gdy oglądający odmówi pozwolenia, odmowa obowiązuje do końca tego załadowania strony; przeładowanie strony przywraca pytanie o pozwolenie."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: '**The viewer declined the permission ask**: a denial lasts for the rest of that page load. Reloading the page brings the permission ask back.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-owner-wylacza-konektory-w-artefaktach
    tresc: "Na planach Team i Enterprise artefaktami zarządza Owner w ustawieniach administratora claude.ai. Gdy części na żywo zostają puste dla oglądającego z Twojej organizacji, jedną z przyczyn jest wyłączenie wywołań konektorów dla organizacji: przełącznikiem Enable artifact connectors w ustawieniach administratora steruje Owner."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'When a connector-backed page renders but its live sections stay empty for a viewer in your organization, work through these causes: [...] **Connector calls are turned off for the organization**: an Owner controls the [**Enable artifact connectors** toggle](#control-connector-calls-from-artifacts) in admin settings. [...] Owners on Team and Enterprise plans control artifacts from [claude.ai admin settings](https://claude.ai/admin-settings/artifacts).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-plik-do-pobrania-przyciskiem
    tresc: "Artefakt może dać oglądającym plik, który wytwarza strona, na przykład eksport tabeli do CSV albo wykres w PNG; oglądający zapisuje go kontrolką pobierania na stronie, na przykład przyciskiem. Pobieranie plików to możliwość strony, którą claude.ai włącza dla poszczególnych kont, więc Claude sprawdza, czy Twoje konto ją ma, zanim zbuduje kontrolkę."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'An artifact can offer viewers a file the page generates, such as a CSV export of a table or a PNG of a chart. The viewer saves it through a download control on the page, such as a button. File downloads are a runtime capability that claude.ai enables per account, so Claude checks whether your account has it before it builds the control.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-zwykly-link-pobrania-zablokowany
    tresc: "Oglądający nie zapiszą pliku przez zwykły link do pobrania ani przez skrypt na stronie, bo podgląd artefaktu na claude.ai blokuje każde pobieranie, które strona zaczyna sama, także linki do adresów data: i blob:. Jeśli strona ma przyciski pobierania zbudowane w ten sposób, poproś Claude, żeby przebudował je z możliwością pobierania. Strona nie może sama zacząć pobierania; żeby oglądający mogli zapisać plik wytworzony przez stronę, Claude deklaruje możliwość pobierania."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Viewers can''t save a file from an ordinary download link or a script on the page, because the artifact viewer on claude.ai blocks any download the page starts itself, including links to `data:` or `blob:` URLs. If a page has download buttons built that way, ask Claude to rebuild them with the downloads capability. [...] Downloads | The page can''t start a download itself. To let viewers save a file the page generates, Claude declares the downloads capability.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-prosba-o-przycisk-pobierania
    tresc: "Żeby zaoferować plik, w prośbie podajesz kontrolkę i format pliku, na przykład: dodaj przycisk, który pobiera tę tabelę jako plik CSV. Claude deklaruje możliwość pobierania przy publikacji, tak samo jak deklaruje konektory."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'To offer a file, ask for the control and the file format in your prompt: [...] Add a button that downloads this table as a CSV file. [...] Claude declares the downloads capability as part of publishing, the same way it [declares connectors](#pull-live-data-with-mcp-connectors).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-jedna-strona-html-css-js
    tresc: "Artefakt to jedna strona HTML, więc mieści się w nim wszystko, co da się wyrazić w HTML, CSS i JavaScript wpisanym w stronę."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'An artifact is a single HTML page, so anything you can express in HTML, CSS, and inline JavaScript is in scope.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-porownanie-wariantow-na-jednej-stronie
    tresc: "Możesz poprosić o kilka wariantów na jednej stronie, żeby porównać je ze sobą; sprawdza się to przy układach, tekstach, kształtach API albo planach wdrożenia."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Ask for several variants on one page so you can evaluate them against each other. This works for layouts, copy, API shapes, or implementation plans.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-suwaki-i-przelaczniki
    tresc: "Możesz poprosić o suwaki, przełączniki albo pola do wpisywania powiązane z tym, co dostrajasz, żeby sprawdzać wartości wprost, zamiast je opisywać."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Ask for sliders, toggles, or input fields bound to whatever you are adjusting, so you can explore values directly instead of describing them.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-wynik-wraca-do-rozmowy-przyciskiem
    tresc: "Artefakt może działać jak prosty edytor decyzji, którą potem odsyłasz do Claude: prosisz o kontrolkę eksportu, która daje tekst do wklejenia w terminalu, więc wynik pracy na stronie wraca do sesji, zamiast zostać na stronie."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'An artifact can act as a lightweight editor for a decision you then send back to Claude. Ask for an export control that produces text you can paste into the terminal, so the result of interacting with the page flows back into the session instead of staying on the page.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-lista-kontrolna-w-trakcie-zadania
    tresc: "Możesz poprosić Claude, żeby utrzymywał artefakt aktualny, gdy trwa długie zadanie, tak żeby każdy z linkiem mógł śledzić postęp bez czytania terminala. Przykład z dokumentacji: plan migracji jako lista kontrolna, w której Claude odhacza punkty po ich wykonaniu i dopisuje notatkę przy każdym pominiętym."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Ask Claude to keep an artifact current while a long task runs, so anyone with the link can follow along without reading the terminal. [...] Turn this migration plan into a checklist artifact. Check items off as you complete them and add a note for anything you skip.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: artefakt-kosztuje-wiecej-tokenow-jak-zmniejszyc
    tresc: "Żeby zmniejszyć zużycie tokenów przez artefakt: do schematów wybieraj SVG albo HTML i CSS zamiast wklejonych obrazów rastrowych, pomijaj interaktywność, której nie potrzebujesz, i niech strona streszcza duże zbiory danych, zamiast wklejać je w całości."
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'To reduce an artifact''s token cost: [...] Prefer SVG, or HTML and CSS, for diagrams over embedded raster images [...] Omit interactivity you do not need [...] Have the page summarize large datasets rather than inline them in full'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-przekazuje-konektory-claude-ai-do-sesji
    tresc: "W sesjach lokalnych i SSH aplikacja na komputer przekazuje Claude Code bezpośrednio konektory claude.ai, które podłączył dany użytkownik."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'In local and SSH sessions, the desktop app delivers each user''s connected claude.ai connectors to Claude Code directly.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  # Lekcja tryb-planowania (moduł tryby-pracy), krok 1 skilla nowa-lekcja, 26.10.2026: z rezerwy modułu
  - id: tryb-plan-wyjscie-shift-tab
    tresc: W terminalu ponowne naciśnięcie Shift+Tab wychodzi z trybu planowania bez zatwierdzania planu.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: Press `Shift+Tab` again to leave plan mode without approving a plan.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    sprawdzone_przez: filtr-prawdy 2026-10-23, poprawione

  - id: plan-opcja-yes-and-use-auto-mode
    tresc: Opcja „Yes, and use auto mode” zatwierdza plan i zaczyna pracę w trybie auto.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: '**Yes, and use auto mode**: approve and start in [auto mode](#eliminate-prompts-with-auto-mode).'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    sprawdzone_przez: filtr-prawdy 2026-10-23

  - id: plan-opcja-yes-auto-accept-edits
    tresc: Gdy tryb auto jest niedostępny w sesji, opcja „Yes, and use auto mode” nazywa się zamiast tego „Yes, auto-accept edits”.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: If auto mode isn't [available to your session](#eliminate-prompts-with-auto-mode), for example because your organization turned it off, this option reads **Yes, auto-accept edits**.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    sprawdzone_przez: filtr-prawdy 2026-10-23, poprawione

  - id: plan-opcja-yes-manually-approve-edits
    tresc: Opcja „Yes, manually approve edits” zatwierdza plan, ale każdą edycję przeglądasz osobno.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: '**Yes, manually approve edits**: approve and review each edit individually.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    sprawdzone_przez: filtr-prawdy 2026-10-23

  - id: plan-ctrl-g-otwiera-plan-w-edytorze
    tresc: W terminalu Ctrl+G otwiera proponowany plan w domyślnym edytorze tekstu, żebyś mógł go poprawić, zanim Claude przejdzie dalej.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: Press `Ctrl+G` to open the proposed plan in your default text editor and edit it directly before Claude proceeds.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    sprawdzone_przez: filtr-prawdy 2026-10-23, poprawione

  # Lekcja tryb-planowania: nowe fakty z dokumentacji
  - id: plan-edycje-zablokowane-do-zatwierdzenia
    tresc: W trybie planowania Claude czyta pliki, uruchamia polecenia powłoki, żeby zbadać projekt, i pisze plan, ale nie edytuje Twoich plików źródłowych; edycje są zablokowane, dopóki nie zatwierdzisz planu (wyjątek to interaktywne sesje w terminalu z dostępnym trybem bypass permissions).
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: Claude reads files, runs shell commands to explore, and writes a plan, but does not edit your source. Except in interactive terminal sessions with [bypass permissions available](#skip-all-checks-with-bypasspermissions-mode), edits stay blocked until you approve the plan.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: plan-polecenia-klasyfikator-albo-pytanie
    tresc: 'Co dzieje się z poleceniem powłoki w czasie planowania, zależy od sesji (obowiązuje pierwszy pasujący przypadek): w interaktywnej sesji w terminalu z dostępnym bypass permissions nie ma ani klasyfikatora, ani pytania; gdy tryb auto jest dostępny, a ustawienie useAutoModeDuringPlan włączone (domyślnie jest), polecenia inne niż usuwanie ścieżek krytycznych ocenia klasyfikator zamiast pytać Ciebie, zatwierdzone się wykonują, a odrzucone są blokowane; gdy tryb auto nie jest dostępny albo ustawienie jest wyłączone, polecenia spoza wbudowanej listy poleceń tylko do odczytu pytają o zgodę.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'What happens to a shell command during planning depends on the session, and the first of these cases that matches applies: … **Interactive terminal sessions with bypass permissions available**: neither the classifier nor a prompt applies to planning commands. … **[Auto mode](https://code.claude.com/docs/en/auto-mode-config.md) available and the `useAutoModeDuringPlan` setting on**, which it is by default: the classifier reviews shell commands other than [critical-path removals](#critical-paths) instead of prompting you. Approved commands run, and rejected ones are blocked. … **Auto mode not available, or `useAutoModeDuringPlan` off**: commands outside the [built-in read-only set](https://code.claude.com/docs/en/permissions.md#read-only-commands) prompt for approval'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: plan-od-razu-do-kodu-zly-problem
    tresc: Gdy Claude od razu przechodzi do pisania kodu, może powstać kod, który rozwiązuje nie ten problem; tryb planowania oddziela badanie od wykonania.
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: Letting Claude jump straight to coding can produce code that solves the wrong problem. Use [plan mode](https://code.claude.com/docs/en/permission-modes.md#analyze-before-you-edit-with-plan-mode) to separate exploration from execution.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: plan-kiedy-najbardziej-przydatny
    tresc: Planowanie przydaje się najbardziej, gdy nie masz pewności co do podejścia, gdy zmiana obejmuje wiele plików albo gdy nie znasz kodu, który ma się zmienić; jeśli zmianę potrafisz opisać jednym zdaniem, pomiń plan.
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: Planning is most useful when you're uncertain about the approach, when the change modifies multiple files, or when you're unfamiliar with the code being modified. If you could describe the diff in one sentence, skip the plan.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: plan-cztery-fazy-pracy
    tresc: 'Dokumentacja zaleca pracę w czterech fazach: badanie (Explore), plan (Plan), wykonanie (Implement) i zapis zmian w repozytorium (Commit).'
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'The recommended workflow has four phases: … **1. Explore** … **2. Plan** … **3. Implement** … **4. Commit**'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: plan-terminal-shift-tab-az-do-plan-mode-on
    tresc: W terminalu tryb planowania włączasz, naciskając Shift+Tab, aż pasek stanu pokaże ⏸ plan mode on (albo zaczynasz sesję poleceniem claude --permission-mode plan); Claude czyta wtedy pliki i odpowiada na pytania, niczego nie zmieniając.
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: Enter plan mode by pressing `Shift+Tab` until the status bar shows `⏸ plan mode on`, or start the session with `claude --permission-mode plan`. Claude reads files and answers questions without making changes.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: plan-wyjscie-zatwierdzenie-albo-shift-tab
    tresc: Z trybu planowania wychodzisz, zatwierdzając plan albo naciskając Shift+Tab; potem Claude pisze kod i sprawdza go względem planu.
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: Switch out of plan mode by approving the plan or pressing `Shift+Tab`, then let Claude code, verifying against its plan.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: aplikacja-panele-zakladki-code
    tresc: 'Zakładka Code składa się z paneli, które układasz dowolnie: rozmowa, widok zmian, przeglądarka, terminal, plik, plan, zadania i subagent (na macOS także symulator iOS).'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'The Code tab is built around panes you can arrange in any layout: chat, diff, browser, terminal, file, plan, tasks, and subagent, along with the [iOS Simulator](https://code.claude.com/docs/en/desktop-ios-simulator.md) on macOS.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

