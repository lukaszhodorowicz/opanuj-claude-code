  - id: subagent-plik-pominiety-bez-komunikatu
    tresc: "Plik w folderze agents projektu albo użytkownika Claude Code pomija bez komunikatu w sesji, gdy w nagłówku brakuje name, gdy otwierająca linia --- nie jest pierwszą linią pliku albo gdy jest name, ale brakuje description. Pomija go też, gdy YAML nagłówka się nie parsuje: wtedy nie czyta z pliku żadnych pól, a błąd zapisuje w dzienniku debugowania."
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'Claude Code skips a file in a project, user, or managed `agents` directory, or in one under a directory you add with `--add-dir`, without reporting it in the session, when the frontmatter has any of these problems: … * **No `name`**: … * **An opening `---` that isn''t the file''s first line**: … * **A `name` but no `description`**: … * **YAML that doesn''t parse**: Claude Code reads no fields from the file, skips it, and writes the parse error to the debug log.'
    sprawdzono: '2026-10-26'
