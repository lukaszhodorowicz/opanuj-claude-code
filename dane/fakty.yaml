  - id: aplikacja-sesja-obok-split-view
    tresc: 'Drugą sesję otworzysz obok bieżącej: przytrzymaj Option na macOS albo Alt na Windows i kliknij sesję w pasku bocznym albo kliknij ją prawym przyciskiem i wybierz Open in, potem Split view.'
