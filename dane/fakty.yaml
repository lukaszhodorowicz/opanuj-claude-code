    tresc: "W aplikacji panel przesuwasz, przeciągając go za nagłówek, a rozmiar panelu zmieniasz, przeciągając jego krawędź."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Drag a pane by its header to reposition it, or drag a pane edge to resize it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-skrot-ctrl-backslash-zamyka-aktywny-panel
    tresc: 'W aplikacji skrót Cmd+\ na macOS albo Ctrl+\ na Windows zamyka aktywny panel.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Press **Cmd+\\** on macOS or **Ctrl+\\** on Windows to close the focused pane.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-waskie-okno-przyciski-paneli-w-menu
    tresc: "W aplikacji, gdy okno jest wąskie, przyciski paneli z paska tytułu, które się nie mieszczą, przechodzą do menu ⋮ obok przycisków."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'If the pane you want has no button in the title bar, select it from the **⋮** menu beside the buttons: … **When the window is narrow**: buttons that don''t fit move into the menu'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-panel-wyjmujesz-do-osobnego-okna-i-przypinasz-z-powrotem
    tresc: "W aplikacji, żeby pracować na kilku ekranach, możesz wyjąć panel, na przykład widok zmian albo terminal, do osobnego okna i przypiąć go z powrotem. Claude pracuje dalej w głównym oknie."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'To work across screens, pop a pane such as the diff or terminal out into its own window, and dock it back when you''re done. Claude keeps working in the main window.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-uklad-paneli-i-edytor-pliku-wymagaja-wersji-1-2581-0
    tresc: "Układ paneli, terminal, edytor pliku i tryby widoku w aplikacji wymagają Claude Desktop w wersji 1.2581.0 lub nowszej; aktualizację sprawdzasz w menu Claude > Check for Updates… na macOS albo Help > Check for Updates… na Windows."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'The pane layout, terminal, file editor, and view modes in this section require Claude Desktop v1.2581.0 or later. Open **Claude > Check for Updates…** on macOS or **Help > Check for Updates…** on Windows to update.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-sesja-lokalna-pliki-z-folderu-edytujesz-w-panelu-pliku
    tresc: "W aplikacji, w sesji lokalnej, pliki z folderu roboczego sesji edytujesz sam w panelu pliku; niektóre pliki tylko do odczytu zmieniasz, otwierając je w innym programie."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'To edit a file yourself, use the [file pane](#arrange-your-workspace): … **Local sessions**: you can edit files inside the session''s working directory, except some view-only ones such as `.mcp.json` and `.claude/settings.json`. To change one, [open it in another app](#open-files-in-other-apps).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-sesje-cloud-ssh-wsl-panel-pliku-tylko-do-odczytu
    tresc: "W aplikacji w sesjach Cloud, SSH i WSL panel pliku jest tylko do odczytu, więc zmiany zlecasz Claude."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**Cloud, SSH, and WSL sessions**: the file pane is view-only, so ask Claude to make edits.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-panel-pliku-zapisuje-zmiany-sam-bez-przycisku-save
    tresc: "W aplikacji zmiany, które wprowadzasz w panelu pliku, domyślnie zapisują się same, więc panel nie ma przycisku Save."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'By default, your edits in the file pane save on their own, so the pane shows no **Save** button.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-panel-pliku-auto-save-wylaczony-save-i-cancel
    tresc: "W aplikacji, żeby zapisywać zmiany w panelu pliku samodzielnie, odznaczasz Auto save w menu ⋮ panelu; wtedy po zmianie pliku klikasz Save, żeby zapisać zmiany, albo Cancel, żeby je odrzucić."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'To save your edits yourself, uncheck **Auto save** in the pane''s **⋮** menu. With **Auto save** off, click **Save** after you change a file to write your edits, or **Cancel** to revert them.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-panel-pliku-plik-zmienil-sie-na-dysku-override-i-discard
    tresc: "W aplikacji, gdy panel pliku ostrzega, że plik zmienił się na dysku, Override nadpisuje wersję z dysku Twoimi zmianami, a Discard porzuca Twoje zmiany."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'If the pane warns that the file changed on disk, click **Override** to write your edits over the version on disk, or **Discard** to drop your edits.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-prawy-klik-na-sciezce-pliku-otwiera-menu
    tresc: "W aplikacji kliknięcie prawym przyciskiem myszy ścieżki pliku w rozmowie, w widoku zmian albo w panelu pliku otwiera menu kontekstowe."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Right-click any file path in the chat, diff viewer, or file pane to open a context menu:'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-menu-sciezki-attach-as-context-dodaje-plik-do-nastepnej-prosby
    tresc: "W menu kontekstowym ścieżki pliku pozycja Attach as context dodaje plik do Twojej następnej prośby."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Right-click any file path in the chat, diff viewer, or file pane to open a context menu: … **Attach as context**: add the file to your next prompt'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-menu-sciezki-show-in-finder-i-explorer-otwieraja-folder-z-plikiem
    tresc: "W menu kontekstowym ścieżki pliku pozycja Show in Finder na macOS albo Show in Explorer na Windows otwiera folder z tym plikiem."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Right-click any file path in the chat, diff viewer, or file pane to open a context menu: … **Show in Finder** on macOS, **Show in Explorer** on Windows: open the containing folder'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-browser-tools-wylaczaja-panel-browser
    tresc: "W aplikacji panel Browser wyłączasz całkiem, wyłączając Browser tools w Settings > Claude Code."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'To turn the Browser off entirely, turn off **Browser tools** in **Settings > Claude Code**.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-blokada-stron-zewnetrznych-nie-wylacza-podgladu-plikow
    tresc: "Gdy organizacja ustawieniem zarządzanym blokuje w panelu Browser całą nawigację na strony zewnętrzne, podgląd plików i lokalne serwery deweloperskie dalej działają."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Restrict external browsing for your organization … To turn off external browsing entirely, set the [`disableBrowserExternalNavigation` managed setting](#managed-settings) to `true`. This blocks all external navigation in the Browser, including sites on your organization''s allowlist; localhost dev servers and file previews keep working.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-przycisk-plus-sluzy-do-zalacznikow-skilli-konektorow-i-wtyczek
    tresc: "W aplikacji przycisk + obok pola wiadomości służy do załączników, skilli, konektorów i wtyczek."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Click the **+** button next to the prompt box for file attachments, [skills](#use-skills), [connectors](#connect-external-tools), and [plugins](#install-plugins).'
