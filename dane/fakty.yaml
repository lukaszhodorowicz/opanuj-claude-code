fakty:
  - id: plan-platny
    tresc: "Claude Code wymaga płatnego planu: Pro, Max, Team albo Enterprise."
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    sprawdzono: 2026-10-23
    wersja: "2.1.309"

  - id: aplikacja-bez-terminala
    tresc: "Aplikacja Claude na komputer ma Claude Code w zakładce Code. Możesz prosić Claude o pracę nad kodem w folderze na komputerze i przeglądać jego zmiany bez terminala. Na Linuksie (wersja beta, Ubuntu i Debian) aplikację instaluje się przez apt albo z pliku .deb."
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    sprawdzono: 2026-10-26
    wersja: "2.1.310"
    cytat: "You can ask Claude to work on the code in a folder on your computer and review its changes without using a terminal. Claude Code is in the **Code** tab at the top of the app's sidebar. […] Get Claude for Linux (beta) […] apt or .deb for Ubuntu and Debian […] On Linux, install with apt"

  - id: aplikacja-zawiera-claude-code-bez-nodejs-i-cli
    tresc: Aplikacja Claude na komputer zawiera Claude Code, więc do zakładki Code nie trzeba instalować Node.js ani Claude Code do terminala (CLI).
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    sprawdzono: 2026-10-26
    wersja: "2.1.309"
    cytat: The desktop app includes Claude Code, so you don't need to install Node.js or the CLI to use the Code tab.

  - id: skill-czym-jest
    tresc: "Skill to plik SKILL.md z instrukcjami. Claude używa go sam, gdy pasuje do zadania, albo gdy wpiszesz jego nazwę po ukośniku."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'Create a `SKILL.md` file with instructions, and Claude adds it to its toolkit. Claude uses skills when relevant, or you can invoke one directly with `/skill-name`.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: skill-kiedy-tworzyc
    tresc: "Skill warto zrobić, gdy w kółko wklejasz do rozmowy te same instrukcje, listę kontrolną albo procedurę z kilku kroków."
    zrodlo: https://code.claude.com/docs/en/skills.md
    sprawdzono: 2026-10-23
    wersja: "2.1.309"

  - id: skill-laduje-sie-przy-uzyciu
    tresc: "Claude ma w kontekście listę nazw i opisów skilli. Pełna treść skilla trafia do rozmowy dopiero wtedy, gdy skill zostaje uruchomiony."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'Claude Code loads a listing of skill names and descriptions into context so Claude knows what''s available. [...] full skill content only loads when invoked.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: skill-opisy-na-starcie-tresc-przy-uzyciu
    tresc: "Domyślnie opisy skilli wczytują się na początku sesji, a pełna treść skilla dopiero wtedy, gdy zostaje użyty."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: 'By default, descriptions load at session start and full content loads when used.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-opis-decyduje
    tresc: "Po opisie skilla (pole description) Claude decyduje, kiedy sam go użyje."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'What the skill does and when to use it. Claude uses this to decide when to apply the skill.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: skill-uruchomienie-ukosnik
    tresc: "Skill uruchamia się od razu, gdy jego nazwa z ukośnikiem stoi na początku wiadomości. Ta sama nazwa dalej w wiadomości, jako osobne słowo bez przylegającego znaku interpunkcyjnego, niczego nie uruchamia, tylko pozwala Claude go użyć."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'To run a skill directly, put its name at the start of your message. After plain text, the name gives Claude permission to run the skill but doesn''t run it: | After plain text, as a separate word with no punctuation attached | `go ahead and /deploy to staging` | Nothing runs directly. The name counts as your permission for that message: Claude can run the skill while it responds, and judges from your wording whether you asked it to |'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: skill-aplikacja-menu
    tresc: "W aplikacji na komputer listę skilli otwierasz, wpisując / w polu wiadomości albo klikając + i wybierając Slash commands. Lista obejmuje też wbudowane polecenia, Twoje skille, skille projektu i skille z zainstalowanych wtyczek; wybrane polecenie albo skill pojawia się w polu wiadomości podświetlone, a zadanie wpisujesz po nim i wysyłasz jak zwykle."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'type `/` in the prompt box or click the **+** button and select **Slash commands** to browse what''s available. This includes [built-in commands](https://code.claude.com/docs/en/commands.md), your [custom skills](https://code.claude.com/docs/en/skills.md#create-your-first-skill), project skills from your codebase, and skills from any [installed plugins](https://code.claude.com/docs/en/plugins/install.md). Select one and it appears highlighted in the input field. Type your task after it and send as usual.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-osobisty-katalog
    tresc: "Skill osobisty leży w katalogu ~/.claude/skills/<nazwa>/SKILL.md i działa we wszystkich Twoich projektach na tym komputerze."
    zrodlo: https://code.claude.com/docs/en/skills.md
    sprawdzono: 2026-10-23
    wersja: "2.1.309"

  - id: katalog-domowy-windows
    tresc: "Na Windowsie katalog ~/.claude to %USERPROFILE%\\.claude, czyli folder .claude w Twoim folderze użytkownika."
    zrodlo: https://code.claude.com/docs/en/claude-directory.md
    sprawdzono: 2026-10-23
    wersja: "2.1.309"

  - id: skill-zapis-chroniony
    tresc: "Katalog ~/.claude jest chroniony: w trybach Manual i Accept edits Claude pyta o zgodę na zapis w nim, poza kilkoma wyjątkami."
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'Writes to a small set of paths are never auto-approved [...] | `default`, `acceptEdits` | Prompted | [...] Protected directories: [...] `.claude`, with a few exceptions, such as:'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: skill-cowork-chmura
    tresc: "Cowork i sesje w chmurze nie czytają skilli z Twojego komputera. Korzystają ze skilli włączonych na koncie claude.ai, którymi zarządzasz przez Customize w aplikacji."
    zrodlo: https://code.claude.com/docs/en/skills.md
    sprawdzono: 2026-10-23
    wersja: "2.1.309"

  - id: skill-zaplanowane-lokalnie
    tresc: "Zadania zaplanowane w aplikacji na komputer działają na Twoim komputerze, więc widzą skille z ~/.claude/skills/."
    zrodlo: https://code.claude.com/docs/en/skills.md
    sprawdzono: 2026-10-23
    wersja: "2.1.309"

  - id: skill-szesc-pol
    tresc: "Skill wgrywany na claude.ai może mieć w nagłówku tylko sześć pól: name, description, license, compatibility, metadata i allowed-tools. Inne pole kończy wgrywanie błędem."
    zrodlo: https://code.claude.com/docs/en/skills.md
    sprawdzono: 2026-10-23
    wersja: "2.1.309"

  - id: skill-nazwa-zasady
    tresc: "Nazwa skilla ma od 1 do 64 znaków: małe litery, cyfry i myślniki, bez myślnika na początku, na końcu i dwóch pod rząd. Musi być taka sama jak nazwa katalogu."
    zrodlo: https://agentskills.io/specification.md
    sprawdzono: 2026-10-23
    wersja: "2.1.309"

  - id: skill-opis-limit
    tresc: "Opis skilla ma od 1 do 1024 znaków."
    zrodlo: https://agentskills.io/specification.md
    sprawdzono: 2026-10-23
    wersja: "2.1.309"

  - id: skill-naglowek-pierwsza-linia
    tresc: "Nagłówek skilla stoi między dwiema liniami ---, a pierwsza z nich musi być pierwszą linią pliku. Inaczej Claude Code czyta cały plik jako treść."
    zrodlo: https://code.claude.com/docs/en/skills.md
    sprawdzono: 2026-10-23
    wersja: "2.1.309"

  - id: skill-500-linii
    tresc: "Plik SKILL.md trzymaj poniżej 500 linii, a dłuższe materiały przenieś do osobnych plików w katalogu skilla."
    zrodlo: https://code.claude.com/docs/en/skills.md
    sprawdzono: 2026-10-23
    wersja: "2.1.309"

  - id: skill-pliki-pomocnicze
    tresc: "W katalogu skilla mogą leżeć dodatkowe pliki, na przykład wzory i przykłady. Claude czyta je dopiero, gdy są potrzebne, jeśli SKILL.md mówi, co w nich jest."
    zrodlo: https://code.claude.com/docs/en/skills.md
    sprawdzono: 2026-10-23
    wersja: "2.1.309"

  - id: skill-najwazniejsze-na-gorze
    tresc: "Treść uruchomionego skilla zostaje w rozmowie, a Claude nie czyta pliku ponownie. Po skróceniu długiej rozmowy może zostać tylko początek skilla, więc najważniejsze polecenia pisz na górze."
    zrodlo: https://code.claude.com/docs/en/skills.md
    sprawdzono: 2026-10-23
    wersja: "2.1.309"

  - id: skill-nie-dziala
    tresc: "Gdy Claude nie używa skilla, sprawdź, czy opis zawiera słowa, których naturalnie używasz, zapytaj Claude, jakie skille są dostępne, albo uruchom go wprost przez /nazwa."
    zrodlo: https://code.claude.com/docs/en/skills.md
    sprawdzono: 2026-10-23
    wersja: "2.1.309"

  - id: skill-standard-otwarty
    tresc: "Skille w Claude Code działają według otwartego standardu Agent Skills, z którego korzystają też inne narzędzia AI."
    zrodlo: https://code.claude.com/docs/en/skills.md
    sprawdzono: 2026-10-23
    wersja: "2.1.309"

  - id: skill-wbudowane
    tresc: "Na koncie claude.ai są też gotowe skille Anthropic, na przykład pdf i xlsx."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'Those skills include the ones you create or turn on in your claude.ai settings, skills your organization provides there, and Anthropic''s built-in skills such as `pdf` and `xlsx`.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  # Moduł 1: Tryby pracy (sprawdzone przez filtr-prawdy 2026-10-23)
  - id: tryb-manual-pyta-przed-akcjami
    tresc: W trybie Manual Claude Code zatrzymuje się i pyta przed większością działań, które edytują pliki, uruchamiają polecenia powłoki albo sięgają do sieci.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: In Manual mode, Claude Code stops and asks you before most actions that edit files, run shell commands, or reach the network.

  - id: tryb-manual-bez-pytania-tylko-odczyt
    tresc: W trybie Manual (wartość default) Claude bez pytania o zgodę wykonuje tylko odczyty w folderze roboczym.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: '| `default` | Reads only | Reviewing every action yourself, sensitive work |'

  - id: okno-zgody-cztery-opcje-polecenia
    tresc: 'Przykładowe okno zgody na polecenie ma cztery opcje: Yes, „Yes, and don''t ask again for…”, „Yes, and switch to auto mode” oraz No.'
    zrodlo: https://code.claude.com/docs/en/permissions.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: 'then asks ''Do you want to proceed?'' with four options: Yes; Yes, and don''t ask again for: npm test \*; Yes, and switch to auto mode; and No.'

  - id: okno-zgody-tab-otwiera-komentarz
    tresc: W terminalu w większości okien zgody zaznaczasz Yes albo No i naciskasz Tab, żeby dopisać komentarz do swojej odpowiedzi.
    zrodlo: https://code.claude.com/docs/en/permissions.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: On most permission prompts, including Bash, PowerShell, file, and MCP tool prompts, move to **Yes** or **No** and press `Tab` to open a comment field on that option.

  - id: okno-zgody-no-z-komentarzem-powod
    tresc: Komentarz przy odpowiedzi No trafia do Claude jako powód odmowy, a Claude pracuje dalej.
    zrodlo: https://code.claude.com/docs/en/permissions.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: '**No**: Claude Code sends your comment to Claude as the reason for the denial, and Claude continues working.'

  - id: accept-edits-edycje-w-folderze-bez-pytania
    tresc: W trybie Accept edits (wartość acceptEdits) Claude tworzy i edytuje pliki w folderze roboczym bez pytania.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '`acceptEdits` mode lets Claude create and edit files in your working directory without prompting.'

  - id: accept-edits-polecenia-na-plikach
    tresc: 'Accept edits zatwierdza sam także typowe polecenia na plikach: mkdir, touch, rm, rmdir, mv, cp i sed, ale tylko dla ścieżek w folderze roboczym albo w dodatkowych folderach.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'In addition to file edits, `acceptEdits` mode auto-approves common filesystem Bash commands: `mkdir`, `touch`, `rm`, `rmdir`, `mv`, `cp`, and `sed`. … Like file edits, auto-approval applies only to paths inside your working directory or `additionalDirectories`.'

  - id: accept-edits-tylko-w-zakresie-folderu
    tresc: Automatyczna zgoda w trybie Accept edits dotyczy tylko ścieżek w folderze roboczym albo w dodatkowych folderach (additionalDirectories).
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: Like file edits, auto-approval applies only to paths inside your working directory or `additionalDirectories`.
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    sprawdzone_przez: filtr-prawdy 2026-10-23

  - id: accept-edits-sciezki-chronione-pytaja
    tresc: W trybach Manual i Accept edits zapis do ścieżek chronionych wymaga Twojej zgody.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: '| `default`, `acceptEdits` | Prompted |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    sprawdzone_przez: filtr-prawdy 2026-10-23

  - id: accept-edits-nadal-pytaja
    tresc: 'W trybie acceptEdits nadal pytają: ścieżki poza folderem roboczym i folderami dodatkowymi, zapisy do ścieżek chronionych, rozpoznane kasowanie ścieżek krytycznych poleceniami rm i rmdir oraz wszystkie inne polecenia Bash poza wbudowanym zestawem poleceń tylko do odczytu.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'Like file edits, auto-approval applies only to paths inside your working directory or `additionalDirectories`. … These still prompt: … Paths outside that scope … Writes to [protected paths](#protected-paths) … Recognized `rm` and `rmdir` [critical-path removals](#critical-paths) … All other Bash commands except the [built-in read-only set](https://code.claude.com/docs/en/permissions.md#read-only-commands)'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: accept-edits-przeglad-po-fakcie
    tresc: Dokumentacja radzi używać acceptEdits, gdy chcesz przejrzeć zmiany po fakcie, w edytorze albo przez git diff, zamiast zatwierdzać każdą edycję na bieżąco.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: Use `acceptEdits` when you want to review changes in your editor or via `git diff` after the fact rather than approving each edit inline.
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: sciezki-chronione-czym-sa
    tresc: 'Zapisy do niewielkiego zestawu ścieżek chronionych, m.in. folderów .git i .claude (z kilkoma wyjątkami), nie są zatwierdzane automatycznie, poza trybem bypassPermissions i trybem Plan w terminalu z dostępnym bypass permissions. Chroni to przed przypadkowym uszkodzeniem stanu repozytorium i własnej konfiguracji Claude.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'Writes to a small set of paths are never auto-approved, except in `bypassPermissions` mode and in interactive terminal sessions in plan mode with [bypass permissions](#skip-all-checks-with-bypasspermissions-mode) available. This prevents accidental corruption of repository state and Claude''s own configuration. … Protected directories: … `.git` … `.claude`, with a few exceptions, such as:'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: sciezki-krytyczne-rm-pyta-w-manual-i-accept-edits
    tresc: 'Ścieżki krytyczne to foldery, które Claude Code chroni przed poleceniami rm i rmdir, np. katalog główny systemu plików, folder domowy i folder roboczy. Rozpoznane polecenie rm albo rmdir na takiej ścieżce w trybach Manual i Accept edits czeka na Twoją zgodę.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'Critical paths are the directories Claude Code protects from `rm` and `rmdir` commands, such as the filesystem root, your home directory, and your working directory. … A critical-path removal is an `rm` or `rmdir` command whose target Claude Code recognizes as a critical path. … | `default`, `acceptEdits` | Asks you to approve it |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: sciezki-krytyczne-sprawdzenie-moze-przeoczyc
    tresc: Sprawdzenie ścieżek krytycznych może przeoczyć niektóre polecenia, więc nie zastępuje zabezpieczeń systemu operacyjnego, takich jak piaskownica (sandboxing).
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'The check can miss some commands, so it doesn''t replace an operating-system control such as [sandboxing](https://code.claude.com/docs/en/sandboxing.md).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: sciezki-krytyczne-sprawdzenie-tylko-rm-i-rmdir
    tresc: Sprawdzenie ścieżek krytycznych dotyczy tylko poleceń rm i rmdir, więc inne zatwierdzone polecenia też mogą skasować ścieżki krytyczne.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: The check applies to `rm` and `rmdir`, so other approved commands can delete critical paths too.
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: manual-po-dziesiatej-zgodzie-klikasz
    tresc: 'W trybie Manual Claude Code pyta przed działaniami, które mogą zmienić system (zapis plików, polecenia Bash, narzędzia MCP). To bezpieczne, ale męczące: po dziesiątej zgodzie klikasz, zamiast przeglądać.'
    zrodlo: https://code.claude.com/docs/en/best-practices.md
    cytat: 'In Manual mode, Claude Code asks before actions that might modify your system: file writes, Bash commands, MCP tools. That''s safe but tedious. After the tenth approval you''re clicking through rather than reviewing.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: folder-roboczy-to-folder-uruchomienia
    tresc: Domyślnie Claude ma dostęp do plików w folderze, w którym go uruchomiono; ten folder jest głównym folderem roboczym sesji.
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: 'By default, Claude has access to files in the directory where you launched it. That directory is the session''s primary working directory'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: foldery-dodatkowe-te-same-zasady
    tresc: 'Pliki w folderach dodatkowych podlegają tym samym zasadom uprawnień co pierwotny folder roboczy: Claude czyta je bez pytania (poza sprawdzeniem ścieżek sieciowych), a zgody na edycję zależą od bieżącego trybu uprawnień.'
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: 'Files in additional directories follow the same permission rules as the original working directory: they become readable without prompts apart from the [network path](#network-paths) check, and file editing permissions follow the current permission mode.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: cofanie-nie-obejmuje-plikow-zmienionych-tylko-przez-bash
    tresc: 'Plik, który zmieniały wyłącznie polecenia Bash, nie jest śledzony i po /rewind zostaje taki, jaki jest; cofniesz go kontrolą wersji, np. Gitem. Jeśli Claude wcześniej edytował plik swoimi narzędziami do edycji, /rewind cofa też późniejsze zmiany z poleceń Bash.'
    zrodlo: https://code.claude.com/docs/en/checkpointing.md
    cytat: 'Once Claude has edited a file with its file editing tools in your conversation, `/rewind` undoes changes that Bash commands make to that file afterward. A file that only Bash commands changed isn''t tracked and stays as it is. To revert it, use version control, such as Git.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: tryb-plan-nie-zmienia-plikow
    tresc: W trybie Plan Claude bada projekt i proponuje zmiany, ale ich nie wprowadza.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: Plan mode tells Claude to research and propose changes without making them.

  - id: tryb-plan-wlaczenie-shift-tab-lub-plan
    tresc: W terminalu tryb planowania włączysz klawiszami Shift+Tab albo poprzedzając pojedynczą wiadomość poleceniem /plan.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: Enter plan mode by pressing `Shift+Tab` or prefixing a single prompt with `/plan`.

  - id: plan-opcja-no-keep-planning
    tresc: Opcja „No, keep planning” zostawia Cię w trybie planowania, a Ty piszesz Claude, co zmienić.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: '**No, keep planning**: stay in plan mode and tell Claude what to change.'

  - id: plan-zatwierdzenie-wychodzi-z-trybu-planowania
    tresc: Zatwierdzenie planu kończy tryb planowania i przełącza sesję na tryb z wybranej opcji, więc Claude zaczyna edytować.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: Approving a plan exits plan mode and switches the session to the permission mode each approve option describes, so Claude starts editing.

  - id: plan-aplikacja-opis
    tresc: 'W aplikacji na komputer tryb Plan: Claude czyta pliki i uruchamia polecenia badające, a potem proponuje plan bez edytowania kodu.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: Claude reads files and runs commands to explore, then proposes a plan without editing your source code.

  - id: plan-aplikacja-porada-po-zatwierdzeniu
    tresc: 'Dokumentacja radzi: złożone zadania zaczynaj w trybie Plan, a po zatwierdzeniu planu przełącz się na Accept edits albo Manual.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: Start complex tasks in Plan so Claude maps out an approach before making changes. Once you approve the plan, switch to Accept edits or Manual to execute it.

  - id: plan-aplikacja-tylko-biezaca-sesja
    tresc: W aplikacji wybór trybu Plan obowiązuje tylko w bieżącej sesji, a pozostałe tryby aplikacja zapamiętuje dla folderu.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: A mode you pick in the selector is remembered per folder and takes precedence over `defaultMode` for that folder, except Plan, which applies to the current session only.

  - id: pasek-napisy-trybow
    tresc: 'Pasek stanu w CLI pokazuje tryb m.in. napisami: ⏸ manual mode on, ⏵⏵ accept edits on, ⏸ plan mode on, ⏵⏵ auto mode on.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: The status bar shows the active mode as a gray `⏸ manual mode on` for `default`, or as `⏵⏵ accept edits on`, `⏸ plan mode on`, `⏵⏵ auto mode on`, `⏵⏵ don't ask on`, or `⏵⏵ bypass permissions on`.

  - id: cykl-shift-tab-od-auto
    tresc: W terminalu, w sesji w trybie auto, kolejne naciśnięcia Shift+Tab przechodzą przez manual, accept edits i plan, a potem wracają do auto. Włączony bypass permissions pojawia się w cyklu przed auto.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: Each time you press `Shift+Tab`, it changes from `auto mode on` to `manual mode on`, `accept edits on`, `plan mode on`, and back to `auto mode on`.

  - id: cykl-aplikacja-brak-shift-tab
    tresc: W aplikacji na komputer Shift+Tab nie przełącza trybów uprawnień tak jak w terminalu.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'In Desktop, `Shift+Tab` doesn''t cycle permission modes as it does in the terminal''s [interactive mode](https://code.claude.com/docs/en/interactive-mode.md#keyboard-shortcuts).'
  - id: aplikacja-skrot-menu-trybu
    tresc: Na macOS w zakładce Code skrót Cmd+Shift+M otwiera menu trybu uprawnień.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: '| `Cmd` `Shift` `M` | Open permission mode menu |'

  - id: auto-klasyfikator-ocenia-przed-wykonaniem
    tresc: W trybie auto osobny model, klasyfikator, ocenia działania przed wykonaniem i blokuje te, które wykraczają poza Twoją prośbę.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: A separate classifier model reviews actions before they run, blocking anything that escalates beyond your request, targets unrecognized infrastructure, or appears driven by hostile content Claude read.

  - id: auto-nie-gwarantuje-bezpieczenstwa
    tresc: Tryb auto zmniejsza liczbę pytań o zgodę, ale nie gwarantuje bezpieczeństwa. Używaj go do zadań, których ogólnemu kierunkowi ufasz, a nie zamiast przeglądu operacji wrażliwych.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: Auto mode reduces permission prompts but does not guarantee safety. Use it for tasks where you trust the general direction, not as a replacement for review on sensitive operations.

  - id: aplikacja-przelacznik-pod-polem-wiadomosci
    tresc: W aplikacji na komputer (zakładka Code) tryb uprawnień zmieniasz w dowolnej chwili selektorem trybu w rzędzie pod polem wiadomości.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: You can switch permission modes at any time using the mode selector in the row under the prompt box.

  - id: aplikacja-tryb-wybierasz-w-przelaczniku
    tresc: W aplikacji na komputer tryb uprawnień wybierasz w selektorze trybu; tryb wybrany w selektorze aplikacja zapamiętuje dla folderu (poza trybem Plan, który obowiązuje tylko w bieżącej sesji).
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: 'use the [mode selector](#choose-a-permission-mode) to choose how much autonomy Claude has. … A mode you pick in the selector is remembered per folder and takes precedence over `defaultMode` for that folder, except Plan, which applies to the current session only.'

  - id: aplikacja-dostepne-tryby
    tresc: W aplikacji na komputer są tryby Manual, Accept edits, Plan i Auto. Auto pojawia się, gdy tryb auto jest dostępny, a Bypass permissions dopiero po włączeniu.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Manual, Accept edits, Plan, and Auto. Bypass permissions appears in the mode selector once enabled … Appears when [auto mode is available](#auto-mode-availability)'

  - id: tryb-manual-aplikacja-czeka-na-zatwierdzenie
    tresc: W aplikacji na komputer w trybie Manual Claude proponuje każdą zmianę i czeka na Twoje zatwierdzenie, zanim ją zastosuje.
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    cytat: '**Manual**: Claude proposes each change and waits for your approval before applying it'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    sprawdzone_przez: filtr-prawdy 2026-10-23

  - id: tryb-manual-nazwa-i-wartosc-default
    tresc: Tryb, który sprawdza każde działanie, nazywa się Manual w aplikacji na komputer, a w ustawieniach ma wartość default.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: The mode that reviews every action is named **Manual** in the CLI, in `claude --help`, in the VS Code and JetBrains extensions, and in the desktop app. Its config value is `default`
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    sprawdzone_przez: filtr-prawdy 2026-10-23

  - id: uprawnienia-egzekwuje-program-nie-model
    tresc: Zasady uprawnień egzekwuje Claude Code, nie model, więc polecenia w prompcie nie zmieniają tego, na co program pozwala.
    zrodlo: https://code.claude.com/docs/en/permissions.md
    cytat: Permission rules are enforced by Claude Code, not by the model. Instructions in your prompt or `CLAUDE.md` shape what Claude tries to do, but they don't change what Claude Code allows.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    sprawdzone_przez: filtr-prawdy 2026-10-23

  - id: aplikacja-manual-podglad-i-przyciski
    tresc: 'W aplikacji na komputer w trybie Manual Claude pyta przed edycją plików i uruchamianiem poleceń, a Ty widzisz podgląd zmiany i możesz przyjąć albo odrzucić każdą zmianę.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: 'Claude asks before editing files or running commands. You see a diff and can accept or reject each change.'

  - id: aplikacja-manual-przyciski-zatwierdzania
    tresc: 'W aplikacji na komputer w trybie Manual widzisz przyciski do zatwierdzenia lub odrzucenia każdej zmiany.'
    zrodlo: https://code.claude.com/docs/en/desktop-quickstart.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: 'Buttons to approve or decline each change'

  - id: auto-granice-z-rozmowy
    tresc: 'Granice podane w rozmowie, np. „nie wypychaj” albo „poczekaj z wdrożeniem, aż przejrzę”, klasyfikator traktuje jak sygnał blokady. Nie są zapisywane jako reguły i mogą zniknąć, gdy streszczenie rozmowy usunie wiadomość, w której je podałeś.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'The classifier treats boundaries you state in the conversation as a block signal. If you tell Claude "don''t push" or "wait until I review before deploying", the classifier blocks matching actions even when the default rules would allow them. … Boundaries are not stored as rules. The classifier re-reads them from the transcript on each check, so a boundary can be lost if [context compaction](https://code.claude.com/docs/en/costs.md#reduce-token-usage) removes the message that stated it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    sprawdzone_przez: filtr-prawdy 2026-10-23, poprawione

  - id: auto-wstrzymanie-po-blokadach
    tresc: Gdy klasyfikator zablokuje działanie 3 razy z rzędu albo 20 razy łącznie, tryb auto wstrzymuje się i Claude Code znów pyta.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: if the classifier blocks an action 3 times in a row or 20 times total, auto mode pauses and Claude Code resumes prompting.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    sprawdzone_przez: filtr-prawdy 2026-10-23

  - id: accept-edits-aplikacja-pyta-o-inne-polecenia
    tresc: W aplikacji na komputer Accept edits sam przyjmuje edycje plików i typowe polecenia na plikach, ale o inne polecenia terminala nadal pyta.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: Claude auto-accepts file edits and common filesystem commands like `mkdir`, `touch`, and `mv`, but still asks before running other terminal commands.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    sprawdzone_przez: filtr-prawdy 2026-10-23

  - id: accept-edits-aplikacja-kiedy-uzywac
    tresc: Dokumentacja radzi używać trybu Accept edits w aplikacji na komputer, gdy ufasz zmianom w plikach i chcesz szybciej iterować.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
    cytat: '| **Accept edits** | `acceptEdits` | … Use this when you trust file changes and want faster iteration. |'

  - id: accept-edits-aplikacja-to-accept-edits
    tresc: 'W aplikacji na komputer, w sesji lokalnej, tryb Accept edits ma w ustawieniach wartość acceptEdits. W sesji w chmurze Accept edits odpowiada trybowi default.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '| **Accept edits** | `acceptEdits` | … Cloud sessions support Accept edits, Plan, and Auto. Accept edits corresponds to `default` mode: cloud sessions pre-approve file edits, so the selector shows Accept edits instead of Manual.'
  - id: accept-edits-shift-tab-raz-z-manual
    tresc: W terminalu z trybu Manual do trybu acceptEdits przejdziesz jednym naciśnięciem Shift+Tab.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Switch permission modes with Shift+Tab in the CLI … Use `acceptEdits` when you want to review changes in your editor or via `git diff` after the fact rather than approving each edit inline. … Press `Shift+Tab` once from Manual mode to enter it'
  - id: accept-edits-odczyty-bez-pytania
    tresc: W trybie acceptEdits odczyty, edycje plików i typowe polecenia na plikach (mkdir, touch, mv, cp i podobne) idą bez pytania o zgodę.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '| Mode | What runs without asking | Best for | … | [`acceptEdits`](#auto-approve-file-edits-with-acceptedits-mode) | Reads, file edits, and common filesystem commands (`mkdir`, `touch`, `mv`, `cp`, etc.) | Iterating on code you''re reviewing |'
  - id: polecenia-tylko-do-odczytu-bez-pytania
    tresc: 'Claude Code ma wbudowany zestaw poleceń Bash, które uznaje za polecenia tylko do odczytu, m.in. ls. Zwykle uruchamia je bez okna zgody, w każdym trybie. Są wyjątki: w trybie Manual w kilku przypadkach pyta mimo to, w trybie auto takie polecenie może czekać na ocenę klasyfikatora, a reguła ask albo deny wymusza pytanie.'
    zrodlo: https://code.claude.com/docs/en/permissions.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Claude Code recognizes a built-in set of Bash commands as read-only and runs them without a permission prompt in every mode, except as [`permissions.blockReadsOutsideWorkingDirectories`](https://code.claude.com/docs/en/settings-reference#permissions-blockreadsoutsideworkingdirectories) changes for paths outside your working directories. The set includes `ls`, `cat`, `echo`, `pwd`, `head`, `tail`, `grep`, `find`, `wc`, `which`, `diff`, `stat`, `du`, `cd`, and read-only forms of `git`. The set is not configurable; to require a prompt for one of these commands, add an `ask` or `deny` rule for it. In auto mode, these commands can also wait for the classifier''s review; see [how the classifier evaluates actions](https://code.claude.com/docs/en/permission-modes.md#how-the-classifier-evaluates-actions). … In Manual mode, commands from this set still prompt in these cases:'
  - id: auto-aplikacja-opis-trybu
    tresc: W aplikacji na komputer tryb Auto działa bez rutynowych pytań; przed działaniami takimi jak polecenia powłoki i żądania sieciowe klasyfikator w tle sprawdza, czy zgadzają się z Twoją prośbą. Tryb pojawia się, gdy auto jest dostępne, i nie ma osobnego przełącznika w Ustawieniach.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: Claude runs without routine prompts; before actions such as shell commands and network requests run, a background classifier checks that they align with your request. Appears when [auto mode is available](#auto-mode-availability); there is no separate Settings toggle for it.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-granica-trwa-do-zdjecia-wiadomoscia
    tresc: W trybie auto granica podana w rozmowie obowiązuje, dopóki nie zdejmiesz jej kolejną wiadomością. Uznanie przez Claude, że warunek został spełniony, jej nie zdejmuje.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: A boundary stays in force until you lift it in a later message. Claude's own judgment that a condition was met does not lift it.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-odczyty-i-zmiany-w-folderze-bez-klasyfikatora
    tresc: W trybie auto odczyty i zmiany plików w folderze roboczym, poza ścieżkami chronionymi, pomijają klasyfikator.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: Reads and working-directory edits outside protected paths skip the classifier
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-claude-dostaje-powod-blokady
    tresc: Gdy klasyfikator zablokuje działanie, Claude dostaje powód. W większości sesji powód wskazuje dopasowaną regułę, na przykład [Data Exfiltration], a nie pisemne wyjaśnienie.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: If the classifier blocks, Claude receives the reason. In most sessions the reason names the rule the classifier matched, such as `[Data Exfiltration]`, rather than giving a written explanation
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-pierwszy-odczyt-spoza-folderu-pyta
    tresc: W trybie auto, gdy permissions.blockReadsOutsideWorkingDirectories jest wyłączone, odczyty plików (poza ścieżkami sieciowymi) idą bez pytania, także spoza folderów roboczych, ale przy pierwszym użyciu Read, Grep albo Glob na takiej ścieżce Claude Code pyta, czy zezwolić na odczyt. Dokumentacja nie wskazuje, że dotyczy to aplikacji. Pytanie nie pojawia się w uruchomieniach z -p ani w sesjach w tle; odczyty idą tam jak dotąd.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'While [`permissions.blockReadsOutsideWorkingDirectories`](https://code.claude.com/docs/en/settings-reference#permissions-blockreadsoutsideworkingdirectories) is off, file reads other than [reads from network paths](https://code.claude.com/docs/en/permissions.md#network-paths) run without a prompt in auto mode, including reads outside the [working directories](https://code.claude.com/docs/en/permissions.md#working-directories). The first time Claude uses the Read, Grep, or Glob tool on a path outside them, Claude Code asks whether to allow that read. … The prompt doesn''t appear in non-interactive `-p` runs or background sessions; reads there run as before.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: odczyt-spoza-folderu-claude-pracuje-dalej
    tresc: Niezależnie od odpowiedzi na pytanie o odczyt spoza folderu roboczego Claude pracuje dalej.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'Whatever you answer, Claude keeps working:'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: odczyt-spoza-folderu-yes-keep-allowing
    tresc: 'Odpowiedź „Yes, and keep allowing any reads outside the working directories”: odczyt się wykonuje, kolejne odczyty spoza folderów roboczych idą jak dotąd, a Claude Code zapisuje odpowiedź, żeby pytanie nie wracało.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: '**Yes, and keep allowing any reads outside the working directories**: the read runs, later reads outside the working directories run as before, and Claude Code records your answer so the prompt doesn''t appear again'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: odczyt-spoza-folderu-no-block-na-stale
    tresc: 'Po odpowiedzi „No, and block…” Claude Code ustawia w ustawieniach użytkownika permissions.blockReadsOutsideWorkingDirectories na true, więc narzędzia plikowe odmawiają takich odczytów w każdej kolejnej sesji i każdym trybie uprawnień. Dostęp do takiej ścieżki przywrócisz poleceniem /add-dir albo usuwając to ustawienie.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'and Claude Code sets [`permissions.blockReadsOutsideWorkingDirectories`](https://code.claude.com/docs/en/settings-reference#permissions-blockreadsoutsideworkingdirectories) to `true` in your user settings, which makes the file tools refuse such reads in every later session and every permission mode. To let Claude read such a path later, add its directory with `/add-dir` or remove the setting.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: odczyt-spoza-folderu-no-ask-again
    tresc: Odpowiedź „No, and ask again next time” odmawia tego odczytu, a kolejny odczyt spoza folderów roboczych znów wywoła pytanie.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: '**No, and ask again next time**: the read is refused, and the next read outside the working directories prompts again'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: odczyt-spoza-folderu-yes-ask-again
    tresc: Odpowiedź „Yes, but ask again next time” wykonuje odczyt, nic nie zapisuje, a kolejny odczyt spoza folderów roboczych znów wywoła pytanie.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: '**Yes, but ask again next time**: the read runs, nothing is saved, and the next read outside the working directories prompts again'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: okno-odczyt-spoza-folderu-tytul-i-pytanie-terminal
    tresc: W terminalu okno zgody na pierwszy odczyt spoza folderów roboczych w trybie auto ma tytuł „Read outside the working directories” i pytanie „Allow this read outside the working directories?”.
    zrodlo: program:claude-code-2.1.310
    cytat: 'Program: var He="Read outside the working directories",Ve="Allow this read outside the working directories?" … P=e.permissionResult.offersBlockOutsideReads … title:P?He:h,subtitle:C,question:P?{kind:"plain",text:Ve}:R'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: tryb-startowy-terminal-auto
    tresc: 'W interaktywnych sesjach w terminalu i w rozszerzeniu VS Code wbudowanym trybem startowym jest auto (od Claude Code 2.1.283), chyba że ustawienia wyłączają tryb auto, organizacja ma konfigurację HIPAA albo tryb auto jest niedostępny. Wtedy sesja startuje w Manual.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'The first row that matches your session applies. … | Any settings file sets `disableAutoMode` to `"disable"` | `default` | … | `claude -p` or the [Agent SDK](https://code.claude.com/docs/en/agent-sdk/permissions.md#permission-modes) | `default` | … | Your organization has the [HIPAA configuration](#hipaa-configuration) applied … | In a terminal or through the [VS Code extension](https://code.claude.com/docs/en/vs-code.md) | `auto` with Claude Code v2.1.283 or later; on earlier versions, `auto` on Pro, Max, or Team plans in sessions that [fetch feature flags](https://code.claude.com/docs/en/env-vars.md#features-that-need-feature-flag-fetching), and `default` otherwise | … When the flag, a settings file, or the built-in default selects `auto` but auto mode isn''t available to the session, Claude Code starts the session in Manual instead.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: tryb-startowy-manual-gdy-auto-niedostepne
    tresc: Gdy flaga, plik ustawień albo wbudowany tryb startowy wybierają auto, a auto jest dla sesji niedostępny, Claude Code uruchamia sesję w trybie Manual.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: "When the flag, a settings file, or the built-in default selects `auto` but auto mode isn't available to the session, Claude Code starts the session in Manual instead."
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-do-dlugich-zadan
    tresc: W tabeli trybów tryb auto przepuszcza bez pytania wszystko, z kontrolą bezpieczeństwa w tle, i jest wskazany do długich zadań i zmniejszenia zmęczenia pytaniami o zgodę.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: '| [`auto`](#eliminate-prompts-with-auto-mode) | Everything, with background safety checks | Long tasks, reducing prompt fatigue |'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-zacheca-do-pracy-bez-pytan-doprecyzowujacych
    tresc: Tryb auto zachęca też Claude, żeby pracował dalej bez zatrzymywania się na pytania doprecyzowujące; Claude nadal pyta, gdy Twoja prośba albo skill wprost na tym polega.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: Auto mode also nudges Claude to keep working without stopping for clarifying questions, though Claude still asks when your prompt or a skill explicitly relies on it.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-klasyfikator-ufa-folderowi-roboczemu
    tresc: Klasyfikator ufa Twojemu folderowi roboczemu i zdalnym repozytoriom ustawionym dla niego na początku sesji; wszystko inne traktuje jako zewnętrzne, dopóki nie skonfigurujesz zaufanej infrastruktury.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'The classifier trusts your working directory and the remotes that were configured for it when the session started. … and everything else is treated as external until you [configure trusted infrastructure](https://code.claude.com/docs/en/auto-mode-config.md).'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-blokuje-pobieranie-i-uruchamianie-kodu
    tresc: Klasyfikator domyślnie blokuje pobieranie i uruchamianie kodu, np. `curl | bash`.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'Downloading and executing code, like `curl | bash`'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-blokuje-wypisanie-danych-dostepowych
    tresc: Klasyfikator domyślnie blokuje wypisanie działających danych dostępowych albo tokenu do zapisu rozmowy lub do pliku.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: Printing a live credential or token into the transcript or a file
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-blokuje-kasowanie-w-tmp-wzorcem
    tresc: Klasyfikator domyślnie blokuje kasowanie plików w `/tmp`, `$TMPDIR` albo innym wspólnym folderze tymczasowym lub podręcznym według wzorca albo wieku plików zamiast po konkretnej, nazwanej ścieżce.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'Deleting files in `/tmp`, `$TMPDIR`, or another shared scratch or cache directory by wildcard, glob, or age filter rather than by a specific named path'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-blokuje-wrazliwe-szczegoly-do-innych
    tresc: Klasyfikator domyślnie blokuje umieszczanie wrażliwych szczegółów w treści wysyłanej, przesyłanej, publikowanej albo pisanej do innych ludzi lub współdzielonych systemów, gdy Twoja wiadomość nie pozwoliła na te szczegóły dla tego odbiorcy.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: Including sensitive details in content sent, uploaded, published, or written to other people or shared systems, when your own message didn't authorize those details for that recipient.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-przepuszcza-odczyt-http
    tresc: Klasyfikator domyślnie przepuszcza żądania HTTP tylko do odczytu.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: '**Allowed by default**: … Read-only HTTP requests'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-kolejnosc-najpierw-reguly
    tresc: W trybie auto każde działanie przechodzi przez stałą kolejność decyzji i wygrywa pierwszy pasujący krok; w pierwszym kroku działania pasujące do Twoich reguł allow, ask albo deny rozstrzygają się od razu, z wyjątkami.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'Each action goes through a fixed decision order. The first matching step wins: … Actions matching your [allow, ask, or deny rules](https://code.claude.com/docs/en/permissions.md#manage-permissions) resolve immediately, with these exceptions:'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-kolejnosc-odczyty-i-edycje-w-folderze
    tresc: W drugim kroku kolejności decyzji trybu auto działania tylko do odczytu i edycje plików w folderze roboczym są zatwierdzane automatycznie, poza zapisami do ścieżek chronionych i pierwszym odczytem spoza folderów roboczych, przy którym program pyta.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'Read-only actions and file edits in your working directory are auto-approved, except writes to [protected paths](#protected-paths) and [the first read outside the working directories](#first-read-outside-the-working-directories), which prompts you'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-kolejnosc-reszta-do-klasyfikatora
    tresc: W trzecim kroku kolejności decyzji trybu auto wszystko inne trafia do klasyfikatora, poza rozpoznanym kasowaniem ścieżek krytycznych, które ma własną obsługę.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'Everything else goes to the classifier, apart from [critical-path removals](#critical-paths) under their default handling'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-klasyfikator-widzi-wiadomosci-nie-wyniki
    tresc: W zapytaniach do klasyfikatora wysyłanych przez sam Claude Code klasyfikator widzi wiadomości użytkownika, wywołania narzędzi poza wyszukiwaniem tylko do odczytu (np. odczytem i przeszukiwaniem plików) oraz treść CLAUDE.md; wyniki narzędzi są z tych zapytań usuwane, więc wroga treść pliku albo strony nie może nim sterować wprost.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: In the classifier requests sent by Claude Code itself, the classifier sees user messages, tool calls other than read-only lookups such as file reads and searches, and your CLAUDE.md content. Tool results are stripped from those requests, so hostile content in a file or web page can't manipulate the classifier directly.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-zgoda-w-rozmowie-nazwij-dzialanie
    tresc: Gdy napiszesz Claude, że zablokowane działanie jest dozwolone, klasyfikator czyta to jako Twoją zgodę i może zdjąć blokadę; wiadomość musi nazwać działanie i to, co czyni je niebezpiecznym, bo samo nazwanie czynności niczego nie zdejmuje.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'If you tell Claude that a blocked action is allowed, the classifier reads that as your approval and can clear the block. … **Name the action and its specifics**: your message has to name the action and the specific thing that makes it dangerous, such as the branch of a force push. Naming the verb alone clears nothing'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-zgoda-obejmuje-jedno-dzialanie
    tresc: Zgoda podana w rozmowie obejmuje jedno nazwane działanie niszczące; kolejne takie działanie znów jest blokowane, chyba że dałeś zgodę na stałe.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: '**Expect it to cover one action**: an approval covers the destructive action you named, so a later action is blocked again unless you granted the approval as standing.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-niektorych-blokad-zgoda-nie-zdejmuje
    tresc: Niektórych blokad zgoda w rozmowie nie zdejmuje; żeby wykonać taki krok, wyjdź z trybu auto i odpowiedz na pytanie o zgodę.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: '**Some blocks stay in place**: … To run a step it won''t clear, [leave auto mode](#switch-permission-modes) and answer the permission prompt.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-blokada-powiadomienie
    tresc: Gdy klasyfikator zablokuje działanie, Claude Code pokazuje powiadomienie i wpisuje to działanie w /permissions na karcie Recently denied.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: '**A blocked action**: Claude Code shows a notification and lists the action in `/permissions` under the **Recently denied** tab'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-zgoda-po-wstrzymaniu-wznawia-auto
    tresc: Gdy tryb auto wstrzyma się po powtarzających się blokadach i Claude Code znów zapyta, zgoda na zapytane działanie wznawia tryb auto.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: auto mode pauses and Claude Code resumes prompting. Approving the prompted action resumes auto mode.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-kasowanie-folderu-aplikacja-odmowa
    tresc: W trybie auto w aplikacji na komputer Claude Code od razu odrzuca rozpoznane kasowanie ścieżki krytycznej, a odmowa każe Claude zgłosić, co chciał skasować, i zostawić kasowanie Tobie.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'What Claude Code does with a critical-path removal depends on your permission mode: … | `auto` | Asks you to approve it in the terminal, with a [time limit](#time-limits-and-denials-in-auto-and-bypasspermissions-modes). Elsewhere, denies it | … In `auto` mode, wherever Claude Code can''t show you a terminal prompt, it denies the command immediately … and in the VS Code extension''s chat panel and the Desktop app. The denial tells Claude to report what it wanted to delete and leave the removal to you.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-kasowanie-folderu-terminal-odliczanie
    tresc: W trybach auto i bypassPermissions pytanie w terminalu o rozpoznane kasowanie ścieżki krytycznej ma dwuminutowe odliczanie.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: In `auto` and `bypassPermissions` modes, the terminal prompt for a critical-path removal shows a two-minute countdown
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: bypass-wylacza-pytania-i-kontrole
    tresc: Tryb bypassPermissions wyłącza pytania o zgodę i kontrole bezpieczeństwa, więc wywołania narzędzi wykonują się od razu, także zapisy do ścieżek chronionych.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: '`bypassPermissions` mode disables permission prompts and safety checks so tool calls execute immediately, including writes to [protected paths](#protected-paths).'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: bypass-bez-ochrony-przed-wstrzyknieciem
    tresc: Tryb bypassPermissions nie chroni przed wstrzykniętymi poleceniami (prompt injection) ani przed niezamierzonymi działaniami.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: '`bypassPermissions` offers no protection against prompt injection or unintended actions.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: aplikacja-bypass-tylko-kontenery
    tresc: W aplikacji na komputer tryb Bypass permissions działa bez pytań o zgodę, z kilkoma wyjątkami; dokumentacja każe używać go tylko w odizolowanych kontenerach albo maszynach wirtualnych.
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Claude runs without permission prompts, except for the [actions no mode auto-approves](https://code.claude.com/docs/en/permission-modes.md#actions-no-mode-auto-approves) … Only use this in sandboxed containers or VMs.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-niedostepny-sesja-bez-auto-do-konca
    tresc: Gdy Claude Code zgłasza, że tryb auto jest niedostępny, sprawdź wymagania i ustawienie disableAutoMode; jeśli Anthropic wyłączył auto po stronie serwera albo serwer odrzucił auto dla Twojego konta, sesja zostaje bez auto do końca, więc nową sesję zacznij później.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'If Claude Code reports auto mode as unavailable, first check these requirements and whether any settings file sets [`disableAutoMode`](https://code.claude.com/docs/en/settings-reference#disableautomode). Anthropic may also have turned auto mode off server-side, or the server may have rejected auto mode for your account. A session that received either answer keeps auto mode off until the session ends, so start a new session later.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: aplikacja-dodaj-folder-w-sesji
    tresc: W aplikacji na komputer w czasie sesji lokalnej folder dodajesz, klikając + obok pola wiadomości i wybierając Add folder; Claude pracuje w tym folderze bezpośrednio, bez osobnej kopii (worktree).
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**While a local or [SSH](#ssh-sessions) session runs**: click **+** next to the prompt box and select **Add folder**. Claude works in that folder itself, with no [worktree](#run-a-session-in-its-own-worktree).'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-pierwszy-start-notka-terminal
    tresc: Gdy wbudowany tryb startowy po raz pierwszy uruchomi Twoją sesję w trybie auto, Claude Code w terminalu raz, na początku sesji, pokazuje notkę z odnośnikiem do strony o trybach uprawnień.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'The first time the built-in default starts one of your sessions in auto mode, Claude Code shows a notice that links to this page: … In a terminal, once, at the top of the session'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: auto-w-cyklu-shift-tab-gdy-dostepny
    tresc: W terminalu tryb auto pojawia się w cyklu Shift+Tab tylko wtedy, gdy jest dostępny; przejście do niego nie wymaga potwierdzenia.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'Not every mode is in the default cycle: … `auto`: appears when [auto mode is available](#eliminate-prompts-with-auto-mode); cycling to it switches permission modes without a confirmation prompt'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: okno-zgody-switch-to-auto-mode-kiedy
    tresc: W terminalu odpowiedź „Yes, and switch to auto mode” dochodzi do okna zgody na polecenie Bash tylko w trybach Manual i Accept edits, gdy tryb auto jest dostępny; nie ma jej w oknach wymuszonych regułą ask albo hookiem.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: '**From a Bash permission prompt**: in the Manual and `acceptEdits` permission modes, when [auto mode](#eliminate-prompts-with-auto-mode) is available, Claude Code adds **Yes, and switch to auto mode** to a Bash command''s permission prompt. … Claude Code doesn''t add the option to prompts forced by one of your [`ask` rules](https://code.claude.com/docs/en/permissions#manage-permissions) or by a [hook](https://code.claude.com/docs/en/hooks.md#pretooluse-decision-control)'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: okno-zgody-yes-and-switch-to-auto-mode
    tresc: Opcja „Yes, and switch to auto mode” zatwierdza polecenie i przełącza sesję na tryb auto. Nie pojawia się w każdym oknie zgody.
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: Claude Code adds **Yes, and switch to auto mode** to a Bash command's permission prompt. Select it to approve the command and switch the session to auto mode.
    sprawdzono: '2026-10-26'
    wersja: 2.1.310
