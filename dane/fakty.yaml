    cytat: "On Claude for Teams and Enterprise plans, each member's Claude Code usage draws from a per-seat allowance that resets on a rolling five-hour window and a weekly window. The allowance is shared with Claude chat and Cowork"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: koszty-sesja-szukania-bledu-wiecej-niz-dzien-czatu
    tresc: "Każda tura Claude Code niesie treść plików, wywołania narzędzi i rozumowanie w wielu krokach, więc jedna sesja szukania błędu może zużyć więcej niż dzień rozmów w czacie."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: "each Claude Code turn carries file contents, tool calls, and multi-step reasoning, so one debugging session can consume more than a day of chat."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: koszty-limit-sesji-i-tygodnia-wspolny-dla-modeli
    tresc: "Komunikaty o limicie sesji i o limicie tygodniowym oznaczają okno zużycia abonamentu wspólne dla wszystkich modeli, więc zmiana modelu nie przywraca dostępu; komunikat podaje, kiedy okno się odnowi."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: "**\"You've hit your session limit\" or \"You've hit your weekly limit\"**: a seat-based usage window on a subscription plan, shared across all models, so the developer can't restore access by switching models with `/model`. The message shows when the window resets."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: koszty-limit-rodziny-modeli-zmiana-modelu-pomaga
    tresc: "Po komunikacie o limicie jednej rodziny modeli zmiana na model spoza tej rodziny pozwala pracować dalej."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: "After the model-specific \"You've hit your Opus limit\" or \"You've hit your Sonnet limit\" message, switching to a model outside that family with `/model` does keep the developer working."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: koszty-rosna-z-rozmiarem-kontekstu
    tresc: "Zużycie tokenów rośnie z rozmiarem kontekstu: im więcej kontekstu Claude przetwarza, tym więcej tokenów zużywasz."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: "Token costs scale with context size: the more context Claude processes, the more tokens you use."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: koszty-subagent-wlasne-zapytania-zuzywaja-limit
    tresc: "Subagent trzyma obszerne wyniki we własnym kontekście i oddaje do głównej rozmowy tylko podsumowanie, ale jego własne zapytania i tak zużywają Twój limit."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: "Delegate these to [subagents](https://code.claude.com/docs/en/sub-agents.md#isolate-high-volume-operations) so the verbose output stays in the subagent's context while only a summary returns to your main conversation. … The subagent's own requests still draw on your usage."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: koszty-konkretna-prosba-mniej-odczytow
    tresc: "Ogólne prośby uruchamiają szerokie przeszukiwanie, a konkretne pozwalają Claude pracować sprawnie przy najmniejszej liczbie odczytów plików."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: "Vague requests like \"improve this codebase\" trigger broad scanning. Specific requests like \"add input validation to the login function in auth.ts\" let Claude work efficiently with minimal file reads."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: koszty-zuzycie-w-tle-niewielkie
    tresc: "Claude Code zużywa tokeny na niektóre prace w tle, nawet gdy nic nie robisz; te prace zużywają niewielką ilość tokenów."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: "Claude Code uses tokens for some background functionality even when idle: … These background processes consume a small amount of tokens"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: koszty-podpowiedz-pomijana-blisko-limitu
    tresc: "Przy włączonych podpowiedziach Claude Code po odpowiedzi Claude wysyła krótkie zapytanie o podpowiedź następnego polecenia; pomija je, gdy konto jest blisko limitu zużycia albo już go osiągnęło, a podpowiedzi da się wyłączyć."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: "When prompt suggestions are on, Claude Code also sends a short request to the model your session is using after Claude responds, to [suggest your next prompt](https://code.claude.com/docs/en/interactive-mode.md#prompt-suggestions). … Claude Code [skips it while your account is close to or at its usage limit](https://code.claude.com/docs/en/interactive-mode.md#when-claude-code-skips-suggestions). To stop these requests, [turn prompt suggestions off](https://code.claude.com/docs/en/interactive-mode.md#turn-prompt-suggestions-off)."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: koszty-dluga-sesja-zuzywa-wiecej-niz-aktywnosc
    tresc: "Sesja otwarta od godzin może zużyć znacznie więcej limitu abonamentu, niż wynikałoby z Twojej aktywności."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: "A session that has been open for hours can use far more of your plan limits than your activity suggests"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: koszty-kazde-zapytanie-niesie-cala-rozmowe
    tresc: "Claude Code wysyła całą rozmowę z każdym zapytaniem, a każde użycie narzędzi przez Claude to kolejne zapytanie z ich wynikami; dzięki pamięci podręcznej (cache) historia idzie po niższej stawce, ale jednolinijkowe pytanie w sesji otwartej cały dzień i tak zużywa limit za całą rozmowę."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: "**Long context**: Claude Code sends your full conversation with every request, and each time Claude uses tools it sends another request carrying that batch of tool results. With [prompt caching](https://code.claude.com/docs/en/prompt-caching.md), Claude Code re-reads that history at the [cached token rate](https://platform.claude.com/docs/en/about-claude/pricing), so a one-line question in a session that has been open all day still draws usage for the whole conversation."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: koszty-pytania-o-rachunek-get-help
    tresc: "Z pytaniami o rachunek za abonament Pro, Max, Team albo Enterprise piszesz do wsparcia Anthropic: logujesz się na claude.ai, klikasz swoje inicjały w lewym dolnym rogu i wybierasz Get help."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: "For billing questions about your specific account, contact Anthropic support through the in-product messenger: … **Subscription plans** (Pro, Max, Team, Enterprise): sign in at [claude.ai](https://claude.ai), click your initials in the lower left, and select **Get help**"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: dostepnosc-abonament-to-konto-claude-ai
    tresc: "Abonament Claude oznacza logowanie kontem claude.ai na planie Pro, Max, Team albo Enterprise."
    zrodlo: https://code.claude.com/docs/en/feature-availability.md
    cytat: "**Claude subscription**: you sign in with a claude.ai account on the Pro, Max, Team, or Enterprise plan"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: dostepnosc-aplikacja-wymaga-konta-claude-ai
    tresc: "Aplikacja Claude Code Desktop wymaga logowania kontem claude.ai; nie działa z kluczem API z Anthropic Console ani przez innego dostawcę."
    zrodlo: https://code.claude.com/docs/en/feature-availability.md
    cytat: "These require signing in with a claude.ai account and are not reachable with an Anthropic Console API key or from a third-party provider: … * [Claude Code Desktop](https://code.claude.com/docs/en/desktop.md)"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: dostepnosc-abonament-decyduje-o-funkcjach
    tresc: "Gdy logujesz się kontem claude.ai, o tym, które funkcje z tabeli masz, decyduje Twój plan abonamentu."
    zrodlo: https://code.claude.com/docs/en/feature-availability.md
    cytat: "When you sign in with a claude.ai account, your plan determines which of the features below are available."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: dostepnosc-artefakty-wszystkie-abonamenty
    tresc: "Artefakty są dostępne na abonamentach Pro, Max, Team i Enterprise."
    zrodlo: https://code.claude.com/docs/en/feature-availability.md
    cytat: "* [Artifacts](https://code.claude.com/docs/en/artifacts.md): Pro, Max, Team, and Enterprise plans"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: dostepnosc-remote-control-team-enterprise-wlacza-administrator
    tresc: "Remote Control działa od razu na abonamentach Pro i Max, a na Team i Enterprise jest wyłączony, dopóki nie włączy go administrator organizacji."
    zrodlo: https://code.claude.com/docs/en/feature-availability.md
    cytat: "\"Admin-enabled\" means the feature is off until an organization admin turns it on. … | [Remote Control](https://code.claude.com/docs/en/remote-control.md) | ✓ | ✓ | Admin-enabled | Admin-enabled |"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: koszty-podpowiedz-korzysta-z-pamieci-podrecznej
    tresc: "Zapytanie o podpowiedź następnego polecenia korzysta z pamięci podręcznej (cache) rozmowy, więc to głównie odczyty z pamięci podręcznej i kilka tokenów odpowiedzi."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: "That request reuses the conversation's prompt cache, so it is mostly cache reads plus a few output tokens."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-customize-konektory-skille-wtyczki
    tresc: 'Żeby zarządzać konektorami, skillami i wtyczkami w jednym miejscu, klikasz Customize na pasku bocznym aplikacji.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'To manage connectors, skills, and plugins in one place, click **Customize** in the sidebar.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-integracje-spoza-katalogu
    tresc: 'Narzędzia, których nie ma wśród konektorów, dodaje się jako serwery MCP ręcznie w plikach ustawień; można też tworzyć własne konektory.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'For integrations not listed in Connectors, add MCP servers manually via [settings files](https://code.claude.com/docs/en/mcp.md#installing-mcp-servers). You can also [create custom connectors](https://support.claude.com/en/articles/11175166-getting-started-with-custom-connectors-using-remote-mcp).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-mcp-przez-interfejs-konektorow
    tresc: 'W aplikacji na komputer serwery MCP dodajesz przez interfejs konektorów (Connectors UI) w sesjach lokalnych i SSH albo w plikach ustawień; w terminalu tylko w plikach ustawień.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '| [MCP servers](https://code.claude.com/docs/en/mcp.md) | Configure in settings files | Connectors UI for local and SSH sessions, or settings files |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-serwery-przez-connectors-ui
    tresc: 'W aplikacji Claude Code na komputer serwery MCP dodajesz przez interfejs konektorów (Connectors UI).'
    zrodlo: https://code.claude.com/docs/en/mcp-quickstart.md
    cytat: '**Claude Code desktop app**: add servers through the [Connectors UI](https://code.claude.com/docs/en/desktop.md#connect-external-tools).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: konektory-claude-ai-dostepne-w-claude-code
    tresc: 'Gdy logujesz się do Claude Code kontem claude.ai, serwery MCP dodane na claude.ai, czyli konektory, są w Claude Code dostępne automatycznie.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    cytat: 'If you''ve logged into Claude Code with a [claude.ai](https://claude.ai) account, MCP servers you''ve added in claude.ai, known as [connectors](https://claude.com/docs/connectors), are automatically available in Claude Code:'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: konektory-team-enterprise-dodaje-admin
    tresc: 'Serwery dodaje się na claude.ai/customize/connectors; na planach Team i Enterprise dodawać je mogą tylko administratorzy.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    cytat: 'Add servers at [claude.ai/customize/connectors](https://claude.ai/customize/connectors). On Team and Enterprise plans, only admins can add servers.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-konektory-zarzadzasz-w-settings-connectors
    tresc: 'Konektorami zarządzasz i odłączasz je w aplikacji na komputer w Settings > Connectors.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'To manage or disconnect connectors, go to **Settings > Connectors** in the desktop app.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-config-otwiera-settings-claude-code
    tresc: 'W zakładce Code wbudowane polecenia, które w terminalu otwierają interaktywny panel, działają inaczej: /config otwiera Settings > Claude Code.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**Terminal-dialog commands**: built-in commands that open an interactive panel in the terminal behave differently in the Code tab. … `/config` opens **Settings > Claude Code**.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-podsumowanie-przeplyw-jeden-wynik
    tresc: 'Subagenci i przepływy pracują poza główną rozmową; przy subagentach o kolejnym kroku decyduje Claude tura po turze, w przepływie skrypt; każdy subagent oddaje podsumowanie do rozmowy, która go uruchomiła, a przepływ uruchamia w tle wielu subagentów i oddaje jeden wynik.'
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: 'Both do work outside your main conversation. With subagents, Claude decides turn by turn what runs next. In a workflow, the script decides: … **Subagents** are workers Claude spawns, each returning a summary to the conversation that spawned it … **[Dynamic workflows](https://code.claude.com/docs/en/workflows.md)** are scripts Claude writes that run many subagents in the background and return one result'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-szybki-skupiony-pomocnik
    tresc: 'Subagenta użyj, gdy potrzebujesz szybkiego pomocnika do jednej sprawy, np. zbadać pytanie, sprawdzić twierdzenie albo przejrzeć plik; oddaje podsumowanie, więc główna rozmowa zostaje czysta.'
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '**Use a subagent** when you need a quick, focused worker: research a question, verify a claim, review a file. The subagent does the work and returns a summary, so your main conversation stays clean.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-gdy-przerasta-kilku-subagentow
    tresc: 'Przepływu użyj, gdy praca przerasta kilku subagentów albo gdy chcesz, żeby ustalenia zostały sprawdzone nawzajem, zanim je zobaczysz; uruchamiasz go prośbą o przepływ.'
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '**Use a dynamic workflow** when a job [outgrows a handful of subagents](https://code.claude.com/docs/en/workflows.md#when-to-use-a-workflow), or when you want the findings cross-checked before you see them, such as a codebase-wide audit, a large migration, or a plan drafted from several angles. To start one, [ask for a workflow in your prompt](https://code.claude.com/docs/en/workflows.md#ask-for-a-workflow-in-your-prompt).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: koszt-agenci-przeplywu-wlasne-zapytania
    tresc: 'Każdy subagent i każdy agent uruchomiony przez przepływ wysyła własne zapytania, ponad zapytania głównej rozmowy.'
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: '**Subagents and workflows**: every subagent, and every agent a [dynamic workflow](https://code.claude.com/docs/en/workflows.md#cost) spawns, sends its own requests on top of the main conversation''s.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-agenci-czytaja-zapisuja-uruchamiaja
    tresc: 'Sam skrypt przepływu nie ma bezpośredniego dostępu do plików ani do powłoki: czytają, zapisują i uruchamiają polecenia agenci, a skrypt tylko ich koordynuje.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: '| No direct filesystem or shell access from the workflow itself | Agents read, write, and run commands. The script coordinates the agents |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: remote-control-aplikacja-stan-w-karcie-environment
    tresc: 'Czy sesja jest połączona, sprawdzasz na przełączniku Remote Control w karcie Environment panelu szczegółów sesji.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'To see whether a session is connected, check the **Remote Control** switch in the **Environment** card of its [session details panel](#see-session-details).'

  - id: remote-control-aplikacja-wylacz-jedna-sesje
    tresc: 'Jedną sesję zabierasz z innych urządzeń, wyłączając jej przełącznik Remote Control.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**One session**: turn off its **Remote Control** switch.'

  - id: remote-control-aplikacja-polaczona-przy-starcie-turn-off
    tresc: 'W sesji, która połączyła się przy starcie, wpisanie /remote-control nie wyłącza Remote Control, tylko pokazuje wiersz Remote Control is already on…; rozłączasz ją przyciskiem Turn off w tym wierszu.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'In a session that connected when it started, typing `/remote-control` leaves Remote Control on and shows `Remote Control is already on. This session connected automatically when it started.` Click **Turn off** on that line to disconnect.'

  - id: remote-control-aplikacja-wylacz-nowe-sesje
    tresc: 'Nowe sesje aplikacji na tym komputerze nie trafią na inne urządzenia, gdy wyłączysz Connect new sessions to Remote Control w Settings > Claude Code.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**New Desktop sessions on this computer**: turn off **Connect new sessions to Remote Control** in **Settings > Claude Code**.'

  - id: remote-control-aplikacja-archiwizacja-ukrywa
    tresc: 'Sesję widoczną już na innych urządzeniach ukrywasz, archiwizując ją w aplikacji na komputer. Aplikacja archiwizuje też jej kopię Remote Control, więc sesja znika z domyślnej listy sesji na tamtych urządzeniach.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'To hide a session that already appears on your other devices, archive it in Desktop. Desktop archives the session''s Remote Control copy too, so it leaves the default session list on those devices.'

  - id: telefon-dispatch-w-cowork
    tresc: 'Dispatch to stała rozmowa z Claude w Cowork: wysyłasz jej zadanie, a ona decyduje, jak je wykonać.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '[Dispatch](https://support.claude.com/en/articles/13947068) is a persistent conversation with Claude that lives in [Cowork](https://claude.com/product/cowork). You message Dispatch a task, and it decides how to handle it.'

  - id: remote-control-zapis-synchronizuje-rozmowe
    tresc: 'Zapis rozmowy przechowywany na serwerach Anthropic utrzymuje tę samą rozmowę na Twoich urządzeniach i pozwala sesji połączyć się znowu po zaniku sieci.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'The stored transcript keeps the conversation in sync across your devices and lets the session reconnect after a network drop.'

  - id: telefon-auto-wymaga-dostepnosci
    tresc: 'W sesji Remote Control tryb Auto wybierzesz tylko wtedy, gdy sesja spełnia wymagania dostępności trybu auto.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'To use Auto, the session has to meet the auto mode [availability requirements](#eliminate-prompts-with-auto-mode).'

  - id: remote-control-aplikacja-ustawienie-domyslne-organizacji
    tresc: 'Dopóki nie zmienisz ustawienia Connect new sessions to Remote Control, aplikacja na komputer idzie za remoteControlAtStartup w Twoich ustawieniach albo ustawieniach zarządzanych, a potem za domyślnym ustawieniem organizacji.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'If you''ve never changed that setting, Desktop follows [`remoteControlAtStartup`](/docs/en/settings-reference#remotecontrolatstartup) in your user or managed settings, then your organization''s default.'

  - id: remote-control-aplikacja-wlacz-wylacz-zapisuje-wybor
    tresc: 'Gdy Connect new sessions to Remote Control już pokazuje wyłączone, włączasz je i wyłączasz, żeby aplikacja na komputer zapisała Twój wybór.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'If it already shows off, turn it on and then off so Desktop saves your choice.'

  - id: telefon-konektor-logowanie-bez-panelu-mcp
    tresc: 'Gdy konektor z claude.ai wymaga zalogowania w sesji prowadzonej przez Remote Control, panelu /mcp nie ma w aplikacji na telefon ani w przeglądarce; link do autoryzacji bierzesz z terminala na komputerze, na którym działa sesja.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'When a claude.ai connector needs authentication in a session you drive over Remote Control, the `/mcp` panel isn''t available from the mobile app or the web. Get the authorization link from a terminal on the machine where the session runs, then open the link on the device you''re using.'

  - id: aplikacja-wtyczki-dodaja-skille-agentow-hooki-bez-terminala
    tresc: 'Wtyczki to pakiety wielokrotnego użytku, które dodają do Claude Code skille, agentów, hooki, serwery MCP i konfiguracje LSP; w aplikacji na komputer instalujesz je bez terminala.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '[Plugins](https://code.claude.com/docs/en/plugins/overview.md) are reusable packages that add skills, agents, hooks, MCP servers, and LSP configurations to Claude Code. You can install plugins from the desktop app without using the terminal.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-formularz-otwierasz-scheduled
    tresc: 'Stronę zadań otwierasz w zakładce Code kliknięciem Scheduled w pasku bocznym albo w jego menu More; gdy pasek pokazuje Routines, klikasz Routines, potem New routine, i wypełniasz formularz na całą stronę.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'In the [**Code** tab](https://code.claude.com/docs/en/desktop.md), click **Scheduled** in the sidebar or in the sidebar''s **More** menu. If the sidebar shows **Routines** instead of **Scheduled**, click **Routines**, then click **New routine**, and continue with [Full-page form](#full-page-form).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-new-task-rozne-ekrany
    tresc: 'Po kliknięciu New task otwiera się okno New scheduled task, ale zamiast niego może się pokazać menu z Create with Claude i Set up manually (wybierasz Set up manually), okno z Only on this computer na górze, menu Local i Cloud albo formularz na całą stronę.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Click **New task** to open the **New scheduled task** dialog. Check for these screens before you continue: … If a menu opens with **Create with Claude** and **Set up manually**, select **Set up manually** to open the dialog. … If **Only on this computer** is at the top of the dialog, go to … before you enter anything. … If a menu with **Local** and **Cloud** opens, or a full page opens in place of the dialog, go to [Full-page form](#full-page-form).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-nazwa-niepowtarzalna
    tresc: 'Aplikacja zapisuje nazwę zadania małymi literami z myślnikami i nadaje ją folderowi zadania na dysku, więc nazwa musi być inna niż nazwy Twoich pozostałych zadań.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Enter a name in the **Name** field. Desktop converts it to lowercase kebab-case and uses it as the task''s folder name on disk, so the name must be unique across your tasks.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-polecenie-pod-nazwa
    tresc: 'W polu pod nazwą wpisujesz, co Claude ma zrobić, gdy zadanie ruszy.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'In the box below the name, enter what Claude should do when the task runs.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-only-on-this-computer
    tresc: 'Pod kartą Trigger rozwijasz Advanced settings i na karcie General włączasz Only on this computer; wtedy zadanie działa na Twoim komputerze, w lokalnym folderze.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Skip past the **Trigger** card for now and expand **Advanced settings** below it. On the **General** tab, turn on **Only on this computer**. With it on, the task runs on your machine in a local folder.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-local-folder-wymagany
    tresc: 'W wierszu Local folder wybierasz folder; dopóki go nie wybierzesz, Create jest nieaktywne.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'In the **Local folder** row, select a folder. **Create** stays unavailable until you pick one.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-trigger-gotowy-termin
    tresc: 'W karcie Trigger wybierasz jeden z gotowych terminów.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Back in the **Trigger** card, select a [schedule preset](#schedule-options).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-tryb-i-model-w-polu-polecenia
    tresc: 'Tryb uprawnień i model zadania wybierasz na pasku pola z poleceniem; jeśli ich nie zmienisz, przebiegi biorą Twoje ustawienia Claude Code i domyślny model.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'In the instructions box''s toolbar, select a [permission mode](#permissions-for-scheduled-tasks) and model. If you leave them unchanged, runs use your Claude Code settings and the default model.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-create-zaufanie-folderu
    tresc: 'Klikasz Create; jeśli folder nie jest jeszcze zaufany, aplikacja prosi o zaufanie, a potem otwiera się strona zadania.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Click **Create**. If you haven''t trusted the folder yet, Desktop asks you to trust it at this point. The task''s detail page opens.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-olowek-otwiera-edit
    tresc: 'Na stronie zadania ikona ołówka otwiera formularz Edit.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'On the detail page, click the pencil icon to open the [**Edit** form](#manage-scheduled-tasks).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-prosba-tworzy-zadanie
    tresc: 'Zadanie utworzysz też, opisując w dowolnej sesji, czego chcesz; prośba o pracę codziennie rano o stałej godzinie tworzy zadanie powtarzane.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'You can also create a task by describing what you want in any session. For example, "set up a daily code review that runs every morning at 9am" creates a recurring task.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-prosba-jednorazowe
    tresc: 'Prośba o przypomnienie o konkretnej porze tworzy zadanie jednorazowe, które po uruchomieniu samo się wyłącza.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'A request like "remind me at 3pm tomorrow to check the deploy" creates a one-time task that disables itself after it fires.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-okno-only-na-gorze
    tresc: 'Gdy Only on this computer stoi na górze okna New scheduled task, włączasz je, zanim cokolwiek wpiszesz; wtedy w miejsce formularza pojawia się osobny, pusty formularz zadania lokalnego.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'If **Only on this computer** is at the top of the **New scheduled task** dialog when it opens, turn it on before you enter anything. When you turn it on, a separate blank form for a local task replaces the form.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-okno-only-opis-i-folder
    tresc: 'W formularzu zadania lokalnego Create jest nieaktywne, dopóki nie wpiszesz opisu w Description i nie wybierzesz folderu w Working folder.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '**Description**: enter a description. **Create** stays unavailable until you do. … **Working folder**: select the folder the task runs in. **Create** stays unavailable until you select one.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-formularz-na-cala-strone
    tresc: 'Gdy otworzy się menu Local i Cloud, wybierasz Local; otwiera się strona New local routine albo New local scheduled task, a tryb, model i folder wybierasz w polu Instructions.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'If a menu with **Local** and **Cloud** opens, select **Local**. A page titled **New local routine** or **New local scheduled task** opens. … **Instructions**: enter what Claude should do when the task runs. In the same box, select the permission mode, the model, and the folder the task runs in.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-create-podpowiedz-po-najechaniu
    tresc: 'W formularzu na całą stronę, gdy Create jest nieaktywne, najeżdżasz na nie myszą i widzisz, czego formularz jeszcze potrzebuje.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'If **Create** is unavailable, hover over it to see what the form still needs.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-trigger-cztery-opcje
    tresc: 'Przy włączonym Only on this computer karta Trigger daje Hourly, Daily, Weekdays i Weekly, a Manual i Custom wybierzesz dopiero w formularzu Edit po utworzeniu zadania.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'When you turn on **Only on this computer** under **Advanced settings**, the **Trigger** card offers Hourly, Daily, Weekdays, and Weekly. To get **Manual** or **Custom** for such a task, open its [**Edit** form](#manage-scheduled-tasks) after you create it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-opcje-terminu
    tresc: 'Hourly uruchamia zadanie co godzinę, Daily codziennie o wybranej godzinie czasu lokalnego, Weekdays tak samo, ale bez soboty i niedzieli, Weekly w wybranym dniu i o wybranej godzinie, a Manual tylko po kliknięciu Run now.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '**Hourly**: runs every hour … **Daily**: runs every day at the local time you pick … **Weekdays**: same as Daily but skips Saturday and Sunday … **Weekly**: shows a time picker and a day picker … **Manual**: no schedule, only runs when you click **Run now**. Useful for saving a prompt you trigger on demand'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-custom-cron
    tresc: 'Custom uruchamia zadanie według wpisanego wyrażenia cron, liczonego w czasie lokalnym.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '**Custom**: runs on a cron expression that you enter and that is evaluated in your local time'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-claude-ustawia-termin
    tresc: 'W każdej sesji aplikacji poprosisz Claude o ustawienie terminu; Claude nie jest ograniczony do jednego uruchomienia na godzinę i ustawi też jedno uruchomienie w przyszłości.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'You can also ask Claude in any Desktop session to set the schedule. Claude isn''t held to the once-per-hour limit and can set a single run at a future time.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-sprawdza-co-minute-nowa-sesja
    tresc: 'Zadania lokalne działają na Twoim komputerze: gdy aplikacja jest otwarta, co minutę sprawdza harmonogram i w porze zadania startuje nową sesję, niezależną od sesji, które sam otworzyłeś.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Local scheduled tasks run on your machine. Desktop checks the schedule every minute while the app is open and starts a fresh session when a task is due, independent of any manual sessions you have open.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-opoznienie-kilka-minut
    tresc: 'Każde zadanie startuje kilka minut po zaplanowanej porze, i to zawsze z tym samym opóźnieniem.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Each task gets a small delay of a few minutes after the scheduled time to stagger API traffic. The delay is deterministic: the same task always starts at the same offset.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-uspiony-komputer-pomija-przebieg
    tresc: 'Zadania działają tylko wtedy, gdy aplikacja jest uruchomiona, a komputer nie śpi; jeśli komputer prześpi porę zadania, przebieg jest pominięty.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Tasks only run while the desktop app is running and your computer is awake. If your computer sleeps through a scheduled time, the run is skipped.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-skille-rozszerzaja-ladowane-same-albo-wprost
    tresc: 'W aplikacji skille rozszerzają to, co Claude potrafi: Claude wczytuje je sam, gdy pasują do zadania, albo uruchamiasz skill wprost.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '[Skills](https://code.claude.com/docs/en/skills.md) extend what Claude can do. Claude loads them automatically when relevant, or you can invoke one directly'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-claude-md-stale-instrukcje
    tresc: 'Pliki CLAUDE.md to pliki Markdown, które dają Claude stałe instrukcje dla projektu, Twojego sposobu pracy albo całej organizacji; piszesz je zwykłym tekstem, a Claude czyta je na początku każdej sesji.'
    zrodlo: https://code.claude.com/docs/en/memory.md
    cytat: 'CLAUDE.md files are markdown files that give Claude persistent instructions for a project, your personal workflow, or your entire organization. You write these files in plain text; Claude reads them at the start of every session.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-hook-polecenie-w-chwilach-pracy
    tresc: 'Hooki to polecenia powłoki ustawione przez użytkownika; Claude Code uruchamia je w określonych chwilach pracy, więc dana czynność dzieje się zawsze, a nie wtedy, gdy model sam zdecyduje się ją wykonać.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'Hooks are user-defined shell commands. Claude Code runs them at specific points in its lifecycle, which gives you deterministic control: certain actions always happen rather than relying on the LLM to choose to run them.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-subagent-osobny-asystent
    tresc: 'Subagenci to wyspecjalizowani asystenci AI do określonych rodzajów zadań; używasz ich, gdy zadanie poboczne zalałoby główną rozmowę wynikami wyszukiwania, logami albo treścią plików, do których nie wrócisz: subagent robi tę pracę we własnym kontekście i oddaje tylko podsumowanie.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'Subagents are specialized AI assistants that handle specific types of tasks. Use one when a side task would flood your main conversation with search results, logs, or file contents you won''t reference again: the subagent does that work in its own context and returns only the summary.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-mcp-otwarty-standard
    tresc: 'Claude Code łączy się z setkami zewnętrznych narzędzi i źródeł danych przez Model Context Protocol (MCP), otwarty standard łączenia AI z narzędziami; serwery MCP dają Claude Code dostęp do Twoich narzędzi, baz danych i API.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    cytat: 'Claude Code can connect to hundreds of external tools and data sources through the [Model Context Protocol (MCP)](https://modelcontextprotocol.io/introduction), an open source standard for AI-tool integrations. MCP servers give Claude Code access to your tools, databases, and APIs.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-prompt-injection-zlosliwy-tekst
    tresc: 'Prompt injection to technika, w której atakujący próbuje zmienić albo zmanipulować instrukcje asystenta AI, wstawiając złośliwy tekst.'
    zrodlo: https://code.claude.com/docs/en/security.md
    cytat: 'Prompt injection is a technique where an attacker attempts to override or manipulate an AI assistant''s instructions by inserting malicious text.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-remote-control-sesja-z-telefonu
    tresc: 'Dzięki Remote Control prowadzisz dalej lokalną sesję Claude Code z telefonu, tabletu albo dowolnej przeglądarki.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    cytat: 'Continue a local Claude Code session from your phone, tablet, or any browser using Remote Control.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-goal-praca-az-warunek-spelniony
    tresc: 'Polecenie /goal ustawia cel: Claude pracuje dalej przez kolejne tury, aż warunek zostanie spełniony albo cel zniknie z innego powodu.'
    zrodlo: https://code.claude.com/docs/en/commands.md
    cytat: 'Set a [goal](https://code.claude.com/docs/en/goal.md): Claude keeps working across turns until the condition is met or the goal [clears for another reason](https://code.claude.com/docs/en/goal.md#how-evaluation-works).'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-artefakt-strona-na-claude-ai
    tresc: 'Artefakt to interaktywna strona internetowa, którą Claude Code publikuje z Twojej sesji pod prywatnym adresem na claude.ai; otwierasz ją w przeglądarce, zmienia się na bieżąco w trakcie sesji, a udostępniasz ją z nagłówka strony.'
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'An [artifact](https://claude.com/features/artifacts) is a live, interactive web page that Claude Code publishes from your session to a private URL on claude.ai. You open it in a browser, and it updates in place as the session continues. Share it from the page header when you want someone else to see it too.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-szablony-slides-design-docs
    tresc: 'Claude może zacząć artefakt od jednego z szablonów na Twoim koncie claude.ai: Claude Slides do prezentacji, Claude Design do projektu wizualnego albo Claude Docs do dokumentu, który inni będą czytać i edytować; każdy otwiera się we własnym edytorze na claude.ai, gdzie zmieniasz go sam albo prosisz o to Claude, i eksportujesz go na przykład do PowerPointa, PDF albo Worda.'
    zrodlo: https://code.claude.com/docs/en/artifacts.md
    cytat: 'Instead of building a page from scratch, Claude can start an artifact from one of the templates on your claude.ai account: [Claude Slides](https://support.claude.com/en/articles/17153992-what-are-artifacts-and-how-do-i-use-them#h_11d5a9a5fa) for a presentation, [Claude Design](https://support.claude.com/en/articles/14604416-get-started-with-claude-design) for a visual design, or [Claude Docs](https://support.claude.com/en/articles/16923645-get-started-with-claude-docs) for a document other people will read and edit. Each opens in its own editor on claude.ai, where you and your teammates change it directly or ask Claude to, and export it to formats such as PowerPoint, PDF, or Word.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-claude-in-chrome-dziala-jako-ty
    tresc: 'Gdy Claude ma działać jako Ty na stronach, na których jesteś zalogowany, dokumentacja każe zamiast panelu Browser użyć rozszerzenia Claude in Chrome, które dzieli stan logowania Twojej przeglądarki.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'When you want Claude to act as you in your logged-in sessions, use the [Claude in Chrome extension](https://code.claude.com/docs/en/chrome.md) instead, which shares your browser''s login state.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-katalogi-wtyczek-anthropic
    tresc: 'Anthropic publikuje trzy ogólne katalogi wtyczek (marketplace) do Claude Code: oficjalny, społeczności i pokazowy; każdy to spis wtyczek we własnym repozytorium na GitHubie, a instalując z niego wtyczkę, podajesz nazwę katalogu po znaku @.'
    zrodlo: https://code.claude.com/docs/en/plugins/anthropic-marketplaces.md
    cytat: 'Anthropic publishes three general-purpose plugin marketplaces for Claude Code: [official](https://github.com/anthropics/claude-plugins-official), [community](https://github.com/anthropics/claude-plugins-community), and [demo](https://github.com/anthropics/claude-code). Each is a catalog of plugins in its own GitHub repository. When you install a plugin from one of them in a Claude Code session, you type the marketplace''s name after `@`, as in `/plugin install commit-commands@claude-plugins-official`.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-pamiec-podreczna-nie-przetwarza-od-nowa
    tresc: 'Pamięć podręczna promptów przyspiesza Claude Code i obniża koszt: bez niej API przetwarzałoby całą historię w każdej turze, a z nią ponownie używa tego, co już przetworzyło, i w pełni przetwarza tylko to, co się zmieniło.'
    zrodlo: https://code.claude.com/docs/en/prompt-caching.md
    cytat: 'Prompt caching makes Claude Code faster and more cost-efficient. Without caching, the API would reprocess your full history on every turn. With caching, it reuses what it already processed, bills the re-read at the [cached token rate](https://platform.claude.com/docs/en/about-claude/pricing), and fully processes only what changed.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-wysilek-steruje-rozumowaniem
    tresc: 'Poziomy wysiłku sterują rozumowaniem adaptacyjnym: model sam decyduje na każdym kroku, czy i ile myśleć; niższy wysiłek jest szybszy i tańszy przy prostych zadaniach, a wyższy daje głębsze rozumowanie przy złożonych problemach.'
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: '[Effort levels](https://platform.claude.com/docs/en/build-with-claude/effort) control adaptive reasoning, which lets the model decide whether and how much to think on each step based on task complexity. Lower effort is faster and cheaper for straightforward tasks, while higher effort provides deeper reasoning for complex problems.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-dispatch-zaczyna-sesje-z-telefonu
    tresc: 'W aplikacji możesz między innymi pozwolić, żeby Dispatch zaczynał dla Ciebie sesje z Twojego telefonu.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'You can run multiple sessions in parallel, branch off side chats, let Claude check on and message your other sessions, send work to the cloud, or let Dispatch start sessions for you from your phone.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-sterowanie-komputerem-co-robi
    tresc: 'Sterowanie komputerem (computer use) pozwala Claude otwierać Twoje aplikacje, sterować ekranem i pracować bezpośrednio na Twoim komputerze tak, jak robisz to Ty.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Computer use lets Claude open your apps, control your screen, and work directly on your machine the way you would.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-zadanie-zaplanowane-nowa-sesja
    tresc: 'Zadanie zaplanowane samo zaczyna nową sesję o porze i z częstotliwością, które wybierzesz; służy do powtarzalnej pracy, na przykład porannych podsumowań z kalendarza i poczty.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Scheduled tasks start a new session automatically at a time and frequency you choose. Use them for recurring work like daily code reviews, dependency update checks, or morning briefings that pull from your calendar and inbox.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-przeplyw-skrypt-subagentow
    tresc: 'Przepływ (dynamic workflow) to skrypt, który naraz kieruje pracą wielu subagentów; Claude pisze go do opisanego zadania, a skrypt działa w tle, podczas gdy sesja dalej odpowiada.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'A dynamic workflow is a JavaScript script that orchestrates many [subagents](https://code.claude.com/docs/en/sub-agents.md) at once. Claude writes the script for the task you describe, and a runtime executes it in the background while your session stays responsive.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-koszt-tokenow-rosnie-z-kontekstem
    tresc: 'Koszt w tokenach rośnie z rozmiarem kontekstu: im więcej kontekstu Claude przetwarza, tym więcej tokenów zużywasz.'
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: 'Token costs scale with context size: the more context Claude processes, the more tokens you use.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: slowniczek-polecenia-steruja-claude-code
    tresc: 'Polecenia sterują Claude Code w trakcie sesji; pozwalają szybko zmienić model, zarządzać uprawnieniami, wyczyścić kontekst, uruchomić przepływ i więcej.'
    zrodlo: https://code.claude.com/docs/en/commands.md
    cytat: 'Commands control Claude Code from inside a session. They provide a quick way to switch models, manage permissions, clear context, run a workflow, and more.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  # Lekcja 0.0 co-jest-gdzie, po kontroli prawdy 27.10.2026 (materialy/kontrole/co-jest-gdzie-2026-10-27/prawda.md w pamięci projektu). Dwa pierwsze fakty przeniesione bez zmian z gałęzi modul-praca-bez-ciebie i modul-dlugie-rozmowy; cytaty sprawdzone grepem w dane/zrodla/strony/.
  - id: harmonogram-keep-computer-awake
    tresc: 'Żeby komputer nie zasypiał, gdy nic na nim nie robisz, włączasz Keep computer awake w Settings > This computer > System; zamknięcie klapy laptopa i tak go usypia.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'To prevent idle-sleep, turn on **Keep computer awake** in **Settings > This computer > System**. Closing the laptop lid still puts it to sleep.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-sesja-przebiegu-w-history
    tresc: 'Sesję, którą uruchomił przebieg, otwierasz na stronie zadania kliknięciem wiersza tego przebiegu na liście History.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'To open the session a run started, go to the task''s [detail page](#manage-scheduled-tasks) and click that run''s row in the **History** list.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-grupa-scheduled-w-pasku
    tresc: 'Lista sesji w pasku bocznym może pokazywać grupę Scheduled z jednym wierszem na zadanie; kliknięcie wiersza otwiera sesję ostatniego przebiegu.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'The sidebar''s session list can show a **Scheduled** group as well, with one row per task. To open the session of a task''s latest run, click the task''s row in that group.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-grupa-scheduled-wlaczasz
    tresc: 'W bieżącym układzie grupę Scheduled włączasz w menu Group and sort (Show, potem Scheduled) i rozwijasz kliknięciem nagłówka, a we wcześniejszym układzie stoi na liście bez włączania.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '**Current layout**: open the [**Group and sort** menu](https://code.claude.com/docs/en/desktop.md#organize-and-find-sessions), select **Show**, then select **Scheduled**. The group starts collapsed, so click its heading to expand it. … **Earlier layout**: the group is in the session list with nothing to turn on'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-grupa-scheduled-przy-aktywnym-zadaniu
    tresc: 'Menu Show pokazuje Scheduled tylko wtedy, gdy co najmniej jedno zadanie ma Status Active; jeśli go nie ma, korzystasz z listy History, która działa zawsze.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '**Show** lists **Scheduled** when at least one of your tasks is **Active**, the **Status** a task''s detail page shows. If it isn''t listed, use the **History** list, which works whether or not the group shows.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-sesja-przebiegu-co-widac
    tresc: 'W sesji przebiegu widzisz, co zrobił Claude, przeglądasz zmiany i odpowiadasz na pytania o zgodę, a Claude zmienia tam pliki i uruchamia polecenia tak samo jak w sesji, którą zaczynasz sam.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'In a run''s session, whichever way you reached it, you can see what Claude did, review changes, and respond to permission prompts. Claude can edit files, run commands, create commits, and open pull requests, the same as in a session you start yourself.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-przebieg-nadrabiajacy
    tresc: 'Po starcie aplikacji albo wybudzeniu komputera aplikacja sprawdza opuszczone przebiegi z ostatnich siedmiu dni i uruchamia dokładnie jeden przebieg za ostatni opuszczony termin, a starsze odrzuca.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'When the app starts or your computer wakes, Desktop checks whether each task missed any runs in the last seven days. If it did, Desktop starts exactly one catch-up run for the most recently missed time and discards anything older. A daily task that missed six days runs once on wake.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-powiadomienie-o-nadrabianiu
    tresc: 'Gdy rusza przebieg nadrabiający, aplikacja pokazuje powiadomienie.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Desktop shows a notification when a catch-up run starts.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-zabezpieczenie-w-poleceniu
    tresc: 'Zadanie na 9:00 może ruszyć o 23:00, jeśli komputer spał cały dzień, więc gdy pora ma znaczenie, zabezpieczenie dopisujesz w samym poleceniu.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'A task scheduled for 9am might run at 11pm if your computer was asleep all day. If timing matters, add guardrails to the prompt itself, for example: "Only review today''s commits. If it''s after 5pm, skip the review and post a summary of what was missed."'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-tryb-wlasny-zadania
    tresc: 'Każde zadanie ma własny tryb uprawnień, który ustawiasz przy tworzeniu albo edycji zadania.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Each task has its own permission mode, which you set when creating or editing the task.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-strona-zadania
    tresc: 'Stronę zadania otwierasz w zakładce Code: Scheduled w pasku bocznym, potem zadanie na liście.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'In the **Code** tab, click **Scheduled** in the sidebar, then click a task in the list to open its detail page.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-run-now
    tresc: 'Run now uruchamia zadanie od razu, bez czekania na następny termin.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '**Run now**: start the task immediately without waiting for the next scheduled time'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-status-active-paused
    tresc: 'Status przełączasz między Active i Paused, żeby wstrzymać albo wznowić przebiegi bez usuwania zadania.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '**Status**: toggle between Active and Paused to pause or resume scheduled runs without deleting the task'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-edit-zmienia-ustawienia
    tresc: 'W Edit zmieniasz polecenie, termin, folder i inne ustawienia zadania.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '**Edit**: change the instructions, schedule, folder, or other settings'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-delete-archiwizuje-sesje
    tresc: 'Delete usuwa zadanie, a sesje, które zadanie utworzyło, trafiają do archiwum, nie są kasowane.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '**Delete**: remove the task. The sessions the task created are [archived](https://code.claude.com/docs/en/desktop.md#organize-and-find-sessions), not deleted.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-folder-zadania-zostaje
    tresc: 'Po usunięciu zadania folder z jego plikiem SKILL.md zostaje na dysku w ~/.claude/scheduled-tasks/<nazwa-zadania>/ i ten folder usuwasz sam.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'The folder holding the task''s `SKILL.md` file stays on disk at `~/.claude/scheduled-tasks/<task-name>/`, or at `scheduled-tasks/<task-name>/` under [`CLAUDE_CONFIG_DIR`](https://code.claude.com/docs/en/env-vars) if you set that variable. To remove that folder, delete it yourself.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-prosba-lista-edycja-pauza
    tresc: 'W każdej sesji aplikacji możesz poprosić Claude, żeby wypisał, utworzył, zmienił albo wstrzymał Twoje zadania.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'You can also list, create, edit, and pause tasks by asking Claude in any Desktop session. For example, "pause my dependency-audit task" or "show me my scheduled tasks."'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-usuwasz-przyciskiem-delete
    tresc: 'Zadanie usuwasz przyciskiem Delete na jego stronie.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'To delete a task, use the **Delete** button on its detail page.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-polecenie-w-pliku-skill
    tresc: 'Polecenie zadania leży w pliku ~/.claude/scheduled-tasks/<nazwa-zadania>/SKILL.md: nazwa i opis w nagłówku, polecenie pod nim; zmiany w pliku działają od następnego przebiegu.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'To edit a task''s prompt on disk, open `~/.claude/scheduled-tasks/<task-name>/SKILL.md` (or under [`CLAUDE_CONFIG_DIR`](https://code.claude.com/docs/en/env-vars) if set). The file uses YAML frontmatter for `name` and `description`, with the prompt as the body. Changes take effect on the next run.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-termin-poza-plikiem
    tresc: 'Terminu, folderu, modelu i tego, czy zadanie jest włączone, nie ma w pliku SKILL.md; zmieniasz je w formularzu Edit albo prośbą do Claude.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Schedule, folder, model, and enabled state are not in this file: change them through the Edit form or ask Claude.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  # Lekcja 8.2 zgoda-gdy-cie-nie-ma (26.10.2026)
  - id: zgoda-bez-ciebie-manual-przebieg-stoi
    tresc: 'Gdy zadanie działa w trybie Manual i potrzebuje narzędzia, na które nie ma zgody, przebieg stoi, dopóki go nie zatwierdzisz; zatwierdzasz w sesji przebiegu, odpowiadając tam na pytanie o zgodę.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'If a task runs in [Manual mode](https://code.claude.com/docs/en/desktop.md#choose-a-permission-mode) and needs to run a tool it doesn''t have permission for, the run stalls until you approve it. To approve it, [find the run''s session](#find-a-runs-session) and answer the permission prompt there.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zgoda-bez-ciebie-reguly-allow-w-sesjach-zadan
    tresc: 'Reguły zgody (allow) z pliku ~/.claude/settings.json działają też w sesjach zadań z harmonogramu.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Allow rules from `~/.claude/settings.json` also apply to scheduled task sessions.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zgoda-bez-ciebie-run-now-always-allow
    tresc: 'Żeby przebiegi nie stawały, po utworzeniu zadania klikasz Run now, patrzysz na pytania o zgodę i przy każdym wybierasz „always allow”.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'To avoid stalls, click **Run now** after creating a task, watch for permission prompts, and select "always allow" for each one.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zgoda-bez-ciebie-kolejne-przebiegi-bez-pytan
    tresc: 'Kolejne przebiegi tego zadania same zatwierdzają te same narzędzia, bez pytania.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Future runs of that task auto-approve the same tools without prompting.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zgoda-bez-ciebie-zgody-przegladasz-i-cofasz
    tresc: 'Te zapisane zgody przeglądasz i cofasz na stronie zadania.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'You can review and revoke these approvals from the task''s detail page.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zgoda-bez-ciebie-panel-always-allowed
    tresc: 'Zapisane zgody na narzędzia dla tego zadania widzisz i cofasz w panelu Always allowed na stronie zadania.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '**Review allowed permissions**: see and revoke saved tool approvals for this task from the **Always allowed** panel'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zgoda-bez-ciebie-narzedzia-pytaja-przy-kazdym-wywolaniu
    tresc: 'Narzędzia serwerów MCP oznaczone requiresUserInteraction pytają przy każdym wywołaniu i nie dają odpowiedzi „always allow”, więc przebieg, który ich używa, staje za każdym razem.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'MCP tools marked [`requiresUserInteraction`](https://code.claude.com/docs/en/mcp#require-approval-for-a-specific-tool) prompt on every call and don''t offer an always-allow option. Runs that call these tools stall each time.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zgoda-bez-ciebie-historia-pominietych-przebiegow
    tresc: 'Historia na stronie zadania pokazuje wszystkie przebiegi, także pominięte; po najechaniu na pominięty wpis widzisz powód: komputer spał, poprzedni przebieg jeszcze trwał albo szły już inne zadania; starsze wpisy ładuje Show more.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '**Review history**: see every past run, including skipped runs. Hover a skipped entry to see why: your computer was asleep, the previous run was still in progress, or other scheduled tasks were already running. Click **Show more** to load older entries.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zgoda-bez-ciebie-zaden-tryb-nie-przepuszcza-interakcji
    tresc: 'W żadnym trybie, także w bypassPermissions, Claude Code nie zatwierdza sam narzędzi wymagających interakcji: wbudowanego narzędzia AskUserQuestion i narzędzi MCP oznaczonych requiresUserInteraction.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    cytat: 'Claude Code doesn''t auto-approve the following in any mode, including `bypassPermissions`. … * Tools that require user interaction: the built-in `AskUserQuestion` tool and MCP tools marked [`requiresUserInteraction`](/docs/en/mcp#require-approval-for-a-specific-tool)'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: goal-stan-pokazuje-ostatni-powod
    tresc: 'Widok stanu celu pokazuje też ostatni powód oceniającego, więc widzisz, do czego Claude teraz dąży.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'The status view also shows the most recent reason, so you can see what Claude is working toward next.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: harmonogram-szesc-terminow-od-razu
    tresc: 'Formularz Edit, okno z Only on this computer na górze i formularz na całą stronę dają od razu wszystkie sześć opcji terminu.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'That form, the [dialog with **Only on this computer** at the top](#dialog-with-only-on-this-computer-at-the-top), and the [full-page form](#full-page-form) offer these six options:'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-wczesniejszy-uklad-pierscien-pokazuje-kontekst
    tresc: "We wcześniejszym układzie aplikacji klikasz pierścień zużycia obok wyboru modelu, a okienko pokazuje, ile zajmuje okno kontekstu."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "**[Earlier layout](#check-which-layout-you-have)**: click the usage ring next to the model picker. Its popover shows your context window usage."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-bypass-przelacznik-w-settings-claude-code
    tresc: 'Na planach Pro i Max tryb Bypass permissions włączasz w Settings → Claude Code przełącznikiem „Allow bypass permissions mode”; na planach Team i Enterprise tego przełącznika w Settings nie ma, a decyduje polityka organizacji.'
