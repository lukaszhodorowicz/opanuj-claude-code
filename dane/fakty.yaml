    wersja: "2.1.310"

  - id: aplikacja-worktree-domyslnie-wylaczony
    tresc: 'Domyślnie przełącznik Worktree jest wyłączony, a Claude pracuje w samym folderze projektu.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'By default, **Worktree** is off and Claude works in the project folder itself.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-izolacja-sesji-wymaga-gita
    tresc: 'Izolacja sesji w aplikacji wymaga gita.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Session isolation requires [Git](https://git-scm.com/downloads).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-powrot-do-sesji-klik-w-pasku-bocznym
    tresc: "Odpowiednikiem wznawiania sesji flagami --resume i --continue z terminala jest w aplikacji kliknięcie sesji w pasku bocznym."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "| `--resume`, `--continue` | Click a session in the sidebar, or type `/resume` in the prompt box to pick up a session you started from the CLI |"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-archiwizacja-z-menu-w-pasku-bocznym
    tresc: "Żeby zarchiwizować sesję w aplikacji, najeżdżasz na nią w pasku bocznym, otwierasz jej menu i wybierasz Archive; sesja przechodzi do zarchiwizowanych sesji."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "To archive a session, hover over it in the sidebar, open its menu, and select **Archive**. The session moves to your [archived sessions](#organize-and-find-sessions)."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-zarchiwizowane-group-and-sort-view-all
    tresc: "W bieżącym układzie aplikacji ikona Group and sort pojawia się po najechaniu na nagłówek listy sesji; zarchiwizowane sesje znajdziesz, gdy klikniesz ją, wybierzesz ostatni wiersz menu View all i otworzysz zakładkę Archived."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "**Current layout**: hover over a heading in the session list to show the **Group and sort** icon, then click it. To find archived sessions, select **View all**, the menu's last row, then open the **Archived** tab."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-wczesniejszy-uklad-filter-status-archived
    tresc: "We wcześniejszym układzie aplikacji ikona Filter jest widoczna bez najeżdżania; zarchiwizowane sesje pokażesz, gdy wybierzesz w niej Status, a potem Archived."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "the **Filter** icon shows without hovering. Click it to arrange the list with **Group by** or **Sort by**. To show archived sessions, select **Status**, then **Archived**."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-zmiana-nazwy-klik-tytulu
    tresc: "Żeby zmienić nazwę sesji w aplikacji, otwierasz ją i klikasz tytuł sesji w pasku tytułu."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "To rename a session, open it and click the session title in the title bar."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-popros-claude-o-nazwe-lub-archiwum
    tresc: "W aplikacji możesz też poprosić Claude, żeby zmienił nazwę sesji albo ją zarchiwizował."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "You can also ask Claude to rename or archive a session."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-karta-zgody-przed-archiwizacja
    tresc: "Zanim Claude zarchiwizuje sesję, dostajesz kartę zgody, chyba że pracujesz w trybie Auto albo Bypass permissions, w których Claude archiwizuje sesję bez karty; żeby Claude pytał, przełącz się na Manual."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "You get an approval card before Claude archives a session, except in Auto mode and Bypass permissions mode, where Claude can archive a session without one. To be asked, switch to Manual."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: sesja-zapisana-rozmowa-zwiazana-z-folderem
    tresc: "Sesja to zapisana rozmowa związana z folderem projektu; Claude Code zapisuje ją na komputerze w trakcie pracy, żeby można było wrócić tam, gdzie się skończyło, spróbować innego podejścia w odgałęzieniu albo przełączać się między zadaniami."
    zrodlo: https://code.claude.com/docs/en/sessions.md
    cytat: "A [session](https://code.claude.com/docs/en/glossary.md#session) is a saved conversation tied to a project directory. Claude Code stores it locally as you work, so you can resume where you left off, branch to try a different approach, or switch between tasks."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: sesje-opisowe-nazwy-zeby-odnalezc
    tresc: "Strona o sesjach w terminalu radzi nadawać sesjom opisowe nazwy, żeby dało się je odnaleźć w oknie wyboru sesji i wznowić po nazwie; najważniejsze jest to przy kilku zadaniach prowadzonych równolegle."
    zrodlo: https://code.claude.com/docs/en/sessions.md
    cytat: "Give sessions descriptive names so they're findable in the session picker and resumable by name. This matters most when you're working on several tasks in parallel."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: nazwa-sesji-do-200-znakow
    tresc: "Przy każdej zmianie nazwy sesji, także w aplikacji na komputer i na claude.ai, Claude Code zamienia znaki sterujące i niewidoczne na spacje i skraca nazwę do 200 znaków."
    zrodlo: https://code.claude.com/docs/en/commands.md
    cytat: "From every rename surface, including claude.ai and the desktop app, Claude Code replaces control and invisible characters in the new name with spaces and caps the name at 200 characters."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: niezwiazana-praca-nazwij-i-zacznij-od-nowa
    tresc: "Strona kosztów radzi przy przejściu do niezwiązanej pracy zacząć od nowa poleceniem /clear, bo nieaktualny kontekst marnuje tokeny przy każdej kolejnej wiadomości, a przed tym nadać sesji nazwę poleceniem /rename, żeby ją potem odnaleźć i wrócić do niej poleceniem /resume."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: "**Clear between tasks**: Use `/clear` to start fresh when switching to unrelated work. Stale context wastes tokens on every subsequent message. Use `/rename` before clearing so you can find the session later, then `/resume` to return to it."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: pierwsza-wiadomosc-po-przerwie-caly-kontekst
    tresc: "Pierwsza wiadomość po przerwie dłuższej niż czas przechowywania pamięci podręcznej (cache) nie trafia w nią i przetwarza od nowa cały kontekst rozmowy."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: "**Cache misses**: your first message after a break longer than the [cache lifetime](https://code.claude.com/docs/en/prompt-caching.md#cache-lifetime) misses the cache and reprocesses your full context."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-zapis-rozmowy-bez-limitu-wieku
    tresc: "Zapis sesji, którą zacząłeś albo ostatnio prowadziłeś w aplikacji Claude (Claude Desktop) albo w Cowork, Claude Code przechowuje bez względu na to, jak jest stary."
    zrodlo: https://code.claude.com/docs/en/claude-directory.md
    cytat: "**Claude Desktop and Cowork transcripts**: Claude Code keeps the transcript of a session you started or most recently continued in Claude Desktop or Cowork at any age."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  # Lekcja 6.2 nowa-czy-ta-sama, po kontroli prawdy 26.10.2026.
  - id: aplikacja-claude-wypisuje-inne-sesje
    tresc: "W aplikacji Claude może wypisać Twoje inne sesje z zakładki Code, przeczytać, co w każdej się działo, i przesyłać między nimi wiadomości; prosisz o to zwykłymi słowami."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Claude can list your other Code tab sessions, read what each has been doing, and send messages between them. Ask in plain language: "which session touched the auth refactor?", "what did the API session conclude?", or "tell the payments session the schema changed".'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-claude-widzi-sesje-aplikacji-bez-biezacej
    tresc: "Tą drogą Claude widzi tylko sesje uruchomione przez aplikację (lokalne, SSH i WSL w zakładce Code), nie widzi sesji w chmurze ani z terminala; nigdy nie wypisuje sesji, z której pytasz; domyślnie widzi 20 ostatnio aktywnych sesji i pomija zarchiwizowane, chyba że o nie poprosisz."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "Through this surface, Claude sees only the sessions the desktop app runs itself: local, [SSH](#ssh-sessions), and [WSL](https://code.claude.com/docs/en/desktop-wsl.md) sessions in the Code tab. Claude doesn't see cloud sessions, or sessions you started from the terminal CLI or the VS Code extension, even in worktrees of the same project, … Claude never lists the session you're asking from. By default it sees the 20 most recently active sessions and skips archived sessions unless you ask for them."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  # Lekcja 6.3 model-i-wysilek (moduł dlugie-rozmowy), etap 1, 26.10.2026.
  - id: aplikacja-wybor-modelu-w-rzedzie-zmiana-w-trakcie
    tresc: "W aplikacji model wybierasz z wyboru modelu w prawej części rzędu pod polem wiadomości i możesz go zmienić w trakcie sesji."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**Model**: pick a [model](https://code.claude.com/docs/en/model-config.md#available-models) from the model picker toward the right end of the row. You can change the model during the session.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-te-same-modele-co-w-terminalu
    tresc: "W aplikacji dostępne są te same modele co w terminalu; wybierasz je z wyboru modelu w rzędzie pod polem wiadomości i z tego samego miejsca zmieniasz model w trakcie sesji."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**Models**: the same [models](https://code.claude.com/docs/en/model-config.md#available-models) are available in both. In Desktop, select the model from the model picker in the row under the prompt box. You can change the model mid-session from the same picker.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  # Lekcja claude-czyta-strony (moduł twoje-narzedzia, lekcja 5.3), etap 1 skilla nowa-lekcja, 26.10.2026: brief z mapą tematu
  - id: aplikacja-browser-karty-dowolna-strona
    tresc: 'Panel Browser w aplikacji to przeglądarka z kartami: obok działającej aplikacji otworzysz w nim dokumentację, system zgłoszeń albo dowolną inną stronę.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'The Browser pane is a tabbed browser, so you can open documentation, issue trackers, or any other site next to your running app.'

  - id: aplikacja-browser-otwierasz-skrotem-albo-przyciskiem
    tresc: 'Panel Browser otwierasz skrótem Cmd+Shift+B na macOS albo Ctrl+Shift+B na Windows albo kliknięciem Browser na pasku tytułu sesji.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'To open the Browser, press **Cmd+Shift+B** on macOS or **Ctrl+Shift+B** on Windows, or click **Browser** in the session''s title bar.'

  - id: aplikacja-browser-logowanie-w-panelu
    tresc: 'W panelu Browser możesz logować się na stronach, także przez wyskakujące okna logowania, takie jak logowanie przez Google.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'You can sign in to sites in the pane, including popup sign-in flows such as Google OAuth.'

  - id: aplikacja-browser-okno-wyboru-przy-pierwszym-odnosniku
    tresc: 'Gdy pierwszy raz klikniesz w rozmowie odnośnik do zewnętrznej strony, okno zapyta, czy odnośniki mają się otwierać w panelu Browser, czy w domyślnej przeglądarce; wybór zmienisz pozycją Open links in built-in browser w menu ⋮ panelu Browser.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'The first time you click an external link in the chat, a dialog asks whether links open in the Browser pane or in your default browser. To change your choice later, use **Open links in built-in browser** in the Browser pane''s **⋮** menu.'

  - id: aplikacja-browser-claude-czyta-i-dziala-na-cudzych-stronach
    tresc: 'Claude może czytać cudze strony i działać na nich tymi samymi narzędziami, których używa do sprawdzania Twojej aplikacji, z dwoma dodatkowymi sprawdzeniami bezpieczeństwa.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Claude can read and interact with external pages using the same tools it uses to [verify your app](#preview-your-app), with two additional safety checks:'

  - id: aplikacja-browser-narzedzia-klikaja-i-wypelniaja-formularze
    tresc: 'Gdy Claude sam sprawdza swoje zmiany w panelu Browser, robi zrzuty ekranu, zagląda w budowę strony (DOM), klika elementy, wypełnia formularze i poprawia znalezione problemy.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Watch Claude verify its own changes automatically: it takes screenshots, inspects the DOM, clicks elements, fills forms, and fixes issues it finds'

  - id: aplikacja-browser-klasyfikator-sprawdza-klikanie-i-pisanie
    tresc: 'Na cudzych stronach klasyfikatory bezpieczeństwa sprawdzają działania Claude, które coś na stronie robią, takie jak klikanie i pisanie, w każdym trybie uprawnień; to te same klasyfikatory co w trybie Auto, a gdy oflagują działanie, dostajesz pytanie o zgodę bez względu na tryb.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Safety classifiers review Claude''s write actions on external pages, such as clicking and typing, in every permission mode. These are the same classifiers [auto mode](#choose-a-permission-mode) uses, and when they flag an action, you get a permission prompt regardless of mode.'

  - id: aplikacja-browser-lista-domen-przed-nowa-strona
    tresc: 'W trybach innych niż Auto i Bypass permissions, zanim Claude przejdzie na nową stronę, działa też sprawdzenie listy dozwolonych domen.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'In permission modes other than Auto and Bypass permissions, a domain allowlist check also applies before Claude navigates to a new site.'

  - id: aplikacja-browser-karta-zgody-przy-pierwszym-dzialaniu
    tresc: 'Gdy Claude pierwszy raz działa na cudzej stronie, pojawia się karta zgody i Claude czeka na Twój wybór: Allow once, Always allow albo Deny.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'The first time Claude acts on an external site, a permission card appears and Claude waits for your choice: **Allow once**, **Always allow**, or **Deny**.'

  - id: aplikacja-browser-allow-once-bez-zapisu
    tresc: 'Allow once zezwala na to jedno działanie i niczego nie zapisuje.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Allow once** approves the action without saving anything.'

  - id: aplikacja-browser-always-allow-zapisuje-dla-strony
    tresc: 'Always allow zapisuje zgodę dla tej strony na Twoim komputerze; cofniesz ją w ustawieniach aplikacji (Settings).'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Always allow** saves the approval for that site on your device, and you can revoke it in Settings.'

  - id: aplikacja-browser-osobna-zgoda-dla-kazdej-strony
    tresc: 'Każda strona potrzebuje osobnej zgody, także subdomeny.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Each site needs its own approval, including subdomains.'

  # Lekcja 9.2 subagent-zbiera (moduł kilka-zadan-naraz), 26.10.2026: subagent w osobnym oknie, co dostaje na start, praca w tle i panel zadań w tle.
  - id: subagent-poboczne-zadanie-oddaje-podsumowanie
    tresc: 'Subagenta używasz, gdy poboczne zadanie zalałoby główną rozmowę wynikami wyszukiwania, logami albo treścią plików, do których nie wrócisz: subagent robi tę pracę we własnym kontekście i oddaje samo podsumowanie.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'Use one when a side task would flood your main conversation with search results, logs, or file contents you won''t reference again: the subagent does that work in its own context and returns only the summary.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: remote-control-laczy-aplikacje-z-sesja-na-komputerze
    tresc: 'Remote Control łączy claude.ai/code albo aplikację Claude na iOS i Android z sesją Claude Code, która działa na Twoim komputerze. Zaczynasz zadanie przy biurku, a dalej prowadzisz je z telefonu albo z przeglądarki na innym komputerze.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Remote Control connects [claude.ai/code](https://claude.ai/code) or the Claude app for [iOS](https://apps.apple.com/us/app/claude-by-anthropic/id6473753684) and [Android](https://play.google.com/store/apps/details?id=com.anthropic.claude) to a Claude Code session running on your machine. Start a task at your desk, then pick it up from your phone on the couch or a browser on another computer.'

  - id: remote-control-claude-pracuje-na-komputerze
    tresc: 'W sesji Remote Control Claude cały czas pracuje na Twoim komputerze: wykonywanie poleceń i dostęp do plików zostają na komputerze.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'When you start a Remote Control session on your machine, Claude keeps running locally the entire time, so your code execution and filesystem access stay on your machine.'

  - id: remote-control-pliki-i-konektory-dostepne
    tresc: 'Z innego urządzenia masz całe środowisko komputera: pliki, serwery MCP, narzędzia i ustawienia projektu; po wpisaniu @ podpowiadają się ścieżki plików z folderu na komputerze.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Use your full local environment remotely**: your filesystem, [MCP servers](https://code.claude.com/docs/en/mcp.md), tools, and project configuration all stay available, and typing `@` autocompletes file paths from your local project.'

  - id: remote-control-rozmowa-na-wszystkich-urzadzeniach
    tresc: 'Rozmowa jest zsynchronizowana na wszystkich połączonych urządzeniach, więc wiadomości wysyłasz na zmianę z terminala, przeglądarki i telefonu.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Work from both surfaces at once**: the conversation and the progress of [subagents](https://code.claude.com/docs/en/sub-agents.md) and [dynamic workflows](https://code.claude.com/docs/en/workflows.md) stay in sync across all connected devices, so you can send messages from your terminal, browser, and phone interchangeably.'

  - id: remote-control-zdjecia-i-pliki-z-telefonu
    tresc: 'Z aplikacji Claude albo z claude.ai/code dołączasz zdjęcie albo plik, z podpisem albo bez. Zdjęcie Claude widzi wprost w wiadomości, a inne pliki Claude Code pobiera na komputer i podaje Claude jako odwołania @.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Send images and files from your phone or browser**: attach a photo or file in the Claude app or at claude.ai/code, with or without a caption. Claude sees attached photos directly as part of your message. Claude Code downloads other files to your machine and passes them to Claude as `@` file references.'

  - id: remote-control-wraca-po-uspieniu
    tresc: 'Gdy laptop zaśnie albo zniknie sieć, Claude Code połączy się sam, kiedy komputer znów będzie online.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Survive interruptions**: if your laptop sleeps or your network drops, Claude Code reconnects automatically when your machine comes back online.'

  - id: remote-control-nie-sesja-w-chmurze
    tresc: 'W odróżnieniu od sesji w chmurze sesja Remote Control działa na Twoim komputerze i na jego plikach. Przeglądarka i telefon są tylko oknem do tej sesji, więc komputer musi zostać włączony.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Unlike [cloud sessions](https://code.claude.com/docs/en/claude-code-on-the-web.md), which run on cloud infrastructure, Remote Control sessions run directly on your machine and interact with your local filesystem. The web and mobile interfaces are a window into that local session, so your computer has to stay on'

  - id: remote-control-plany
    tresc: 'Remote Control działa w planach Pro, Max, Team i Enterprise, nie z kluczem API. W planach Team i Enterprise najpierw musi go włączyć właściciel organizacji (Owner).'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Subscription**: available on Pro, Max, Team, and Enterprise plans. API keys are not supported. On Team and Enterprise, an Owner must first enable the Remote Control toggle in [Claude Code admin settings](https://claude.ai/admin-settings/claude-code).'

  - id: remote-control-aplikacja-polecenie-w-polu
    tresc: 'W lokalnej sesji w zakładce Code aplikacji Claude na komputer wpisujesz w polu wiadomości /remote-control albo /rc.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'In a local session in the [Claude Desktop app''s](https://code.claude.com/docs/en/desktop.md) Code tab, type `/remote-control` or `/rc` in the prompt box.'

  - id: remote-control-aplikacja-wylaczenie-poleceniem
    tresc: 'Połączoną sesję z aplikacji na komputer znajdziesz na liście sesji na claude.ai/code. Rozłączasz ją, wpisując /remote-control jeszcze raz.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Once the session connects, find it in the session list at [claude.ai/code](https://claude.ai/code). To disconnect, run `/remote-control` again.'

  - id: telefon-sesja-po-nazwie-na-liscie
    tresc: 'Na claude.ai/code albo w aplikacji Claude sesję znajdujesz po nazwie na liście sesji.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Open [claude.ai/code](https://claude.ai/code) or the Claude app** and find the session by name in the session list.'

  - id: telefon-zakladka-code-ikona-komputera
    tresc: 'W aplikacji Claude na telefonie stukasz Code w nawigacji i widzisz listę sesji. Sesja Remote Control ma ikonę komputera z zieloną kropką, gdy jest online.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'In the Claude mobile app, tap **Code** in the navigation to reach the session list. Remote Control sessions show a computer icon with a green status dot when online.'

  - id: remote-control-tytul-z-prosby
    tresc: 'Gdy nie nadasz sesji nazwy, Claude Code zmienia jej tytuł według Twojej prośby, kiedy ją wyślesz.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'If you didn''t set an explicit name, Claude Code updates the title to reflect your prompt once you send one.'

  - id: remote-control-clear-na-urzadzeniach
    tresc: 'Po /clear rozmowa zaczyna się od nowa także na połączonych urządzeniach.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'When you run `/clear`, the conversation resets on connected devices too.'

  - id: remote-control-model-z-telefonu
    tresc: 'Gdy wybierzesz model na połączonym urządzeniu, Claude Code prowadzi sesję na tym modelu.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Model**: when you pick a [model](https://code.claude.com/docs/en/model-config.md) from a connected device, Claude Code runs the session on that model.'

  - id: remote-control-wysilek-z-telefonu
    tresc: 'Poziom wysiłku ustawiony na połączonym urządzeniu Claude Code stosuje w sesji na Twoim komputerze.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Effort level**: when you set the [effort level](https://code.claude.com/docs/en/model-config.md#adjust-effort-level) from a connected device, with `/effort` or the device''s effort control, Claude Code applies it to the session on your machine.'

  - id: remote-control-tylko-twoje-konto
    tresc: 'Automatyczne łączenie loguje się Twoim kontem claude.ai, więc sesja pojawia się tylko w aplikacjach Claude na Twoim koncie i nikt inny nie dostaje do niej dostępu.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Auto-connect signs in with your own claude.ai account, so a session it starts appears only in your own account''s Claude apps and grants no one else access.'

  - id: remote-control-aplikacja-ta-sama-sesja-po-wznowieniu
    tresc: 'Gdy w aplikacji Claude na komputer wznawiasz rozmowę, która miała włączony Remote Control, Claude Code podłącza ją do tej samej sesji na claude.ai, zamiast dodawać nową do listy sesji.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'When you resume a conversation in Claude Desktop or an IDE extension that had Remote Control on, Claude Code reattaches it to the existing claude.ai session instead of adding a new one to the session list.'

  - id: remote-control-polaczenia-tylko-wychodzace
    tresc: 'Sesja na Twoim komputerze sama łączy się na zewnątrz przez HTTPS i nigdy nie otwiera na komputerze portów dla połączeń przychodzących.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Your local Claude Code session makes outbound HTTPS requests only and never opens inbound ports on your machine.'

  - id: remote-control-zapis-rozmowy-na-serwerach
    tresc: 'Dopóki Remote Control jest połączony, zapis sesji (Twoje wiadomości, odpowiedzi Claude i działania narzędzi) leży na serwerach Anthropic.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'While Remote Control is connected, the session transcript, including your messages, Claude''s responses, and tool activity, is stored on Anthropic servers.'

  - id: remote-control-a-sesja-w-chmurze-gdzie-dziala
    tresc: 'Remote Control i sesja w chmurze różnią się miejscem pracy: Remote Control działa na Twoim komputerze z jego serwerami MCP, narzędziami i ustawieniami projektu, a sesja w chmurze na infrastrukturze w chmurze, domyślnie zarządzanej przez Anthropic.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'The key difference is where the session runs: Remote Control executes on your machine, so your local MCP servers, tools, and project configuration stay available. A cloud session executes on cloud infrastructure, Anthropic-managed by default.'

  - id: remote-control-kiedy-uzywac
    tresc: 'Remote Control wybierasz, gdy jesteś w środku pracy na komputerze i chcesz ją prowadzić dalej z innego urządzenia.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Use Remote Control when you''re in the middle of local work and want to keep going from another device.'

  - id: remote-control-push-na-telefon
    tresc: 'Gdy Remote Control jest włączony, Claude może wysyłać powiadomienia push na telefon.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'When Remote Control is active, Claude can send push notifications to your phone.'

  - id: remote-control-push-wlaczasz-w-terminalu
    tresc: 'Powiadomienia push dokumentacja każe włączyć w terminalu: poleceniem /config i ustawieniem Push when Claude decides, Push when actions required albo obu.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'In your terminal, run `/config` and enable **Push when Claude decides** for proactive notifications, **Push when actions required** for permission prompts and questions, or both.'

  - id: remote-control-zamkniecie-aplikacji-sesja-offline
    tresc: 'Gdy zamkniesz aplikację Claude na komputer, w której działa sesja (albo terminal czy VS Code), sesja jest offline, dopóki jej nie przywrócisz.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'If you close the terminal, quit the Desktop app or VS Code that runs the session on your machine, or otherwise stop the `claude` process, the session goes offline until you [bring it back](#resume-sessions-after-stopping-the-server).'

  - id: remote-control-zalacznik-nie-doszedl
    tresc: 'Gdy pliku dołączonego z telefonu albo przeglądarki nie da się pobrać na komputer, Claude i tak dostaje wiadomość i pobrane pliki, a w miejscu brakujących Claude Code dopisuje notkę, na przykład [1 of 3 attachments did not arrive].'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'if a file you attach from your phone or browser can''t be downloaded to your machine, Claude still receives your message and the files that were downloaded. In place of the missing files, Claude Code adds a note such as `[1 of 3 attachments did not arrive]` to the message.'

  - id: remote-control-pytania-o-zgode-czekaja
    tresc: 'W sesji Remote Control Claude Code trzyma pytania o zgodę i pytania Claude (AskUserQuestion) otwarte, dopóki na nie nie odpowiesz.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Claude Code keeps permission prompts and `AskUserQuestion` questions open until you answer them.'

  - id: remote-control-rozlaczenie-nie-mowi-czy-pracuje
    tresc: 'Komunikat Remote Control disconnected albo Can''t reach na claude.ai/code lub w aplikacji znaczy, że przeglądarka albo aplikacja straciła kontakt z Claude Code na komputerze. Żaden z tych komunikatów nie mówi, czy Claude dalej pracuje na komputerze.'
    zrodlo: https://code.claude.com/docs/en/remote-control.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'At [claude.ai/code](https://claude.ai/code) or in the Desktop app, **Remote Control disconnected** or a **Can''t reach** message means your browser or app lost contact with Claude Code on your computer. Neither message tells you whether Claude or a subagent you were watching is still working on your computer.'

  - id: telefon-aplikacja-okno-do-sesji
    tresc: 'Aplikacja Claude na iOS i Android łączy się z sesjami Claude Code, ale nie jest miejscem, w którym działa kod.'
    zrodlo: https://code.claude.com/docs/en/mobile.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'The Claude app for [iOS](https://apps.apple.com/us/app/claude-by-anthropic/id6473753684) and [Android](https://play.google.com/store/apps/details?id=com.anthropic.claude) is a client for Claude Code sessions rather than a place where code runs.'

  - id: telefon-bez-osobnej-aplikacji-zakladka-code
    tresc: 'Claude Code nie ma osobnej aplikacji na telefon: sesje Remote Control są w zakładce Code w aplikacji Claude.'
    zrodlo: https://code.claude.com/docs/en/mobile.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Claude Code doesn''t have a separate mobile app: cloud sessions and Remote Control both live in the **Code** tab in the Claude app'

  - id: telefon-ios-android-ipad
    tresc: 'Instalujesz aplikację Claude na iOS albo Android; na iPadzie tę samą aplikację na iOS.'
    zrodlo: https://code.claude.com/docs/en/mobile.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Install the Claude app for [iOS](https://apps.apple.com/us/app/claude-by-anthropic/id6473753684) or [Android](https://play.google.com/store/apps/details?id=com.anthropic.claude). On an iPad, install the same iOS app.'

  - id: telefon-to-samo-konto
    tresc: 'Na telefonie logujesz się tym samym kontem claude.ai i do tej samej organizacji co w Claude Code.'
    zrodlo: https://code.claude.com/docs/en/mobile.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Sign in with the same claude.ai account and organization you use for Claude Code.'

  - id: telefon-brak-zakladki-code
    tresc: 'Gdy nie widzisz zakładki Code, Twój plan albo organizacja może nie obejmować tych funkcji.'
    zrodlo: https://code.claude.com/docs/en/mobile.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'If you don''t see the Code tab, your plan or organization may not include these features'

  - id: telefon-komputer-musi-dzialac
    tresc: 'Remote Control steruje Twoim komputerem, więc komputer musi zostać włączony, z działającą aplikacją Claude na komputer albo Claude Code.'
    zrodlo: https://code.claude.com/docs/en/mobile.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Remote Control and Dispatch drive your own machine, so it needs to stay on with Claude Code or the Desktop app running.'

  - id: telefon-komputer-wylaczony-chmura
    tresc: 'Gdy komputer będzie wyłączony, dokumentacja odsyła do sesji w chmurze albo projektu, które działają w chmurze także przy zamkniętym laptopie.'
    zrodlo: https://code.claude.com/docs/en/mobile.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'If your computer will be off, use cloud sessions or a project, which run in the cloud and continue with your laptop closed.'

  - id: telefon-zdjecia-w-uploads
    tresc: 'Claude Code zapisuje każde zdjęcie dołączone w aplikacji Claude w ~/.claude/uploads/ i podaje Claude ścieżkę zapisanego pliku, więc Claude może skopiować obraz do plików, które tworzy.'
    zrodlo: https://code.claude.com/docs/en/mobile.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Claude Code also saves each photo under `~/.claude/uploads/` and tells Claude the saved file path, so Claude can copy the image into files it creates.'

  - id: telefon-polecenia-tylko-lokalne
    tresc: 'Polecenia, które działają tylko w terminalu, na przykład /plugin i /resume, nie działają z aplikacji na telefon.'
    zrodlo: https://code.claude.com/docs/en/mobile.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Local-only commands**: commands that only run in the terminal interface, such as `/plugin` and `/resume`, don''t work from the app.'

  - id: telefon-tryby-bez-bypass
    tresc: 'Sesja Remote Control w aplikacji na telefon daje tryby Manual, Accept edits, Plan i Auto; Bypass permissions z aplikacji wybrać się nie da.'
    zrodlo: https://code.claude.com/docs/en/mobile.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Remote Control sessions offer Manual, Accept edits, Plan, and Auto. You can''t select Bypass permissions from the app in either case.'

  - id: telefon-tryb-plus-permission
    tresc: 'W aplikacji na telefon tryb zmieniasz przyciskiem + w polu wiadomości, a potem Permission.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'In the mobile app, tap the **+** button in the prompt box, then **Permission**.'

  - id: remote-control-aplikacja-sesja-na-innych-urzadzeniach
    tresc: 'Sesja lokalna pokazuje się na innych urządzeniach, gdy połączy ją Remote Control: na liście sesji na claude.ai/code i w aplikacjach Claude na urządzeniach zalogowanych na Twoje konto claude.ai.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'A local session shows up on your other devices once [Remote Control](/docs/en/remote-control.md) connects it. A connected session appears in the session list at [claude.ai/code](https://claude.ai/code) and in the Claude apps on devices signed in to your claude.ai account.'

  - id: remote-control-aplikacja-przelacznik-albo-polecenie
    tresc: 'W aplikacji na komputer Remote Control dla jednej sesji włączasz jej przełącznikiem Remote Control albo wpisując /remote-control w jej polu wiadomości.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**You turn it on for that session**: with the session''s **Remote Control** switch, or by typing `/remote-control` in its prompt box.'

  - id: remote-control-aplikacja-nowe-sesje-same
    tresc: 'Nowe sesje łączą się same, dopóki w Settings > Claude Code jest włączone Connect new sessions to Remote Control.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'new sessions connect automatically while **Connect new sessions to Remote Control** is on in **Settings > Claude Code**.'

  - id: aplikacja-cowork-obok-czatu-i-code
    tresc: "Aplikacja Claude na komputer ma oprócz zakładki Code także czat i Cowork, który obsługuje Dispatch i dłuższą pracę agentową."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "In the Claude Desktop app, Claude Code is the **Code** tab. The app also has chat and [Cowork](https://claude.com/product/cowork), which handles Dispatch and longer agentic work."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-sterowanie-komputerem-co-robi
    tresc: "Sterowanie komputerem (computer use) pozwala Claude otwierać Twoje aplikacje, sterować ekranem i pracować bezpośrednio na Twoim komputerze tak, jak robisz to Ty."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "Computer use lets Claude open your apps, control your screen, and work directly on your machine the way you would."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-browser-pliki-projektu-bez-zgody
    tresc: 'Twoje lokalne serwery deweloperskie i pliki projektu nie potrzebują tej zgody.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Your local dev servers and project files don''t need approval, so [auto-verify](#auto-verify-changes) keeps working without prompts.'

  - id: aplikacja-browser-bez-zakupow-kont-captcha
    tresc: 'Nawet na stronie, na którą się zgodziłeś, Claude bez Twojego udziału nie kupuje, nie zakłada kont i nie obchodzi zabezpieczeń CAPTCHA.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Even on an approved site, Claude won''t purchase items, create accounts, or bypass CAPTCHAs without your input.'

  - id: aplikacja-browser-ten-sam-model-bezpieczenstwa-co-chrome
    tresc: 'Przeglądanie w panelu Browser korzysta z tego samego modelu bezpieczeństwa co rozszerzenie Claude in Chrome.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Browsing in the Browser pane uses the same safety model as the [Claude in Chrome extension](https://code.claude.com/docs/en/chrome.md).'

  - id: aplikacja-browser-czysty-profil
    tresc: 'Panel Browser używa czystego profilu przeglądarki, oddzielnego od Twojej przeglądarki, bez Twoich zapisanych logowań i historii.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'The Browser pane uses a clean browser profile, separate from your personal browser, with none of your saved logins or history.'

  - id: aplikacja-browser-do-stron-bez-twojej-tozsamosci
    tresc: 'Panel Browser jest do budowania i sprawdzania aplikacji oraz do stron, które nie potrzebują Twojej tożsamości.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Use it for building and testing your app and for sites that don''t need your identity.'

  - id: aplikacja-browser-chrome-gdy-claude-ma-dzialac-jako-ty
    tresc: 'Gdy Claude ma działać jako Ty na stronach, na których jesteś zalogowany, dokumentacja każe zamiast panelu Browser użyć rozszerzenia Claude in Chrome, które dzieli stan logowania Twojej przeglądarki.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'When you want Claude to act as you in your logged-in sessions, use the [Claude in Chrome extension](https://code.claude.com/docs/en/chrome.md) instead, which shares your browser''s login state.'

  - id: aplikacja-browser-organizacja-listy-stron-i-wylaczenie-narzedzi
    tresc: 'Panel Browser stosuje te same listy dozwolonych i zablokowanych stron co rozszerzenie Claude in Chrome; administrator może wyłączyć narzędzia Claude na cudzych stronach, a wtedy nadal je odwiedzasz, ale Claude ich nie czyta i nic na nich nie robi.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'The Browser follows the same [site allowlist and blocklist controls](https://support.claude.com/en/articles/13065128-claude-in-chrome-admin-controls) as the Claude in Chrome extension. … Administrators can also turn off Claude''s tools on external pages with the [`browserExternalPageTools` managed setting](#managed-settings). With tools disabled, users can still visit external sites; Claude''s tools can''t read or act on them.'

  - id: aplikacja-browser-wylaczenie-browser-tools
    tresc: 'Żeby całkiem wyłączyć panel Browser, wyłączasz Browser tools w Settings > Claude Code.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'To turn the Browser off entirely, turn off **Browser tools** in **Settings > Claude Code**.'

  - id: aplikacja-browser-czyszczenie-danych
    tresc: 'Zapisane dane panelu Browser wyczyścisz pozycją Clear browsing data w menu ⋮ panelu.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'To clear the Browser''s saved data, select **Clear browsing data** in the Browser pane''s **⋮** menu.'

  - id: aplikacja-ssh-bez-narzedzi-panelu-browser
    tresc: 'W sesji SSH Claude nie otworzy Twojej aplikacji w panelu Browser, bo nie ma tam narzędzi tego panelu.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'In an [SSH session](#ssh-sessions), Claude can''t open your app in the Browser pane, because it doesn''t have the pane''s tools there.'

  - id: aplikacja-bypass-pyta-przy-dzialaniu-na-cudzych-stronach
    tresc: 'Tryb Bypass permissions nie pyta o zgodę poza wyjątkami; jednym z nich są klasyfikatory bezpieczeństwa, gdy Claude działa na cudzych stronach.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Claude runs without permission prompts, except for the [actions no mode auto-approves](https://code.claude.com/docs/en/permission-modes.md#actions-no-mode-auto-approves), safety classifiers when Claude [acts on external sites](#browse-external-sites), or desktop actions such as deleting a session'

  - id: aplikacja-podglad-pyta-przy-pierwszym-wejsciu-na-nowa-strone
    tresc: 'Adres spoza Twojego komputera aplikacja otwiera w podglądzie dopiero po Twojej zgodzie przy pierwszym razie, tak samo jak przy przejściu do nowej strony w podglądzie; Always allow pomija to pytanie dla tej strony w przyszłości.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'For any other address, Desktop asks for your permission the first time the preview opens it, the same as when you browse to a new site in the preview. … Choose **Always allow** to skip the prompt for that site in the future.'

  - id: chrome-rozszerzenie-z-terminala-i-vs-code
    tresc: 'Claude Code współpracuje z rozszerzeniem przeglądarki Claude in Chrome, które daje mu sterowanie przeglądarką z terminala (CLI) albo z rozszerzenia VS Code.'
    zrodlo: https://code.claude.com/docs/en/chrome.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Claude Code integrates with the [Claude in Chrome browser extension](https://chromewebstore.google.com/detail/claude/fcoeoabgfenejglbffodgkkbkcdhcgfn) to give you browser automation capabilities from the CLI or the [VS Code extension](https://code.claude.com/docs/en/vs-code.md#automate-browser-tasks-with-chrome).'

  - id: chrome-dzieli-logowanie-przegladarki
    tresc: 'Z rozszerzeniem Claude otwiera nowe karty do zadań w przeglądarce i dzieli stan logowania Twojej przeglądarki, więc ma dostęp do każdej strony, na której już jesteś zalogowany.'
    zrodlo: https://code.claude.com/docs/en/chrome.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Claude opens new tabs for browser tasks and shares your browser''s login state, so it can access any site you''re already signed into.'

  - id: chrome-widoczne-okno-i-pauza-przy-logowaniu
    tresc: 'Działania rozszerzenia widać na bieżąco w oknie Chrome; gdy Claude trafi na stronę logowania albo CAPTCHA, zatrzymuje się i prosi, żebyś zrobił to sam.'
    zrodlo: https://code.claude.com/docs/en/chrome.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Browser actions run in a visible Chrome window in real time. When Claude encounters a login page or CAPTCHA, it pauses and asks you to handle it manually.'

  - id: chrome-mozliwosci-aplikacje-dane-formularze
    tresc: 'Z rozszerzeniem Claude pracuje w aplikacjach, w których jesteś zalogowany (Google Docs, Gmail, Notion), bez konektorów, wyciąga dane ze stron i zapisuje je na komputerze oraz automatyzuje powtarzalne zadania, takie jak wpisywanie danych i wypełnianie formularzy.'
    zrodlo: https://code.claude.com/docs/en/chrome.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Authenticated web apps**: interact with Google Docs, Gmail, Notion, or any app you''re logged into without API connectors … **Data extraction**: pull structured information from web pages and save it locally … **Task automation**: automate repetitive browser tasks like data entry, form filling, or multi-site workflows'

  - id: chrome-wymagania-przegladarka-sklep-plan
    tresc: 'Rozszerzenie wymaga przeglądarki Chrome, Edge albo innej opartej na Chromium, rozszerzenia Claude in Chrome ze sklepu Chrome Web Store i bezpośredniego planu Anthropic: Pro, Max, Team albo Enterprise.'
    zrodlo: https://code.claude.com/docs/en/chrome.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '[Google Chrome](https://www.google.com/chrome/), [Microsoft Edge](https://www.microsoft.com/edge), or another Chromium-based browser such as Brave, Arc, Vivaldi, or Opera … available in the Chrome Web Store … A direct Anthropic plan (Pro, Max, Team, or Enterprise)'

  - id: dane-trening-konta-konsumenckie-za-zgoda
    tresc: 'Na kontach Free, Pro i Max sam wybierasz, czy Twoje dane posłużą do ulepszania przyszłych modeli Claude; Anthropic trenuje nowe modele na danych z tych kont, gdy to ustawienie jest włączone, także gdy używasz Claude Code.'
    zrodlo: https://code.claude.com/docs/en/data-usage.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'We give you the choice to allow your data to be used to improve future Claude models. We will train new models using data from Free, Pro, and Max accounts when this setting is on (including when you use Claude Code from these accounts).'

  - id: dane-konta-firmowe-bez-treningu
    tresc: 'Na planach Team i Enterprise, w API i na platformach zewnętrznych Anthropic nie trenuje modeli generatywnych na kodzie ani na promptach wysłanych do Claude Code na warunkach komercyjnych, chyba że klient sam zdecydował się udostępnić dane do ulepszania modeli.'
    zrodlo: https://code.claude.com/docs/en/data-usage.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Commercial users**: (Team and Enterprise plans, API, 3rd-party platforms, and Claude Gov) maintain existing policies: Anthropic does not train generative models using code or prompts sent to Claude Code under commercial terms, unless the customer has chosen to provide their data to us for model improvement'

  - id: dane-przechowywanie-konta-konsumenckie-5-lat-albo-30-dni
    tresc: 'Anthropic przechowuje dane Claude Code według rodzaju konta i Twoich ustawień: na kontach Free, Pro i Max 5 lat, gdy zgadzasz się na użycie danych do ulepszania modeli, a 30 dni, gdy się nie zgadzasz.'
    zrodlo: https://code.claude.com/docs/en/data-usage.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Anthropic retains Claude Code data based on your account type and preferences. … **Consumer users (Free, Pro, and Max plans)**: … Users who allow data use for model improvement: 5-year retention period to support model development and safety improvements … Users who don''t allow data use for model improvement: 30-day retention period'

  - id: dane-ustawienia-prywatnosci-w-kazdej-chwili
    tresc: 'Na kontach Free, Pro i Max ustawienia prywatności zmienisz w każdej chwili na stronie claude.ai/settings/data-privacy-controls.'
    zrodlo: https://code.claude.com/docs/en/data-usage.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Consumer users (Free, Pro, and Max plans)**: … Privacy settings can be changed at any time at [claude.ai/settings/data-privacy-controls](https://claude.ai/settings/data-privacy-controls).'

  - id: dane-konta-firmowe-30-dni
    tresc: 'Na planach Team i Enterprise oraz w API standardowy okres przechowywania danych Claude Code to 30 dni.'
    zrodlo: https://code.claude.com/docs/en/data-usage.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Commercial users (Team, Enterprise, and API)**: … Standard: 30-day retention period'

  - id: dane-zapis-rozmow-na-komputerze-30-dni
    tresc: 'Claude Code zapisuje przebieg rozmów na Twoim komputerze jawnym tekstem (plaintext) w folderze ~/.claude/projects/, domyślnie na 30 dni, żeby dało się wrócić do rozmowy.'
    zrodlo: https://code.claude.com/docs/en/data-usage.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Local caching: Claude Code clients store session transcripts locally in plaintext under `~/.claude/projects/` for 30 days by default to enable session resumption.'

  - id: aplikacja-zapis-rozmow-bez-limitu-30-dni
    tresc: 'Przebieg rozmów rozpoczętych albo ostatnio kontynuowanych w aplikacji Claude na komputer (Claude Desktop) albo w Cowork domyślnie nie podlega temu limitowi 30 dni.'
    zrodlo: https://code.claude.com/docs/en/data-usage.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Transcripts of sessions started or most recently continued in Claude Desktop or Cowork are [exempt from that limit by default](https://code.claude.com/docs/en/claude-directory.md#cleaned-up-automatically).'

  - id: dane-pelne-zasady-w-regulaminach
    tresc: 'Pełne zasady opisują Warunki handlowe (Team, Enterprise, API) albo Warunki dla konsumentów (Free, Pro, Max) oraz Polityka prywatności Anthropic.'
    zrodlo: https://code.claude.com/docs/en/data-usage.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'For full details, please review our [Commercial Terms of Service](https://www.anthropic.com/legal/commercial-terms) (for Team, Enterprise, and API users) or [Consumer Terms](https://www.anthropic.com/legal/consumer-terms) (for Free, Pro, and Max users) and [Privacy Policy](https://www.anthropic.com/legal/privacy).'

  - id: remote-control-zapis-rozmowy-na-serwerach-anthropic
    tresc: 'Rozmowa połączona przez Remote Control działa na Twoim komputerze jak zwykła sesja lokalna, ale dopóki jest połączona, jej przebieg jest też przechowywany na serwerach Anthropic, żeby rozmowa była widoczna na innych urządzeniach.'
    zrodlo: https://code.claude.com/docs/en/data-usage.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '[Remote Control](https://code.claude.com/docs/en/remote-control.md) sessions follow the local data flow since all execution happens on your machine; while connected, the session transcript is also stored on Anthropic servers to sync the conversation across devices'

  - id: aplikacja-remote-control-rozmowa-na-innych-urzadzeniach
    tresc: 'Sesja lokalna aplikacji pojawia się na Twoich innych urządzeniach, gdy połączy ją Remote Control: wtedy widać ją na liście sesji na claude.ai/code i w aplikacjach Claude na urządzeniach zalogowanych na Twoje konto claude.ai.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'A local session shows up on your other devices once [Remote Control](https://code.claude.com/docs/en/remote-control.md) connects it. A connected session appears in the session list at [claude.ai/code](https://claude.ai/code) and in the Claude apps on devices signed in to your claude.ai account.'

  - id: dane-prompty-i-odpowiedzi-szyfrowane-w-drodze
    tresc: 'Claude Code działa na Twoim komputerze, ale żeby korzystać z modelu, wysyła dane przez sieć: wszystkie prompty i wszystkie odpowiedzi modelu, szyfrowane w drodze (TLS 1.2 lub nowszy).'
    zrodlo: https://code.claude.com/docs/en/data-usage.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Claude Code runs locally. To interact with the LLM, Claude Code sends data over the network. This data includes all user prompts and model outputs, encrypted in transit via TLS 1.2+.'

  - id: aplikacja-sesje-lokalne-wysylaja-rozmowe-do-dostawcy-modelu
    tresc: 'Sesje lokalne i SSH w aplikacji wysyłają rozmowę i kontekst kodu do dostawcy modelu, którego ustawia wdrożenie, domyślnie do API Anthropic.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Cloud sessions, including in a self-hosted environment, send conversations and code context to Anthropic''s API for processing; local and SSH sessions send them to whichever [model provider](#feature-comparison) your deployment configures, Anthropic''s API by default.'

  - id: dane-api-anthropic-szyfrowanie-dyskow
    tresc: 'U dostawcy Anthropic API dane zapisane na serwerach chroni szyfrowanie dysków na poziomie infrastruktury (AES-256).'
    zrodlo: https://code.claude.com/docs/en/data-usage.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Encryption at rest depends on your model provider: … | Anthropic API | Infrastructure-level disk encryption (AES-256).'

  - id: dane-metryki-bez-tresci
    tresc: 'Metryki (opóźnienia, niezawodność, sposób używania) trafiają do Anthropic i do zewnętrznej usługi zapisu logów szyfrowanym połączeniem i nigdy nie zawierają Twojego kodu, promptów ani ścieżek plików.'
    zrodlo: https://code.claude.com/docs/en/data-usage.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Metrics**: latency, reliability, and usage patterns, sent to Anthropic and to third-party logging infrastructure over TLS. Metrics never include your code, prompts, or file paths.'

  - id: dane-raporty-bledow-bez-danych-osobowych
    tresc: 'Raporty błędów (komunikaty i ślady błędów samego Claude Code) trafiają do zewnętrznej usługi śledzenia błędów; zanim cokolwiek opuści komputer, Claude Code usuwa z nich znane wzorce sekretów, ścieżki plików, adresy e-mail i inne dane osobowe.'
    zrodlo: https://code.claude.com/docs/en/data-usage.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Error reports**: error messages and stack traces from Claude Code''s own internals, sent to a third-party error tracking service over TLS. Claude Code redacts known patterns of secrets, file paths, email addresses, and other personal information before anything leaves your machine.'

  - id: dane-raporty-bledow-wlaczone-pro-max
    tresc: 'Raporty błędów są włączone tylko wtedy, gdy jednocześnie logujesz się subskrypcją Claude Pro albo Max, masz Claude Code w wersji 2.1.198 lub nowszej, łączysz się wprost z Claude API, a Twoja organizacja nie ma umowy o zerowym przechowywaniu danych ani umowy HIPAA.'
    zrodlo: https://code.claude.com/docs/en/data-usage.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Error reporting is on only when all of these apply: … you sign in with a Claude Pro or Max subscription … you''re running Claude Code v2.1.198 or later … you''re connecting directly to the Claude API … your organization doesn''t have a zero data retention or HIPAA agreement'

  - id: ukryte-polecenie-definicja
    tresc: 'Prompt injection (wstrzyknięcie polecenia) to technika, w której atakujący próbuje zmienić instrukcje asystenta AI albo nimi pokierować, wstawiając złośliwy tekst; Claude Code ma kilka zabezpieczeń przed takimi atakami.'
    zrodlo: https://code.claude.com/docs/en/security.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Prompt injection is a technique where an attacker attempts to override or manipulate an AI assistant''s instructions by inserting malicious text. Claude Code includes several safeguards against these attacks'

  - id: manual-wrazliwe-dzialania-wymagaja-zgody
    tresc: 'Wśród zabezpieczeń przed prompt injection dokumentacja wymienia system uprawnień: w trybie Manual działania wrażliwe wymagają Twojej wyraźnej zgody.'
    zrodlo: https://code.claude.com/docs/en/security.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Protect against prompt injection … Core protections … **Permission system**: In Manual mode, sensitive operations require explicit approval'

  - id: manual-zadania-sieciowe-wymagaja-zgody
    tresc: 'W trybie Manual większość narzędzi, które wysyłają zapytania do sieci, domyślnie wymaga Twojej zgody.'
    zrodlo: https://code.claude.com/docs/en/security.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Network request approval**: In Manual mode, most tools that make network requests require user approval by default'

  - id: dane-ograniczony-czas-i-dostep
    tresc: 'Wśród zabezpieczeń Twoich danych Anthropic wymienia ograniczony czas przechowywania informacji wrażliwych i ograniczony dostęp do danych sesji.'
    zrodlo: https://code.claude.com/docs/en/security.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'We have implemented several safeguards to protect your data, including: … Limited retention periods for sensitive information … Restricted access to user session data'

  - id: rady-praca-z-niesprawdzonymi-tresciami
    tresc: 'Przy pracy z niesprawdzonymi treściami dokumentacja radzi między innymi: przeglądać proponowane polecenia przed zgodą, nie przesyłać niesprawdzonych treści wprost do Claude i sprawdzać proponowane zmiany w ważnych plikach.'
    zrodlo: https://code.claude.com/docs/en/security.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Best practices for working with untrusted content**: … Review suggested commands before approval … Avoid piping untrusted content directly to Claude … Verify proposed changes to critical files'

  - id: zadna-ochrona-nie-jest-pelna
    tresc: 'Te zabezpieczenia znacznie zmniejszają ryzyko, ale żaden system nie jest całkowicie odporny na wszystkie ataki; przy pracy z każdym narzędziem AI trzeba dbać o dobre zasady bezpieczeństwa.'
    zrodlo: https://code.claude.com/docs/en/security.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'While these protections significantly reduce risk, no system is completely immune to all attacks. Always maintain good security practices when working with any AI tool.'

  - id: katalog-konektorow-przeglad-bez-audytu
    tresc: 'Dokumentacja zachęca, by używać serwerów MCP od dostawców, którym ufasz (albo pisać własne); Anthropic sprawdza konektory według swoich kryteriów, zanim doda je do katalogu Anthropic Directory, ale nie przeprowadza audytu bezpieczeństwa żadnego serwera MCP i nim nie zarządza.'
    zrodlo: https://code.claude.com/docs/en/security.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'We encourage either writing your own MCP servers or using MCP servers from providers that you trust. … Anthropic reviews connectors against its [listing criteria](https://claude.com/docs/connectors/building/review-criteria) before adding them to the [Anthropic Directory](https://claude.ai/directory), but does not security-audit or manage any MCP server.'

  - id: konektor-tresci-z-zewnatrz-ryzyko-wstrzykniecia
    tresc: 'Zanim podłączysz serwer MCP, sprawdź, czy mu ufasz: serwery, które pobierają treści z zewnątrz, mogą narazić Cię na prompt injection.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Verify you trust each server before connecting it. Servers that fetch external content can expose you to [prompt injection risk](https://code.claude.com/docs/en/security.md#protect-against-prompt-injection).'

  - id: dane-ankieta-tak-wysyla-przebieg-rozmowy
    tresc: 'Po ocenie sesji Claude Code może zapytać, czy Anthropic może zajrzeć do przebiegu rozmowy; odpowiedź „Yes” wysyła do Anthropic przebieg rozmowy, przebiegi subagentów i plik dziennika sesji z dysku, przy czym znane wzorce kluczy API i tokenów są usuwane, a kod, treść plików i reszta rozmowy idą bez zmian; udostępnione przebiegi są przechowywane do 6 miesięcy, a bez wyboru „Yes” nic nie jest wysyłane.'
    zrodlo: https://code.claude.com/docs/en/data-usage.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'After the rating prompt, you may see a separate follow-up asking "Can Anthropic look at your session transcript to help us improve Claude Code?". … **Yes**: uploads your conversation transcript, any subagent transcripts, and the raw session log file from disk to Anthropic. Known API key and token patterns are redacted before upload. Source code, file contents, and other conversation content are uploaded as-is. Shared transcripts are retained for up to 6 months. … Nothing is uploaded unless you explicitly select **Yes**.'

  - id: dane-feedback-wysyla-historie-z-kodem-5-lat
    tresc: 'Polecenie /feedback (a także /bug i /share, które zgłaszają tą samą drogą) wysyła do Anthropic kopię historii rozmowy razem z kodem; przebiegi udostępnione tą drogą są przechowywane 5 lat.'
    zrodlo: https://code.claude.com/docs/en/data-usage.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Transcripts shared via `/feedback`, or via `/bug` and `/share`, which report through the same path, are retained for 5 years. … When you run the `/feedback` command, a copy of your conversation history including code is sent to Anthropic. The `/bug` and `/share` commands submit through the same path.'

  # Lekcja pierwszy-konektor (moduł 5, lekcja 1), 26.10.2026
  - id: mcp-czym-jest
    tresc: 'Claude Code łączy się z setkami zewnętrznych narzędzi i źródeł danych przez Model Context Protocol (MCP), otwarty standard łączenia AI z narzędziami; serwery MCP dają Claude Code dostęp do Twoich narzędzi, baz danych i API.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    cytat: 'Claude Code can connect to hundreds of external tools and data sources through the [Model Context Protocol (MCP)](https://modelcontextprotocol.io/introduction), an open source standard for AI-tool integrations. MCP servers give Claude Code access to your tools, databases, and APIs.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: mcp-po-co-zamiast-przeklejania
    tresc: 'Serwer podłącz wtedy, gdy przeklejasz do rozmowy dane z innego narzędzia; po podłączeniu Claude czyta to narzędzie i działa w nim wprost, zamiast pracować na tym, co wkleisz.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    cytat: 'Connect a server when you find yourself copying data into chat from another tool, like an issue tracker or a monitoring dashboard. Once connected, Claude can read and act on that system directly instead of working from what you paste.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: mcp-przyklad-szkice-maili-gmail
    tresc: 'Z podłączonymi serwerami MCP możesz poprosić Claude Code na przykład o szkice maili w Gmailu z zaproszeniem dla 10 osób na spotkanie z opiniami o nowej funkcji.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    cytat: '**Automate workflows**: "Create Gmail drafts inviting these 10 users to a feedback session about the new feature."'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-konektor-to-serwer-mcp-z-kreatorem
    tresc: 'W aplikacji na komputer konektory to serwery MCP, które konfigurujesz w okienkach aplikacji.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Connectors are [MCP servers](https://code.claude.com/docs/en/mcp.md) with a graphical setup flow.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  # Elementy ekranu lekcji wtyczki (moduł 4, lekcja 4): przeglądarka wtyczek z menu +, przepisane dosłownie z gałęzi modul-4; przy scalaniu zostaje po jednym wpisie.
  - id: aplikacja-add-plugins-otwiera-przegladarke-wtyczek
    tresc: 'W sesji lokalnej albo SSH klikasz + obok pola wiadomości i wybierasz Add plugins; to otwiera przeglądarkę wtyczek.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'In a local session or an [SSH session](#ssh-sessions), click **+** next to the prompt box and select **Add plugins** to open the plugin browser.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-plugins-browse-albo-manage-plugins
    tresc: 'Gdy menu pokazuje Plugins zamiast Add plugins, wybierasz Plugins, a potem Browse plugins albo Manage plugins, w którym włączasz, wyłączasz i odinstalowujesz wtyczki.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'If the menu shows **Plugins** instead, select it, then **Browse plugins**, or **Manage plugins** to enable, disable, or uninstall plugins.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-wtyczki-nie-w-chmurze-i-wsl
    tresc: 'Przeglądarki wtyczek nie ma w sesjach w chmurze, wtyczki zainstalowane z aplikacji nie działają w sesjach w chmurze, a w sesjach WSL wtyczek nie ma.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'The plugin browser is not available in cloud sessions, and plugins you install from the desktop app aren''t available for cloud sessions. A cloud session also doesn''t install plugins that the repository''s `.claude/settings.json` declares, as [What carries over from your setup](https://code.claude.com/docs/en/cloud-environments.md#what-carries-over-from-your-setup) explains. Plugins aren''t available in WSL sessions.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-wtyczki-menedzer-zamiast-polecenia-plugin
    tresc: 'W terminalu wtyczkami zarządza polecenie /plugin, a w aplikacji na komputer graficzny menedżer wtyczek.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '| [Plugins](https://code.claude.com/docs/en/plugins/overview.md) | `/plugin` command | Plugin manager UI |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-przegladarka-wtyczek-z-twoich-katalogow
    tresc: 'Przy instalacji z aplikacji klikasz + obok pola wiadomości i Add plugins (albo Plugins, a potem Browse plugins); przeglądarka wtyczek otwiera się z wtyczkami z Twoich katalogów.'
    zrodlo: https://code.claude.com/docs/en/plugins/install.md
    cytat: 'Click the **+** button next to the prompt box and select **Add plugins**. If the **+** menu shows **Plugins** instead of **Add plugins**, select **Plugins**, then **Browse plugins**. The plugin browser opens with the plugins from your marketplaces.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-instalacja-znajdz-i-wybierz-wtyczke
    tresc: 'Przy instalacji z aplikacji znajdujesz wtyczkę w przeglądarce i ją wybierasz (w przykładzie dokumentacji to commit-commands).'
    zrodlo: https://code.claude.com/docs/en/plugins/install.md
    cytat: 'Find `commit-commands` and select it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: katalog-dodajesz-gdy-wtyczki-nie-ma-w-oficjalnym
    tresc: 'Katalog trzeba dodać tylko wtedy, gdy wtyczki nie ma w oficjalnym katalogu Anthropic, na przykład gdy opublikował ją współpracownik albo pochodzi z katalogu społeczności Anthropic.'
    zrodlo: https://code.claude.com/docs/en/plugins/install.md
    cytat: 'You only need this section when the plugin you want isn''t in Anthropic''s official marketplace, for example one a coworker published or one from Anthropic''s community marketplace.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczki-aktualizuja-sie-z-katalogu
    tresc: 'Wtyczki aktualizują się same, gdy katalog, z którego pochodzą, ma włączoną automatyczną aktualizację.'
    zrodlo: https://code.claude.com/docs/en/plugins/install.md
    cytat: 'Plugins update automatically when the marketplace they came from has auto-update turned on.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: oficjalny-katalog-auto-aktualizacja-domyslnie-wlaczona
    tresc: 'Automatyczna aktualizacja jest domyślnie włączona w katalogu claude-plugins-official i w innych katalogach o oficjalnych nazwach (poza knowledge-work-plugins i first-party-plugins) oraz w katalogach dodanych z claude.ai.'
    zrodlo: https://code.claude.com/docs/en/plugins/install.md
    cytat: '**On by default**: `claude-plugins-official` and the other [official marketplace names](https://code.claude.com/docs/en/plugins/security.md#official-marketplace-names) except `knowledge-work-plugins` and `first-party-plugins`, plus [marketplaces added from claude.ai](#add-from-claude-ai).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: inne-katalogi-auto-aktualizacja-domyslnie-wylaczona
    tresc: 'W każdym innym katalogu, także w katalogu społeczności, w katalogach innych wydawców i w lokalnych katalogach roboczych, automatyczna aktualizacja jest domyślnie wyłączona.'
    zrodlo: https://code.claude.com/docs/en/plugins/install.md
    cytat: '**Off by default**: every other marketplace, including the community marketplace, third-party marketplaces, and local development marketplaces.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-folder-instalowany-jako-calosc
    tresc: 'Wtyczka Claude Code to folder ze skillami, agentami, hookami, serwerami MCP albo innymi składnikami, który Claude Code instaluje i ładuje jako jedną całość.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: 'A Claude Code plugin is a directory of skills, agents, hooks, MCP servers, or other components that Claude Code installs and loads as one unit.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczki-zwykle-z-katalogu
    tresc: 'Większość wtyczek pochodzi z katalogu (marketplace), czyli spisu wtyczek z miejscem, skąd pobrać każdą z nich.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: 'Most plugins come from a marketplace, which is a catalog that lists plugins and where to fetch each one.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-manifest-nazwa-wersja-opis
    tresc: 'Manifest wtyczki, plik JSON .claude-plugin/plugin.json, nadaje jej nazwę i może dodać wersję, opis i inne dane.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: 'The manifest, a JSON file at `.claude-plugin/plugin.json`, gives the plugin its name and can add a version, a description, and other [metadata](https://code.claude.com/docs/en/plugins/manifest-reference.md).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-skladnik-skille
    tresc: 'Skille wtyczki to instrukcje SKILL.md, które Claude ładuje, gdy pasują, i które możesz też uruchomić jak polecenie.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: '[**Skills**](https://code.claude.com/docs/en/plugins/components.md#skills): `SKILL.md` instructions Claude loads when relevant, and that you can also run as a command'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-skladnik-agenci
    tresc: 'Agenci wtyczki to opisy subagentów, którym Claude może przekazać pracę.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: '[**Agents**](https://code.claude.com/docs/en/plugins/components.md#agents): subagent definitions Claude can delegate to'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-skladnik-hooki
    tresc: 'Hooki wtyczki to polecenia, które Claude Code uruchamia w określonych momentach pracy, na przykład po każdej edycji.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: '[**Hooks**](https://code.claude.com/docs/en/plugins/components.md#hooks): commands Claude Code runs at points in its lifecycle, such as after every edit'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-skladnik-serwery-mcp
    tresc: 'Serwery MCP wtyczki to serwery narzędzi, z którymi Claude Code łączy się, dopóki wtyczka jest włączona.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: '[**MCP servers**](https://code.claude.com/docs/en/plugins/components.md#mcp-servers): tool servers Claude Code connects to while the plugin is enabled'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-hook-mcp-dzialaja-bez-wtyczki
    tresc: 'Skille, subagenci, hooki i serwery MCP działają też bez wtyczki; na przykład skill zapisany w ~/.claude/skills/ jest dostępny w każdym projekcie na Twoim komputerze.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: 'Skills, subagents, hooks, and MCP servers all work on their own, without a plugin. A skill you save in `~/.claude/skills/`, for example, is available in every project on your machine.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-gdy-kilka-rzeczy-naraz-cudzy-zestaw
    tresc: 'Wtyczkę wybierasz, gdy chcesz kilka skilli, subagentów, hooków albo serwerów MCP w jednej paczce; instalując ją, dostajesz zestaw zbudowany przez kogoś innego, jednym poleceniem i z aktualizacjami z jego katalogu.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: 'Use a plugin when you want several skills, subagents, hooks, or MCP servers packaged as one unit. Install one to get a setup someone else built, with one command and updates from its marketplace.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-wlaczona-jest-w-kazdej-sesji
    tresc: 'Włączona wtyczka jest częścią każdej sesji, nie tylko tych, w których jej używasz.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: 'An enabled plugin is part of every session, not only the sessions where you use it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-nazwy-i-opisy-w-kazdej-turze
    tresc: 'Nazwa i opis każdego skilla, agenta i polecenia wtyczki, po które Claude może sięgnąć sam, są w kontekście w każdej turze; te tokeny liczą się do zużycia i zajmują miejsce w oknie kontekstu także wtedy, gdy nic z wtyczki nie działa; pełna treść skilla albo agenta ładuje się dopiero przy użyciu.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: 'for each skill, agent, and command that [Claude can invoke on its own](https://code.claude.com/docs/en/skills.md#control-who-invokes-a-skill), the name and description are in Claude''s context on every turn so that Claude knows it exists. Those tokens count toward your usage and leave less room in the [context window](https://code.claude.com/docs/en/context-window.md) even in sessions where nothing from the plugin runs. The full text of a skill or agent loads only when it''s used.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-serwery-mcp-i-hooki-dzialaja-w-sesji
    tresc: 'Serwery MCP wtyczki działają obok każdej sesji, w której jest włączona, a jej hooki odpalają się przy swoich zdarzeniach.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: '**Processes**: MCP servers the plugin defines run alongside each session where it''s enabled, and its hooks fire at their events.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-dziala-jako-ty
    tresc: 'To, co wtyczka uruchamia, uruchamia jako Ty.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: '**Permissions**: what the plugin runs, it runs as you.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: katalog-wtyczek-spis-nie-sklep
    tresc: 'Katalog wtyczek to repozytorium albo folder z plikiem .claude-plugin/marketplace.json, który wymienia wtyczki i miejsca, skąd je pobrać; to spis, nie sklep; katalog dodajesz raz, a potem instalujesz z niego wtyczki po nazwie.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: 'A marketplace is a repository or directory with a `.claude-plugin/marketplace.json` file that lists plugins and where to fetch each one. It''s a catalog, not a hosted store. You add a marketplace once, then install plugins from it by name'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: katalog-wtyczek-to-nie-claude-marketplace
    tresc: 'Katalog wtyczek to nie Claude Marketplace: Claude Marketplace to strona claude.com/marketplace, na której przeglądasz wtyczki, konektory, produkty i usługi partnerów.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: 'A plugin marketplace isn''t [Claude Marketplace](https://claude.com/marketplace). Claude Marketplace is the website at claude.com/marketplace where you browse plugins, connectors, partner products, and service partners.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: oficjalny-katalog-dodawany-przy-pierwszej-sesji-w-terminalu
    tresc: 'Oficjalny katalog Anthropic Claude Code dodaje przy pierwszym uruchomieniu interaktywnej sesji w terminalu, chyba że blokują to zasady organizacji.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: 'Claude Code adds Anthropic''s official marketplace the first time you start an interactive terminal session, unless a [managed policy](https://code.claude.com/docs/en/plugins/org.md#allow-the-official-marketplace-and-your-own) blocks it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-droga-z-katalogu-do-sesji
    tresc: 'Droga wtyczki do sesji: katalog wymienia wtyczkę, Ty ją instalujesz, a Claude Code ładuje jej składniki.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: 'This diagram shows the path from a marketplace to your session. A marketplace lists a plugin, you install that plugin, and Claude Code loads its components.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-pliki-w-claude-plugins
    tresc: 'Na dysku to, co Claude Code pobrał i zainstalował, leży w ~/.claude/plugins/.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: '**Disk**: `~/.claude/plugins/` holds what Claude Code has fetched and installed.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-kazdy-poziom-kod-z-twoimi-uprawnieniami
    tresc: 'Bez względu na poziom katalogu zainstalowana wtyczka może uruchamiać kod z Twoimi uprawnieniami użytkownika.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: 'Whatever the tier, a plugin you install can run code with your user privileges.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-zakres-decyduje-dla-kogo
    tresc: 'Przy instalacji wtyczki wybierasz zakres, a zakres decyduje, dla kogo wtyczka jest włączona.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: 'When you install a plugin, you pick a scope, and the scope decides who the plugin is enabled for:'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczki-laduja-sie-na-starcie-sesji
    tresc: 'Wtyczki wczytują się na starcie sesji albo przy ich przeładowaniu.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: '**Session**: plugins load at startup, or when you [reload plugins](https://code.claude.com/docs/en/plugins/loading.md#check-which-stage-a-plugin-reached).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczki-sesja-trzyma-wczytane-wersje
    tresc: 'Trwająca sesja zostaje przy wersjach wtyczek, które już wczytała; nowe wersje wczytuje dopiero następna sesja.'
    zrodlo: https://code.claude.com/docs/en/plugins/install.md
    cytat: 'The running session keeps the versions it already loaded. [...] the next session loads the new versions automatically.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: anthropic-trzy-katalogi-wtyczek
    tresc: 'Anthropic wydaje trzy ogólne katalogi wtyczek dla Claude Code: oficjalny, społeczności i demonstracyjny; każdy to spis wtyczek we własnym repozytorium na GitHubie.'
    zrodlo: https://code.claude.com/docs/en/plugins/anthropic-marketplaces.md
    cytat: 'Anthropic publishes three general-purpose plugin marketplaces for Claude Code: [official](https://github.com/anthropics/claude-plugins-official), [community](https://github.com/anthropics/claude-plugins-community), and [demo](https://github.com/anthropics/claude-code). Each is a catalog of plugins in its own GitHub repository.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: katalogi-anthropic-nazwy
    tresc: 'Nazwy katalogów Anthropic: oficjalny claude-plugins-official, społeczności claude-community, demonstracyjny claude-code-plugins.'
    zrodlo: https://code.claude.com/docs/en/plugins/anthropic-marketplaces.md
    cytat: '| Marketplace name | `claude-plugins-official` | `claude-community` | `claude-code-plugins` |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: katalogi-anthropic-co-zawieraja
    tresc: 'Katalog oficjalny ma wtyczki utrzymywane przez Anthropic oraz wtyczki partnerów i innych autorów; katalog społeczności ma wtyczki innych wydawców zgłoszone przez autorów do Anthropic; demonstracyjny ma kilka przykładowych wtyczek.'
    zrodlo: https://code.claude.com/docs/en/plugins/anthropic-marketplaces.md
    cytat: '| What''s in it | Plugins Anthropic maintains, plus plugins from partners and other authors | Third-party plugins that their authors submitted to Anthropic | A small set of example plugins that show what a plugin can contain |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: oficjalny-katalog-glownie-od-partnerow
    tresc: 'Większość wtyczek w oficjalnym katalogu pochodzi od partnerów i innych autorów, nie od Anthropic: producenci narzędzi publikują wtyczki łączące Claude Code z ich usługami, a Anthropic utrzymuje mniejszy zestaw własnych.'
    zrodlo: https://code.claude.com/docs/en/plugins/anthropic-marketplaces.md
    cytat: 'Most of what it lists comes from partners and other authors rather than from Anthropic: tool vendors publish plugins that connect Claude Code to their services, and Anthropic maintains a smaller set of its own'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-marketplace-liczba-instalacji-anthropic-verified
    tresc: 'Na stronie Claude Marketplace przeszukasz cały katalog; strona pokazuje liczbę instalacji i oznacza część wtyczek jako Anthropic verified.'
    zrodlo: https://code.claude.com/docs/en/plugins/anthropic-marketplaces.md
    cytat: '**On the web**: search the full catalog on [Claude Marketplace](https://claude.com/marketplace/plugins), which shows install counts and marks some plugins **Anthropic verified**.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wiele-wtyczek-w-katalogach-autorow
    tresc: 'Wiele popularnych wtyczek nie ma w żadnym katalogu Anthropic; są we własnych katalogach autorów, zwykle w repozytorium na GitHubie.'
    zrodlo: https://code.claude.com/docs/en/plugins/anthropic-marketplaces.md
    cytat: 'Many popular plugins aren''t in any Anthropic marketplace. They''re in their authors'' own marketplaces, usually a GitHub repository with a `.claude-plugin/marketplace.json` at its root.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: anthropic-nie-sprawdza-cudzych-katalogow
    tresc: 'Anthropic nie sprawdza katalogów innych wydawców, więc przed dodaniem takiego katalogu przeczytaj stronę o bezpieczeństwie wtyczek.'
    zrodlo: https://code.claude.com/docs/en/plugins/anthropic-marketplaces.md
    cytat: 'Anthropic doesn''t review third-party marketplaces, so read [Plugin security and trust](https://code.claude.com/docs/en/plugins/security.md) before you add one.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-moze-uruchomic-dowolny-kod
    tresc: 'Zainstalowana wtyczka Claude Code może uruchomić dowolny kod na Twoim komputerze z Twoimi uprawnieniami użytkownika.'
    zrodlo: https://code.claude.com/docs/en/plugins/security.md
    cytat: 'A Claude Code plugin you install can execute arbitrary code on your machine with your user privileges.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: nazwa-katalogu-mowi-kto-wydaje-nie-co-robi-wtyczka
    tresc: 'Nazwa katalogu mówi, kto wydaje spis, a nie co robi każda wtyczka w nim, więc sprawdź wtyczkę przed instalacją, z jakiegokolwiek katalogu pochodzi.'
    zrodlo: https://code.claude.com/docs/en/plugins/security.md
    cytat: 'A marketplace''s name tells you who publishes the catalog, not what each plugin in it does, so [review a plugin before you install it](#review-a-plugin-before-you-install) whichever marketplace it comes from.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-kod-na-komputerze-i-instrukcje-w-kontekscie
    tresc: 'Wtyczka może nieść treść, która uruchamia kod na Twoim komputerze z Twoimi uprawnieniami, i treść, która trafia do kontekstu Claude jako instrukcje.'
    zrodlo: https://code.claude.com/docs/en/plugins/security.md
    cytat: 'A plugin can carry content that runs code on your machine with your user privileges and content that enters Claude''s context as instructions'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-hooki-to-polecenia-powloki
    tresc: 'Hooki wtyczki działają jako polecenia powłoki w określonych momentach pracy Claude Code, na przykład przed wywołaniem narzędzia albo po nim.'
    zrodlo: https://code.claude.com/docs/en/plugins/security.md
    cytat: '**Hooks**: a plugin''s [hooks](https://code.claude.com/docs/en/hooks.md) run as shell commands at points in Claude Code''s lifecycle, such as before or after a tool call.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-serwer-mcp-proces-na-komputerze
    tresc: 'Claude Code łączy się z serwerami MCP włączonej wtyczki i daje Claude ich narzędzia; serwer MCP typu stdio działa jako proces, który Claude Code uruchamia na Twoim komputerze.'
    zrodlo: https://code.claude.com/docs/en/plugins/security.md
    cytat: 'Claude Code connects to the [MCP servers](https://code.claude.com/docs/en/mcp.md) an enabled plugin declares and gives Claude their tools. A stdio MCP server runs as a process that Claude Code starts on your machine.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-skille-i-agenci-jako-instrukcje
    tresc: 'Skille, polecenia i agenci wtyczki trafiają do kontekstu Claude jako instrukcje, więc wpływają na to, co Claude robi narzędziami, które już ma.'
    zrodlo: https://code.claude.com/docs/en/plugins/security.md
    cytat: '**Skills, commands, and agents**: these enter Claude''s context as instructions, so they influence what Claude does with the tools it already has.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-aktualizacja-zmienia-sprawdzone-pliki
    tresc: 'Gdy katalog wtyczki ma włączoną automatyczną aktualizację, Claude Code aktualizuje wtyczkę w tle, więc pliki, które sprawdziłeś, mogą się zmienić na dysku.'
    zrodlo: https://code.claude.com/docs/en/plugins/security.md
    cytat: '**Updates**: when auto-update is on for the marketplace you installed a plugin from, Claude Code updates that plugin in the background, so the files you reviewed can change on disk.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: reguly-uprawnien-nie-obejmuja-kodu-wtyczki
    tresc: 'Reguły uprawnień i piaskownica Claude Code obejmują wywołania narzędzi przez Claude, a nie kod, który wtyczka uruchamia sama.'
    zrodlo: https://code.claude.com/docs/en/plugins/security.md
    cytat: 'Claude Code''s [permission rules](https://code.claude.com/docs/en/permissions.md) and [sandbox](https://code.claude.com/docs/en/sandboxing.md) cover the tool calls Claude makes, not the code a plugin runs by itself:'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hooki-wtyczki-z-pelnymi-uprawnieniami
    tresc: 'Hooki poleceń i monitory wtyczki to polecenia powłoki, które działają z Twoimi pełnymi uprawnieniami użytkownika.'
    zrodlo: https://code.claude.com/docs/en/plugins/security.md
    cytat: '**Hooks, monitors, and server processes**: command hooks and monitors are shell commands that run with your full user permissions.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: narzedzia-mcp-wtyczki-podlegaja-regulom-uprawnien
    tresc: 'Wywołanie narzędzia z serwera MCP wtyczki to wywołanie narzędzia przez Claude, więc obejmują je Twoje reguły uprawnień.'
    zrodlo: https://code.claude.com/docs/en/plugins/security.md
    cytat: '**Claude''s tool calls**: a call to one of the plugin''s MCP tools, and a Bash command that runs an executable from the plugin''s `bin/`, are tool calls, so your permission rules apply to them.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: instalacja-wlacza-wtyczke
    tresc: 'Instalacja wtyczki od razu ją włącza, chyba że autor ustawił defaultEnabled: false, a Ty jej sam nie włączyłeś.'
    zrodlo: https://code.claude.com/docs/en/plugins/security.md
    cytat: 'Installing a plugin also enables it, unless its manifest or marketplace entry sets [`defaultEnabled: false`](https://code.claude.com/docs/en/plugins/install#choose-an-install-scope) and you haven''t enabled it yourself.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: katalogi-trzy-poziomy-anthropic-nie-do-podrobienia
    tresc: 'Nazwa katalogu stawia go na jednym z trzech poziomów: oficjalny, społeczności albo inny wydawca; nazwy oficjalne i społeczności Claude Code przyjmuje tylko dla katalogów z repozytoriów github.com/anthropics/, więc cudzy katalog nie może udawać katalogu Anthropic; katalog wydany przez współpracownika albo Twoją organizację to inny wydawca.'
    zrodlo: https://code.claude.com/docs/en/plugins/security.md
    cytat: 'A marketplace''s name places it in one of three tiers: official, community, or third-party. Claude Code accepts the official and community names only for marketplaces sourced from `github.com/anthropics/` repositories, so a third-party marketplace can''t present itself as an Anthropic one. A marketplace that a coworker or your organization publishes is third-party.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przed-instalacja-sprawdz-co-dodaje-i-skad
    tresc: 'Zanim zainstalujesz wtyczkę, sprawdź, co dodaje i skąd pochodzi.'
    zrodlo: https://code.claude.com/docs/en/plugins/security.md
    cytat: 'Before you install a plugin, look at what it adds and where it comes from.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: ostrzezenie-zaufaj-wtyczce-przed-instalacja
    tresc: 'Ostrzeżenie Claude Code przed instalacją wtyczki: upewnij się, że ufasz wtyczce, zanim ją zainstalujesz, zaktualizujesz albo użyjesz; Anthropic nie kontroluje serwerów MCP, plików ani innego oprogramowania we wtyczkach i nie może sprawdzić, czy działają zgodnie z zamiarem i czy się nie zmienią; więcej na stronie domowej każdej wtyczki.'
    zrodlo: https://code.claude.com/docs/en/plugins/security.md
    cytat: 'Make sure you trust a plugin before installing, updating, or using it. Anthropic does not control what MCP servers, files, or other software are included in plugins and cannot verify that they will work as intended or that they won''t change. See each plugin''s homepage for more information.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-wtyczki-usuwasz-wylaczajac-wtyczke
    tresc: 'Skill z wtyczki usuwasz, wyłączając albo odinstalowując wtyczkę, która go daje.'
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: '**Plugin skill**: disable or uninstall the plugin that provides it'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-creator-w-aplikacji-z-oficjalnego-katalogu
    tresc: 'Wtyczka skill-creator automatyzuje w Claude Code pętlę porównań przy sprawdzaniu skilla; w rozszerzeniu VS Code i w aplikacji na komputer instalujesz ją z oficjalnego katalogu.'
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'The [`skill-creator` plugin](https://github.com/anthropics/claude-plugins-official/tree/main/plugins/skill-creator) automates the comparison loop inside Claude Code. In the VS Code extension or the desktop app, install it from the official marketplace by following [Install a plugin](https://code.claude.com/docs/en/plugins/install.md#install-a-plugin).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-pakuje-skille-hooki-subagentow-mcp
    tresc: 'Wtyczki to warstwa pakowania: wtyczka łączy skille, hooki, subagentów i serwery MCP w jedną instalowaną całość; skille wtyczek mają przedrostek z nazwą wtyczki (np. /my-plugin:review), więc wiele wtyczek działa obok siebie; wtyczki służą do tego samego zestawu w wielu repozytoriach albo do przekazania go innym przez katalog.'
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '**[Plugins](https://code.claude.com/docs/en/plugins/overview.md)** are the packaging layer. A plugin bundles skills, hooks, subagents, and MCP servers into a single installable unit. Plugin skills are namespaced (like `/my-plugin:review`) so multiple plugins can coexist. Use plugins when you want to reuse the same setup across multiple repositories or distribute to others via a **[marketplace](https://code.claude.com/docs/en/plugins/overview.md)**.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: drugie-repozytorium-ten-sam-zestaw-wtyczka
    tresc: 'Gdy drugie repozytorium potrzebuje tego samego zestawu, zapakuj go jako wtyczkę.'
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '| A second repository needs the same setup | Package it as a [plugin](https://code.claude.com/docs/en/plugins/overview.md) |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-panel-zadan-w-tle-co-pokazuje
    tresc: 'W aplikacji panel zadań w tle pokazuje pracę w tle bieżącej sesji: subagenty, polecenia w tle i przepływy; gdy sesja ma pracę w tle, otwierasz go pozycją Background tasks w menu ⋮ na pasku tytułu.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'The tasks pane shows the background work running inside the current session: subagents, background shell commands, and [dynamic workflows](/docs/en/workflows.md). Once the session has background work, open the pane with **Background tasks** in the title bar''s **⋮** menu.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-wpis-w-tle-wynik-w-panelu-subagenta
    tresc: 'W aplikacji kliknięcie wpisu w panelu zadań w tle pokazuje jego wynik w panelu subagenta albo zatrzymuje tę pracę.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Click any entry to see its output in the subagent pane or stop it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-menu-paska-panele-bez-przycisku
    tresc: 'W aplikacji panel bez przycisku na pasku tytułu wybierasz z menu ⋮ obok przycisków; panele takie jak Background tasks i Plan pojawiają się w nim, gdy sesja ma w nich coś do pokazania.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'If the pane you want has no button in the title bar, select it from the **⋮** menu beside the buttons: … **For panes with no button**: panes such as **Background tasks** and **Plan** are listed once the session has something to show in those panes'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-osobne-okno-wraca-podsumowanie
    tresc: 'Subagent oddziela kontekst: praca dzieje się osobno i wraca tylko podsumowanie; subagent korzysta z osobnego okna z własnymi tokenami wejścia i wyjścia, a skill dokłada się do głównego okna.'
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: 'Context isolation. Work happens separately, only summary returns … | **[Context window](https://code.claude.com/docs/en/context-window.md) impact** | Adds to your main window | Uses a separate window with its own input and output tokens |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-gdy-okno-sie-zapelnia
    tresc: 'Subagenta użyj, gdy potrzebujesz oddzielenia kontekstu albo gdy okno kontekstu się zapełnia; subagent może przeczytać dziesiątki plików, a główna rozmowa dostaje tylko podsumowanie.'
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '**Use a subagent** when you need context isolation or when your context window is getting full. The subagent might read dozens of files or run extensive searches, but your main conversation only receives a summary.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: kontekst-subagent-duze-odczyty-poza-twoim-oknem
