    wersja: "2.1.310"

  - id: aplikacja-split-view-zmiana-sesji-w-panelu
    tresc: 'Żeby zmienić sesję w panelu widoku obok siebie, kliknij w ten panel, a potem kliknij sesję w pasku bocznym.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
