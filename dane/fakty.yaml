    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: narzedzie-write-tworzy-lub-nadpisuje
    tresc: "Narzędzie Write tworzy pliki albo zapisuje je od nowa i wymaga zgody."
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: '| `Write` | Creates or overwrites files. See [Write tool behavior](#write-tool-behavior) | Yes |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-platne-plany-pro-wlacz
    tresc: 'Przepływy (dynamic workflows) są dostępne na wszystkich płatnych planach, z dostępem przez API Anthropic i u trzech dostawców chmury; na planie Pro włączasz je wierszem Dynamic workflows w /config.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'Dynamic workflows are available on all paid plans, with Anthropic API access, and on Amazon Bedrock, Google Cloud''s Agent Platform, and Microsoft Foundry. On Pro, turn them on from the Dynamic workflows row in `/config`.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-skrypt-wielu-subagentow-w-tle
    tresc: 'Przepływ to skrypt w JavaScripcie, który kieruje naraz pracą wielu subagentów; Claude pisze go do zadania, które opisujesz, a program wykonuje go w tle, gdy sesja dalej odpowiada.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'A dynamic workflow is a JavaScript script that orchestrates many [subagents](https://code.claude.com/docs/en/sub-agents.md) at once. Claude writes the script for the task you describe, and a runtime executes it in the background while your session stays responsive.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-kiedy-siegac
    tresc: 'Po przepływ sięgasz, gdy zadanie potrzebuje więcej agentów, niż jedna rozmowa zdoła pokierować, albo gdy chcesz mieć sposób prowadzenia pracy zapisany w skrypcie, który przeczytasz i uruchomisz ponownie; jednym z przykładów jest pytanie badawcze, w którym źródła trzeba sprawdzić nawzajem.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'Reach for a workflow when a task needs more agents than one conversation can coordinate, or when you want the orchestration codified as a script you can read and rerun. Examples include … a research question that needs sources cross-checked against each other'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-kiedy-pasuje-najlepiej
    tresc: 'Przepływ pasuje najlepiej, gdy zadanie jest większe, niż jeden agent zmieści w kontekście, albo gdy ten sam krok trzeba wykonać na wielu elementach.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'A workflow fits best when the task is larger than one agent can hold in context, or when the same step needs to run across many items.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: przeplyw-kto-decyduje-o-kolejnym-kroku
    tresc: 'Subagentów, skille, zespoły agentów i przepływy różni to, kto trzyma plan: o tym, co dzieje się dalej, przy subagentach decyduje Claude tura po turze, a w przepływie skrypt.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'The difference is who holds the plan: … | Who decides what runs next | Claude, turn by turn | Claude, following the prompt | The lead agent, turn by turn | The script |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-kontekst-tylko-wynik-koncowy
    tresc: 'Przepływ przenosi plan do kodu: przy subagentach Claude tura po turze decyduje, co uruchomić dalej, a każdy wynik trafia do okna kontekstu; skrypt przepływu sam trzyma pętlę, rozgałęzienia i wyniki pośrednie, więc w kontekście Claude zostaje tylko wynik końcowy.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'A workflow moves the plan into code. With subagents, skills, and agent teams, Claude is the orchestrator: it decides turn by turn what to spawn or assign next, and every result goes into a context window. A workflow script holds the loop, the branching, and the intermediate results itself, so Claude''s context holds only the final answer.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-sprawdzanie-nawzajem
    tresc: 'Plan w kodzie pozwala przepływowi stosować powtarzalny wzorzec jakości: może kazać niezależnym agentom krytycznie sprawdzić nawzajem swoje ustalenia, zanim trafią do raportu, albo przygotować plan z kilku stron i porównać warianty; wynik jest wtedy bardziej wiarygodny niż po jednym przejściu.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'Moving the plan into code also lets a workflow apply a repeatable quality pattern, not just run more agents: it can have independent agents adversarially review each other''s findings before they''re reported, or draft a plan from several angles and weigh them against each other, so you get a more trustworthy result than a single pass.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-prosba-wlasnymi-slowami
    tresc: 'Przepływ uruchomisz też prośbą własnymi słowami, np. „use a workflow” albo „run a workflow”: bezpośrednią prośbę Claude traktuje jak wybór przepływu.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'Asking in your own words, for example "use a workflow" or "run a workflow", also works: Claude treats a direct request as the same opt-in.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-ultracode-gdzie-dziala
    tresc: 'Słowo ultracode wybiera przepływ tylko w prośbie wpisanej samodzielnie: w interaktywnym wierszu poleceń, w panelu rozszerzenia IDE, w kliencie Remote Control albo w aplikacji Agent SDK, która oznacza wpis z klawiatury jako origin { kind: "human" }.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'The keyword is an opt-in only in a prompt you type yourself: at the interactive prompt, in an IDE extension panel, in a [Remote Control](https://code.claude.com/docs/en/remote-control.md) client, or in an Agent SDK application that stamps your keyboard input''s [`origin`](https://code.claude.com/docs/en/agent-sdk/typescript#sdkmessageorigin) as `{ kind: "human" }`'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  # Lekcja 0.0 co-jest-gdzie (27.10.2026). Osiem faktów niżej przeniesionych bez zmian z gałęzi innych modułów (te same id, ta sama treść), żeby przy scalaniu nie powstały dwa fakty z jednym cytatem: modul-dlugie-rozmowy, modul-twoje-narzedzia, modul-kilka-zadan, modul-praca-bez-ciebie, modul-skille. Cytaty sprawdzone grepem w dane/zrodla/strony/ 27.10.2026.
  - id: aplikacja-pierscien-zuzycie-abonamentu
    tresc: "W obu układach aplikacji obok wyboru modelu jest pierścień zużycia; po kliknięciu pokazuje zużycie abonamentu, wspólne dla wszystkich miejsc, w których używasz Claude Code."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "Both layouts have the usage ring next to the model picker. Click it to see your plan usage, which is shared across all your Claude Code surfaces."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-pelny-kontekst-claude-streszcza-i-pracuje-dalej
    tresc: "W aplikacji, gdy kontekst się zapełni, Claude sam streszcza rozmowę i pracuje dalej."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "When context fills up, Claude automatically summarizes the conversation and continues working."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-wysilek-pod-effort-w-wyborze-modelu
    tresc: "W bieżącym układzie aplikacji poziom wysiłku wybierasz tak: otwierasz wybór modelu i klikasz poziom pod Effort."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'In the [current layout](#check-which-layout-you-have), open the model picker and select a level under **Effort**.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-ultracode-ustawienie-sesji
    tresc: 'Ultracode to ustawienie Claude Code, a nie poziom wysiłku modelu.'
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: 'Ultracode is a Claude Code setting rather than a model effort level'
    sprawdzono: '2026-10-27'
    wersja: "2.1.310"

  - id: przeplyw-ultracode-planuje-bez-prosby
    tresc: 'Gdy Ultracode jest włączone, Claude planuje przepływ przy każdym większym zadaniu w sesji, nie czekając na prośbę.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'With it on, Claude plans a workflow for each substantive task instead of waiting for you to ask.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.310"

  - id: przeplyw-ultracode-wiecej-tokenow
    tresc: 'Przy włączonym Ultracode każda prośba zużywa więcej tokenów i trwa dłużej niż ta sama prośba bez przepływu, a w abonamencie sesja szybciej dochodzi do limitu sesji albo tygodnia.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'so each request uses more tokens and takes longer than the same request without a workflow. On a subscription plan those tokens draw on your usage limits, so a session with ultracode on reaches a session or weekly limit sooner than the same work with it off.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.310"

  - id: przeplyw-aplikacja-karta-zgody
    tresc: 'W aplikacji na komputer karta zgody na przepływ pokazuje nazwę przepływu, listę faz i ostrzeżenie o zużyciu tokenów oraz przyciski Once, Always i Deny.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'In the Desktop app, an approval card shows the workflow name, the phase list, and a token-usage caution, with **Once**, **Always**, and **Deny** actions.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-aplikacja-postep-w-panelu-background-tasks
    tresc: 'W aplikacji na komputer postęp przepływu widać w bocznym panelu Background tasks.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'In the Desktop app, an approval card shows … The progress view appears in the Background tasks side pane.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-agenci-twoje-reguly-uprawnien
    tresc: 'Subagenci uruchomieni przez przepływ korzystają z Twoich reguł uprawnień, a tryb uprawnień Claude Code dobiera im według tych samych zasad co innym subagentom.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'The subagents the workflow spawns use your [permission rules](https://code.claude.com/docs/en/settings-reference.md#permission-settings), and Claude Code picks their permission mode by the rules under [which permission mode a subagent runs in](https://code.claude.com/docs/en/sub-agents.md#permission-modes).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-skrypt-pisze-claude
    tresc: 'Każda z przykładowych próśb każe Claude napisać i uruchomić przepływ do zadania; skryptu nie piszesz sam.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'Each one asks Claude to write and run a workflow for that task; you don''t write the script yourself.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-przyklad-trzech-konkurentow
    tresc: 'Przykładowa prośba z dokumentacji każe przepływowi zbadać, jak trzech konkurentów rozwiązuje jedną sprawę: równolegle przeczytać ich publiczną dokumentację i ostatnie wpisy o zmianach, a potem porównać podejścia.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'Fan out readers across changelogs, issues, and docs, then synthesize. … use a workflow to research how our three competitors handle rate limiting: read their public docs and recent changelog entries in parallel, then compare the approaches'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-bez-wejscia-w-trakcie
    tresc: 'W trakcie przebiegu przepływ nie przyjmuje nic od Ciebie; sam staje tylko na pytania agentów o zgodę i na czekanie na limit zużycia, a żeby zatwierdzać kolejne etapy, uruchamiasz każdy etap jako osobny przepływ.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: '| No mid-run user input | A run pauses on its own only for agent permission prompts and a [usage-limit wait](#when-a-run-hits-your-usage-limit). For sign-off between stages, run each stage as its own workflow |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-wiecej-tokenow-limit-planu
    tresc: 'Przepływ uruchamia wielu agentów, więc jeden przebieg może zużyć wyraźnie więcej tokenów niż ta sama praca w rozmowie; przebiegi liczą się do limitów zużycia Twojego planu.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'A workflow spawns many agents, so a single run can use meaningfully more tokens than working through the same task in conversation. Runs count toward your plan''s usage and rate limits.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-najpierw-maly-wycinek
    tresc: 'Żeby ocenić koszt, zanim zlecisz duże zadanie, uruchom przepływ najpierw na małym wycinku, np. na jednym folderze zamiast całego repozytorium albo na wąskim pytaniu zamiast szerokiego.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'To gauge the spend before committing to a large task, run the workflow on a small slice first: one directory instead of the whole repo, or a narrow question instead of a broad one.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-mniejszy-model-dla-prostych-faz
    tresc: 'Żeby ograniczyć koszt modeli, przy opisie zadania poproś Claude o mniejszy model dla etapów, które nie potrzebują najmocniejszego.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'To control the model cost: … Ask Claude to use a smaller model for stages that don''t need the strongest one when you describe the task'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-rozmiar-to-wskazowka
    tresc: 'Wskazówka rozmiaru mówi Claude, do ilu agentów dążyć, gdy pisze przepływ; to rada, nie limit, więc prośba o inną skalę ma pierwszeństwo.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'A size guideline tells Claude how many agents to aim for when it writes a dynamic workflow. Claude Code sends the guideline to Claude as advice, not a cap, so a prompt that calls for a different scale still overrides it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-rozmiar-domyslny-pro-small
    tresc: 'Domyślna wskazówka rozmiaru przepływu to medium (mniej niż 10 agentów), a po zalogowaniu na planie Pro w Claude Code 2.1.271 i nowszym small (mniej niż 5 agentów).'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: '| `small` | Fewer than 5 agents | … | `medium` | Fewer than 10 agents | … The default is `medium`, or `small` when you''re signed in on a Pro plan with Claude Code v2.1.271 or later.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: przeplyw-skala-wobec-subagentow
    tresc: 'W tabeli porównującej subagentów, skille, zespoły agentów i przepływy dokumentacja opisuje skalę tak: subagenci to kilka zleconych zadań na turę, a przepływ to od kilkudziesięciu do kilkuset agentów w jednym przebiegu; to opis skali, jaką przepływ może objąć, a nie jego domyślny rozmiar.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: '| | Subagents | Skills | Agent teams | Workflows | … | Scale | A few delegated tasks per turn | Same as subagents | A handful of long-running peers | Dozens to hundreds of agents per run |'
    sprawdzono: '2026-10-27'
    wersja: "2.1.311"

  - id: przeplyw-dziala-w-aplikacji
    tresc: 'Przepływy działają w wierszu poleceń, w aplikacji na komputer, w rozszerzeniach IDE, w trybie nieinteraktywnym z claude -p i w Agent SDK.'
    zrodlo: https://code.claude.com/docs/en/workflows.md
    cytat: 'Workflows are available in the CLI, the Desktop app, the IDE extensions, [non-interactive mode](https://code.claude.com/docs/en/headless.md) with `claude -p`, and the [Agent SDK](https://code.claude.com/docs/en/agent-sdk/overview.md).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: piec-sposobow-kilku-zadan-naraz
    tresc: 'Claude Code ma pięć sposobów pracy nad kilkoma zadaniami naraz: subagentów, agent view, zespoły agentów, przepływy i projekty; różnią się tym, jak bardzo się angażujesz, i tym, czy praca idzie na Twoim komputerze, czy w chmurze.'
    zrodlo: https://code.claude.com/docs/en/agents.md
    cytat: 'Claude Code has five ways to work on several tasks at once: [subagents](https://code.claude.com/docs/en/sub-agents.md), [agent view](https://code.claude.com/docs/en/agent-view.md), [agent teams](https://code.claude.com/docs/en/agent-teams.md), [dynamic workflows](https://code.claude.com/docs/en/workflows.md), and [projects](https://code.claude.com/docs/en/claude-projects.md). They differ in how involved you stay, from steering each conversation yourself to letting Claude coordinate a group of workers, and in whether the work runs on your machine or in the cloud.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: sposob-subagenci-w-jednej-sesji
    tresc: 'Subagenci to pomocnicy w jednej sesji, którzy robią zadanie poboczne we własnym kontekście i oddają podsumowanie.'
    zrodlo: https://code.claude.com/docs/en/agents.md
    cytat: '| [Subagents](https://code.claude.com/docs/en/sub-agents.md) | Delegated workers inside one session that do a side task in their own context and return a summary |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: sposob-agent-view-claude-agents
    tresc: 'Agent view to jeden ekran do zlecania i śledzenia sesji pracujących w tle, otwierany poleceniem claude agents; to wersja testowa (research preview).'
    zrodlo: https://code.claude.com/docs/en/agents.md
    cytat: '| [Agent view](https://code.claude.com/docs/en/agent-view.md) | One screen to dispatch and monitor sessions running in the background, opened with `claude agents`. Research preview |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: sposob-zespoly-agentow
    tresc: 'Zespoły agentów to kilka sesji ze wspólną listą zadań i wiadomościami między agentami, prowadzonych przez lidera; to funkcja eksperymentalna, domyślnie wyłączona.'
    zrodlo: https://code.claude.com/docs/en/agents.md
    cytat: '| [Agent teams](https://code.claude.com/docs/en/agent-teams.md) | Multiple coordinated sessions with a shared task list and inter-agent messaging, managed by a lead. Experimental and disabled by default |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: sposob-projekty-watki
    tresc: 'Projekt to jedna stała rozmowa na claude.ai/code albo w aplikacji na komputer; Claude uruchamia w nim równoległe sesje zwane wątkami, w chmurze albo na prośbę na Twoim komputerze przez Remote Control; to publiczna beta na planach Pro i Max.'
    zrodlo: https://code.claude.com/docs/en/agents.md
    cytat: '| [Projects](https://code.claude.com/docs/en/claude-projects.md) | One ongoing conversation at claude.ai/code or in the desktop app. Claude starts parallel sessions called threads, in the cloud or, when you ask, on your computer through Remote Control, gives each one the project''s instructions, and shows you which ones need you. Public beta on Pro and Max |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: sposob-przeplyw-sprawdza-wyniki
    tresc: 'Przepływ to skrypt, który uruchamia wielu subagentów i sprawdza nawzajem ich wyniki; służy do pracy za dużej, żeby prowadzić ją tura po turze, albo takiej, która potrzebuje więcej niż jednego przejścia.'
    zrodlo: https://code.claude.com/docs/en/agents.md
    cytat: '| [Dynamic workflows](https://code.claude.com/docs/en/workflows.md) | A script that runs many subagents and cross-checks their results, for work too big to coordinate one turn at a time or that needs more than a single pass |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-zespoly-agentow-tylko-cli
    tresc: 'Zespoły agentów działają w wierszu poleceń, nie w aplikacji na komputer; do pracy wielu agentów w jednej sesji służą przepływy, które działają w aplikacji.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**Agent teams**: coordinated teams, where Claude as the team lead assigns tasks to teammates from a shared task list, are available in the [CLI](https://code.claude.com/docs/en/agent-teams.md), not in Desktop. For multi-agent work inside one session, use [dynamic workflows](https://code.claude.com/docs/en/workflows.md), which run in Desktop'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-skrot-menu-modelu
    tresc: "W zakładce Code menu modelu otwiera skrót Cmd+Shift+I na macOS, a na Windowsie Ctrl+Shift+I (tabela skrótów podaje klawisze macOS, na Windowsie Cmd zamienia się na Ctrl)."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'The table in this section shows the macOS keys. On Windows and Linux, change these keys: … **Cmd**: press **Ctrl** … | `Cmd` `Shift` `I` | Open model menu |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-skrot-menu-wysilku
    tresc: "W zakładce Code menu wysiłku otwiera skrót Cmd+Shift+E na macOS, a na Windowsie Ctrl+Shift+E (tabela skrótów podaje klawisze macOS, na Windowsie Cmd zamienia się na Ctrl)."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'The table in this section shows the macOS keys. On Windows and Linux, change these keys: … **Cmd**: press **Ctrl** … | `Cmd` `Shift` `E` | Open effort menu |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-transcript-view-menu-sesji-ctrl-o
    tresc: "Widok rozmowy zmieniasz w menu sesji, które otwiera strzałka obok tytułu sesji, pozycją Transcript view; skrót Ctrl+O na macOS i na Windowsie przełącza widoki po kolei."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'To switch view modes, open the session menu from the caret beside the session title and select **Transcript view**, or press **Ctrl+O** on macOS or Windows to cycle through them.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-widok-thinking-dopiero-po-mysleniu
    tresc: "Widok Thinking pojawia się w menu dopiero wtedy, gdy Claude myślał w oglądanej sesji."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'The Thinking mode appears in the menu only after Claude has produced thinking in the session you''re viewing.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-widok-thinking-pokazuje-myslenie
    tresc: "Widok Thinking pokazuje użycia narzędzi zwinięte do podsumowań i do tego myślenie Claude; służy do śledzenia rozumowania Claude."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '| **Thinking** | Tool calls collapsed into summaries, plus Claude''s thinking | … Use Thinking to follow Claude''s reasoning with tool calls still collapsed.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-myslenie-domyslnie-wlaczone-zuzywa-tokeny
    tresc: "Myślenie przed odpowiedzią jest domyślnie włączone; poprawia wyniki w złożonych zadaniach wymagających rozumowania, ale zużywa dodatkowe tokeny."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '[Extended thinking](https://code.claude.com/docs/en/model-config.md#extended-thinking) is enabled by default, which improves performance on complex reasoning tasks but uses additional tokens.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wysilek-model-decyduje-czy-i-ile-myslec
    tresc: "Poziom wysiłku steruje rozumowaniem adaptacyjnym: model sam decyduje na każdym kroku, czy myśleć i ile, zależnie od tego, jak złożone jest zadanie."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: '[Effort levels](https://platform.claude.com/docs/en/build-with-claude/effort) control adaptive reasoning, which lets the model decide whether and how much to think on each step based on task complexity.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wysilek-nizszy-szybciej-taniej-wyzszy-glebiej
    tresc: "Niższy wysiłek jest szybszy i tańszy przy prostych zadaniach, a wyższy daje głębsze rozumowanie przy złożonych problemach."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: 'Lower effort is faster and cheaper for straightforward tasks, while higher effort provides deeper reasoning for complex problems.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wysilek-poziomy-zaleza-od-modelu
    tresc: "Dostępne poziomy wysiłku zależą od modelu: modele z dwóch pierwszych wierszy tabeli w dokumentacji mają pięć poziomów (low, medium, high, xhigh, max), dwa starsze modele cztery, a modele spoza tabeli wysiłku nie obsługują."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: 'The available effort levels depend on the model. Models not listed here do not support effort: … | Fable 5.1 and Fable 5 | `low`, `medium`, `high`, `xhigh`, `max` | … | Opus 5.5, Sonnet 5.5, Haiku 5.5, Opus 5, Sonnet 5, Opus 4.8, and Opus 4.7 | `low`, `medium`, `high`, `xhigh`, `max` | … | Opus 4.6 and Sonnet 4.6 | `low`, `medium`, `high`, `max` |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wysilek-nieobslugiwany-poziom-spada-nizej
    tresc: "Gdy ustawisz poziom, którego model nie obsługuje, Claude Code użyje najwyższego obsługiwanego poziomu nie wyższego od ustawionego; poziomy modelu może też ograniczyć organizacja albo Twoje ustawienia."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: 'If you set a level the active model does not support, Claude Code falls back to the highest supported level at or below the one you set. For example, `xhigh` runs as `high` on Opus 4.6. Your organization or your own settings can also cap the levels a model offers'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wysilek-domyslny-zalezy-od-modelu
    tresc: "Gdy nic innego nie ustala poziomu, obowiązuje domyślny poziom wysiłku modelu, a ten jest różny dla różnych modeli."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: 'The model''s default effort: `high` on every model that supports effort, except that Opus 5.5, Sonnet 5.5, and Haiku 5.5 default to `medium`, Opus 4.7 defaults to `xhigh`'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wysilek-max-tylko-biezaca-sesja
    tresc: "max to najgłębszy poziom rozumowania; jeśli nie ustawisz go zmienną środowiska CLAUDE_CODE_EFFORT_LEVEL, Claude Code stosuje go tylko w bieżącej sesji."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: '`max` is the deepest reasoning level. Unless you set it through the `CLAUDE_CODE_EFFORT_LEVEL` environment variable, Claude Code applies `max` to the current session only.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: ultracode-ustawienie-nie-poziom-wysilku
    tresc: "Ultracode to ustawienie Claude Code, a nie poziom wysiłku modelu: gdy jest włączone, Claude przy większych zadaniach prowadzi dynamiczne przepływy pracy, na tym poziomie wysiłku, na którym działa sesja."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: 'Ultracode is a Claude Code setting rather than a model effort level: with it on, Claude orchestrates [dynamic workflows](https://code.claude.com/docs/en/workflows.md) for substantive tasks, at whichever effort level the session runs at.'
    sprawdzono: '2026-10-27'
    wersja: "2.1.310"

  - id: wysilek-wymiana-tokenow-na-mozliwosci
    tresc: "Każdy poziom wysiłku wymienia zużycie tokenów na możliwości; domyślny poziom pasuje do większości zadań programistycznych, a zmieniasz go, gdy chcesz innej równowagi."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: 'Each level trades token spend against capability. The default suits most coding tasks; adjust when you want a different balance.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wysilek-low-szybkie-wymiany-szkic
    tresc: "Poziom low pasuje do szybkich wymian, w których przeglądasz każdy wynik, na przykład burzy pomysłów, pierwszego szkicu albo drobnej zmiany, takiej jak zmiana nazwy."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: '| `low` | Quick exchanges where you review each result, such as brainstorming, a first sketch, or a small change like a rename |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wysilek-high-gdy-liczy-sie-sprawdzenie
    tresc: "Poziom high pasuje do pracy, w której liczy się sprawdzenie albo prawdopodobne są nietypowe przypadki."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: '| `high` | Work where verification matters or edge cases are likely, such as fixing a bug in an existing codebase.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wysilek-xhigh-glebiej-wiecej-tokenow
    tresc: "Poziom xhigh daje głębsze rozumowanie kosztem większego zużycia tokenów."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: '| `xhigh` | Deeper reasoning at higher token spend.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wysilek-max-trudne-problemy-przemyslenie
    tresc: "Poziom max jest na trudne problemy, które Claude ma przepracować bez Ciebie; może dawać coraz mniejsze korzyści i ma skłonność do przemyślenia sprawy ponad potrzebę, więc wypróbuj go, zanim zaczniesz go używać szerzej."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: '| `max` | Hard problems you want Claude to work through without you, such as finding security vulnerabilities. `max` may show diminishing returns and is prone to overthinking, so test before adopting it broadly |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wysilek-w-testach-wyzszy-sprawdzal-nizszy-szybciej
    tresc: "W testach Anthropic na dwóch modelach Claude na wyższym poziomie sprawdzał więcej nietypowych przypadków i więcej swojej pracy przed odpowiedzią oraz więcej decydował sam; na niższym szybciej oddawał punkt wyjścia, co pasuje do pracy, w której przeglądasz każdy wynik i kierujesz następnym krokiem."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: 'In tests on Opus 5.5 and Fable 5.1, Claude at a higher level tested more edge cases and verified more of its work before answering. It also made more choices on its own. At a lower level, Claude returned a starting point sooner, which fits work where you review each result and steer the next step.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wysilek-skala-osobna-dla-modelu
    tresc: "Skala wysiłku jest ustawiona osobno dla każdego modelu, więc ta sama nazwa poziomu nie znaczy tego samego w różnych modelach."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: 'The effort scale is calibrated per model, so the same level name does not represent the same underlying value across models.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: myslenie-adaptacyjne-popros-w-poleceniu
    tresc: "Przy rozumowaniu adaptacyjnym myślenie na każdym kroku jest opcjonalne; jeśli chcesz, żeby Claude myślał częściej albo rzadziej niż na danym poziomie, napisz to wprost w poleceniu albo w CLAUDE.md, a model uwzględni tę wskazówkę w granicach ustawionego wysiłku."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: 'Adaptive reasoning makes thinking optional on each step, so Claude can respond faster to routine prompts and reserve deeper thinking for steps that benefit from it. If you want Claude to think more or less often than the current level produces, you can say so directly in your prompt or in `CLAUDE.md`; the model responds to that guidance within its effort setting.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: myslenie-przed-odpowiedzia-wysilek-glowne-pokretlo
    tresc: "Myślenie to rozumowanie, które Claude przeprowadza przed odpowiedzią; w modelach z rozumowaniem adaptacyjnym ilością myślenia steruje głównie poziom wysiłku."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: 'Extended thinking is the reasoning Claude emits before responding. On models that support [adaptive reasoning](#adjust-effort-level), the effort level is the primary control for how much thinking happens'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: myslenie-placisz-za-wszystkie-tokeny-myslenia
    tresc: "Płacisz za wszystkie wygenerowane tokeny myślenia, także wtedy, gdy myślenie jest zwinięte albo ukryte."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: 'You are charged for all thinking tokens generated, even when collapsed or redacted.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: myslenie-tokeny-liczone-jak-odpowiedz
    tresc: "Myślenie jest domyślnie włączone, bo wyraźnie poprawia wyniki przy złożonym planowaniu i rozumowaniu; tokeny myślenia liczą się jak tokeny odpowiedzi, a domyślny budżet może sięgać dziesiątek tysięcy tokenów na jedno zapytanie, zależnie od modelu."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: 'Extended thinking is enabled by default because it significantly improves performance on complex planning and reasoning tasks. Thinking tokens are billed as output tokens, and the default budget can be tens of thousands of tokens per request depending on the model.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: nizszy-wysilek-taniej-przy-prostych-zadaniach
    tresc: "Przy prostszych zadaniach, które nie wymagają głębokiego rozumowania, koszty zmniejszysz, obniżając poziom wysiłku."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: 'For simpler tasks where deep reasoning isn''t needed, you can reduce costs by lowering the [effort level](https://code.claude.com/docs/en/model-config.md#adjust-effort-level)'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: program-wyzszy-wysilek-dluzej-szybciej-zuzywa-limity
    tresc: "Program Claude Code opisuje wysiłek zdaniem: wyższy wysiłek daje dokładniejsze odpowiedzi, ale trwa dłużej i szybciej zużywa Twoje limity."
    zrodlo: program:claude-code-2.1.310
    cytat: 'Higher effort means more thorough responses, but takes longer and uses your limits faster.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-wybor-modelu-ukrywa-modele-organizacji
    tresc: "Wybór modelu na claude.ai i w aplikacji ukrywa albo wyszarza modele, których nie dopuszcza lista modeli Twojej organizacji."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: 'The model pickers on claude.ai and in the Desktop app hide or grey out models excluded by your organization''s allowlist.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: organizacja-moze-ograniczyc-wysilek
    tresc: "Organizacja może ograniczyć najwyższy dostępny poziom wysiłku."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: 'Your organization can cap the [effort level](#adjust-effort-level) in two ways.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: model-domyslny-zalezy-od-konta-i-wersji
    tresc: "Model, na którym startuje Claude Code bez innego wyboru, zależy od rodzaju konta i zmieniał się w kolejnych wersjach programu."
    zrodlo: https://code.claude.com/docs/en/model-config.md
    cytat: 'The behavior of `default` depends on your account type: … Before v2.1.280, `default` resolved to Sonnet 5 on Pro and Team Standard, and to Opus 5 on Max, Team Premium, Enterprise'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: lzejszy-model-wiekszosc-mocniejszy-zlozone-rozumowanie
    tresc: "Według dokumentacji z 26.10.2026 Sonnet dobrze radzi sobie z większością zadań programistycznych i kosztuje mniej niż Opus, a Opusa warto zostawić na złożone decyzje o budowie programu i rozumowanie w wielu krokach."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: 'Sonnet handles most coding tasks well and costs less than Opus. Reserve Opus for complex architectural decisions or multi-step reasoning.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

