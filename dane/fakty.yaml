  # Lekcja praca-do-warunku (moduł 8, /goal), 26.10.2026

  - id: goal-ustawia-warunek-i-pracuje-dalej
    tresc: 'Polecenie /goal ustawia warunek ukończenia, a Claude pracuje do niego bez Twoich próśb o każdy krok. Po każdej turze model sprawdza, czy warunek jest spełniony; gdy uzna, że jeszcze nie, Claude zaczyna kolejną turę, zamiast oddać Ci sterowanie.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'The `/goal` command sets a completion condition and Claude keeps working toward it without you prompting each step. After each turn, a model checks whether the condition holds. If the model judges it not yet met, Claude starts another turn instead of returning control to you.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-cel-znika-sam
    tresc: 'Cel znika sam, gdy warunek jest spełniony, gdy model uzna go za niemożliwy do spełnienia albo gdy tura padnie na błąd, który musisz naprawić.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'The goal clears automatically once the condition is met, if the model judges the condition impossible to satisfy, or if a turn fails on [an error you have to fix](#errors-you-have-to-fix-clear-the-goal).'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-do-duzej-pracy-ze-sprawdzalnym-koncem
    tresc: 'Cel ustawiasz do dużej pracy, której stan końcowy da się sprawdzić.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'Use a goal for substantial work with a verifiable end state:'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-tylko-w-tej-sesji
    tresc: '/goal to skrót na jedną sesję: wpisujesz warunek, a on działa tylko w bieżącej sesji.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: '`/goal` is a session-scoped shortcut: you type a condition and it''s active for the current session only.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-hook-stop-dla-kazdej-sesji
    tresc: '/goal i hook Stop uruchamiają się po każdej turze. Hook Stop leży w pliku ustawień, działa w każdej sesji ze swojego zakresu i może uruchomić skrypt albo prompt oceniany przez model.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: '`/goal` and a Stop hook both fire after every turn. … A Stop hook lives in your settings file, applies to every session in its scope, and can run a script for deterministic checks or a prompt for model-evaluated ones.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-auto-nie-zaczyna-nowej-tury
    tresc: 'Sam tryb Auto zatwierdza wywołania narzędzi w obrębie jednej tury, ale nie zaczyna nowej; Claude kończy, gdy sam uzna pracę za skończoną.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: '[Auto mode](https://code.claude.com/docs/en/auto-mode-config.md) on its own approves tool calls within a single turn but doesn''t start a new one. Claude stops when it judges the work done.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-ocenia-swiezy-model
    tresc: '/goal dodaje osobnego oceniającego, który po każdej turze sprawdza Twój warunek, więc o końcu pracy decyduje świeży model, a nie ten, który wykonuje pracę.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: '`/goal` adds a separate evaluator that checks your condition after every turn, so completion is decided by a fresh model rather than the one doing the work.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-auto-i-goal-uzupelniaja-sie
    tresc: 'Tryb Auto i /goal uzupełniają się: Auto usuwa pytania o zgodę przy kolejnych narzędziach, a /goal Twoje prośby przed kolejnymi turami.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'The two are complementary: auto mode removes per-tool prompts, and `/goal` removes per-turn prompts.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-praca-o-porze-bez-otwartej-sesji
    tresc: 'Te sposoby podtrzymują bieżącą sesję; pracę, która rusza niezależnie od otwartej sesji, możesz też ustawić według harmonogramu.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'The approaches above keep the current session running. You can also schedule work that runs independent of any open session, such as nightly tests or morning triage.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-jeden-cel-na-sesje
    tresc: 'W jednej sesji może być aktywny jeden cel; to samo polecenie ustawia go, sprawdza i usuwa, zależnie od tego, co wpiszesz po nim.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'One goal can be active per session. The same command sets, checks, and clears it depending on the argument.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-nowy-cel-zastepuje-stary
    tresc: 'Wpisujesz /goal, a po nim warunek, który ma być spełniony; gdy jakiś cel jest już aktywny, nowy go zastępuje.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'Run `/goal` followed by the condition you want satisfied. If a goal is already active, the new one replaces it.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-ustawienie-od-razu-startuje-ture
    tresc: 'Ustawienie celu od razu zaczyna turę, a poleceniem dla Claude jest sam warunek; osobnej prośby nie wysyłasz.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'Setting a goal starts a turn immediately, with the condition itself as the directive. You don''t need to send a separate prompt.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-nie-zmienia-trybu-auto-bez-nadzoru
    tresc: 'Cel nie zmienia trybu uprawnień; żeby tury celu szły bez nadzoru, uruchom /goal w trybie Auto.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'A goal doesn''t change your permission mode. To let goal turns run unattended, run `/goal` in [auto mode](https://code.claude.com/docs/en/auto-mode-config.md).'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-w-manual-claude-dalej-pyta
    tresc: 'W trybie Manual Claude dalej pyta przed wywołaniami narzędzi, na które Twoje ustawienia jeszcze nie pozwalają.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'In [Manual mode](https://code.claude.com/docs/en/permission-modes.md), Claude still asks before tool calls that your settings don''t already allow, such as the test command above.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-ocena-tylko-z-rozmowy
    tresc: 'Oceniający sprawdza warunek według tego, co Claude pokazał w rozmowie. Sam nie uruchamia poleceń ani nie czyta plików, więc warunek piszesz tak, żeby dało się go wykazać tym, co wypisze Claude.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'The [evaluator](#how-evaluation-works) judges your condition against what Claude has surfaced in the conversation. It doesn''t run commands or read files independently, so write the condition as something Claude''s own output can demonstrate.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-warunek-mierzalny-koniec
    tresc: 'Warunek, który wytrzymuje wiele tur, ma zwykle jeden mierzalny stan końcowy, na przykład wynik testu, kod zakończenia budowania, liczbę plików albo pustą kolejkę.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'A condition that holds up across many turns usually has: … **One measurable end state**: a test result, a build exit code, a file count, an empty queue'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-warunek-sposob-sprawdzenia
    tresc: 'Taki warunek ma zwykle podany sposób sprawdzenia: jak Claude ma wykazać, że warunek jest spełniony.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: '**A stated check**: how Claude should prove it'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-warunek-ograniczenia
    tresc: 'Taki warunek ma zwykle ważne ograniczenia: to, co nie może się zmienić po drodze do celu.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: '**Constraints that matter**: anything that must not change on the way there'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-warunek-do-4000-znakow
    tresc: 'Warunek może mieć do 4000 znaków.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'The condition can be up to 4,000 characters.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-granica-tur-albo-czasu
    tresc: 'Żeby ograniczyć czas pracy celu, dopisujesz do warunku granicę tur albo czasu, na przykład „or stop after 20 turns”. Claude w każdej turze podaje postęp względem tej granicy, a oceniający ocenia ją z rozmowy.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'To bound how long a goal runs, include a turn or time clause in the condition, such as `or stop after 20 turns`. Claude reports progress against that clause each turn and the evaluator judges it from the conversation.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-stan-bez-argumentu
    tresc: '/goal bez niczego po nim pokazuje stan. Przy aktywnym celu stan pokazuje warunek, jak długo cel trwa, ile tur oceniono, ile tokenów zużyto i ostatni powód oceniającego.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'Run `/goal` with no arguments to see the current state. … If a goal is active, the status shows: … The condition … How long it has been running … How many turns have been evaluated … The current token spend … The evaluator''s most recent reason'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-stan-po-osiagnietym-celu
    tresc: 'Gdy żaden cel nie jest aktywny, a wcześniej w tej sesji jakiś został osiągnięty, stan pokazuje osiągnięty warunek, czas trwania, liczbę tur i zużyte tokeny.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'If no goal is active but one was achieved earlier in the session, the status shows the achieved condition along with its duration, turn count, and token spend.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-clear-usuwa-cel
    tresc: '/goal clear usuwa aktywny cel, zanim się rozstrzygnie; zamiast clear możesz wpisać stop, off, reset, none albo cancel.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'Run `/goal clear` to remove an active goal before it resolves. … `stop`, `off`, `reset`, `none`, and `cancel` are accepted as aliases for `clear`.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-clear-nowa-rozmowa-usuwa-cel
    tresc: 'Polecenie /clear, które zaczyna nową rozmowę, też usuwa aktywny cel.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'Running `/clear` to start a new conversation also removes any active goal.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  # Lekcja hooki/powiadomienie-gdy-czeka (moduł 7), 26.10.2026
  - id: hook-stala-reakcja-nie-wybor-modelu
    tresc: 'Hooki to polecenia, które ustawiasz sam. Claude Code uruchamia je w określonych chwilach pracy, więc dana czynność dzieje się zawsze, a nie wtedy, gdy model sam zdecyduje się ją wykonać.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'Hooks are user-defined shell commands. Claude Code runs them at specific points in its lifecycle, which gives you deterministic control: certain actions always happen rather than relying on the LLM to choose to run them.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-inne-rozszerzenia-skille-subagenci-wtyczki
    tresc: 'Dokumentacja hooków wymienia jako inne sposoby rozszerzania Claude Code skille (dodatkowe instrukcje), subagentów (zadania w osobnym kontekście) i wtyczki (pakiety rozszerzeń).'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'For other ways to extend Claude Code, see [skills](https://code.claude.com/docs/en/skills.md) for giving Claude additional instructions and executable commands, [subagents](https://code.claude.com/docs/en/sub-agents.md) for running tasks in isolated contexts, and [plugins](https://code.claude.com/docs/en/plugins/overview.md) for packaging extensions to share across projects.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-blok-hooks-w-pliku-ustawien
    tresc: 'Hook tworzysz, dopisując blok hooks do pliku ustawień.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'To create a hook, add a `hooks` block to a [settings file](#configure-hook-location).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-nowe-zdarzenie-obok-istniejacych
    tresc: 'Gdy plik ustawień ma już klucz hooks, nowe zdarzenie, np. Notification, dopisuje się obok istniejących, zamiast zastępować cały blok.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'If your settings file already has a `hooks` key, add `Notification` as a sibling of the existing event keys rather than replacing the whole object.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-prosba-do-claude-w-terminalu
    tresc: 'Dokumentacja podaje, że w programie w terminalu możesz poprosić Claude, żeby napisał hook za Ciebie, opisując, czego chcesz.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'You can also ask Claude to write the hook for you by describing what you want in the CLI.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-zastosowania
    tresc: 'Hooki uruchamiają polecenia w ważnych chwilach pracy Claude Code, np. formatują pliki po zmianach, blokują polecenia przed wykonaniem, wysyłają powiadomienie, gdy Claude potrzebuje Twojej odpowiedzi, albo dokładają kontekst na starcie sesji.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'Hooks let you run code at key points in Claude Code''s lifecycle: format files after edits, block commands before they execute, send notifications when Claude needs input, inject context at session start, and more.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-notification-gdy-claude-czeka
    tresc: 'Hook powiadomienia korzysta ze zdarzenia Notification, które Claude Code wysyła, gdy Claude czeka na Twoją odpowiedź albo zgodę.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'This hook uses the `Notification` event, which Claude Code fires when Claude is waiting for input or permission.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-powiadomienie-polecenie-systemu
    tresc: 'Dokumentacja podaje gotowy hook powiadomienia osobno dla macOS, Linuxa i Windowsa; każdy używa polecenia powiadomień danego systemu.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'The example below uses `osascript` for macOS; see [Get notified when Claude needs input](#get-notified-when-claude-needs-input) for Linux and Windows commands. … Each tab below uses the platform''s native notification command.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-macos-script-editor-bez-zgody-cisza
    tresc: 'Na macOS polecenie osascript pokazuje powiadomienia przez wbudowaną aplikację Script Editor. Gdy Script Editor nie ma zgody na powiadomienia, polecenie zawodzi bez żadnego komunikatu, a macOS nie zapyta o zgodę.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: '`osascript` routes notifications through the built-in Script Editor app. If Script Editor doesn''t have notification permission, the command fails silently, and macOS won''t prompt you to grant it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-macos-naprawa-zgody-script-editor
    tresc: 'Naprawa na macOS: raz uruchamiasz w Terminalu polecenie testowe, żeby Script Editor pojawił się w ustawieniach powiadomień, potem w Ustawieniach systemowych > Powiadomienia włączasz dla Script Editor zezwolenie na powiadomienia.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'Run this in Terminal once to make Script Editor appear in your notification settings: … Nothing will appear yet. Open **System Settings > Notifications**, find **Script Editor** in the list, and turn on **Allow Notifications**. Run the command again to confirm the test notification appears.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-windows-okno-dialogowe-za-oknem
    tresc: 'Przykład hooka dla Windowsa otwiera okno dialogowe, a nie powiadomienie w rogu ekranu, więc okno może się otworzyć za oknem terminala.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'This command opens a dialog box rather than a notification in the corner of your screen, so the dialog can open behind your terminal window.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-notification-pusty-matcher-wszystkie-typy
    tresc: 'Pusty matcher (dopasowanie) w hooku Notification uruchamia hook przy każdym typie powiadomienia; żeby hook ruszał tylko przy jednym typie, wpisujesz jego nazwę.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'The empty `matcher` fires on all notification types. To fire only on specific events, set it to one of these values:'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-permission-prompt-czeka-szesc-sekund
    tresc: 'Typ powiadomienia permission_prompt zachodzi, gdy Claude potrzebuje Twojej zgody na użycie narzędzia, a pytanie czeka około sześciu sekund.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '| `permission_prompt` | Claude needs you to approve a tool use or a sandboxed command''s [network request](https://code.claude.com/docs/en/sandboxing.md#network-isolation), and the prompt has waited about six seconds |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-idle-prompt-minuta-po-odpowiedzi
    tresc: 'Typ powiadomienia idle_prompt zachodzi około 60 sekund po tym, jak Claude skończył odpowiadać, jeśli od tego czasu nic nie wpisałeś.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '| `idle_prompt` | Claude finished responding about 60 seconds ago and you haven''t typed since |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-aplikacja-permission-prompt-po-szesciu-sekundach
    tresc: 'W aplikacji Claude na komputer powiadomienie permission_prompt zachodzi około sześciu sekund po tym, jak Claude poprosi o zgodę; pisanie go nie opóźnia.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'Claude Code times `permission_prompt` differently in sessions where it sends permission requests to the Agent SDK''s [`canUseTool` callback](https://code.claude.com/docs/en/agent-sdk/user-input), which is how Claude Desktop and the VS Code extension host Claude Code: … Expect `permission_prompt` about six seconds after Claude asks for permission. Claude Code doesn''t defer it while you type.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-aplikacja-odpowiedz-szybciej-bez-powiadomienia
    tresc: 'W aplikacji Claude na komputer, gdy odpowiesz na pytanie o zgodę wcześniej (przed upływem około sześciu sekund), Claude Code nie uruchamia powiadomienia permission_prompt.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'which is how Claude Desktop and the VS Code extension host Claude Code: … If you or a [PermissionRequest](#permissionrequest) hook answer sooner, Claude Code doesn''t run `permission_prompt`.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-aplikacja-permission-prompt-od-2-1-233
    tresc: 'W aplikacji Claude na komputer powiadomienie permission_prompt zachodzi dopiero od Claude Code w wersji 2.1.233; wcześniej w tych sesjach nie zachodziło.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'which is how Claude Desktop and the VS Code extension host Claude Code: … Before v2.1.233, `permission_prompt` didn''t fire in these sessions.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-notification-nie-zmienia-rozmowy
    tresc: 'Hook Notification nie może zablokować ani zmienić powiadomienia; służy do skutków ubocznych, np. przekazania powiadomienia dalej.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'Notification hooks can''t block or modify notifications. … Notification hooks are intended for side effects such as forwarding the notification to an external service.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-permissionrequest-sygnal-od-razu
    tresc: 'Sygnał w chwili, gdy Claude prosi o zgodę, daje zdarzenie PermissionRequest; hook Notification typu permission_prompt rusza dopiero, gdy pytanie czeka około sześciu sekund.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'Use this event when you need a signal the moment Claude asks for permission to use a tool. Claude Code runs a [Notification](#notification) hook with the `permission_prompt` type only after the prompt has waited about six seconds.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hooki-te-same-zdarzenia-takze-w-aplikacji
    tresc: 'Claude Code uruchamia te same zdarzenia hooków wszędzie, gdzie działa: w terminalu, w rozszerzeniach edytorów, w aplikacji Claude na komputer i w sesjach w chmurze.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'Claude Code fires the same hook events wherever it runs: sessions in the terminal, IDE extensions, the [Desktop app](https://code.claude.com/docs/en/desktop-quickstart.md), and [cloud sessions](https://code.claude.com/docs/en/claude-code-on-the-web.md).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-trzy-rytmy-zdarzen
    tresc: 'Zdarzenia hooków mają trzy rytmy: raz na sesję (SessionStart, SessionEnd), raz na wiadomość (m.in. UserPromptSubmit, Stop) i przy każdym użyciu narzędzia (PreToolUse, PostToolUse).'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'Events fall into three cadences: … per session: `SessionStart` and `SessionEnd` … per turn: `UserPromptSubmit`, `Stop`, and `StopFailure` … on every tool call inside the agentic loop: `PreToolUse` and `PostToolUse`'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zdarzenie-sessionstart-kiedy
    tresc: 'Zdarzenie SessionStart zachodzi, gdy sesja się zaczyna albo wznawia.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '| `SessionStart` | When a session begins or resumes |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zdarzenie-pretooluse-kiedy
    tresc: 'Zdarzenie PreToolUse zachodzi przed użyciem narzędzia i może je zablokować.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '| `PreToolUse` | Before a tool call executes. Can block it |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zdarzenie-posttooluse-kiedy
    tresc: 'Zdarzenie PostToolUse zachodzi po udanym użyciu narzędzia.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '| `PostToolUse` | After a tool call succeeds |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zdarzenie-notification-kiedy
    tresc: 'Zdarzenie Notification zachodzi, gdy Claude Code wysyła powiadomienie.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '| `Notification` | When Claude Code sends a notification |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: zdarzenie-stop-kiedy
    tresc: 'Zdarzenie Stop zachodzi, gdy Claude kończy odpowiadać.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '| `Stop` | When Claude finishes responding |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-stop-po-kazdej-odpowiedzi
    tresc: 'Hook Stop rusza za każdym razem, gdy Claude kończy odpowiadać, a nie tylko po zakończeniu zadania.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: '`Stop` hooks fire whenever Claude finishes responding, not only at task completion.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-trzy-poziomy-zdarzenie-dopasowanie-hook
    tresc: 'Zapis hooka ma trzy poziomy: zdarzenie, na które hook reaguje; grupę dopasowania (matcher), która zawęża, kiedy hook rusza; i jeden albo kilka hooków do uruchomienia.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'Hooks are defined in JSON settings files. The configuration has three levels of nesting: … Choose a [hook event](#hook-events) to respond to, like `PreToolUse` or `Stop` … Add a [matcher group](#matcher-patterns) to filter when it fires, like "only for the Bash tool" … Define one or more [hook handlers](#hook-handler-fields) to run when matched'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-miejsce-folder-albo-komputer
    tresc: 'Miejsce hooka wyznacza jego zasięg: hook w ~/.claude/settings.json działa we wszystkich Twoich projektach, a hook w .claude/settings.json tylko w jednym projekcie.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'Where you define a hook determines its scope: … | `~/.claude/settings.json` | All your projects | No, local to your machine | … | `.claude/settings.json` | Single project | Yes, can be committed to the repo |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: ustawienia-tylda-to-folder-domowy
    tresc: '~/.claude to folder .claude w Twoim folderze domowym, a samo .claude to folder .claude w Twoim projekcie.'
    zrodlo: https://code.claude.com/docs/en/settings.md
    cytat: 'In the File column, `~/.claude` is the `.claude` folder in your home directory, and a bare `.claude` is the `.claude` folder inside your project.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hooki-z-roznych-plikow-sumuja-sie
    tresc: 'Hooki z różnych poziomów ustawień sumują się, a nie zastępują: ustawienia użytkownika, projektu i lokalne dokładają własne hooki.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'Hook entries merge across settings levels rather than replacing each other: user, project, and local settings add their own hooks without removing managed ones'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-command-uruchamia-polecenie-powloki
    tresc: 'Hook typu command uruchamia polecenie powłoki; pole command zawiera polecenie do wykonania.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '**[Command hooks](#command-hook-fields)** (`type: "command"`): run a shell command. … | `command` | yes | Shell command to execute.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-windows-bez-git-bash-powershell
    tresc: 'Na Windowsie bez zainstalowanego Git Bash hook typu command domyślnie działa w PowerShell.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'Shell to use for this hook. Accepts `"bash"` or `"powershell"`. Defaults to `"bash"`, or to `"powershell"` on Windows when Git Bash isn''t installed.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-dziala-poza-rozmowa
    tresc: 'Hooki działają poza główną rozmową i domyślnie nic do niej nie wczytują.'
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '**What loads:** Nothing by default. Hooks execute outside the main conversation.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-wbudowany-instrukcje-polecenie-stala-logika
    tresc: "Skille wbudowane w Claude Code to instrukcje: dają Claude szczegółowe wskazówki i pozwalają mu poprowadzić pracę jego narzędziami. Większość poleceń wbudowanych wykonuje zamiast tego wprost stałą, zaprogramowaną czynność."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'Bundled skills are prompt-based: they give Claude detailed instructions and let it orchestrate the work using its tools. Most built-in commands instead execute fixed logic directly.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-dopasowuje-zadanie-do-opisow-skilli
    tresc: "Claude porównuje Twoje zadanie z opisami skilli i po nich decyduje, które pasują. Gdy opisy są mętne albo się pokrywają, Claude może wziąć zły skill albo pominąć ten, który by pomógł. Żeby Claude użył konkretnego skilla, uruchom go przez /nazwa."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: 'Claude matches your task against skill descriptions to decide which are relevant. If descriptions are vague or overlap, Claude may load the wrong skill or miss one that would help. To tell Claude to use a specific skill, invoke it with `/<name>`.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: polecenie-tylko-na-poczatku-wiadomosci
    tresc: "Polecenie działa tylko na początku wiadomości; tekst po nazwie polecenia staje się jego argumentami."
    zrodlo: https://code.claude.com/docs/en/commands.md
    cytat: 'A command is only recognized at the start of your message. Text that follows the command name becomes its arguments.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-polecenia-z-panelem-terminala-dzialaja-inaczej
    tresc: "Polecenia wbudowane, które w terminalu otwierają interaktywny panel, w zakładce Code aplikacji działają inaczej."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**Terminal-dialog commands**: built-in commands that open an interactive panel in the terminal behave differently in the Code tab.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skille-konta-zarzadzasz-w-customize-albo-na-claude-ai
    tresc: "Skillami włączonymi dla Twojego konta claude.ai zarządzasz przez Customize na pasku bocznym aplikacji albo w ustawieniach skilli na claude.ai."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'Both interactive and scheduled Cowork sessions load the skills enabled for your claude.ai account, synced at session start. Manage them from **Customize** in the Desktop app sidebar or from the skills settings on claude.ai.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: polecenia-steruja-claude-code-z-rozmowy
    tresc: "Polecenia sterują Claude Code z wnętrza sesji; to szybki sposób, żeby na przykład zmienić model, zarządzać uprawnieniami, wyczyścić kontekst albo uruchomić przepływ pracy."
    zrodlo: https://code.claude.com/docs/en/commands.md
    cytat: 'Commands control Claude Code from inside a session. They provide a quick way to switch models, manage permissions, clear context, run a workflow, and more.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-projektu-katalog
    tresc: "Skill projektu leży w pliku .claude/skills/<nazwa>/SKILL.md i ładuje się w sesjach w tym repozytorium, ale nie w wątkach w chmurze w projekcie."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: '| Project | `.claude/skills/<skill-name>/SKILL.md` | Sessions in this repository, but not [cloud threads in a project](https://code.claude.com/docs/en/claude-projects.md#what-threads-pick-up-from-your-repositories). Commit it so your team gets it too |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-wtyczki-nazwa-z-dwukropkiem
    tresc: "Skill z wtyczki leży w folderze wtyczki (<wtyczka>/skills/<nazwa>/SKILL.md) i działa wszędzie tam, gdzie wtyczka jest włączona, pod nazwą /nazwa-wtyczki:nazwa-skilla."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: '| Plugin | `<plugin>/skills/<skill-name>/SKILL.md` | Wherever the [plugin](https://code.claude.com/docs/en/plugins/overview.md) is enabled, as `/plugin-name:skill-name` |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: goal-claude-pracuje-az-warunek-spelniony
    tresc: "Polecenie /goal ustawia cel: Claude pracuje dalej przez kolejne tury, aż warunek zostanie spełniony albo cel zniknie z innego powodu."
    zrodlo: https://code.claude.com/docs/en/commands.md
    cytat: 'Set a [goal](https://code.claude.com/docs/en/goal.md): Claude keeps working across turns until the condition is met or the goal [clears for another reason](https://code.claude.com/docs/en/goal.md#how-evaluation-works).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-remote-control-sesja-na-innych-urzadzeniach
    tresc: "Sesja lokalna z aplikacji pojawia się na Twoich innych urządzeniach, gdy połączy ją Remote Control: na liście sesji na claude.ai/code i w aplikacjach Claude zalogowanych na Twoje konto claude.ai."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'A local session shows up on your other devices once [Remote Control](https://code.claude.com/docs/en/remote-control.md) connects it. A connected session appears in the session list at [claude.ai/code](https://claude.ai/code) and in the Claude apps on devices signed in to your claude.ai account.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  # Lekcja 4.2 pierwszy-skill (brief 26.10.2026). Fakty z rezerwy bez pola cytat
  # (skill-kiedy-tworzyc, skill-szesc-pol, skill-naglowek-pierwsza-linia, skill-nazwa-zasady,
  # skill-najwazniejsze-na-gorze, skill-nie-dziala, skill-osobisty-katalog, skill-standard-otwarty)
  # zastępują niżej nowe identyfikatory z cytatem; skill-zapis-chroniony zastępują istniejące
  # accept-edits-sciezki-chronione-pytaja i sciezki-chronione-czym-sa; skill-opis-limit lekcja pomija.
  # Stare zostają dla moduly/skille.

  - id: skill-tworz-gdy-wklejasz-te-same-instrukcje
    tresc: "Skill warto zrobić, gdy w kółko wklejasz do rozmowy te same instrukcje, listę kontrolną albo procedurę z kilku kroków, albo gdy część CLAUDE.md zamieniła się z faktu w procedurę."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'Create a skill when you keep pasting the same instructions, checklist, or multi-step procedure into chat, or when a section of CLAUDE.md has grown into a procedure rather than a fact.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-wyzwalacze-ten-sam-prompt-ta-sama-procedura
    tresc: "Gdy w kółko wpisujesz ten sam prompt na początek zadania, zapisz go jako skill, który uruchamiasz sam; gdy trzeci raz wklejasz do rozmowy tę samą procedurę z kilku kroków, zapisz ją jako skill."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '| You keep typing the same prompt to start a task | Save it as a user-invocable [skill](https://code.claude.com/docs/en/skills.md) | … | You paste the same playbook or multi-step procedure into chat for the third time | Capture it as a [skill](https://code.claude.com/docs/en/skills.md) |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-plik-ma-naglowek-i-instrukcje
    tresc: "Każdy skill to plik SKILL.md z dwiema częściami: nagłówkiem YAML między liniami ---, który mówi Claude, kiedy użyć skilla, i treścią w markdown z instrukcjami, według których Claude pracuje, gdy skill działa."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'Every skill needs a `SKILL.md` file with two parts: YAML frontmatter between `---` markers that tells Claude when to use the skill, and markdown content with the instructions Claude follows when the skill runs.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-nazwa-polecenia-z-folderu-albo-pola-name
    tresc: "Nazwa folderu skilla albo pole name, gdy je ustawisz, staje się poleceniem, które wpisujesz, a pole description pomaga Claude zdecydować, kiedy sam wczyta skill."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'The directory name, or the frontmatter `name` when you set one, becomes the command you type, and the `description` helps Claude decide when to load the skill automatically.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-pola-opcjonalne-zalecany-opis
    tresc: "Wszystkie pola nagłówka skilla są nieobowiązkowe; zalecane jest tylko description, żeby Claude wiedział, kiedy użyć skilla."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'All fields are optional. Only `description` is recommended so Claude knows when to use the skill.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-naglowek-od-pierwszej-linii
    tresc: "Claude Code czyta nagłówek skilla tylko wtedy, gdy otwierająca linia --- jest pierwszą linią pliku; inaczej traktuje cały plik, razem z liniami ---, jako treść skilla."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'Claude Code reads the frontmatter only when the opening `---` is the file''s first line. Otherwise it treats the whole file, `---` markers included, as skill content.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-tresc-wiedza-albo-zadanie
    tresc: "Treść skilla to wiedza, którą Claude stosuje w bieżącej pracy (zasady, wzorce, wytyczne stylu, wiedza z dziedziny), albo instrukcje krok po kroku do konkretnego zadania."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: '**Reference content** adds knowledge Claude applies to your current work. Conventions, patterns, style guides, domain knowledge. … **Task content** gives Claude step-by-step instructions for a specific action, like deployments, commits, or code generation.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-tresc-zwiezla-zostaje-w-rozmowie
    tresc: "Treść skilla pisz zwięźle: po wczytaniu zostaje w kontekście w kolejnych turach, więc każda linijka stale kosztuje tokeny."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'Keep the body itself concise. Once a skill loads, its content [stays in context across turns](#skill-content-lifecycle), so every line is a recurring token cost.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-miejsce-zapisu-decyduje
    tresc: "Miejsce, w którym zapiszesz skill, decyduje, które sesje go wczytają; skill zapisany w Twoim folderze domowym działa w każdym projekcie."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'Where you save a skill decides which sessions load it. Save it under your home directory to get it in every project'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-osobisty-wszystkie-projekty-na-komputerze
    tresc: "Skill osobisty leży w ~/.claude/skills/<nazwa>/SKILL.md i działa we wszystkich Twoich projektach na tym komputerze, ale nie w Cowork ani w sesjach w chmurze."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: '| Personal | `~/.claude/skills/<skill-name>/SKILL.md` | All your projects on this machine, but not [Cowork or cloud sessions](#skills-in-cowork-and-cloud-sessions) |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-projektu-z-folderu-sesji
    tresc: "Claude Code wczytuje skille projektu z .claude/skills/ w folderze, w którym go uruchamiasz, i w każdym folderze nad nim aż do korzenia repozytorium."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'Claude Code loads project skills from `.claude/skills/` in the directory where you start it and in every parent directory up to the repository root'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-zmiana-dziala-bez-restartu
    tresc: "Gdy dodasz, zmienisz albo usuniesz skill w ~/.claude/skills/ albo w .claude/skills/ projektu, Claude Code uwzględni zmianę w bieżącej sesji, bez ponownego uruchamiania."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'When you add, edit, or remove a skill under `~/.claude/skills/`, the project `.claude/skills/`, or a `.claude/skills/` inside an `--add-dir` directory, Claude Code picks up the change within the current session, without a restart.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-usuwasz-razem-z-folderem
    tresc: "Skill osobisty albo skill projektu usuwasz, usuwając jego folder: ~/.claude/skills/<nazwa>/ albo .claude/skills/<nazwa>/."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: '* **Personal or project skill**: delete the skill''s directory, `~/.claude/skills/<skill-name>/` or `.claude/skills/<skill-name>/`.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-na-konto-claude-ai-szesc-pol
    tresc: "Skill wgrywany na claude.ai może mieć w nagłówku tylko pola name, description, license, compatibility, metadata i allowed-tools; te same zasady obowiązują, gdy włączasz skill osobisty na koncie claude.ai, bo wtedy go tam wgrywasz."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: '| claude.ai skill uploads, the Skills API, and packaging with `package_skill.py` from [anthropics/skills](https://github.com/anthropics/skills) | `name`, `description`, `license`, `compatibility`, `metadata`, `allowed-tools` | … When you enable a personal skill for your claude.ai account, for example to use it in [Cowork and cloud sessions](#skills-in-cowork-and-cloud-sessions) and scheduled tasks, you upload it to claude.ai. The same rules apply to that upload.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-otwarty-standard-agent-skills
    tresc: "Skille Claude Code działają według otwartego standardu Agent Skills, który działa w wielu narzędziach AI."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'Claude Code skills follow the [Agent Skills](https://agentskills.io) open standard, which works across multiple AI tools.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-nazwa-male-litery-cyfry-myslniki
    tresc: "Według standardu Agent Skills nazwa skilla (pole name) ma od 1 do 64 znaków, tylko małe litery, cyfry i myślniki, bez myślnika na początku i na końcu, bez dwóch myślników pod rząd, i musi być taka sama jak nazwa folderu skilla."
    zrodlo: https://agentskills.io/specification.md
    cytat: '* Must be 1-64 characters * May only contain unicode lowercase alphanumeric characters (`a-z`, `0-9`) and hyphens (`-`) * Must not start or end with a hyphen (`-`) * Must not contain consecutive hyphens (`--`) * Must match the parent directory name'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-tresc-wchodzi-raz-i-zostaje
    tresc: "Gdy Ty albo Claude uruchomicie skill, jego treść wchodzi do rozmowy jako jedna wiadomość i zostaje w niej w kolejnych turach; Claude Code nie czyta pliku skilla ponownie, więc wskazówki na całe zadanie pisz jako stałe zasady, nie jednorazowe kroki."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'When you or Claude invoke a skill, the rendered `SKILL.md` content enters the conversation as a single message and stays there across later turns. … Claude Code does not re-read the skill file on later turns, so write guidance that should apply throughout a task as standing instructions rather than one-time steps.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-tekst-po-nazwie-dopisany-na-koncu
    tresc: "Gdy uruchamiasz skill z tekstem po nazwie, a treść skilla nie ma na niego miejsca, Claude Code dopisuje ten tekst na końcu treści skilla, więc Claude i tak widzi, co wpisałeś."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'If you invoke a skill with arguments but no placeholder in the skill''s content receives one, Claude Code appends `ARGUMENTS: <your input>` to the end of the skill content so Claude still sees what you typed.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-po-streszczeniu-uruchom-ponownie
    tresc: "Gdy rozmowa została streszczona, uruchom skill jeszcze raz, żeby wróciła jego pełna treść; po streszczeniu Claude Code może zachować tylko początek skilla, więc najważniejsze instrukcje stawiaj na górze SKILL.md."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: '* **The conversation was compacted**: invoke the skill again to restore its full content. After [compaction](https://code.claude.com/docs/en/how-claude-code-works.md#when-context-fills-up), Claude Code [can keep only the start of an invoked skill](#skill-content-lifecycle), so put the most important instructions near the top of `SKILL.md`.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-gdy-nie-rusza-opis-pytanie-nazwa
    tresc: "Gdy Claude nie używa skilla, choć powinien: sprawdź, czy opis zawiera słowa, których naturalnie używasz, sprawdź, czy skill jest w odpowiedzi na pytanie „What skills are available?”, sformułuj prośbę bliżej opisu albo uruchom skill wprost przez /nazwa."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: '1. Check the description includes keywords users would naturally say 2. Verify the skill appears in `What skills are available?` 3. Try rephrasing your request to match the description more closely 4. Invoke it directly with `/skill-name` if the skill is user-invocable'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-rusza-za-czesto-doprecyzuj-opis
    tresc: "Gdy Claude używa skilla wtedy, kiedy tego nie chcesz, napisz bardziej konkretny opis."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'If Claude uses your skill when you don''t want it: 1. Make the description more specific'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-nowy-folder-skilli-wymaga-przeladowania
    tresc: "Gdy utworzysz folder skilli najwyższego poziomu, którego nie było na starcie sesji, Claude Code jeszcze go nie obserwuje; skille z niego wczytuje dopiero polecenie /reload-skills."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'If you create a top-level skills directory that didn''t exist when the session started, run [`/reload-skills`](https://code.claude.com/docs/en/commands#all-commands) to pick up the skills you put there. Claude Code isn''t watching that directory yet'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  # Lekcja 4.3 claude-md-czy-skill (moduł powtarzalna-praca), etap 1, 26.10.2026.
  # Cytaty sprawdzone grep -F na świeżych kopiach w dane/zrodla/strony/.

  - id: rozszerzenia-zmieniaja-co-claude-wie
    tresc: "Rozszerzenia to dodatki, którymi dopasowujesz to, co Claude wie, łączysz go z usługami z zewnątrz i automatyzujesz pracę."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: 'This guide covers the extension layer: features you add to customize what Claude knows, connect it to external services, and automate workflows.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: rozszerzenia-zacznij-od-claude-md
    tresc: "Dokumentacja radzi zacząć od CLAUDE.md z zasadami projektu, a inne rozszerzenia dokładać wtedy, gdy pojawi się konkretny powód."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '**New to Claude Code?** Start with [CLAUDE.md](https://code.claude.com/docs/en/memory.md) for project conventions, then add other extensions [as specific triggers come up](#build-your-setup-over-time).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wyzwalacz-claude-md-dwa-razy-ten-sam-blad
    tresc: "Gdy Claude dwa razy źle zastosuje tę samą zasadę albo polecenie, dopisz je do CLAUDE.md."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '| Claude gets a convention or command wrong twice | Add it to [CLAUDE.md](https://code.claude.com/docs/en/memory.md) |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: powtarzany-blad-do-claude-md-przepis-do-poprawki-skilla
    tresc: "Błąd, który się powtarza, albo uwaga, która wraca przy każdym przeglądzie, to poprawka w CLAUDE.md, a nie jednorazowa poprawka w rozmowie; przepis pracy, który ciągle poprawiasz ręcznie, to skill do poprawki."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: 'A repeated mistake or a recurring review comment is a CLAUDE.md edit, not a one-off correction in chat. A workflow you keep tweaking by hand is a skill that needs another revision.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-kazda-sesja-skill-na-zadanie
    tresc: "CLAUDE.md i skill przechowują instrukcje, ale wczytują się inaczej: CLAUDE.md automatycznie w każdej sesji, skill na żądanie."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: 'Both store instructions, but they load differently and serve different purposes. […] | Aspect | CLAUDE.md | Skill | … | **Loads** | Every session, automatically | On demand |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-uruchamia-przepis-claude-md-nie
    tresc: "Skillem uruchamiasz przepis pracy poleceniem /nazwa; CLAUDE.md tego nie potrafi."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '| Aspect | CLAUDE.md | Skill | … | **Can trigger workflows** | No | Yes, with `/<name>` |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: do-claude-md-co-claude-ma-wiedziec-zawsze
    tresc: "Do CLAUDE.md wpisujesz to, co Claude ma wiedzieć zawsze; dokumentacja podaje przykłady z pracy programisty i reguły „nigdy nie rób X”."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '**Put it in CLAUDE.md** if Claude should always know it: coding conventions, build commands, project structure, "never do X" rules.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: do-skilla-material-czasem-albo-przepis
    tresc: "Do skilla wpisujesz materiał, którego Claude potrzebuje tylko czasem, na przykład wytyczne stylu, albo przepis pracy, który uruchamiasz poleceniem /nazwa."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '**Put it in a skill** if it''s reference material Claude needs sometimes (API docs, style guides) or a workflow you trigger with `/<name>` (deploy, review, release).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-do-200-linii-material-do-skilli
    tresc: "Dokumentacja radzi trzymać CLAUDE.md poniżej 200 linii; gdy plik rośnie, materiał pomocniczy przenieś do skilli albo rozdziel na pliki w folderze .claude/rules/."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '**Rule of thumb:** Keep CLAUDE.md under 200 lines. If it''s growing, move reference content to skills or split into [`.claude/rules/`](https://code.claude.com/docs/en/memory#organize-rules-with-claude/rules/) files.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-wczytuje-sie-gdy-wywolany-albo-pasuje
    tresc: "CLAUDE.md wczytuje się w każdej sesji, a skill na żądanie: gdy go wywołasz albo gdy pasuje do zadania."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '| Aspect | CLAUDE.md | `.claude/rules/` | Skill | … | **Loads** | Every session | Every session, or when matching files are opened | On demand, when invoked or relevant |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-i-skill-prosba-nie-gwarancja
    tresc: "Zasada zapisana w CLAUDE.md albo w skillu to prośba, nie gwarancja; zasadę, która ma obowiązywać za każdym razem, zapisuje się jako hook."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: 'An instruction like "never edit `.env`" in CLAUDE.md or a skill is a request, not a guarantee. … If a rule must hold every time, make it a hook rather than a prompt instruction.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-zasady-stale-skill-material-na-zadanie
    tresc: "CLAUDE.md i skille łączysz tak: CLAUDE.md trzyma zawsze obecne zasady, a skille materiał wczytywany na żądanie."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '| **CLAUDE.md + Skills** | CLAUDE.md holds always-on rules; skills hold reference material loaded on demand |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: za-duzo-dodatkow-szum
    tresc: "Każdy dodatek zajmuje część kontekstu Claude; za dużo dodatków może zapełnić okno kontekstu albo dodać szum, przez który skille mogą nie uruchamiać się poprawnie albo Claude może gubić Twoje zasady."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: 'Every feature you add consumes some of Claude''s context. Too much can fill up your context window, but it can also add noise that makes Claude less effective; skills may not trigger correctly, or Claude may lose track of your conventions.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: koszt-claude-md-kazde-zapytanie-skill-opisy
    tresc: "CLAUDE.md wczytuje się na starcie sesji w całości i zajmuje kontekst w każdym zapytaniu; skille wczytują na starcie tylko opisy, a pełną treść przy użyciu, więc kosztują mało: w każdym zapytaniu są tylko opisy."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '| Feature | When it loads | What loads | Context cost | … | **CLAUDE.md** | Session start | Full content of each file that loads at session start | Every request | … | **Skills** | Session start + when used | Descriptions at start, full content when used | Low (descriptions every request)'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: skill-tresc-tylko-przy-uzyciu-dlugi-material-tani
    tresc: "W odróżnieniu od treści CLAUDE.md treść skilla wczytuje się dopiero przy użyciu, więc długi materiał pomocniczy prawie nic nie kosztuje, dopóki go nie potrzebujesz."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'Unlike CLAUDE.md content, a skill''s body loads only when it''s used, so long reference material costs almost nothing until you need it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: kazdy-skill-na-liscie-kosztuje-w-kazdej-turze
    tresc: "Każdy skill na liście skilli zajmuje miejsce w kontekście w każdej turze, nawet jeśli Claude nigdy go nie użyje."
    zrodlo: https://code.claude.com/docs/en/skills.md
    cytat: 'Every skill in the [skill listing](#skill-descriptions-are-cut-short) adds to your context on every turn, whether or not Claude ever uses it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-i-terminal-wspolne-claude-md
    tresc: "Aplikacja na komputer i Claude Code w terminalu mają wspólną konfigurację i wspólną pamięć projektu w plikach CLAUDE.md."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'If you already use the Claude Code CLI, Desktop runs the same underlying engine with a graphical interface. … They share configuration and project memory via CLAUDE.md files.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: claude-md-caly-projekt-skill-jedno-zadanie
    tresc: "CLAUDE.md dotyczy całego projektu, a skill konkretnego zadania."
    zrodlo: https://code.claude.com/docs/en/features-overview.md
    cytat: '| Aspect | CLAUDE.md | `.claude/rules/` | Skill | … | **Scope** | Whole project | Can be scoped to file paths | Task-specific |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  # Elementy ekranu lekcji pierwszy-konektor (moduł 5, lekcja 1): menu + i katalog konektorów, przepisane dosłownie z gałęzi modul-5; przy scalaniu zostaje po jednym wpisie.
  - id: aplikacja-plus-menu-pliki-skille-konektory-wtyczki
    tresc: 'W aplikacji przycisk + obok pola wiadomości otwiera dołączanie plików, skille, konektory i wtyczki.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Click the **+** button next to the prompt box for file attachments, [skills](#use-skills), [connectors](#connect-external-tools), and [plugins](#install-plugins).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-add-connectors-otwiera-katalog
    tresc: 'W aplikacji konektory dodajesz w sesji lokalnej albo SSH z kontem Claude, przed sesją albo w jej trakcie: klikasz + obok pola wiadomości i wybierasz Add connectors, co otwiera katalog konektorów; gdy menu pokazuje Connectors, wybierasz je, a potem Browse connectors.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Click **+** next to the prompt box, before or during the session, to add connectors in a local or [SSH](#ssh-sessions) session with a Claude account. Select **Add connectors** to open the connector directory. If the menu shows **Connectors** instead, select it, then **Browse connectors**.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-zapytaj-claude-o-konektory
    tresc: 'W aplikacji możesz zapytać Claude, jakie konektory są ustawione w Twojej sesji.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'You can ask Claude what connectors are configured in your session.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: konektor-logowanie-w-claude-ai
    tresc: 'Wymagane logowanie do serwera MCP (konektora) kończysz w claude.ai.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    cytat: 'Complete any required authentication steps in claude.ai.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: konektory-google-calendar-gmail-microsoft-365
    tresc: 'Microsoft 365, Gmail i Google Calendar to przykłady konektorów utrzymywanych przez Anthropic; nie obsługują logowania OAuth uruchamianego lokalnie z Claude Code, bo dostawca logowania przyjmuje tylko adres przekierowania zarejestrowany przez claude.ai.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    cytat: 'Some Anthropic-hosted connectors, such as Microsoft 365, Gmail, and Google Calendar, don''t support local OAuth from Claude Code because the upstream identity provider only accepts the redirect URL that claude.ai registered.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-konektory-dostarcza-aplikacja
    tresc: 'W sesjach lokalnych i SSH aplikacji na komputer konektory dostarcza do rozmowy sama aplikacja, a rządzą nimi tylko blokady narzędzi ustawione przez organizację.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    cytat: '| The [desktop app](https://code.claude.com/docs/en/desktop.md)''s local and SSH sessions | The desktop app delivers them in-process | `blocked` entries in your organization''s [connector tool controls](#organization-controls-on-connector-tools) |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-konektor-odlaczasz-na-claude-ai
    tresc: 'W sesjach lokalnych i SSH aplikacji na komputer konektor wyłączasz ze swoich sesji, odłączając go na claude.ai/customize/connectors.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    cytat: '**Desktop app local and SSH sessions**: … A user keeps a connector out of their own sessions by disconnecting it at [claude.ai/customize/connectors](https://claude.ai/customize/connectors).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-konektory-w-wsl-jeszcze-nie
    tresc: 'Do sesji WSL aplikacji na komputer konektory dopiero docierają (są w trakcie wprowadzania).'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    cytat: 'The desktop app''s WSL sessions have no row because connectors are [still rolling out to them](https://code.claude.com/docs/en/desktop-wsl.md#check-for-the-terminal-and-connectors).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: konektory-claude-ai-poza-folderem-projektu
    tresc: 'Konektory z claude.ai (tak jak serwery MCP z innych zakresów) są ustawiane poza repozytorium projektu, więc przejrzenie pliku .mcp.json nie pokazuje wszystkich serwerów, które sesja może wczytać.'
    zrodlo: https://code.claude.com/docs/en/security.md
    cytat: 'Servers at [other scopes](https://code.claude.com/docs/en/mcp.md#mcp-installation-scopes) and [claude.ai connectors](https://code.claude.com/docs/en/mcp.md#how-connectors-reach-claude-code) are configured outside the repository, and plugins can add servers too, so reviewing `.mcp.json` doesn''t show every server a session can load.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-dostarcza-konektory-z-konta-claude-ai
    tresc: 'W sesjach lokalnych i SSH aplikacja na komputer dostarcza Claude Code bezpośrednio konektory claude.ai, które dany użytkownik ma połączone.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'In local and SSH sessions, the desktop app delivers each user''s connected claude.ai connectors to Claude Code directly.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-sesja-ssh-na-zdalnej-maszynie
    tresc: 'Sesja SSH w aplikacji na komputer działa na zdalnej maszynie, z którą łączysz się przez SSH, na przykład na własnym serwerze, maszynie wirtualnej w chmurze albo w kontenerze programistycznym.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**SSH**: runs on a remote machine you connect to over SSH, such as your own servers, cloud VMs, or dev containers.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: mcp-claude-sam-wybiera-narzedzia
    tresc: 'W przewodniku podłączania serwera MCP w terminalu (Claude Code CLI) dokumentacja pisze, że zwykle nie trzeba nazywać serwera w prośbie, bo Claude sam wybiera odpowiednie narzędzia.'
    zrodlo: https://code.claude.com/docs/en/mcp-quickstart.md
    cytat: 'You don''t normally need to name a server in your prompt, since Claude chooses relevant tools on its own.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: mcp-serwer-zajmuje-miejsce-w-kontekscie
    tresc: 'W przewodniku podłączania serwera MCP w terminalu (Claude Code CLI) dokumentacja pisze, że każdy podłączony serwer zajmuje trochę miejsca w oknie kontekstu Claude, bo nazwy jego narzędzi i instrukcje serwera wczytują się do każdej sesji; usunięcie nieużywanych serwerów zwalnia to miejsce.'
    zrodlo: https://code.claude.com/docs/en/mcp-quickstart.md
    cytat: 'Each connected server takes some space in [Claude''s context window](https://code.claude.com/docs/en/how-claude-code-works.md#the-context-window) because its tool names and server instructions load into every session. Removing servers you no longer use keeps that space free.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-konektor-czyta-kalendarz-wysyla-wiadomosci
    tresc: 'W aplikacji na komputer po podłączeniu konektora Claude może czytać Twój kalendarz, wysyłać wiadomości, zakładać zgłoszenia i działać w Twoich narzędziach wprost.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Once connected, Claude can read your calendar, send messages, create issues, and interact with your tools directly.'

  - id: konektor-organizacja-ustawia-zasady-narzedzi
    tresc: 'Organizacja może ustawić zasady dla każdego narzędzia konektora z claude.ai osobno.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Your organization can set per-tool controls on [claude.ai connectors](https://claude.com/docs/connectors).'

  - id: aplikacja-konektor-zwykle-reguly-uprawnien
    tresc: 'W sesjach lokalnych i SSH aplikacji na komputer ustawienie organizacji „ask” nie dociera do Claude Code, więc do narzędzi konektora Claude Code stosuje zwykłe reguły uprawnień sesji, zamiast pytać przy każdym wywołaniu.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Claude Code reads these settings at startup and enforces them locally, except in the desktop app''s [local and SSH sessions](#how-connectors-reach-claude-code). There, … the `ask` setting doesn''t reach Claude Code, so it applies the session''s ordinary [permission rules](https://code.claude.com/docs/en/permissions.md) to those tools instead of prompting on every call.'

  - id: aplikacja-konektor-bez-zablokowanych-narzedzi
    tresc: 'W sesjach lokalnych i SSH aplikacja na komputer zatrzymuje narzędzia zablokowane przez organizację, zanim przekaże konektor do rozmowy.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'except in the desktop app''s [local and SSH sessions](#how-connectors-reach-claude-code). There, the desktop app withholds `blocked` tools before it delivers a connector'

  - id: konektor-zablokowane-narzedzie-niewidoczne-dla-claude
    tresc: 'Narzędzie konektora ustawione przez organizację na „blocked” Claude Code odfiltrowuje, zanim Claude je zobaczy, więc nie ma go na liście narzędzi Claude.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: '**Tool set to `blocked`**: Claude Code filters the tool out before Claude sees it, so it never appears in Claude''s tool list.'

  - id: aplikacja-i-czat-ta-sama-blokada-narzedzia
    tresc: 'Aplikacja na komputer i czat na claude.ai stosują tę samą blokadę narzędzia, więc zablokowanego narzędzia Claude nie użyje w żadnym z nich; konektor, którego wszystkie narzędzia są zablokowane, aplikacja pomija.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'The desktop app and claude.ai chat apply the same `blocked` setting, so Claude can''t use a blocked tool there either, and you can''t withhold a tool from the desktop app''s sessions while keeping it available in chat. The desktop app skips a connector whose tools are all blocked.'

  - id: mcp-autor-oznacza-narzedzie-wymagajace-zgody
    tresc: 'Autor serwera MCP może oznaczyć narzędzie tak, żeby każde jego wywołanie wymagało wyraźnej zgody.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'If you''re building an MCP server, you can mark a tool as requiring explicit approval on every call'

  - id: mcp-narzedzie-wymagajace-zgody-pyta-w-kazdym-trybie
    tresc: 'Przy narzędziu oznaczonym jako wymagające zgody Claude Code pokazuje pytanie o zgodę przy każdym wywołaniu, także w trybach acceptEdits, auto i bypassPermissions, i nie daje opcji „nie pytaj ponownie”.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Claude Code shows that tool''s permission prompt on every call, even in `acceptEdits`, `auto`, and `bypassPermissions` [permission modes](https://code.claude.com/docs/en/permissions.md#permission-modes), and doesn''t offer a "don''t ask again" option for it.'

  - id: mcp-narzedzie-wymagajace-zgody-po-co
    tresc: 'Oznaczenie służy narzędziom, w których samo pytanie o zgodę jest celem, na przykład krokowi udzielenia zgody albo dostępu, gdzie automatyczne przepuszczenie znaczyłoby, że żaden człowiek się nie zgodził; pozostałe narzędzia tego samego serwera działają według zwykłych zasad.'
    zrodlo: https://code.claude.com/docs/en/mcp.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Use this for tools whose permission prompt is itself the point, such as a consent or access-grant step where auto-approval would mean no human ever agreed. Other tools from the same server keep their normal permission behavior.'

  - id: zaden-tryb-nie-przepuszcza-narzedzi-wymagajacych-zgody
    tresc: 'Żaden tryb, także bypassPermissions, nie przepuszcza bez pytania narzędzi MCP oznaczonych jako wymagające działania użytkownika.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'Claude Code doesn''t auto-approve the following in any mode, including `bypassPermissions`. … Tools that require user interaction: the built-in `AskUserQuestion` tool and MCP tools marked [`requiresUserInteraction`](https://code.claude.com/docs/en/mcp#require-approval-for-a-specific-tool)'

  - id: auto-narzedzia-wymagajace-zgody-omijaja-klasyfikator
    tresc: 'W trybie auto narzędzia MCP oznaczone jako wymagające zgody pytają Cię wprost i nie trafiają do klasyfikatora, więc krok zgody nie jest przepuszczany automatycznie.'
    zrodlo: https://code.claude.com/docs/en/permission-modes.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'The connector tools and `requiresUserInteraction` MCP tools that prompt you directly in step 1 never reach the classifier either, so neither an org-required approval nor a consent step is auto-approved'

  - id: uzytkownik-przeglada-przed-zgoda
    tresc: 'To Ty odpowiadasz za sprawdzenie bezpieczeństwa proponowanego kodu i poleceń, zanim się na nie zgodzisz.'
    zrodlo: https://code.claude.com/docs/en/security.md
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"
    cytat: 'You''re responsible for reviewing proposed code and commands for safety before approval.'

  - id: aplikacja-compact-skraca-rozmowe-wczesniej
    tresc: "Gdy kontekst się zapełnia, Claude w aplikacji sam streszcza rozmowę i pracuje dalej; wpisanie /compact uruchamia streszczenie wcześniej i zwalnia miejsce w kontekście."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'When context fills up, Claude automatically summarizes the conversation and continues working. You can also type `/compact` to trigger summarization earlier and free up context space. See [the context window](https://code.claude.com/docs/en/how-claude-code-works.md#the-context-window) for details on how compaction works.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-btw-otwiera-boczna-rozmowe
    tresc: "Wpisanie /btw w polu wiadomości w aplikacji otwiera boczną rozmowę, która może czytać wszystko z głównej rozmowy do tego momentu, a niczego do niej nie dokłada."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'A side chat lets you ask Claude a question that uses your session''s context but doesn''t add anything back to the main conversation. [...] Press **Cmd+;** on macOS or **Ctrl+;** on Windows to open a side chat, or type `/btw` in the prompt box. The side chat can read everything in the main thread up to that point.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: kontekst-okno-miesci-wszystko-o-sesji
    tresc: "Okno kontekstu Claude Code mieści wszystko, co Claude wie o sesji: Twoje polecenia, pliki, które czyta, jego własne odpowiedzi i treść, która nigdy nie pojawia się w terminalu."
    zrodlo: https://code.claude.com/docs/en/context-window.md
    cytat: "Claude Code's context window holds everything Claude knows about your session: your instructions, the files it reads, its own responses, and content that never appears in your terminal."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: kontekst-na-start-claude-md-mcp-skille
    tresc: "Zanim cokolwiek wpiszesz, do kontekstu wczytują się CLAUDE.md, pamięć automatyczna, nazwy narzędzi MCP i opisy skilli."
    zrodlo: https://code.claude.com/docs/en/context-window.md
    cytat: "**Before you type anything**: CLAUDE.md, auto memory, MCP tool names, and skill descriptions all load into context."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-remote-control-polecenie-wlacza-dla-sesji
    tresc: "W aplikacji Remote Control dla lokalnej sesji włączasz przełącznikiem Remote Control albo wpisując /remote-control w polu wiadomości tej sesji."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**You turn it on for that session**: with the session''s **Remote Control** switch, or by typing `/remote-control` in its prompt box.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: read-blad-podpowiada-skill-do-typu-pliku
    tresc: "Po odmowie narzędzia Read Claude pracuje dalej: błąd podpowiada skill do tego typu pliku, jeśli taki jest, a jeśli nie, polecenie powłoki albo skrypt czytający ten format."
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: 'Claude keeps working after a refusal: the error suggests a skill for that file type if one is available, or else a shell command or script that reads the format.'
    sprawdzono: '2026-10-25'
    wersja: "2.1.310"

  - id: goal-dziala-w-aplikacji
    tresc: '/goal działa w trybie nieinteraktywnym, w aplikacji na komputer i przez Remote Control.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: '`/goal` works in [non-interactive mode](https://code.claude.com/docs/en/headless.md), in the [desktop app](https://code.claude.com/docs/en/desktop.md), and through [Remote Control](https://code.claude.com/docs/en/remote-control.md).'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-dziala-jak-hook-stop-na-sesje
    tresc: '/goal to nakładka na hook Stop z promptem, ustawiony tylko na bieżącą sesję.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: '`/goal` is a wrapper around a session-scoped [prompt-based Stop hook](https://code.claude.com/docs/en/hooks.md#prompt-based-hooks).'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-ocena-maly-szybki-model
    tresc: 'Za każdym razem, gdy Claude kończy turę, Claude Code wysyła warunek i dotychczasową rozmowę do ustawionego małego, szybkiego modelu. Ten model zwraca jeden z trzech werdyktów, każdy z krótkim powodem.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'Each time Claude finishes a turn, Claude Code sends the condition and the conversation so far to your configured [small fast model](https://code.claude.com/docs/en/model-config.md). The model returns one of three verdicts, each with a short reason:'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-werdykt-niespelniony
    tresc: 'Werdykt „jeszcze niespełniony” (Not yet met): Claude pracuje dalej i bierze powód jako wskazówkę na następną turę.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: '**Not yet met**: Claude keeps working and takes the reason as guidance for the next turn.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-werdykt-spelniony
    tresc: 'Werdykt „spełniony” (Met): Claude Code usuwa cel i zapisuje w zapisie rozmowy wpis o osiągnięciu celu.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: '**Met**: Claude Code clears the goal and records an achieved entry in the transcript.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-werdykt-niemozliwy
    tresc: 'Werdykt „niemożliwy” (Impossible): oceniający uznał, że warunku nigdy nie da się spełnić. Claude Code usuwa cel i zapisuje w zapisie rozmowy wpis o porażce z powodem; sam celu nie usuwasz.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: '**Impossible**: the evaluator judged that the condition can never be satisfied. Claude Code clears the goal and records a failed entry in the transcript along with the reason. You don''t need to clear it yourself.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-brak-postepu-zatrzymuje-petle
    tresc: 'Gdy Claude odpowiada oceniającemu bez postępu (przez kilka tur z rzędu nie używa narzędzi), Claude Code zatrzymuje pętlę, wypisuje ostrzeżenie i oddaje Ci sterowanie, a cel zostaje ustawiony. Ocena wraca po Twojej następnej wiadomości.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'If Claude keeps answering the evaluator without making progress (no tool use for several turns in a row), Claude Code stops the loop, prints a warning, and returns control to you with the goal still set. Evaluation resumes after your next prompt.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-blad-do-naprawy-kasuje-cel
    tresc: 'Gdy tura padnie na błąd, który musisz naprawić, Claude Code usuwa cel; po każdym innym błędzie cel zostaje. Naprawiasz przyczynę i ustawiasz cel jeszcze raz poleceniem /goal z warunkiem.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'When a turn fails, Claude Code clears the goal if the error is one you have to fix. After any other error the goal stays set. … Fix the cause, then [set the goal again](#set-a-goal) with `/goal <condition>`.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-bledy-ktore-kasuja-cel
    tresc: 'Cel kasują cztery rodzaje błędów: błąd logowania, gdy Claude Code sam prowadzi dane logowania; wyczerpane środki na koncie; przepełniony kontekst, którego nie zwolniło samoczynne kompaktowanie; niedostępny model.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'Four kinds of failure clear the goal: … An authentication failure, when Claude Code manages its own credentials. … An exhausted credit balance … A context overflow that [auto-compaction](https://code.claude.com/docs/en/model-config.md#set-the-auto-compact-window) couldn''t clear … A model that isn''t available'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-aplikacja-blad-logowania-nie-kasuje-celu
    tresc: 'Gdy dane logowania prowadzi za Ciebie program, w którym działa Claude Code, na przykład aplikacja na komputer, Claude Code przy błędzie logowania zostawia cel aktywny, bo ten program sam przywraca dostęp.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'When a host manages them for you, such as the desktop app or a [cloud session](https://code.claude.com/docs/en/claude-code-on-the-web.md), Claude Code leaves the goal active because the host restores access on its own.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-inne-bledy-cel-zostaje
    tresc: 'Po innym błędzie niż te, które kasują cel, cel zostaje ustawiony; takim błędem jest na przykład limit zapytań API, limit użycia claude.ai albo hook, który zakończył turę.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'After any other failure the goal stays set. … such as an API rate limit, a claude.ai [usage limit](https://code.claude.com/docs/en/errors.md#youve-hit-your-session-limit), or a hook that ended the turn'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-wiadomosc-od-razu-startuje-ture
    tresc: 'Wiadomością wysłaną w dowolnej chwili od razu zaczynasz następną turę.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'Send a message at any time to start the next turn immediately.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-praca-w-tle-odklada-ocene
    tresc: 'Gdy pod koniec tury wciąż działa subagent albo polecenie w tle, Claude Code pomija ocenę tej tury. Ocenia na końcu następnej tury, po której nic już nie działa w tle.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'If a subagent or a background shell command is still running when a turn ends, Claude Code skips the evaluation for that turn. It evaluates at the end of the next turn that finishes with no background work running.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-oceniajacy-nie-uzywa-narzedzi
    tresc: 'Oceniający nie wywołuje narzędzi, więc może ocenić tylko to, co Claude już pokazał w rozmowie.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'It does not call tools, so it can only judge what Claude has already surfaced in the conversation.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-koszt-oceny-niewielki
    tresc: 'Tokeny oceny są rozliczane według małego, szybkiego modelu i zwykle są znikome w porównaniu ze zużyciem głównych tur.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'Evaluation tokens are billed on the small fast model configured for your provider and are typically negligible compared to main-turn spend.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-wymaga-zaufania-folderu-i-hookow
    tresc: '/goal działa według tej samej zasady zaufania do folderu co hooki z plików ustawień, bo oceniający należy do systemu hooków. Nie działa też, gdy disableAllHooks ma wartość true; w każdym takim przypadku polecenie mówi dlaczego, zamiast nic nie robić bez słowa.'
    zrodlo: https://code.claude.com/docs/en/goal.md
    cytat: 'Claude Code makes `/goal` available under the same [workspace trust rule as hooks in settings files](https://code.claude.com/docs/en/permissions.md#what-runs-before-you-trust-a-folder), because the evaluator is part of the hooks system. `/goal` is also unavailable when [`disableAllHooks`](https://code.claude.com/docs/en/hooks#disable-or-remove-hooks) is `true` after settings precedence applies … In each case, the command tells you why instead of silently doing nothing.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-aplikacja-ukosnik-polecenia-wbudowane
    tresc: 'W aplikacji wpisujesz / w polu wiadomości albo klikasz + i wybierasz Slash commands, żeby przejrzeć dostępne polecenia, także wbudowane. Wybrane polecenie stoi podświetlone w polu, a po nim wpisujesz zadanie i wysyłasz jak zwykle.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'type `/` in the prompt box or click the **+** button and select **Slash commands** to browse what''s available. This includes [built-in commands](/docs/en/commands.md) … Select one and it appears highlighted in the input field. Type your task after it and send as usual.'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  - id: goal-aplikacja-powrot-do-sesji-w-pasku-bocznym
    tresc: 'W aplikacji odpowiednikiem flag --resume i --continue jest kliknięcie sesji w pasku bocznym.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '| `--resume`, `--continue` | Click a session in the sidebar, or type `/resume` in the prompt box to pick up a session you started from the CLI |'
    sprawdzono: '2026-10-26'
    wersja: 2.1.310

  # Lekcja zadanie-co-rano (moduł 8, praca-bez-ciebie), 26.10.2026: zadania z harmonogramu w aplikacji
  - id: harmonogram-zadanie-startuje-nowa-sesje
    tresc: 'Zadanie z harmonogramu samo startuje nową sesję o porze i z częstotliwością, które wybierzesz; służy do powtarzalnej pracy, na przykład porannych podsumowań z kalendarza i poczty.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Scheduled tasks start a new session automatically at a time and frequency you choose. Use them for recurring work like daily code reviews, dependency update checks, or morning briefings that pull from your calendar and inbox.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-strona-scheduled-tasks-lokalne-i-chmura
    tresc: 'Strona Scheduled tasks w aplikacji pokazuje zarówno zadania lokalne, jak i zadania w chmurze.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'The Desktop app''s **Scheduled tasks** page lists both local scheduled tasks and [cloud scheduled tasks](https://code.claude.com/docs/en/routines.md), formerly routines:'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-lokalne-tylko-przy-otwartej-aplikacji
    tresc: 'Zadanie lokalne działa na Twoim komputerze z bezpośrednim dostępem do plików i narzędzi, ale rusza tylko wtedy, gdy aplikacja jest otwarta, a komputer nie śpi.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '**Local task**: runs on your machine with direct access to your files and tools, but only fires while the app is open and your computer is awake'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-chmura-dziala-przy-wylaczonym-komputerze
    tresc: 'Zadanie w chmurze działa nawet wtedy, gdy komputer jest wyłączony.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '**Cloud task**: runs even when your computer is off, and can also start on API calls or GitHub events'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-dawna-nazwa-routines
    tresc: 'Jeśli aplikacja pokazuje tę funkcję pod dawną nazwą, klikasz Routines tam, gdzie dokumentacja mówi Scheduled, i New routine tam, gdzie mówi New task.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'If your app shows the feature under its [earlier name](https://code.claude.com/docs/en/routines.md#where-the-name-routines-still-appears), click **Routines** wherever this page says **Scheduled** and **New routine** where it says **New task**.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-porownanie-gdzie-dziala
    tresc: 'Zadanie w chmurze działa domyślnie w chmurze Anthropic, a zadanie w aplikacji i /loop działają na Twoim komputerze.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '| Runs on | Cloud, Anthropic-managed by default | Your machine | Your machine |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-porownanie-wlaczony-komputer
    tresc: 'Zadanie w aplikacji i /loop wymagają włączonego komputera, a zadanie w chmurze nie.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '| Requires machine on | No | Yes | Yes |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-porownanie-otwarta-sesja
    tresc: 'Zadanie w aplikacji i zadanie w chmurze nie wymagają otwartej sesji, a /loop wymaga.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '| Requires open session | No | No | Yes |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-porownanie-trwa-po-ponownym-uruchomieniu
    tresc: 'Zadanie w chmurze i zadanie w aplikacji zostają po ponownym uruchomieniu.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '| Persistent across restarts | Yes | Yes | Restored on `--resume`, with [exceptions](https://code.claude.com/docs/en/scheduled-tasks.md#limitations) |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-porownanie-pliki-na-komputerze
    tresc: 'Zadanie w aplikacji i /loop mają dostęp do plików na komputerze, a zadanie w chmurze nie, bo pracuje na świeżej kopii.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '| Access to local files | No (fresh clone) | Yes | Yes |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-porownanie-konektory
    tresc: 'Zadanie w aplikacji korzysta z serwerów MCP z plików konfiguracji i z konektorów.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '| MCP servers | Connectors configured per task | [Config files](https://code.claude.com/docs/en/mcp.md) and connectors | Inherits from session |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-najkrotszy-odstep
    tresc: 'Zadanie w aplikacji może ruszać nawet co minutę, gdy termin ustawia Claude, a w formularzach najczęściej co godzinę.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '| Minimum interval | 1 hour | 1 minute when Claude sets it, [1 hour in the forms](https://code.claude.com/docs/en/desktop-scheduled-tasks.md#schedule-options) | 1 minute |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-kiedy-chmura-aplikacja-loop
    tresc: 'Zadanie w chmurze jest do pracy, która ma iść niezawodnie bez Twojego komputera, zadanie w aplikacji do pracy z plikami i narzędziami na komputerze, a /loop do szybkiego sprawdzania w trakcie sesji.'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Use **cloud tasks** for work that should run reliably without your machine. Use **Desktop tasks** when you need access to local files and tools. Use **`/loop`** for quick polling during a session.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-loop-w-terminalu
    tresc: '/loop to harmonogram w obrębie jednej sesji Claude Code w terminalu (CLI).'
    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: '[Run prompts on a schedule](https://code.claude.com/docs/en/scheduled-tasks.md): session-scoped scheduling with `/loop` in the CLI'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-loop-nalezy-do-sesji
    tresc: 'Zadania /loop należą do sesji; harmonogram, który trwa niezależnie od sesji, daje między innymi zadanie w aplikacji.'
    zrodlo: https://code.claude.com/docs/en/scheduled-tasks.md
    cytat: 'Tasks are session-scoped. … For scheduling that survives independently of any session, create a [cloud scheduled task](https://code.claude.com/docs/en/routines.md), set up a [Desktop scheduled task](https://code.claude.com/docs/en/desktop-scheduled-tasks.md), or use [GitHub Actions](https://code.claude.com/docs/en/github-actions.md).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: harmonogram-wymaga-wersji-aplikacji
