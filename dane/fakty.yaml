    cytat: '| `.claude/agents/` | Current project | 3 | Ask Claude, or create the file manually | … | `~/.claude/agents/` | All your projects | 4 | Ask Claude, or create the file manually | … **User subagents** (`~/.claude/agents/`) are personal subagents available in all your projects.'
