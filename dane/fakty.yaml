    cytat: 'If you leave it unset, the subagent inherits the main conversation''s [permission mode](https://code.claude.com/docs/en/permission-modes.md). … When the main conversation is in `bypassPermissions`, `acceptEdits`, or [auto mode](https://code.claude.com/docs/en/permission-modes.md#eliminate-prompts-with-auto-mode), the subagent runs in that same mode and Claude Code ignores the `permissionMode` you set.'
