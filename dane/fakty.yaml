  - id: koszty-team-enterprise-okno-piec-godzin-i-tydzien
    tresc: "Na abonamentach Team i Enterprise zużycie Claude Code każdego członka idzie z przydziału na stanowisko, który odnawia się w kroczącym oknie pięciogodzinnym i w oknie tygodniowym; przydział jest wspólny z czatem Claude i Cowork."
