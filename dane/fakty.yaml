  # Lekcja 9.1 kilka-rozmow (folder każdej rozmowy i karta wiadomości w symulatorze aplikacji): fakty skopiowane dosłownie z gałęzi modul-kilka-zadan
  - id: aplikacja-claude-czyta-inne-sesje-zwykla-prosba
    tresc: 'W aplikacji Claude może wypisać Twoje inne sesje z zakładki Code, przeczytać, co robiła każda z nich, i przesyłać między nimi wiadomości; prosisz o to zwykłymi słowami, np. „co ustaliła sesja o API?”.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Claude can list your other Code tab sessions, read what each has been doing, and send messages between them. Ask in plain language: "which session touched the auth refactor?", "what did the API session conclude?", or "tell the payments session the schema changed".'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-claude-widzi-tylko-sesje-aplikacji
    tresc: 'Tą drogą Claude widzi tylko sesje, które prowadzi sama aplikacja (lokalne, SSH i WSL w zakładce Code); nie widzi sesji w chmurze ani sesji zaczętych w terminalu albo w rozszerzeniu VS Code.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Through this surface, Claude sees only the sessions the desktop app runs itself: local, [SSH](#ssh-sessions), and [WSL](/docs/en/desktop-wsl.md) sessions in the Code tab. Claude doesn''t see cloud sessions, or sessions you started from the terminal CLI or the VS Code extension, even in worktrees of the same project'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-claude-nie-wymienia-biezacej-sesji
    tresc: 'Claude nigdy nie wymienia sesji, z której pytasz.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Claude never lists the session you''re asking from.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-claude-widzi-20-ostatnich-sesji
    tresc: 'Domyślnie Claude widzi 20 ostatnio aktywnych sesji i pomija zarchiwizowane, chyba że o nie poprosisz.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'By default it sees the 20 most recently active sessions and skips archived sessions unless you ask for them.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-wiadomosc-karta-z-tytulem-nadawcy
    tresc: 'Gdy Claude wyśle wiadomość do innej sesji, aplikacja pokazuje ją w tamtej sesji jako kartę z tytułem sesji, która wysłała, i z odnośnikiem do niej, więc zawsze widać, skąd przyszła wiadomość.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'When Claude messages another session through this surface, Claude Code shows it there as a card labeled with the sending session''s title and a link back, so you can always tell where a message came from.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-wiadomosc-czeka-gdy-odbiorca-pracuje
    tresc: 'Gdy sesja, do której idzie wiadomość, jest w trakcie pracy, aplikacja wstrzymuje wiadomość, a Claude czyta ją po skończeniu bieżącej pracy.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'If the receiving session is mid-task, Claude Code holds the message and Claude reads it once the current work finishes.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-odbiorca-moze-odpisac
    tresc: 'Claude w sesji, która dostała wiadomość, może odpisać, a aplikacja dostarcza odpowiedź z powrotem tą samą drogą.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'The receiving Claude can reply, and Claude Code delivers the reply back through this surface.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-wiadomosc-nie-dojdzie-do-archiwum
    tresc: 'Claude nie dostarczy wiadomości do zarchiwizowanej sesji i mówi, gdy wiadomość nie doszła.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Claude can''t deliver to an archived session, and tells you when a message doesn''t go through.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-wiadomosc-cytowana-uprawnienia-odbiorcy
    tresc: 'Aplikacja cytuje każdą przychodzącą wiadomość i podaje sesję, która ją wysłała, a Claude, działając według niej, dalej trzyma się ustawień uprawnień sesji, która ją dostała.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'Claude Code quotes each incoming message and attributes it to the session that sent it, and Claude still follows the receiving session''s own permission settings when acting on one.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-zadanie-proponowane-karta-w-rozmowie
    tresc: 'Gdy Claude zauważy coś do poprawy poza bieżącym zadaniem, proponuje to jako zadanie; w sesjach lokalnych i SSH w bieżącym układzie propozycja to karta w rozmowie z przyciskami, które zaczynają zadanie albo zostawiają je w tej sesji.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'When Claude notices something worth fixing outside your current task, it suggests that work as a task. In local and SSH sessions on the [current layout](#check-which-layout-you-have), the suggestion is a card in the chat, and its buttons either start the task or keep it in this session'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-zadanie-proponowane-start
    tresc: 'Przycisk Start zaczyna zadanie w innej sesji, domyślnie w tym samym środowisku; karta pokazuje potem stan tej sesji, a pasek boczny wymienia ją pod bieżącą sesją.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**Start**: starts the task in another session. By default the task runs in the current session''s environment. The card then shows the started session''s state, and the [sidebar](#work-in-parallel-with-sessions) lists the started session under the current session.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-zadanie-proponowane-do-it-here
    tresc: 'Przycisk Do it here wysyła zadanie do bieżącej sesji jako wiadomość.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**Do it here**: sends the task to the current session as a message'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-zadanie-proponowane-options
    tresc: 'Przycisk Options pozwala przed kliknięciem Start przejrzeć albo zmienić ustawienia, np. środowisko, model, worktree i uprawnienia.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**Options**: review or change settings such as the environment, model, [worktree](#run-a-session-in-its-own-worktree), and permissions before you click **Start**'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-zadanie-proponowane-start-all
    tresc: 'Gdy karta wymienia kilka zadań, przycisk Start all zaczyna każde w osobnej sesji, bez czekania, aż skończy się poprzednie.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: '**Start all**: when the card lists several tasks, starts each task in its own session without waiting for one task to finish before starting the next'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-zadanie-proponowane-wczesniejszy-uklad
    tresc: 'W sesjach w chmurze oraz w sesjach lokalnych i SSH we wcześniejszym układzie propozycja to karta Suggested task; strzałka obok głównego przycisku daje inne sposoby startu, w tym Do it here.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'In cloud sessions, and in local and SSH sessions on the earlier layout, the suggestion is a **Suggested task** card. … Click the caret beside the main button for other ways to start the task, including **Do it here**.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-pasek-boczny-grupa-folderu
    tresc: 'Przy domyślnym grupowaniu i sortowaniu paska bocznego sesję (np. zaczętą przez Dispatch) znajdziesz w grupie folderu, w którym pracuje.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'With the sidebar''s [default grouping and sorting](#organize-and-find-sessions), look for the newest session in the group for the folder it runs in.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  # Lekcja 9.1 kilka-rozmow: wiadomości między sesjami (cross-session-messaging.md). Strona aplikacji opisuje pracę między sesjami osobno (desktop.md, dział Work across sessions); te fakty to mechanizm wiadomości, w lekcji z mostem.
  - id: wiadomosc-miedzy-sesjami-po-co
    tresc: 'Gdy zmiana w jednej sesji psuje to, na czym opiera się druga, Claude może ostrzec tamtą sesję, zanim to zauważysz; gdy jedna sesja rozstrzygnie sprawę, na którą czeka druga, Claude może przesłać jej odpowiedź.'
    zrodlo: https://code.claude.com/docs/en/cross-session-messaging.md
    cytat: 'When a change in one session breaks what another is building on, Claude can warn that session before you notice. When one session settles a question another is blocked on, Claude can send the answer across.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wiadomosc-miedzy-sesjami-sam-albo-na-prosbe
    tresc: 'Claude może wysłać wiadomość sam, gdy widzi potrzebę, np. po zmianie, która dotyczy pracy innej sesji, albo możesz go o to poprosić.'
    zrodlo: https://code.claude.com/docs/en/cross-session-messaging.md
    cytat: 'Claude can send a message on its own when it sees the need, for example after making a change that affects work another session is doing, or you can ask it to send one.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wiadomosc-miedzy-sesjami-przekazanie-ustalenia
    tresc: 'Gdy jedna sesja coś odkryje albo podejmie decyzję, Claude streszcza to dla sesji, która pracuje nad tą sprawą, zamiast żebyś tłumaczył to tam od nowa.'
    zrodlo: https://code.claude.com/docs/en/cross-session-messaging.md
    cytat: '**Hand over a finding**: when one session discovers a breaking change or makes a decision, Claude summarizes it for the session working on the affected area, instead of you re-explaining it there.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wiadomosc-miedzy-sesjami-tresc-pisze-claude
    tresc: 'Treść wiadomości pisze sam Claude, więc w prośbie możesz zostawić mu jej brzmienie.'
    zrodlo: https://code.claude.com/docs/en/cross-session-messaging.md
    cytat: 'Claude writes the actual message itself, so your prompt can leave the content to Claude.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wiadomosc-miedzy-sesjami-liczy-sie-do-zuzycia
    tresc: 'Dostarczona wiadomość liczy się do zużycia tak jak prośba, którą sam wpisujesz.'
    zrodlo: https://code.claude.com/docs/en/cross-session-messaging.md
    cytat: 'Once delivered, the message counts toward [usage](https://code.claude.com/docs/en/costs.md) like a prompt you type.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wiadomosc-miedzy-sesjami-granice-uprawnien
    tresc: 'Granice uprawnień zostają w każdej sesji osobno: Claude ma nie prosić innej sesji o działanie, którego odmówiono albo które zablokowano w jego sesji, tylko oddać tę pracę Tobie.'
    zrodlo: https://code.claude.com/docs/en/cross-session-messaging.md
    cytat: 'Permission boundaries stay per-session. Claude is instructed never to ask another session for an action that was denied or blocked in its own session, or that its own permission settings would block, and to route that work back to you instead.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wiadomosc-miedzy-sesjami-nie-zatwierdza
    tresc: 'Wiadomość z innej sesji nigdy nie jest Twoją zgodą, więc nie odpowie za Ciebie na czekające pytanie o zgodę.'
    zrodlo: https://code.claude.com/docs/en/cross-session-messaging.md
    cytat: '**It can''t approve anything**: a message from another session never counts as your consent, so it can''t answer a pending permission prompt on your behalf.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wiadomosc-miedzy-sesjami-pytania-o-zgode-zostaja
    tresc: 'Gdy działanie według wiadomości wymaga uprawnienia, którego sesja nie ma, widzisz to samo pytanie o zgodę co przy każdej innej pracy.'
    zrodlo: https://code.claude.com/docs/en/cross-session-messaging.md
    cytat: '**Permission prompts still fire**: if acting on the message requires a permission the receiving session doesn''t have, you see the same prompt you''d see for any other work.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wiadomosc-miedzy-sesjami-petla-sama-sie-zatrzymuje
    tresc: 'Pętla wiadomości między dwiema sesjami zatrzymuje się sama.'
    zrodlo: https://code.claude.com/docs/en/cross-session-messaging.md
    cytat: 'A message loop between two sessions therefore stops on its own.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

