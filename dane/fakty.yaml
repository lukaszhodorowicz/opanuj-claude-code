    cytat: '* **Preserve context** by keeping exploration and implementation out of your main conversation … * **Enforce constraints** by limiting which tools a subagent can use … * **Reuse configurations** across projects with user-level subagents … * **Specialize behavior** with focused system prompts for specific domains … * **Control costs** by routing tasks to faster, lower-cost models like Haiku'
