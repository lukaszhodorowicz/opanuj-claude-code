    zrodlo: https://code.claude.com/docs/en/desktop-scheduled-tasks.md
    cytat: 'Local scheduled tasks require Claude Desktop 1.1.5368 or later.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: kontekst-kazdy-przeczytany-plik-dodaje
    tresc: "W trakcie pracy Claude każdy przeczytany plik dokłada się do kontekstu."
    zrodlo: https://code.claude.com/docs/en/context-window.md
    cytat: "**As Claude works**: each file read adds to context"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: compact-zastepuje-rozmowe-streszczeniem
    tresc: "Polecenie /compact zastępuje rozmowę uporządkowanym streszczeniem; większość treści wczytanej na starcie wczytuje się ponownie sama."
    zrodlo: https://code.claude.com/docs/en/context-window.md
    cytat: "you run `/compact`, which replaces the conversation with a structured summary. Most startup content reloads automatically"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: streszczenie-miesci-historie-w-oknie
    tresc: "Gdy długa sesja jest streszczana, Claude Code streszcza historię rozmowy tak, żeby zmieściła się w oknie kontekstu."
    zrodlo: https://code.claude.com/docs/en/context-window.md
    cytat: "When a long session compacts, Claude Code summarizes the conversation history to fit the context window."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: po-streszczeniu-claude-md-wraca-z-dysku
    tresc: "Po streszczeniu rozmowy CLAUDE.md z głównego folderu projektu i reguły bez ograniczenia do ścieżek wczytują się ponownie z dysku."
    zrodlo: https://code.claude.com/docs/en/context-window.md
    cytat: "| Project-root CLAUDE.md and unscoped rules | Re-injected from disk |"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: po-streszczeniu-opisy-skilli-wracaja
    tresc: "Po streszczeniu rozmowy opisy skilli są budowane od nowa z Twoich obecnych skilli i wczytywane ponownie (od Claude Code 2.1.304)."
    zrodlo: https://code.claude.com/docs/en/context-window.md
    cytat: "| Skill descriptions | Rebuilt from your current [skills](https://code.claude.com/docs/en/skills.md) and re-injected. Requires Claude Code v2.1.304 or later |"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: po-streszczeniu-plan-wraca-z-dysku
    tresc: "Po streszczeniu rozmowy plan, który Claude napisał w trybie planowania, wczytuje się ponownie z dysku."
    zrodlo: https://code.claude.com/docs/en/context-window.md
    cytat: "| The plan Claude wrote in [plan mode](https://code.claude.com/docs/en/permission-modes.md#analyze-before-you-edit-with-plan-mode) | Re-injected from disk |"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: po-streszczeniu-do-pieciu-plikow
    tresc: "Zaraz po streszczeniu Claude Code ponownie czyta do pięciu plików, które Claude czytał albo zmieniał w sesji, wybierając te zmienione najpóźniej; plik powyżej 5 000 tokenów wraca jako sama ścieżka, bez treści."
    zrodlo: https://code.claude.com/docs/en/context-window.md
    cytat: "Right after compaction, Claude Code re-reads up to five of the files Claude has read or edited in the session, choosing the ones modified most recently. A file over 5,000 tokens comes back as a path reference without its content"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: kontekst-pelne-okno-nie-konczy-sesji
    tresc: "Claude Code streszcza rozmowę sam, gdy zbliżasz się do granicy, więc pełne okno kontekstu nie kończy sesji."
    zrodlo: https://code.claude.com/docs/en/context-window.md
    cytat: "Claude Code compacts automatically as you approach the limit, so a full context window doesn't end your session."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: compact-z-poleceniem-co-zachowac
    tresc: "Polecenie /compact możesz uruchomić z poleceniem, na czym się skupić, przed długim nowym zadaniem; streszczenie zachowa wtedy to, co wybierzesz, a nie to, co za ważne uzna automatyczne streszczenie."
    zrodlo: https://code.claude.com/docs/en/context-window.md
    cytat: "**Compact with a focus**: run `/compact` with instructions, like `/compact focus on the auth bug fix`, before starting a long new task. The summary keeps what you choose instead of what the automatic pass guesses is important."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: stara-rozmowa-wypiera-pliki-i-kosztuje
    tresc: "Strona o oknie kontekstu radzi uruchomić /clear przy przejściu do niezwiązanej pracy, bo stara rozmowa wypiera pliki potrzebne dalej i kosztuje tokeny przy każdej wiadomości."
    zrodlo: https://code.claude.com/docs/en/context-window.md
    cytat: "**Clear between tasks**: run `/clear` when switching to unrelated work. Old conversation crowds out the files you need next and costs tokens on every message."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: kontekst-prog-streszczenia-zalezy-od-modelu
    tresc: "To, kiedy rusza automatyczne streszczenie, zależy od modelu i ustawień."
    zrodlo: https://code.claude.com/docs/en/context-window.md
    cytat: "The point where automatic compaction runs depends on your model and configuration."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: compact-instrukcje-w-claude-md-albo-z-naciskiem
    tresc: "Żeby wpłynąć na to, co zostaje w streszczeniu, dodajesz do CLAUDE.md część „Compact Instructions” albo uruchamiasz /compact z poleceniem, na czym się skupić."
    zrodlo: https://code.claude.com/docs/en/how-claude-code-works.md
    cytat: 'To control what''s preserved during compaction, add a "Compact Instructions" section to CLAUDE.md or run `/compact` with a focus (like `/compact focus on the API changes`).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-kazda-rozmowa-to-sesja
    tresc: "W zakładce Code każda rozmowa to sesja: ma własną historię rozmowy i folder projektu, niezależne od innych sesji."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "In the Code tab, each conversation is a **session**: it has its own chat history and project folder, independent of any other session."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-karta-context-procent-w-naglowku
    tresc: "W bieżącym układzie aplikacji nagłówek karty Context w panelu szczegółów sesji pokazuje w procentach, jak pełne jest okno kontekstu tej sesji; po otwarciu karta pokazuje, co zajmuje okno, z podziałem na kategorie."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "To see how full this session's context window is, find your Code tab layout: … **Current layout**: the header of the **Context** card in the [session details panel](#see-session-details) shows it as a percentage. Open the card to see what is using the window by category."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-pytanie-z-boku-nic-nie-wraca-do-rozmowy
    tresc: "W aplikacji pytanie z boku korzysta z kontekstu sesji, ale nic z niego nie wraca do głównej rozmowy; służy do tego, żeby coś zrozumieć, sprawdzić założenie albo zbadać pomysł bez zbaczania z toru sesji."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "A side chat lets you ask Claude a question that uses your session's context but doesn't add anything back to the main conversation. Use it when you want to understand a piece of code, check an assumption, or explore an idea without steering the session off course."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-pytanie-z-boku-zamknij-i-wracasz
    tresc: "W aplikacji, gdy skończysz, zamykasz pytanie z boku i prowadzisz główną sesję od miejsca, w którym przerwałeś."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "When you're done, close the side chat and continue the main session where you left off."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  # Lekcja hooki/jakie-hooki-dzialaja (moduł 7), 26.10.2026
  - id: hook-miejsce-ustawienia-lokalne
    tresc: 'Plik .claude/settings.local.json działa tylko dla Ciebie i tylko w tym jednym projekcie.'
    zrodlo: https://code.claude.com/docs/en/settings.md
    cytat: '| Project local | `.claude/settings.local.json` | You, in this one project only.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-wtyczka-dziala-gdy-wlaczona
    tresc: 'Hooki wtyczki leżą w jej pliku hooks/hooks.json i działają, gdy wtyczka jest włączona; wtedy łączą się z hookami z Twoich ustawień użytkownika i projektu.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '| [Plugin](https://code.claude.com/docs/en/plugins/overview.md) `hooks/hooks.json` | When plugin is enabled | Yes, bundled with the plugin | … Define plugin hooks in `hooks/hooks.json` with an optional top-level `description` field. When a plugin is enabled, its hooks merge with your user and project hooks.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-w-skillu-od-uruchomienia-do-konca-sesji
    tresc: 'Hooki zapisane w skillu Claude Code rejestruje, gdy Ty albo Claude uruchomicie ten skill, i uruchamia je do końca sesji.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '**Skill hooks**: Claude Code registers them when you or Claude invoke the skill and keeps running them for the rest of the session, on turns after the skill''s own turn as well.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-w-subagencie-tylko-gdy-dziala
    tresc: 'Hooki zapisane w subagencie Claude Code uruchamia tylko wtedy, gdy ten subagent działa, i usuwa je, gdy subagent skończy.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '**Subagent hooks**: Claude Code runs them only while that subagent is running and removes them when it finishes.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hooki-jednego-zdarzenia-rownolegle-do-konca
    tresc: 'Gdy zachodzi zdarzenie, wszystkie pasujące do niego hooki działają równolegle i każdy dochodzi do końca; odmowa jednego hooka nie zatrzymuje pozostałych.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'When an event fires, Claude Code runs the matching hooks in parallel … When multiple hooks match the same event, every hook''s command runs to completion before Claude Code merges the results. One hook returning `deny` doesn''t stop sibling hooks from executing.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-ten-sam-w-dwoch-plikach-rusza-raz
    tresc: 'Ten sam hook zapisany w kilku plikach ustawień rusza raz; kopia tego samego hooka we wtyczce albo w skillu działa osobno.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'If you define the same handler in more than one settings file, it runs once. A plugin''s or skill''s copy of the same handler stays separate.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-usun-wpis-z-pliku
    tresc: 'Żeby usunąć hook zapisany w pliku ustawień, usuwasz jego wpis z tego pliku.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'To remove a hook defined in a settings file, delete its entry from that file.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-nie-wylaczysz-pojedynczego
    tresc: 'Nie da się wyłączyć jednego hooka tak, żeby został w ustawieniach.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'There is no way to disable an individual hook while keeping it in the configuration.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: disableallhooks-wylacza-wszystkie-bez-usuwania
    tresc: 'Ustawienie "disableAllHooks": true w pliku ustawień chwilowo wyłącza wszystkie hooki bez usuwania ich wpisów.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'To temporarily disable all hooks without removing them, set `"disableAllHooks": true` in your settings file.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: disableallhooks-zasieg-poza-ustawieniami-organizacji
    tresc: 'disableAllHooks zapisane w pliku innym niż ustawienia zarządzane przez organizację wyłącza hooki z ustawień użytkownika, projektu i lokalnych oraz z wtyczek; hooki zarządzane, hooki Agent SDK i hooki wtyczek wymuszonych przez organizację działają dalej.'
    zrodlo: https://code.claude.com/docs/en/settings-reference.md
    cytat: '**In any other settings file**: Claude Code disables user, project, local, and plugin hooks; managed hooks, Agent SDK hooks, and hooks from plugins force-enabled in managed [`enabledPlugins`](#enabledplugins) keep running'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-sukces-nic-w-rozmowie
    tresc: 'Gdy hook zadziała, Claude Code nic nie pokazuje w rozmowie; że hook ruszył, sprawdzasz po jego skutku.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'When the hook succeeds, Claude Code shows nothing in the conversation. … To confirm the hook ran, check for its effect, like a reformatted file'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-trzy-wyniki-sukces-blokada-blad
    tresc: 'Hook kończy się sukcesem (działanie idzie dalej, chyba że hook je zablokuje), błędem blokującym (na zdarzeniach, które mogą blokować, Claude Code zatrzymuje działanie) albo błędem nieblokującym, np. gdy się nie uruchomi (działanie idzie dalej, chyba że hook ma onFailure ustawione na "block"; przy zdarzeniach takich jak PreToolUse w zapisie rozmowy pojawia się notka o błędzie hooka).'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '**Success**: your hook exits 0. Claude Code applies any [JSON output](#json-output) fields your hook printed, and the action goes ahead unless those fields block or deny it. … **Blocking error**: your hook exits 2. On [events that can block](#exit-code-2-behavior-per-event), Claude Code stops the action. … **Non-blocking error**: your hook exits with any other code, or fails in some other way, such as not starting or printing invalid JSON. The action goes ahead, except for hooks [whose failure blocks the action](#block-the-action-when-a-hook-fails), for example a hook with `onFailure` set to `"block"`. On events such as `PreToolUse`, you see a `<hook name> hook error` notice in the transcript.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-blad-zwykle-nie-zatrzymuje-dzialania
    tresc: 'Przy większości zdarzeń, gdy hook się wysypie albo przekroczy czas, Claude Code i tak wykonuje działanie, więc hook pilnujący zasad ze złą ścieżką albo z psującym się skryptem przepuszcza wszystko.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'On most events, when a hook fails or times out, Claude Code still carries out the action. A policy hook with a wrong path or a crashing script then lets everything through.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-literowka-w-sciezce-nie-rusza
    tresc: 'Literówka w ścieżce w settings.json sprawia, że hook nigdy nie rusza; dlatego przy pierwszym uruchomieniu hooka pilnującego zasad wypatruj notki o błędzie.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'When you set up a policy hook, watch for this notice on its first run, because a mistyped path in `settings.json` means the hook never runs.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-przekroczony-czas-bez-decyzji
    tresc: 'Hook typu command, który dojdzie do swojego limitu czasu (domyślnie 600 sekund), Claude Code przerywa i odrzuca jego wynik, więc przy większości zdarzeń taki hook nie podejmuje decyzji.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'Defaults: 600 for `command`, `http`, and `mcp_tool` … Claude Code cancels a `command`, `http`, or `mcp_tool` hook that reaches its [`timeout`](#common-fields), discarding the hook''s output, so on most events a timed-out hook renders no decision.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-dopasowanie-wielkosc-liter-literowka
    tresc: 'Dopasowanie rozróżnia wielkość liter, a nazwy narzędzi zaczynają się wielką literą (Bash, Edit, Write, Read); literówka w nazwie narzędzia daje dopasowanie, które niczego nie łapie, i hook po cichu nie rusza.'
    zrodlo: https://code.claude.com/docs/en/debug-your-config.md
    cytat: 'A misspelled tool name produces a matcher that matches nothing, so the hook fails silently. … Matching is case-sensitive. Tool names are capitalized: `Bash`, `Edit`, `Write`, `Read`.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-nie-rusza-sprawdz-zdarzenie
    tresc: 'Gdy hook nie rusza, sprawdź, czy stoi na właściwym zdarzeniu: PreToolUse zachodzi przed użyciem narzędzia, a PostToolUse po nim.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'Verify you''re triggering the right event type: `PreToolUse` fires before tool execution, `PostToolUse` fires after.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: ustawienia-scisly-json-blad-na-starcie
    tresc: 'Pliki ustawień to ścisły JSON: komentarz // albo przecinek po ostatnim elemencie to błąd składni, a Claude Code zgłasza taki plik jako Settings Error przy następnym starcie.'
    zrodlo: https://code.claude.com/docs/en/settings.md
    cytat: 'Settings files are strict JSON: a `//` comment or a trailing comma is a syntax error, and Claude Code reports the file as a [Settings Error](#fix-a-broken-settings-file) at the next start.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: ustawienia-settings-warning-pomija-zly-wpis
    tresc: 'Gdy błędne są tylko pojedyncze wpisy, np. nieznana nazwa zdarzenia hooka, Claude Code pomija je i stosuje resztę pliku (Settings Warning).'
    zrodlo: https://code.claude.com/docs/en/settings.md
    cytat: '**Settings Warning**: only individual entries fail, such as a malformed permission rule or an unknown hook event name. Claude Code skips those values and keeps the rest of the file in effect.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hooki-tylko-w-settings-json
    tresc: 'Hooki użytkownika i projektu zapisuje się pod kluczem "hooks" w settings.json; osobnego pliku z hookami nie ma, własny hooks/hooks.json wczytują tylko wtyczki. ~/.claude.json to inny plik, na stan programu i przełączniki interfejsu: hooki wpisane do niego są pomijane.'
    zrodlo: https://code.claude.com/docs/en/debug-your-config.md
    cytat: 'There is no standalone hooks file for project or user config. Define hooks under the `"hooks"` key in `settings.json`. Only [plugins](https://code.claude.com/docs/en/plugins/components.md#hooks) load a separate `hooks/hooks.json`. … | Permissions or hooks set globally are ignored | Configuration was added to `~/.claude.json` | `~/.claude.json` holds app state and UI toggles. `permissions`, `hooks`, and `env` belong in `~/.claude/settings.json`. These are two different files. |'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-pelne-uprawnienia-konta
    tresc: 'Hooki typu command uruchamiają polecenia z pełnymi uprawnieniami Twojego konta: mogą zmienić, usunąć albo odczytać każdy plik, do którego ma dostęp Twoje konto; dokumentacja radzi przejrzeć i sprawdzić polecenia hooka, zanim go dodasz.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: 'Command hooks execute shell commands with your full user permissions. They can modify, delete, or access any files your user account can access. Review and test all hook commands before adding them to your configuration.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-dodaje-hooki
    tresc: 'Instalacja wtyczki dodaje do Claude Code na Twoim komputerze jej skille, agentów, hooki i serwery MCP.'
    zrodlo: https://code.claude.com/docs/en/plugins/install.md
    cytat: 'Installing a plugin adds its skills, agents, hooks, and MCP servers to Claude Code on your machine.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczka-wlaczona-hooki-w-kazdej-sesji
    tresc: 'Włączona wtyczka jest częścią każdej sesji, nie tylko tych, w których jej używasz: jej hooki ruszają przy swoich zdarzeniach, a wszystko, co uruchamia, uruchamia jako Ty.'
    zrodlo: https://code.claude.com/docs/en/plugins/overview.md
    cytat: 'An enabled plugin is part of every session, not only the sessions where you use it. … **Processes**: MCP servers the plugin defines run alongside each session where it''s enabled, and its hooks fire at their events. … **Permissions**: what the plugin runs, it runs as you.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-manage-plugins
    tresc: 'W sesji lokalnej w aplikacji klikasz + obok pola wiadomości; gdy menu pokazuje Plugins zamiast Add plugins, wybierasz Plugins, a potem Manage plugins, żeby włączyć, wyłączyć albo odinstalować wtyczki.'
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: 'In a local session or an [SSH session](#ssh-sessions), click **+** next to the prompt box and select **Add plugins** to open the plugin browser. If the menu shows **Plugins** instead, select it, then **Browse plugins**, or **Manage plugins** to enable, disable, or uninstall plugins.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: wtyczki-w-claude-plugins-nie-kasuj
    tresc: 'Zainstalowane wtyczki leżą w ~/.claude/plugins; dokumentacja radzi nie usuwać ~/.claude/settings.json ani ~/.claude/plugins/, bo trzymają Twoje ustawienia i zainstalowane wtyczki.'
    zrodlo: https://code.claude.com/docs/en/claude-directory.md
    cytat: '| Installed plugins | `~/.claude/plugins` | Cloned marketplaces, installed plugin versions, … Don''t delete `~/.claude.json`, `~/.claude/settings.json`, or `~/.claude/plugins/`: those hold your account details, preferences, and installed plugins.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-permissionrequest-odpowiada-za-ciebie
    tresc: 'Hook PermissionRequest rusza, gdy Claude Code ma Cię zapytać o zgodę, a gdy zwróci zgodę, Claude Code odpowiada na pytanie w Twoim imieniu; z pustym dopasowaniem albo .* zatwierdzałby każde pytanie o zgodę, także na zapis plików i polecenia powłoki.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'Claude Code runs `PermissionRequest` hooks when it''s about to ask you for permission, and if your hook returns `"behavior": "allow"`, Claude Code answers the request on your behalf. … Matching on `.*` or leaving the matcher empty would auto-approve every tool permission prompt, including file writes and shell commands.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-przyklad-dziennik-polecen-bash
    tresc: 'Dokumentacja podaje przykład hooka PostToolUse z dopasowaniem Bash, który po każdym poleceniu dopisuje jego treść do pliku ~/.claude/command-log.txt; treść polecenia wyciąga programem jq.'
    zrodlo: https://code.claude.com/docs/en/hooks-guide.md
    cytat: 'Match only `Bash` tool calls and log each command to a file. The `PostToolUse` event fires after the command completes, so `tool_input.command` contains what ran. The hook receives the event data as JSON on stdin, and `jq -r ''.tool_input.command''` extracts only the command string, which `>>` appends to the log file'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: hook-dopasowanie-bash-tylko-narzedzie-bash
    tresc: 'Dopasowanie z samych liter, cyfr i znaków _, -, spacji, przecinka i | jest porównywane dokładnie: Bash pasuje tylko do narzędzia Bash.'
    zrodlo: https://code.claude.com/docs/en/hooks.md
    cytat: '| Only letters, digits, `_`, `-`, spaces, `,`, and `\|` | Exact string, or list of exact strings separated by `\|` or `,` with optional surrounding whitespace | `Bash` matches only the Bash tool;'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: narzedzie-bash-uruchamia-polecenia
    tresc: 'Narzędzie Bash uruchamia polecenia powłoki w Twoim środowisku.'
    zrodlo: https://code.claude.com/docs/en/tools-reference.md
    cytat: '| `Bash` | Executes shell commands in your environment.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: disableallhooks-goal-nie-dziala
    tresc: 'Polecenie /goal nie działa, gdy hooki są wyłączone.'
    zrodlo: https://code.claude.com/docs/en/settings-reference.md
    cytat: 'The [`/goal`](https://code.claude.com/docs/en/goal) command can''t run while hooks are disabled'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: aplikacja-pytanie-z-boku-nie-zapisuje-sie-na-dysku
    tresc: "Pytanie z boku działa w sesjach lokalnych, SSH i WSL; aplikacja nie zapisuje go na dysku, więc po zamknięciu aplikacji do niego nie wrócisz."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "Side chats are available in local, SSH, and WSL sessions. The desktop app doesn't save side chats to disk, so you can't return to one after you close the app."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: compact-zwalnia-miejsce-w-tej-samej-rozmowie
    tresc: "Polecenie /clear zaczyna nową rozmowę z pustym kontekstem; żeby zwolnić miejsce i dalej prowadzić tę samą rozmowę, używasz /compact."
    zrodlo: https://code.claude.com/docs/en/commands.md
    cytat: "Start a new conversation with empty context. … To free up context while continuing the same conversation, use `/compact` instead."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: streszczenie-samo-jest-duzym-zadaniem
    tresc: "Polecenie /compact czyta rozmowę, którą streszcza, więc streszczenie dużego kontekstu samo jest dużym żądaniem; gdy chcesz zacząć od nowa zamiast kontynuować, /clear nic nie kosztuje."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: "**Compaction**: `/compact` reads the conversation it summarizes, so [compacting a large context](https://code.claude.com/docs/en/prompt-caching.md#compacting-the-conversation) is itself a large request. When you want a fresh start instead of continuity, `/clear` costs nothing"
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: kontekst-ostrzezenie-to-nie-limit-zuzycia
    tresc: "Ostrzeżenie o kontekście albo o automatycznym streszczeniu to nie limit zużycia: rozmowa zbliżyła się do progu, przy którym Claude Code streszcza starszą historię, żeby zwolnić miejsce."
    zrodlo: https://code.claude.com/docs/en/costs.md
    cytat: "**A context or auto-compact warning**: not a usage limit. The conversation has grown close to the session's [auto-compact window](https://code.claude.com/docs/en/model-config.md#set-the-auto-compact-window), the threshold where Claude Code summarizes older history to free space."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  # Lekcja 6.1 kontekst-rozmowy, po kontroli prawdy 26.10.2026.
  - id: aplikacja-konektory-to-serwery-mcp
    tresc: "W aplikacji konektory to serwery MCP z graficznym sposobem konfiguracji."
    zrodlo: https://code.claude.com/docs/en/desktop.md
    cytat: "Connectors are [MCP servers](https://code.claude.com/docs/en/mcp.md) with a graphical setup flow."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: streszczenie-automatyczne-jak-compact
    tresc: "Automatyczne streszczenie działa tak samo jak polecenie /compact."
    zrodlo: https://code.claude.com/docs/en/context-window.md
    cytat: "The automatic pass works the same way as the `/compact` step in the timeline."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-wlasne-okno-kontekstu
    tresc: 'Każdy subagent pracuje we własnym oknie kontekstu, z własnym promptem systemowym, własnym dostępem do narzędzi i własnymi uprawnieniami.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'Each subagent runs in its own context window with a custom system prompt, specific tool access, and independent permissions.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-ten-sam-limit-co-rozmowa
    tresc: 'Subagent wysyła własne zapytania, a one liczą się do tego samego limitu zużycia co główna rozmowa.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'It also sends its own requests, which count toward the same [usage limits](https://code.claude.com/docs/en/costs.md#plan-usage-breakdown) as your main conversation.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-claude-przekazuje-pasujace-zadanie
    tresc: 'Gdy zadanie pasuje do opisu subagenta, Claude przekazuje je temu subagentowi, a on pracuje samodzielnie i oddaje wyniki.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'When Claude encounters a task that matches a subagent''s description, it delegates to that subagent, which works independently and returns results.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagenty-wbudowane-claude-uzywa-sam
    tresc: 'Claude Code ma wbudowane subagenty, których Claude sam używa, gdy pasują do zadania; każdy dziedziczy reguły uprawnień głównej rozmowy, a większość ma ograniczony zestaw narzędzi.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'Claude Code includes built-in subagents that Claude automatically uses when appropriate. Each inherits the parent conversation''s permission rules; most run with a restricted tool set.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-explore-tylko-czyta
    tresc: 'Wbudowany subagent Explore tylko czyta: szuka i analizuje bazę kodu, a narzędzia Write i Edit (zapis i zmiana pliku) ma zablokowane.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'A fast, read-only agent optimized for searching and analyzing codebases. … **Tools**: read-only tools; Write and Edit are denied'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-general-purpose-szuka-i-dziala
    tresc: 'Wbudowany subagent general-purpose służy do złożonych zadań w wielu krokach, które wymagają i szukania, i działania.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'A capable agent for complex, multi-step tasks that require both exploration and action.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-plan-w-trybie-planowania
    tresc: 'W trybie planowania, gdy Claude musi poznać bazę kodu, oddaje szukanie subagentowi Plan, żeby wyniki zostały w osobnym oknie kontekstu, a główna rozmowa niczego nie zmieniała.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'When you''re in plan mode and Claude needs to understand your codebase, it delegates research to the Plan subagent so that exploration output stays in a separate context window while the main conversation remains read-only.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-oddaj-duzo-danych-wraca-podsumowanie
    tresc: 'Pracę, która daje dużo danych, oddajesz subagentowi prośbą w rodzaju „Use a subagent to …”: obszerne wyniki zostają w kontekście subagenta, a do głównej rozmowy wraca tylko potrzebne podsumowanie.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'By delegating these to a subagent, the verbose output stays in the subagent''s context while only the relevant summary returns to your main conversation. … Use a subagent to run the test suite and report only the failing tests with their error messages'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-wyniki-wracaja-do-rozmowy
    tresc: 'Gdy subagenty skończą, ich wyniki wracają do głównej rozmowy; wiele subagentów, z których każdy oddaje szczegółowe wyniki, może zająć dużo kontekstu, a każdy w trakcie pracy zużywa własne tokeny.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'When subagents complete, their results return to your main conversation. Running many subagents that each return detailed results can consume significant context, and each subagent spends tokens of its own while it runs.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagenty-rownolegle-niezalezne-tematy
    tresc: 'Przy niezależnych tematach Claude może uruchomić kilka subagentów naraz; każdy bada swój obszar, a Claude łączy ustalenia; działa to najlepiej, gdy tematy od siebie nie zależą.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'For independent investigations, spawn multiple subagents to work simultaneously … Each subagent explores its area independently, then Claude synthesizes the findings. This works best when the research paths don''t depend on each other.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-praca-ponad-okno-osobne-sesje
    tresc: 'Pracę, która ma długo trwać równolegle albo nie zmieści się w jednym oknie kontekstu, prowadzisz w osobnych sesjach, a Claude przekazuje ustalenia między nimi.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'For work that needs to keep running in parallel or won''t fit in one context window, run it in [separate sessions](https://code.claude.com/docs/en/agents.md) and let Claude [pass findings between them](https://code.claude.com/docs/en/cross-session-messaging.md).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-domyslnie-w-tle
    tresc: 'Bez żadnych ustawień subagent, którego Claude uruchamia z głównej rozmowy, startuje w tle.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'With nothing configured, a subagent that Claude spawns from your main conversation starts in the background.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-aplikacja-claude-nie-czeka-przy-trybie-fork
    tresc: 'W sesjach aplikacji na Twoim komputerze (a także w terminalu i w VS Code) Claude może poczekać na subagenta dopiero po wyłączeniu trybu fork, który jest domyślnie włączony.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: '**Interactive terminal session, VS Code, and desktop app sessions on your machine**: to let Claude wait for a subagent, [turn off fork mode](#let-claude-wait-for-a-subagent), which is [on by default](#turn-fork-mode-on-or-off).'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-w-tle-pracuje-gdy-ty-pracujesz
    tresc: 'Subagent w tle pracuje równocześnie z Tobą, gdy dalej prowadzisz rozmowę.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: '**Background subagents** run concurrently while you continue working.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-w-tle-pytanie-o-zgode-w-rozmowie
    tresc: 'Gdy subagent w tle dochodzi do działania, które wymaga zgody, pytanie o zgodę pojawia się w Twojej głównej sesji z nazwą subagenta, który pyta.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'When a background subagent reaches a tool call that needs permission, Claude Code surfaces the prompt in your main session and names the subagent that is asking.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-w-tle-zgoda-na-sesje-obejmuje-rozmowe
    tresc: 'Gdy na pytanie subagenta w tle odpowiesz zgodą, która trwa dłużej niż to jedno działanie, na przykład do końca sesji, Claude Code stosuje ją w całej sesji, także w głównej rozmowie.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'When you answer one of those prompts with a choice that lasts beyond that one tool call, such as a grant that lasts for the rest of the session, Claude Code applies your answer to the whole session, including your main conversation.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-w-tle-wynik-w-pozniejszej-turze
    tresc: 'Wyniki subagenta w tle docierają do Claude jako powiadomienie o zakończeniu w późniejszej turze; Claude czeka na nie, zanim poda wyniki, a gdy wcześniej zapytasz o postęp, odpowie, że subagent jeszcze pracuje.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'A background subagent''s results reach Claude as a completion notification in a later turn. Claude waits for that notification before reporting the subagent''s results, and if you ask about progress first, it reports that the subagent is still running.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-w-tle-raport-jako-zdarzenie-automatyczne
    tresc: 'Raport subagenta w tle przychodzi w powiadomieniu o zakończeniu, oznaczonym jako zdarzenie automatyczne, a nie wiadomość od Ciebie.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'A [background subagent''s report](#run-subagents-in-foreground-or-background) arrives inside a completion notification, which is marked as an automated event rather than a message from you.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-blad-api-wynik-czesciowy-nie-ginie
    tresc: 'Subagent, którego praca kończy się błędem, na przykład z powodu limitu zużycia, zgłasza to Claude; subagent w tle jest wtedy oznaczony jako nieudany, a Claude dostaje jego ostatni wynik, więc częściowa praca nie ginie.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'A subagent whose run ends on an API error, such as a usage limit or a repeated server error, reports that failure back to Claude. … **Background**: the subagent is marked failed, and the message Claude receives when it ends names the API error and includes the subagent''s last output, so partial work isn''t lost.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-kiedy-glowna-rozmowa
    tresc: 'Główna rozmowa pasuje, gdy zadanie wymaga częstej wymiany zdań i poprawek, gdy kolejne etapy dzielą dużo wspólnego kontekstu, przy szybkiej punktowej zmianie i gdy liczy się czas, bo subagent, który nie jest forkiem, zaczyna od zera i może potrzebować czasu na zebranie kontekstu.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'Use the **main conversation** when: … The task needs frequent back-and-forth or iterative refinement … Multiple phases share significant context, such as planning, implementation, and testing … You''re making a quick, targeted change … Latency matters. A subagent that isn''t a [fork](#fork-the-current-conversation) starts fresh and may need time to gather context'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-kiedy-subagent
    tresc: 'Subagent pasuje, gdy zadanie daje obszerne wyniki, których nie potrzebujesz w głównym kontekście, gdy chcesz narzucić ograniczenia narzędzi albo uprawnień i gdy praca jest zamknięta w sobie i może skończyć się podsumowaniem.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'Use **subagents** when: … The task produces verbose output you don''t need in your main context … You want to enforce specific tool restrictions or permissions … The work is self-contained and can return a summary'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-skill-gdy-praca-w-rozmowie
    tresc: 'Zamiast subagenta rozważ skill, gdy chcesz powtarzalnych poleceń albo przebiegów pracy, które działają w kontekście głównej rozmowy, a nie w osobnym kontekście subagenta.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'Consider [Skills](https://code.claude.com/docs/en/skills.md) instead when you want reusable prompts or workflows that run in the main conversation context rather than isolated subagent context.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-btw-dla-pytania-o-rozmowe
    tresc: 'Na pytanie o coś, co już jest w rozmowie, użyj /btw zamiast subagenta: widzi cały kontekst, ale nie ma dostępu do narzędzi, a odpowiedź nie trafia do historii rozmowy.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'For a question about something already in your conversation, use [`/btw`](https://code.claude.com/docs/en/interactive-mode#side-questions-with-%2Fbtw) instead of a subagent. It sees your full context but has no tool access, and the answer isn''t added to history.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-swieze-okno-bez-historii-rozmowy
    tresc: 'Każdy subagent startuje ze świeżym, oddzielnym oknem kontekstu: nie widzi historii Twojej rozmowy, skilli, których już użyto, ani plików, które Claude już przeczytał.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'Each subagent starts with a fresh, isolated context window. It doesn''t see your conversation history, the skills you''ve already invoked, or the files Claude has already read.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-zadanie-pisze-claude
    tresc: 'Zadanie dla subagenta pisze Claude: układa wiadomość, która streszcza zadanie, i od niej subagent zaczyna pracę.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'Claude composes a delegation message that summarizes the task, and the subagent works from there. … **Task message**: the delegation prompt Claude writes when it hands off the work.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-wlasny-prompt-nie-prompt-claude-code
    tresc: 'Na start subagent (inny niż fork) dostaje własny prompt systemowy z danymi o środowisku, a nie prompt systemowy Claude Code.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'A non-fork subagent''s initial context contains: … **System prompt**: the agent''s own prompt plus environment details that Claude Code appends, not the Claude Code system prompt.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-dostaje-claude-md-poza-explore-i-plan
    tresc: 'Subagent (inny niż fork) dostaje na start pliki CLAUDE.md, które wczytuje główna rozmowa; wbudowane subagenty Explore i Plan ich nie dostają.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: '**CLAUDE.md files**: every level of the [CLAUDE.md hierarchy](https://code.claude.com/docs/en/memory.md#how-claude-md-files-load) the main conversation loads … The built-in Explore and Plan agents skip this.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-zasade-powtorz-w-prosbie
    tresc: 'Główna rozmowa ma cały CLAUDE.md, gdy czyta wyniki takich subagentów, więc większość zasad nie musi do nich docierać; zasadę, która musi dotrzeć do subagenta, powtórz w prośbie do Claude, gdy zlecasz mu pracę.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'The main conversation still has your full CLAUDE.md when it reads these subagents'' results, so most rules don''t need to reach the subagent itself. If a rule must, such as "ignore the `vendor/` directory," restate it in the prompt you give Claude when delegating.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-bez-pamieci-automatycznej
    tresc: 'Do subagenta, który nie jest forkiem, nie trafia pamięć automatyczna głównej rozmowy.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'Some main-conversation state never reaches a non-fork subagent: … **Auto memory**: the main conversation''s [auto memory](https://code.claude.com/docs/en/memory.md#auto-memory) isn''t loaded.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-wznow-prosba-o-kontynuacje
    tresc: 'Każde wywołanie subagenta tworzy nowy egzemplarz; żeby subagent dokończył wcześniejszą pracę zamiast zaczynać od nowa, poproś Claude, żeby go wznowił.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'Each subagent invocation creates a new instance rather than continuing an earlier one. To continue an existing subagent''s work instead of starting over, ask Claude to resume it.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-explore-plan-nie-do-wznowienia
    tresc: 'Wbudowanych subagentów Explore i Plan Claude nie może wznowić, bo pracują jednorazowo; gdy pracę trzeba będzie dokończyć, potrzebny jest general-purpose albo własny subagent.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'The built-in Explore and Plan agents are one-shot and return no agent ID, so Claude can''t resume them. Use `general-purpose` or a custom subagent when you need to continue the work.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-fork-zna-cala-rozmowe
    tresc: 'Fork to subagent, który dziedziczy całą dotychczasową rozmowę, zamiast zaczynać od zera; jego własne działania zostają poza Twoją rozmową i wraca tylko jego końcowy wynik.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'A fork is a subagent that inherits the entire conversation so far instead of starting fresh. … The fork''s own tool calls still stay out of your conversation and only its final result comes back, so your main context window stays clean.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-fork-claude-uruchamia-sam
    tresc: 'Claude może sam uruchomić fork, dopóki tryb fork jest włączony, a domyślnie jest włączony.'
    zrodlo: https://code.claude.com/docs/en/sub-agents.md
    cytat: 'Claude can start a fork on its own while fork mode is on, as it is by default.'
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  - id: subagent-zbiera-w-osobnym-oknie-kontekstu
    tresc: "Subagent zajmuje się zbieraniem informacji we własnym, osobnym oknie kontekstu, więc duże czytanie plików nie trafia do Twojego; wraca tylko podsumowanie i krótka metryczka."
    zrodlo: https://code.claude.com/docs/en/context-window.md
    cytat: "a [subagent](https://code.claude.com/docs/en/sub-agents.md) handles the research in its own separate context window, so the large file reads stay out of yours. Only the summary and a small metadata trailer come back."
    sprawdzono: '2026-10-26'
    wersja: "2.1.310"

  # Lekcja 6.2 nowa-czy-ta-sama (moduł dlugie-rozmowy), 26.10.2026.
