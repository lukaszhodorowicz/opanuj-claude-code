# Słowniczek kursu: pojęcia, które czytelnik może znać słabo albo które w kursie znaczą coś węższego niż zwykle.
# Z tego pliku generator buduje stronę słowniczka i pogrubia pierwsze wystąpienie pojęcia w każdej lekcji (D-2026-10-27-51).
# Pola: `pojecie` (nazwa na stronie słowniczka), `odmiany` (dokładne formy z lekcji), `wyjasnienie` (1-2 zdania), `fakt`.
# Pole `fakt` musi wskazywać id istniejące w dane/fakty.yaml; wyjaśnienie nie mówi więcej niż ten fakt. Kolejność: alfabetyczna po `pojecie`.
# Klucz `bez_pogrubienia`: lista fraz (napisy interfejsu i nazwy programów), wewnątrz których żadna odmiana nie dostaje pogrubienia.
# Fraza dopasowuje się jak odmiana (granice słowa, dłuższa forma wygrywa, wielkość liter się liczy, spacje elastyczne), ale trafienie w nią zostawia tekst bez zmian
# i nie zużywa żadnego hasła. Dopisz tu nazwę, której część jest odmianą hasła, a w całości nie jest tym pojęciem (na przykład „Git” w „Git Bash”).

bez_pogrubienia:
  - "Cloud session credits"
  - "kredyty sesji w chmurze"
  - "Git Bash"
  - "Accept and auto mode"
  - "Settings Error"
  - "Settings Warning"
  - "System Settings"
  - "Settings > Usage"
  - "Settings > Connectors"

pojecia:
